<style>
:root{
  color-scheme: dark;

button,input{font:inherit;}
.app{position:relative; z-index:1; width:100%; max-width:var(--maxw); margin:0 auto; padding:0 var(--gut) calc(var(--safe-bottom) + 18px); padding-left:calc(var(--safe-left) + var(--gut)); padding-right:calc(var(--safe-right) + var(--gut));}
.topbar{position:relative; top:0; z-index:20; margin:0 calc(var(--gut)*-1) 10px; padding:calc(var(--safe-top) + 12px) var(--gut) 10px;

.filter-btn.active{border-color:var(--green); color:var(--green); background:rgba(56,245,198,.1); font-weight:600;}

#content{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; margin-top:12px;}

.game-cover{display:block; width:100%; aspect-ratio:3/4; overflow:hidden; background:rgba(8,10,18,.5);}
.game-cover img{width:100%; height:100%; object-fit:cover; display:block;}

.game-info{display:block; padding:6px 10px 10px;}
.game-title{display:block; font-size:13px; line-height:1.4; font-weight:600; color:var(--ink); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.game-tags{display:flex; flex-wrap:wrap; justify-content:center; gap:4px; margin-top:6px; min-height:0;}
.game-tag{display:inline-block; font-size:10px; line-height:1.6; color:var(--ink-faint); border:1px solid var(--line); background:rgba(8,10,18,.4); padding:0 6px; white-space:nowrap; max-width:100%;}

.no-layout-gap #content{gap:0;}
.no-layout-gap #content > .game-card{margin-bottom:12px; margin-right:12px;}
.no-layout-gap .game-tags{gap:0;}
.no-layout-gap .game-tag{margin:0 4px 4px 0;}

/* 图片失败时回退到内置占位图(内联,不依赖运行时全局) */
function imgTag(title,src){

function cardHtml(g){
  if(!g)return '';
  var url=g.url||g.link||'#';

  if(g.tags&&g.tags.length){
    tagsHtml='<span class="game-tags">'+g.tags.map(function(t){return '<span class="game-tag">'+esc(t)+'</span>';}).join('')+'</span>';

    '<span class="game-cover">'+imgTag(title,g.pic||g.img)+'</span>'+
    '<span class="game-info"><span class="game-title">'+esc(title)+'</span>'+tagsHtml+'</span>'+
  '</a>';
}
/* 三级请求层:WebHome fm.req(原生,无 CORS)→ fetch → XHR */
function sdkGetText(url){
  var fm=window.fm;
  if(fm&&typeof fm.req==='function'){
    return fm.req(url,{method:'GET',responseType:'text',timeout:30}).then(function(r){
      var body=typeof r.body==='string'?r.body:(r&&r.text)||'';
      return {status:(r&&r.status)||(r&&r.ok?200:0),text:body};
    });
  }
  if(typeof fetch==='function'){
    return fetch(url,{headers:{'Accept':'text/html','User-Agent':'Mozilla/5.0'}}).then(function(res){
      return res.text().then(function(t){ return {status:res.status,text:t}; });
    });
  }
  return new Promise(function(resolve,reject){
    var req=new XMLHttpRequest();
    req.open('GET',url,true); req.timeout=30000;
    req.onreadystatechange=function(){ if(req.readyState!==4)return; if(req.status>=200&&req.status<300)resolve({status:req.status,text:req.responseText}); else reject(new Error('HTTP '+req.status)); };
    req.onerror=function(){reject(new Error('network'));}; req.ontimeout=function(){reject(new Error('timeout'));};
    req.send();
  });
}
/* ===== 主分类 ===== */
function renderTabs(){
  tabContainer.innerHTML='';
  classes.forEach(function(c){
    var btn=document.createElement('button');
    btn.className='tab-btn'+(c.type_id===state.type?' active':'');
    btn.textContent=c.type_name;
    btn.onclick=function(){ switchTab(c.type_id); };
    tabContainer.appendChild(btn);
  });
}
function switchTab(typeId){
  if(state.loading)return;
  state.type=typeId; state.page=1; state.sub=false; state.subPath=null; state.search=false; state.searchKw='';
  state.allGames=[]; kwInput.value='';
  renderTabs(); renderSubFilters();
  loadCurrent();
}
/* ===== 子分类 ===== */
function renderSubFilters(){
  filterContainer.innerHTML='';
  var subFilter=filters[state.type];
  if(!subFilter||!subFilter[0]||!subFilter[0].value)return;
  var allBtn=document.createElement('button');
  allBtn.className='filter-btn active'; allBtn.textContent='全部';
  allBtn.onclick=function(){ if(state.loading)return; state.sub=false; state.subPath=null; state.page=1; state.allGames=[]; setActiveFilter(allBtn); loadCurrent(); };
  filterContainer.appendChild(allBtn);
  subFilter[0].value.forEach(function(item){
    var btn=document.createElement('button');
    btn.className='filter-btn'; btn.textContent=item.n;
    btn.onclick=function(){ if(state.loading)return; state.sub=true; state.subPath=item.v; state.page=1; state.allGames=[]; setActiveFilter(btn); loadCurrent(); };
    filterContainer.appendChild(btn);
  });
}
function setActiveFilter(el){
  Array.prototype.forEach.call(filterContainer.querySelectorAll('.filter-btn'),function(b){b.classList.remove('active');});
  el.classList.add('active');
}
/* ===== 加载 ===== */
function loadCurrent(){
  if(state.type==='定制'){
    renderGames(RECOMMENDED);
    setStatus('推荐 · '+RECOMMENDED.length+' 款经典游戏');
    return;
  }
  var path=state.sub&&state.subPath?state.subPath:state.type;
  fetchAndRender(path+state.page);
}
function searchGames(kw){
  kw=(kw||'').trim();
  if(!kw){ setStatus('请输入游戏名称'); return; }
  if(state.loading)return;
  state.search=true; state.searchKw=kw; state.type=''; state.sub=false; state.subPath=null; state.page=1; state.allGames=[];
  renderTabs(); renderSubFilters();
  fetchAndRender('/search?name='+encodeURIComponent(kw), true);
}
function resetView(){
  if(state.loading)return;
  state.search=false; state.searchKw=''; kwInput.value=''; state.type='定制'; state.page=1; state.sub=false; state.subPath=null; state.allGames=[];
  renderTabs(); renderSubFilters(); loadCurrent();
}
function parseCards(doc){
  var cards=doc.querySelectorAll('.card.card-blog');
  var games=[];
  Array.prototype.forEach.call(cards,function(el){
    var linkEl=el.querySelector('a[href*="/play?id="]')||el.querySelector('a');
    if(!linkEl)return;
    var href=linkEl.getAttribute('href'); if(!href)return;
    var link=href.indexOf('http')===0?href:(BASE+href.replace(/^\/?/,'/'));
    var titleEl=el.querySelector('.card-caption a, h4 a, h4, .title, .name');
    var title=titleEl?titleEl.textContent.trim():'未知游戏';
    var img=el.querySelector('img');
    var imgSrc=''; if(img){ imgSrc=img.getAttribute('data-src')||img.getAttribute('data-original')||img.getAttribute('src')||''; }
    var tags=[];
    Array.prototype.forEach.call(el.querySelectorAll('.label,.badge,.tag'),function(t){ var s=t.textContent.trim(); if(s)tags.push(s); });
    games.push({title:title,link:link,img:imgSrc,tags:tags.slice(0,2)});
  });
  return games;
}
function renderGames(games){
  content.innerHTML='';
  if(!games||!games.length){ content.innerHTML=emptyHtml('暂无游戏','换个分类或搜索关键词试试'); return; }
  var html=games.map(cardHtml).join('');
  content.innerHTML=html;
}
function fetchAndRender(path,isSearch){
  if(state.loading)return;
  state.loading=true;
  setStatus(isSearch?'正在搜索「'+state.searchKw+'」...':'加载中...',true);
  content.innerHTML=emptyHtml('加载中','正在获取游戏列表');
  var url=fullUrl(path);
  sdkGetText(url).then(function(res){
    state.loading=false;
    try{
      if(res.status<200||res.status>=300)throw new Error('HTTP '+res.status);
      var doc=new DOMParser().parseFromString(res.text,'text/html');
      var games=parseCards(doc);
      state.allGames=state.allGames.concat(games);
      if(!games.length&&state.allGames.length){ renderGames(state.allGames); return; }
      renderGames(state.allGames);
      if(isSearch){ setStatus('「'+state.searchKw+'」找到 '+state.allGames.length+' 个结果',true); }
      else{ setStatus('已加载 '+state.allGames.length+' 款游戏',true); }
    }catch(e){
      state.loading=false;
      var isPreview=typeof window.fm==='undefined'||!window.fm||!window.fm.req;
      content.innerHTML=emptyHtml('请求失败',isPreview?'浏览器跨域受限 · 请放入默影视 WebHome 使用(fm.req 无此限制)':'请检查网络后重试');
      setStatus(isPreview?'浏览器跨域受限 · 请放入 WebHome 使用':'请求失败');
    }
  }).catch(function(){
    state.loading=false;
    var isPreview=typeof window.fm==='undefined'||!window.fm||!window.fm.req;
    content.innerHTML=emptyHtml('请求失败',isPreview?'浏览器跨域受限 · 请放入默影视 WebHome 使用(fm.req 无此限制)':'请检查网络后重试');
    setStatus(isPreview?'浏览器跨域受限 · 请放入 WebHome 使用':'请求失败');
  });
}
/* 滚动到底自动加载下一页(仅非推荐、非搜索模式),不插入任何页内提示 */
window.addEventListener('scroll',function(){
  if(state.loading||state.search||state.type==='定制')return;
  var scrollTop=window.scrollY||document.documentElement.scrollTop||0;
  var scrollHeight=document.documentElement.scrollHeight;
  var clientHeight=window.innerHeight||document.documentElement.clientHeight||0;
  if(scrollTop+clientHeight>=scrollHeight-320){
    state.loading=true;
    state.page++;
    var path=(state.sub&&state.subPath?state.subPath:state.type)+state.page;
    sdkGetText(fullUrl(path)).then(function(res){
      state.loading=false;
      try{
        var doc=new DOMParser().parseFromString(res.text,'text/html');
        var games=parseCards(doc);
        if(!games.length){ state.page--; return; }
        state.allGames=state.allGames.concat(games);
        renderGames(state.allGames);
        setStatus('已加载 '+state.allGames.length+' 款游戏',true);
      }catch(e){ state.page--; }
    }).catch(function(){ state.page--; state.loading=false; });
  }
});
/* ===== 交互绑定 ===== */
$('searchBtn').onclick=function(){ searchGames(kwInput.value); };
kwInput.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); searchGames(kwInput.value); } });
$('resetBtn').onclick=function(){ resetView(); };
var wt=$('webhtvToggle');
if(wt){ wt.onclick=function(){ window.scrollTo(0,0); }; wt.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();window.scrollTo(0,0);} }); }
/* ===== 初始化 ===== */
renderTabs();
renderSubFilters();
loadCurrent();
})();
</script>
