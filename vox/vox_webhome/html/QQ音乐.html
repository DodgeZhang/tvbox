/** 取单集播放直链 */
API.ximalayaTrackUrl = function(song){
  var tid = (song && (song.xmTrackId || String(song.songmid || "").replace(/^xm_/, ""))) || "";
  if (!tid) return Promise.resolve(null);
  if (song.playUrl && /^https?:\/\//i.test(song.playUrl) && isPlayUrlFresh(song)){
    return Promise.resolve(song.playUrl);
  }
  function normalizeSrc(src){
    if (!src) return "";
    src = String(src);
    if (src.indexOf("//") === 0) src = "https:" + src;
    if (src.indexOf("http://") === 0) src = "https://" + src.slice(7);
    return src;
  }
  function applySrc(src){
    src = normalizeSrc(src);
    if (src && song){
      song.playUrl = src;
      var now = Date.now();
      song.playUrlAt = now;
      song.playUrlTs = now;
    }
    return src || null;
  }
  // 1) 官方 web 批量播放接口（稳定、免 webtk）
  var webUrl = "https://www.ximalaya.com/revision/play/tracks?trackIds=" + encodeURIComponent(tid);
  // 2) 移动端单集详情（含 playUrl64 / aac）
  var mobUrl = "https://mobile.ximalaya.com/v1/track/baseInfo?device=android&trackId=" + encodeURIComponent(tid) + "&trackQualityLevel=1";
  // 3) 旧 v1 audio 兜底
  var v1Url = "https://www.ximalaya.com/revision/play/v1/audio?id=" + encodeURIComponent(tid) + "&ptype=1&t=" + Date.now();

  var pWeb = ADAPTER_request(webUrl, { headers: _xmHdr(), timeout: 10, credentials: "omit" }).then(function(txt){
    var d = jsonp_safeParse(txt);
    var arr = (d && d.data && d.data.tracksForAudioPlay) || [];
    var item = arr[0] || {};
    return applySrc(item.src || item.playUrl || item.url || "");
  }).catch(function(){ return null; });

  var pMob = ADAPTER_request(mobUrl, { headers: _xmMobHdr(), timeout: 10, credentials: "omit" }).then(function(txt){
    var d = jsonp_safeParse(txt) || {};
    var node = d.data || d;
    var src = node.playUrl64 || node.playUrl32 || node.playPathAacv164 || node.playPathAacv224 ||
      node.downloadUrl || node.playUrl || "";
    return applySrc(src);
  }).catch(function(){ return null; });

  return Promise.all([pWeb, pMob]).then(function(parts){
    for (var i = 0; i < parts.length; i++){
      if (parts[i]) return parts[i];
    }
    return ADAPTER_request(v1Url, { headers: _xmHdr(), timeout: 8, credentials: "omit" }).then(function(txt){
      var d = jsonp_safeParse(txt);
      var data = (d && d.data) || d || {};
      var src = data.src || data.playUrl || data.url || data.trackUrl ||
        (data.playUrlList && data.playUrlList[0] && (data.playUrlList[0].url || data.playUrlList[0])) || "";
      return applySrc(src);
    }).catch(function(){ return null; });
  });
};

function shuffleArray(arr){
  var a = (arr || []).slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function dedupePlaylists(list){
  var seen = {}, out = [];
  (list || []).forEach(function(p){
    if (!p || !p.dissid || seen[p.dissid]) return;
    seen[p.dissid] = 1;
    out.push(p);
  });
  return out;
}

    var fallbacks = [3, 2, 4, 1].filter(function(x){ return x !== Number(sortId); });
    function tryFb(i){
      if (i >= fallbacks.length) return Promise.resolve([]);
      return reqOnce(fallbacks[i]).then(function(list2){
        if (list2 && list2.length) return list2;
        return tryFb(i + 1);
      });
    }
    return tryFb(0);
  });
};

// 智能推荐：多源混合 + 随机分类 + 随机分页 + 全量打散（换一批真的会变）
// 第 4 个参数 refresh=true 时强制换源/换页
API.recommendPlaylists = function(categoryId, sortId, count, refresh){
  count = count || 18;
  if (refresh) _plRefreshNonce++;
  var nonce = _plRefreshNonce + (refresh ? Math.floor(Math.random()*1000) : 0);

  // 指定具体分类（歌单页 Tab）
  if (categoryId && categoryId !== 10000000 && categoryId !== "10000000" && categoryId !== "smart" && categoryId !== null){
    var sin = refresh ? (Math.floor(Math.random() * 8) * 20) : 0; // 0/20/40/.../140
    return API.playlistsByTagPage(categoryId, sortId || 3, sin, Math.max(count, 24)).then(function(list){
      if (list.length) return shuffleArray(list).slice(0, count);
      // 空则换页再试一次
      return API.playlistsByTagPage(categoryId, 3, 0, count).then(function(list2){
        return shuffleArray(list2).slice(0, count);
      });
    });
  }

  // 每次（尤其换一批）随机抽 3 个分类 + 随机分页
  var pool = shuffleArray(PL_CAT_POOL);
  var catA = pool[nonce % pool.length];
  var catB = pool[(nonce + 3) % pool.length];
  var catC = pool[(nonce + 7) % pool.length];
  var sinA = (nonce % 5) * 12;
  var sinB = ((nonce + 2) % 5) * 12;
  var sinC = ((nonce + 4) % 5) * 12;

  return Promise.all([
    API.hotRecommendPlaylists(),
    API.playlistsByTagPage(catA, 3, sinA, 16),
    API.playlistsByTagPage(catB, 3, sinB, 16),
    API.playlistsByTagPage(catC, 3, sinC, 16)
  ]).then(function(parts){
    var mixed = dedupePlaylists([].concat(parts[0]||[], parts[1]||[], parts[2]||[], parts[3]||[]));
    // 换一批：整表打散，不要固定热门前 8
    mixed = shuffleArray(mixed);
    if (mixed.length >= count) return mixed.slice(0, count);
    // 不够再补一页全部
    return API.playlistsByTagPage(10000000, 3, (nonce % 6) * 18, 30).then(function(more){
      return shuffleArray(dedupePlaylists(mixed.concat(more || []))).slice(0, count);
    });
  }).catch(function(){
    return API.playlistsByTagPage(10000000, 3, 0, count).then(function(list){
      return shuffleArray(list).slice(0, count);
    });
  });
};

API.playlistDetail = function(dissid, pageNo, pageSize){
  dissid = String(dissid || "").replace(/\D/g, "") || dissid;
  pageNo = Math.max(0, pageNo || 0);
  pageSize = pageSize || 50;
  var url = "https://c.y.qq.com/qzone/fcg-bin/fcg_ucc_getcdinfo_byids_cp.fcg?type=1&json=1&utf8=1&onlysong=0&nosign=1&disstid="+encodeURIComponent(dissid)+"&format=json&g_tk=5381&loginUin=0&hostUin=0&inCharset=utf8&outCharset=utf-8&platform=yqq.json&needNewCode=0";
  function fromCdlist(txt){
    var d = jsonp_safeParse(txt);
    if (!d || !d.cdlist || !d.cdlist[0]) return null;
    var c = d.cdlist[0];
    var all = (c.songlist || []).map(normalizeSongFromPlaylist).filter(function(s){ return s && s.songmid; });
    // 旧接口一次返回（可能不全），按页切片以统一分页体验
    var start = pageNo * pageSize;
    var slice = all.slice(start, start + pageSize);
    var total = c.songnum || all.length;
    return {
      info: { title:c.dissname, cover:fixCover(c.logo||c.dir_pic_url2||""), desc:c.desc, playCount:c.visitnum, creator:c.nickname, songCount:total },
      songs: slice,
      hasMore: (start + slice.length) < all.length || (total > all.length && slice.length >= pageSize),
      pageNo: pageNo,
      _cdAll: pageNo === 0 ? all : null // 首页缓存全量，后续页本地切片
    };
  }
  function fromMusicu(){
    var body = JSON.stringify({
      comm: { ct: 24, cv: 0 },
      req_0: {
        module: "srf_diss_info.DissInfoServer",
        method: "CgiGetDiss",
        param: { disstid: Number(dissid)||dissid, num: pageSize, orderlist: 1, page_no: pageNo, onlysonglist: pageNo > 0 ? 1 : 0, enc_host_uin: "" }
      }
    });
    return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
      method: "POST", headers: withCookie({ "Content-Type": "application/json" }), body: body
    }).then(function(txt){
      var d = jsonp_safeParse(txt);
      var data = d && d.req_0 && d.req_0.data;
      if (!data) return { info: {}, songs: [], hasMore: false, pageNo: pageNo };
      var dir = data.dirinfo || data.dirInfo || {};
      var list = data.songlist || data.songList || [];
      var songs = list.map(function(it){
        return normalizeSongFromPlaylist(it.songInfo || it.musicData || it);
      }).filter(function(s){ return s && s.songmid; });
      var total = dir.songnum || dir.song_num || data.total_song_num || data.total || 0;
      if (!total) total = (pageNo * pageSize) + songs.length + (songs.length >= pageSize ? pageSize : 0);
      return {
        info: {
          title: dir.title || dir.dissname || "",
          cover: fixCover(dir.picurl || dir.logo || dir.pic_url || ""),
          desc: dir.desc || "",
          playCount: dir.listennum || dir.visitnum || 0,
          creator: (dir.host_nick || dir.nickname || ""),
          songCount: total || ((pageNo * pageSize) + songs.length)
        },
        songs: songs,
        hasMore: songs.length >= pageSize,
        pageNo: pageNo
      };
    }).catch(function(){ return { info: {}, songs: [], hasMore: false, pageNo: pageNo }; });
  }
  // 分页页只走 musicu；首页优先 cdlist，空则 musicu
  if (pageNo > 0){
    return fromMusicu();
  }
  return ADAPTER_request(url, {headers:withCookie()}).then(function(txt){
    var res = fromCdlist(txt);
    if (res && res.songs && res.songs.length){
      // cdlist 若一次给全量，后续用本地缓存翻页
      return res;
    }
    return fromMusicu().then(function(res2){
      if (res2.songs && res2.songs.length) return res2;
      return res || res2;
    });
  }).catch(function(){ return fromMusicu(); });
};

API.lyricByMeta = function(name, singer){
  name = (name || "").trim();
  if (!name) return Promise.resolve({ lyric: "", trans: "" });
  var kw = (name + " " + ((singer || "").split(/[\/、,&]/)[0] || "")).trim();
  return API._searchByType(kw, 0, 1, 5).then(function(songRes){
    var list = (((songRes || {}).data || {}).song || {}).list || [];
    if (!list.length) return { lyric: "", trans: "" };
    var best = null, bestScore = -1;
    list.forEach(function(it){
      var n = normalizeSongFromSearch(it);
      var score = 0;
      if (n.name === name) score += 5;
      else if (n.name && name && n.name.indexOf(name) >= 0) score += 3;
      else if (n.name && name && name.indexOf(n.name) >= 0) score += 2;
      if (singer && n.singer && n.singer.indexOf((singer.split(/[\/、]/)[0]||"")) >= 0) score += 3;
      if (score > bestScore){ bestScore = score; best = n; }
    });

    if (!best || !best.songmid) return { lyric: "", trans: "" };
    return API.lyric(best.songmid);
  }).catch(function(){ return { lyric: "", trans: "" }; });

// 播放地址（vkey）
// 音质：ZQ 无损 / SQ 320k / HQ 128k / LQ 96k / M4A 试听档
// 未登录或非绿钻时，高音质可能无 purl 或只返回试听链；试听链须拒绝并回落洛雪
API.songUrl = function(song){
  if (!song || !song.songmid) return Promise.resolve(null);
  var qMap = {
    "ZQ": { s:"F000", e:".flac" },
    "SQ": { s:"M800", e:".mp3" },
    "HQ": { s:"M500", e:".mp3" },
    "LQ": { s:"M300", e:".mp3" },
    "M4A":{ s:"C400", e:".m4a" }
  };
  // 请求顺序：用户选择 → 完整音质降级；默认不自动落到 C400 试听档
  var order = [];
  var pref = state.quality || "HQ";
  if (qMap[pref] && pref !== "M4A") order.push(pref);
  else if (pref === "M4A") order.push("HQ");
  ["HQ","SQ","LQ","ZQ"].forEach(function(k){
    if (order.indexOf(k) < 0) order.push(k);
  });

  var uin = "0";
  if (state.user && state.user.uin) uin = String(state.user.uin).replace(/^o0*/, "") || "0";
  var g = guid();
  // 官方 filename = 前缀 + media_mid(优先) / songmid + 后缀，切勿把两个 mid 拼在一起
  var songmid = song.songmid;
  var mediaMid = song.media_mid || song.strMediaMid || song.mediaMid || songmid;
  var midCandidates = [];
  if (mediaMid) midCandidates.push(mediaMid);
  if (songmid && songmid !== mediaMid) midCandidates.push(songmid);

  var userIsVip = !!(state.user && (state.user.vip || state.user.svip));
  var songIsVip = !!(song.isVip || song.pay_play || (song.pay && (song.pay.pay_play === 1 || song.pay.payplay === 1)));

  /** 判断官方返回的 purl 是否为试听/无权限短链（一律拒绝，不播约 1 分钟试听） */
  function isTrialPurl(purl, item, qKey){
    if (!purl) return true;
    var p = String(purl);
    // C400 = 官方试听档；RS02 等为 try 文件
    if (/^C400/i.test(p) || /(?:^|[\/?&])C400/i.test(p)) return true;
    if (/RS02|O6[0-9A-Z]|try[_-]?url|preview|tsmusic|onlyplay/i.test(p)) return true;
    if (/\/C400|filename=C400|C400[A-Za-z0-9]+\.m4a/i.test(p)) return true;
    if (item){
      var msg = String(item.msg || item.errmsg || item.errMsg || "");
      if (/试听|无版权|付费|会员|vip|无权限|无法播放|开通/i.test(msg)) return true;
      // subcode 非 0 常见于无权限
      if (item.subcode != null && Number(item.subcode) !== 0) return true;
    }
    // 请求完整音质却只拿到 m4a 试听前缀
    if (qKey && qKey !== "M4A" && /\.m4a(\?|$)/i.test(p) && /C400/i.test(p)) return true;
    // 明确点了试听档 key
    if (qKey === "M4A") return true;
    return false;
  }

  function parseVkeyResp(d, qKey){
    if (!d) return null;
    var data = (d.req_0 && d.req_0.data) || (d.req && d.req.data) || d.data || null;
    if (!data) return null;
    var item = (data.midurlinfo && data.midurlinfo[0]) || null;
    if (!item || !item.purl) return null;
    if (isTrialPurl(item.purl, item, qKey)) return null;
    var domain = (data.sip && data.sip[0]) || "https://dl.stream.qqmusic.qq.com/";
    if (domain.indexOf("http") !== 0) domain = "https://" + domain;
    if (domain.slice(-1) !== "/") domain += "/";
    domain = domain.replace(/^http:/, "https:");
    return domain + item.purl;
  }

  function requestOne(qKey, fileMid){
    var q = qMap[qKey] || qMap.HQ;
    var filename = q.s + fileMid + q.e;
    var body = JSON.stringify({
      req_0: {
        module: "vkey.GetVkeyServer",
        method: "CgiGetVkey",
        param: {
          guid: g,
          songmid: [songmid],
          filename: [filename],
          songtype: [0],
          uin: uin,
          loginflag: uin && uin !== "0" ? 1 : 0,
          platform: "20"
        }
      },
      comm: {
        uin: Number(uin) || 0,
        format: "json",
        ct: 24,
        cv: 0,
        authst: (state.user && (state.user.qqmusic_key || state.user.qm_keyst)) || ""
      }
    });
    return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
      method: "POST",
      headers: withCookie({
        "Content-Type": "application/json",
        "Referer": "https://y.qq.com/",
        "Origin": "https://y.qq.com"
      }),
      body: body,
      credentials: "include",
      timeout: 20
    }).then(function(txt){
      return parseVkeyResp(jsonp_safeParse(txt), qKey);
    }).catch(function(){ return null; });
  }

  // 备用：UrlGetVkey（部分环境 CgiGetVkey 对绿钻曲返回空 purl）
  function requestUrlGetVkey(qKey, fileMid){
    var q = qMap[qKey] || qMap.HQ;
    var filename = q.s + fileMid + q.e;
    var body = JSON.stringify({
      req_0: {
        module: "music.vkey.GetVkey",
        method: "UrlGetVkey",
        param: {
          guid: g,
          songmid: [songmid],
          filename: [filename],
          songtype: [0],
          uin: uin,
          loginflag: 1,
          platform: "20"
        }
      },
      comm: { uin: Number(uin) || 0, format: "json", ct: 24, cv: 0 }
    });
    return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
      method: "POST",
      headers: withCookie({
        "Content-Type": "application/json",
        "Referer": "https://y.qq.com/"
      }),
      body: body,
      credentials: "include",
      timeout: 20
    }).then(function(txt){
      return parseVkeyResp(jsonp_safeParse(txt), qKey);
    }).catch(function(){ return null; });
  }

  function tryOfficialVkey(){
    var chain = Promise.resolve(null);
    order.forEach(function(qKey){
      midCandidates.forEach(function(mid){
        chain = chain.then(function(got){
          if (got) return got;
          return requestOne(qKey, mid);
        }).then(function(got){
          if (got) return got;
          return requestUrlGetVkey(qKey, mid);
        });
      });
    });
    return chain;
  }

  // 非 VIP：直接走官方完整音质；VIP：长青∥洛雪完整曲，官方试听一律不用
  if (!songIsVip){
    return tryOfficialVkey().then(function(url){
      if (url) return url;
      // 官方失败再兜底第三方（少数地区/接口异常）
      return API.cqOrLxUrlMulti(song).then(function(u){ return u || null; });
    });
  }
  return API.cqOrLxUrlMulti(song).then(function(url){
    if (url) return url;
    return null; // VIP 不走官方试听
  });
};

function _lxSha256(ascii){
  // 精简正确实现（与 Node crypto 对齐，供洛雪 v4 签名）
  ascii = String(ascii == null ? "" : ascii);
  function rightRotate(value, amount){ return (value>>>amount) | (value<<(32-amount)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), i, j, result = "", words = [];
  var asciiBitLength = ascii.length * 8;
  // K 常量表缓存；每次哈希使用新的初始 H
  if (!_lxSha256.k){
    _lxSha256.k = [];
    var isComposite = {}, primeCounter = 0, candidate;
    var hInit = [];
    for (candidate = 2; primeCounter < 64; candidate++){
      if (!isComposite[candidate]){
        for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
        hInit[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
        _lxSha256.k[primeCounter++] = (mathPow(candidate, 1/3) * maxWord) | 0;
      }
    }
    _lxSha256.hInit = hInit.slice(0, 8);
  }
  var k = _lxSha256.k;
  var hash = _lxSha256.hInit.slice(0, 8);
  ascii += "\x80";
  while (ascii.length % 64 - 56) ascii += "\x00";
  for (i = 0; i < ascii.length; i++){
    j = ascii.charCodeAt(i);
    if (j >> 8) return "";
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = (asciiBitLength);
  for (j = 0; j < words.length;){
    var w = words.slice(j, j += 16);
    var oldHash = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++){
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e & hash[5]) ^ ((~e) & hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
          ) | 0);
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++){
    for (j = 3; j + 1; j--){
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? "0" : "") + b.toString(16);
    }
  }
  return result;
}

function _lxSign(path){
  // v4: sha256( path + md5(token) + secret )；当前 token 为空 → 固定 md5("")
  return _lxSha256(path + LX_API.tokenMd5 + LX_API.secret);
}


/* ============================================================
   长青 SVIP 音源（与洛雪并行）
   接口来自「长青SVIP音源 v1.2.0」：按源拼直链，支持 128k/320k/flac
   kg 用 hash；tx/wy/kw/mg 用 songmid/rid/数字 id
   ============================================================ */
var CHANGQING = {
  qualityMap: { "128k": "standard", "320k": "exhigh", "flac": "lossless", "HQ": "exhigh", "SQ": "exhigh", "ZQ": "lossless" },
  endpoints: {
    kugou:   "https://music.haitangw.cc/kgqq1/kg.php",
    qq:      "http://175.27.166.236/kgqq1/qq.php",
    netease: "http://175.27.166.236/wy1/wy.php",
    kuwo:    "https://musicapi.haitangw.net/music1/kw.php",
    migu:    "https://music.haitangw.cc/musicapi1/mg.php"
  }
};
API.changqingLevel = function(){
  var q = state.quality || "HQ";
  if (q === "ZQ" || q === "flac") return "lossless";
  if (q === "SQ" || q === "320k") return "exhigh";
  if (q === "HQ" || q === "128k") return "standard";
  return CHANGQING.qualityMap[q] || "exhigh";
};
API.changqingSongId = function(song){
  if (!song) return "";
  var src = song.source || "qq";
  if (src === "kugou"){
    return String(song.hash || song.kgHash || song.songmid || "").replace(/^kg_/, "");
  }
  if (src === "kuwo"){
    return String(song.rid || song.hash || String(song.songmid || "").replace(/^kw_/, "")).replace(/^MUSIC_/i, "");
  }
  if (src === "netease"){
    return String(song.neteaseId || song.hash || String(song.songmid || "").replace(/^ne_/, ""));
  }
  if (src === "migu"){
    return String(song.miguId || song.hash || song.songmid || "");
  }
  // qq / tx
  return String(song.songmid || song.media_mid || song.strMediaMid || song.hash || "");
};
/** 长青：请求接口，跟随跳转得到可播直链；失败返回 null */
API.changqingUrl = function(song){
  if (!song) return Promise.resolve(null);
  var src = song.source || "qq";
  var epKey = src === "qq" ? "qq" : src;
  var base = CHANGQING.endpoints[epKey];
  if (!base) return Promise.resolve(null);
  var id = API.changqingSongId(song);
  if (!id) return Promise.resolve(null);
  var level = API.changqingLevel();
  var url = base + "?type=mp3&id=" + encodeURIComponent(id) + "&level=" + encodeURIComponent(level);
  // 对齐可播版(q-16a)：接口 URL 原样作 audio.src（302 到真实 mp3）
  // 禁止 safePlaySrc 把 http 网关强升 https（长青节点常无证书，升了全挂）
  return Promise.resolve(url);
};
/** 长青与洛雪并行：主用长青，备用洛雪（与可播版一致） */
API.cqOrLxUrl = function(song){
  var cq = API.changqingUrl(song).catch(function(){ return null; });
  var lx = API.lxUrl(song).catch(function(){ return null; });
  return Promise.all([cq, lx]).then(function(arr){
    return arr[0] || arr[1] || null;
  });
};
API.cqOrLxUrlMulti = function(song){
  // 本源：长青 ∥ 洛雪 → 失败再走洛雪跨源
  return API.cqOrLxUrl(song).then(function(url){
    if (url) return url;
    return API.lxUrlMulti(song);
  });
};


API.lxQuality = function(){
  var q = state.quality || "HQ";
  if (q === "ZQ") return ["flac", "flac24bit", "320k", "128k"];
  if (q === "SQ") return ["320k", "128k", "flac"];
  return ["128k", "320k", "flac"];
};

API.lxSourceOf = function(song){
  if (!song) return "tx";
  if (song.source === "kuwo") return "kw";
  if (song.source === "netease") return "wy";
  if (song.source === "kugou") return "kg";
  if (song.source === "migu") return "mg";
  return "tx";
};

/** 与洛雪客户端一致：优先 hash，其次 songmid / rid */
API.lxSongId = function(song){
  if (!song) return "";
  if (song.source === "kuwo"){
    return String(song.hash || song.rid || String(song.songmid || "").replace(/^kw_/, "")).replace(/^MUSIC_/i, "");
  }
  if (song.source === "netease"){
    return String(song.hash || song.neteaseId || String(song.songmid || "").replace(/^ne_/, ""));
  }
  if (song.source === "kugou"){
    return String(song.hash || song.kgHash || song.songmid || "");
  }
  if (song.source === "migu"){
    return String(song.hash || song.miguId || song.songmid || "");
  }
  // QQ：洛雪脚本读的是 musicInfo.hash
  return String(song.hash || song.songmid || song.media_mid || song.strMediaMid || "");
};

API.lxUrl = function(song){
  var source = API.lxSourceOf(song);
  var songId = API.lxSongId(song);
  if (!songId) return Promise.resolve(null);
  var quals = API.lxQuality();

  function parseBody(txt){
    if (!txt) return null;
    if (typeof txt === "string" && /^\s*</.test(txt)) return null; // nginx 404 html
    var d = null;
    try { d = typeof txt === "string" ? JSON.parse(txt) : txt; } catch(e){ d = jsonp_safeParse(txt); }
    if (!d) return null;
    // 洛雪：code===0 且 data/url 为链接；部分镜像直接 url 字段
    if (Number(d.code) === 0 || d.code === 200 || d.code === "200"){
      var u = d.url || d.data || (d.data && d.data.url) || "";
      if (typeof u === "string" && /^https?:\/\//i.test(u)) return u.replace(/^http:/, "https:");
    }
    // vkeys 风格
    if (d.data && typeof d.data.url === "string" && /^https?:\/\//i.test(d.data.url)){
      return String(d.data.url).replace(/^http:/, "https:");
    }
    return null;
  }

  function tryOne(url, key){
    var isSlowMirror = /onrender\.com/i.test(url);
    return ADAPTER_request(url, {
      headers: {
        "Content-Type": "application/json",
        "User-Agent": "lx-music-mobile/1.4.3",
        "X-Request-Key": key || LX_API.key,
        "Accept": "application/json, text/plain, */*"
      },
      // onrender 冷启动较慢，适当放宽超时
      timeout: isSlowMirror ? 25 : 16,
      credentials: "omit"
    }).then(parseBody).catch(function(){ return null; });
  }

  var chain = Promise.resolve(null);
  var mirrors = (LX_API.mirrors && LX_API.mirrors.length) ? LX_API.mirrors : [
    { base: LX_API.base, key: LX_API.key }
  ];

  // 优先：公共镜像无签名 /url/{source}/{id}/{quality}（实测可用）
  mirrors.forEach(function(m){
    if (m.signed) return;
    quals.forEach(function(q){
      chain = chain.then(function(got){
        if (got) return got;
        var path = "/url/" + encodeURIComponent(source) + "/" + encodeURIComponent(songId) + "/" + encodeURIComponent(q);
        return tryOne(String(m.base).replace(/\/$/, "") + path, m.key);
      });
    });
  });

  // 其次：官方 v4 签名路径
  mirrors.forEach(function(m){
    if (!m.signed && m.base.indexOf("88.lxmusic") === -1) return;
    quals.forEach(function(q){
      chain = chain.then(function(got){
        if (got) return got;
        var path = "/lxmusicv4/url/" + encodeURIComponent(source) + "/" + encodeURIComponent(songId) + "/" + encodeURIComponent(q);
        var sign = _lxSign(path);
        return tryOne(String(m.base).replace(/\/$/, "") + path + "?sign=" + sign, m.key || LX_API.key);
      });
    });
  });

  // 再次：v3 无签名
  mirrors.forEach(function(m){
    quals.forEach(function(q){
      chain = chain.then(function(got){
        if (got) return got;
        var path = "/lxmusicv3/url/" + encodeURIComponent(source) + "/" + encodeURIComponent(songId) + "/" + encodeURIComponent(q);
        return tryOne(String(m.base).replace(/\/$/, "") + path, m.key || LX_API.key);
      });
    });
  });

  // 最后：vkeys 公共接口（QQ mid）
  if (source === "tx"){
    chain = chain.then(function(got){
      if (got) return got;
      var qMap = { "128k": 4, "320k": 8, "flac": 10, "flac24bit": 14 };
      var order = quals.map(function(q){ return qMap[q] || 8; });
      var p = Promise.resolve(null);
      order.forEach(function(qv){
        p = p.then(function(g){
          if (g) return g;
          var u = "https://api.vkeys.cn/v2/music/tencent/geturl?mid=" + encodeURIComponent(songId) + "&quality=" + qv;
          return ADAPTER_request(u, {
            headers: { "User-Agent": "Mozilla/5.0", "Accept": "application/json" },
            timeout: 12,
            credentials: "omit"
          }).then(parseBody).catch(function(){ return null; });
        });
      });
      return p;
    });
  }

  return chain;
};

/**
 * 洛雪多音源兜底：先本源 (tx/kw/wy/kg/mg)，失败再按歌名跨源匹配后走洛雪
 * 用于任意平台曲目播放失败时统一回落
 */
API.lxUrlMulti = function(song){
  if (!song) return Promise.resolve(null);
  // 1) 本源直取
  return API.lxUrl(song).then(function(url){
    if (url) return url;
    // 2) 跨源并行：酷我 / 网易 / 酷狗 / QQ 同时搜，谁先出可用链用谁
    var name = (song.name || "").trim();
    var singer = ((song.singer || "").split(/[\/、,&]/)[0] || "").trim();
    if (!name) return null;
    var kw = (name + " " + singer).trim();
    var primary = API.lxSourceOf(song);

    function scorePick(list, mapItem){
      var best = null, bestScore = -1;
      (list || []).forEach(function(it){
        var n = mapItem ? mapItem(it) : it;
        if (!n || !n.name) return;
        var score = 0;
        if (n.name === name) score += 5;
        else if (name && n.name.indexOf(name) >= 0) score += 3;
        if (singer && n.singer && n.singer.indexOf(singer) >= 0) score += 3;
        if (score > bestScore){ bestScore = score; best = n; }
      });
      if (!best || bestScore < 2){
        if (best && bestScore >= 1) return best;
        return null;
      }
      return best;
    }

    function trySearchThenLx(searchFn, srcTag){
      if (srcTag === primary) return Promise.resolve(null);
      return searchFn(kw, 1).then(function(res){
        var list = (res && res.list) || [];
        if (!list.length) return null;
        var best = scorePick(list, null);
        if (!best) return null;
        best.source = srcTag === "tx" ? "qq" : (srcTag === "kw" ? "kuwo" : (srcTag === "wy" ? "netease" : (srcTag === "kg" ? "kugou" : srcTag)));
        return API.cqOrLxUrl(best);
      }).catch(function(){ return null; });
    }

    function tryQQSearchThenLx(){
      if (primary === "tx") return Promise.resolve(null);
      return API._searchByType(kw, 0, 1, 6).then(function(songRes){
        var list = (((songRes || {}).data || {}).song || {}).list || [];
        if (!list.length) return null;
        var best = scorePick(list, normalizeSongFromSearch);
        if (!best || !best.songmid) return null;
        best.source = "qq";
        return API.cqOrLxUrl(best);
      }).catch(function(){ return null; });
    }

    /** 并行竞速：任一源返回非空 URL 即采用，其余忽略 */
    function firstUrl(promises){
      return new Promise(function(resolve){
        if (!promises || !promises.length){ resolve(null); return; }
        var left = promises.length;
        var settled = false;
        promises.forEach(function(p){
          Promise.resolve(p).then(function(v){
            if (settled) return;
            if (v){ settled = true; resolve(v); return; }
            left--;
            if (left <= 0) resolve(null);
          }).catch(function(){
            if (settled) return;
            left--;
            if (left <= 0) resolve(null);
          });
        });
      });
    }

    return firstUrl([
      trySearchThenLx(API.kuwoSearch, "kw"),

function mapMvSearchItem(m){

      if (typeof s === "string") return s;

  };

function pickMvStreamUrl(info){
  if (!info) return null;
  function normUrl(u, vkey){
    if (!u) return "";
    u = String(u).trim();
    if (!u) return "";
    if (u.indexOf("//") === 0) u = "https:" + u;
    u = u.replace(/^http:/i, "https:");
    // freeflow 已带完整 query；仅在缺 vkey 时补
    if (vkey && u.indexOf("vkey=") < 0 && u.indexOf("vkey%3D") < 0){
      u += (u.indexOf("?") >= 0 ? "&" : "?") + "vkey=" + encodeURIComponent(vkey);
    }
    return u;
  }
  function pushUrl(out, u, size, filetype){
    u = normUrl(u, "");
    if (!u || !/^https?:\/\//i.test(u)) return;
    // 过滤明显不可播的空壳
    if (/\/0$|\.ts$/i.test(u) && u.indexOf("m3u8") < 0) return;
    out.push({ u: u, size: Number(size) || 0, ft: Number(filetype) || 0 });
  }
  function collect(arr, out){
    (arr || []).forEach(function(x){
      if (!x) return;
      // code: 0 正常；部分节点用 1000；负值/非0且非1000 视为不可用
      var code = x.code;
      if (code != null && code !== 0 && code !== 1000 && code !== "0") return;
      var vkey = x.vkey || x.vnkey || "";
      var size = x.fileSize || x.filesize || x.size || 0;
      var ft = x.filetype || x.fileType || x.file_type || 0;
      // 优先 freeflow（免流/完整链），再普通 url
      var pools = [x.freeflow_url, x.url, x.comm_url, x.cn, x.wifi_url, x.hls_url];
      pools.forEach(function(pool){
        if (!pool) return;
        var list = Array.isArray(pool) ? pool : [pool];
        list.forEach(function(u){
          if (typeof u === "object" && u) u = u.url || u.purl || u.addr || "";
          pushUrl(out, normUrl(u, vkey), size, ft);
        });
      });
      if (x.m3u8) pushUrl(out, normUrl(x.m3u8, vkey), size, ft);
      // 部分响应直接给 purl
      if (x.purl) pushUrl(out, normUrl(x.purl, vkey), size, ft);
    });
  }
  var cands = [];
  collect(info.mp4, cands);
  collect(info.hls, cands);
  collect(info.mp3, cands);
  // 少数响应把流放在根上
  if (!cands.length && (info.freeflow_url || info.url)){
    collect([info], cands);
  }
  if (!cands.length) return null;
  // 偏好更高 filetype / 更大体积（跳过试看 filetype 0 若有更高清）
  cands.sort(function(a,b){
    var af = a.ft || 0, bf = b.ft || 0;
    if (af !== bf) return bf - af;
    return (b.size || 0) - (a.size || 0);
  });
  // 若最高是试看(0)且存在非0，则取非0
  var nonTrial = cands.filter(function(c){ return (c.ft || 0) > 0; });
  if (nonTrial.length) return nonTrial[0].u;
  return cands[0].u;
}
/** 返回所有候选播放地址（高清优先），供 openMv 失败时换源 */
function pickMvStreamUrls(info, limit){
  if (!info) return [];
  function normUrl(u, vkey){
    if (!u) return "";
    u = String(u).trim();
    if (u.indexOf("//") === 0) u = "https:" + u;
    u = u.replace(/^http:/i, "https:");
    if (vkey && u.indexOf("vkey=") < 0){
      u += (u.indexOf("?") >= 0 ? "&" : "?") + "vkey=" + encodeURIComponent(vkey);
    }
    return u;
  }
  var cands = [];
  var seen = {};
  function add(u, size, ft){
    u = normUrl(u, "");
    if (!u || seen[u]) return;
    seen[u] = 1;
    cands.push({ u: u, size: Number(size)||0, ft: Number(ft)||0 });
  }
  function collect(arr){
    (arr || []).forEach(function(x){
      if (!x) return;
      var code = x.code;
      if (code != null && code !== 0 && code !== 1000 && code !== "0") return;
      var vkey = x.vkey || "";
      var size = x.fileSize || x.filesize || 0;
      var ft = x.filetype || x.fileType || 0;
      [x.freeflow_url, x.url, x.comm_url, x.wifi_url].forEach(function(pool){
        if (!pool) return;
        (Array.isArray(pool) ? pool : [pool]).forEach(function(u){
          if (typeof u === "object" && u) u = u.url || u.purl || "";
          add(normUrl(u, vkey), size, ft);
        });
      });
      if (x.m3u8) add(normUrl(x.m3u8, vkey), size, ft);
      if (x.purl) add(normUrl(x.purl, vkey), size, ft);
    });
  }
  collect(info.mp4);
  collect(info.hls);
  cands.sort(function(a,b){
    if ((a.ft||0) !== (b.ft||0)) return (b.ft||0) - (a.ft||0);
    return (b.size||0) - (a.size||0);
  });
  return cands.slice(0, limit || 6).map(function(c){ return c.u; });
}
API.mvUrl = function(vid){
  if (!vid) return Promise.resolve(null);
  vid = String(vid).trim();
  if (!vid) return Promise.resolve(null);

  function parseMvPayload(txt){
    var d = jsonp_safeParse(txt);
    if (!d) return null;
    // 兼容 req_0 / getMVUrl / mvUrl 多种包壳
    var nodes = [];
    if (d.req_0 && d.req_0.data) nodes.push(d.req_0.data);
    if (d.getMVUrl && d.getMVUrl.data) nodes.push(d.getMVUrl.data);
    if (d.mvUrl && d.mvUrl.data) nodes.push(d.mvUrl.data);
    if (d.data) nodes.push(d.data);
    for (var i = 0; i < nodes.length; i++){
      var node = nodes[i];
      if (!node) continue;
      // data[vid] 或 data 直接是 info
      var info = node[vid] || node[String(vid)] || null;
      if (!info && node.mp4) info = node;
      // 有时包一层 { data: { vid: info } }
      if (!info && node.data){
        info = node.data[vid] || node.data[String(vid)] || (node.data.mp4 ? node.data : null);
      }
      if (info) return info;
    }
    return null;
  }

  function requestVariant(variant){
    var bodyObj = {
      comm: {
        ct: 24,
        cv: 0,
        g_tk: 5381,
        uin: (state.user && state.user.uin) || "0",
        format: "json",
        platform: "yqq"
      }
    };
    bodyObj[variant.key] = {
      module: variant.module,
      method: "GetMvUrls",
      param: variant.param
    };
    // 历史写法：request_typet 在 param 外层
    if (variant.outerTypet != null){
      bodyObj[variant.key].request_typet = variant.outerTypet;
    }
    var body = JSON.stringify(bodyObj);
    return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
      method: "POST",
      headers: withCookie({
        "Content-Type": "application/json",
        "Referer": "https://y.qq.com/",
        "Origin": "https://y.qq.com"
      }),
      body: body,
      credentials: "include"
    }).then(function(txt){
      var info = parseMvPayload(txt);
      if (!info) return null;
      // 返回候选列表，上层 openMv 可换源
      var urls = pickMvStreamUrls(info, 8);
      if (urls && urls.length) return { url: urls[0], urls: urls, info: info };
      var one = pickMvStreamUrl(info);
      return one ? { url: one, urls: [one], info: info } : null;
    }).catch(function(){ return null; });
  }

  // 多种线上可用变体（2024–2025 抓包 + 旧 gosrf）
  var variants = [
    {
      key: "mvUrl",
      module: "music.stream.MvUrlProxy",
      param: { vids: [vid], request_type: 10003, addrtype: 3, format: 264, maxFiletype: 60 }
    },
    {
      key: "req_0",
      module: "gosrf.Stream.MvUrlProxy",
      param: { vids: [vid], request_typet: 10003, addrtype: 3 }
    },
    {
      key: "getMVUrl",
      module: "gosrf.Stream.MvUrlProxy",
      param: { vids: [vid], from: "h5.playsong" },
      outerTypet: 10001
    },
    {
      key: "req_0",
      module: "gosrf.Stream.MvUrlProxy",
      param: { vids: [vid], request_typet: 10001 }
    },
    {
      key: "mvUrl",
      module: "music.stream.MvUrlProxy",
      param: { vids: [vid], request_type: 10001, addrtype: 3 }
    }
  ];

  function tryAt(i){
    if (i >= variants.length) return Promise.resolve(null);
    return requestVariant(variants[i]).then(function(res){
      if (res && res.url) return res;
      return tryAt(i + 1);
    });
  }
  // 兼容旧调用方：默认 resolve 字符串 URL；同时挂 urls 供 openMv 使用
  return tryAt(0).then(function(res){
    if (!res) return null;
    var u = res.url;
    // 把候选挂到字符串上不现实；openMv 改为接收对象。这里返回对象，并让 String 场景仍可用
    return res;
  });
};

function _isQqLoggedIn(){

/** 两套列表都尽量给满（推荐最多 30 首，30 卡最多 30 首）；只错开排序，不砍成 15 首 */
function _dedupeDailyPair(recSongs, d30Songs){
  recSongs = (recSongs || []).slice();
  d30Songs = (d30Songs || []).slice();
  var seen = {};
  var pool = [];
  function addAll(list){
    (list || []).forEach(function(s){
      if (!s || !s.songmid || seen[s.songmid]) return;
      seen[s.songmid] = true;
      pool.push(s);
    });
  }
  addAll(d30Songs);
  addAll(recSongs);
  if (pool.length < 5){
    return { rec: recSongs.slice(0, 30), d30: d30Songs.slice(0, 30), same: true };
  }

  // 每日30：原顺序前 30
  var d30 = pool.slice(0, Math.min(30, pool.length));

  // 每日推荐：同样最多 30 首，但从中段轮转，保证首曲不同、顺序不同
  var offset = 0;
  if (pool.length >= 8){
    offset = Math.min(Math.max(3, Math.floor(pool.length / 4)), pool.length - 1);
  }
  var rec = pool.slice(offset).concat(pool.slice(0, offset)).slice(0, Math.min(30, pool.length));

  // 硬保证首曲不同
  if (rec[0] && d30[0] && rec[0].songmid === d30[0].songmid && rec.length > 1){
    for (var i = 1; i < rec.length; i++){
      if (rec[i].songmid !== d30[0].songmid){
        var tmp = rec[0]; rec[0] = rec[i]; rec[i] = tmp;
        break;
      }
    }
  }
  return { rec: rec, d30: d30, same: true };
}

    isVip: !!(d.pay&&(d.pay.payplay===1||d.pay.pay_play===1))
  };
}
function normalizeSongFromPlaylist(d){
  if (!d) return {songmid:"",name:"未知",singer:"",albummid:"",interval:0};
  var mediaMid = (d.file && (d.file.media_mid || d.file.mediaMid)) || d.media_mid || d.strMediaMid || d.songmid || d.mid || "";
  return {
    songmid: d.songmid||d.mid,
    media_mid: mediaMid,
    name: d.songname||d.name||d.title,
    singer:(d.singer||[]).map(function(a){return a.name;}).join("/"),
    albummid: d.albummid||d.album_mid||(d.album&&(d.album.mid||d.album.pmid))||"",
    albumname: d.albumname||(d.album&&(d.album.name||d.album.title))||"",
    cover: d.pic||d.cover||(d.album&&d.album.pic)||"",
    interval: d.interval||0,
    isVip: !!(d.pay&&(d.pay.payplay===1||d.pay.pay_play===1))
  };
}

/* ============================================================
   § 4. 路由 + 全局返回（对齐 Solene）
   ------------------------------------------------------------
   - 首页 = history 第 0 层，URL = pathname+search（不带 #hash）
     原生用 URL 判断「是否主页」；带 #home 会对不上 homePage，无法退出全屏
   - 不垫任何哨兵层；离开首页才 pushState
   - 子页 restoreAffordance:"none"；首页 "auto" 交给 App 退出
   ============================================================ */
var VIEWS = ["home","toplist","playlists","singers","radio","mv","mine","search","detail","singerDetail"];
var MAIN_TABS = ["home","toplist","playlists","singers","radio","mv","mine"];
var _overlayNavLock = false;
var _ignorePop = 0;

function currentHistoryState(extra){
  var base = { view: state.view, params: state.viewParams || {}, qqm: 1 };
  if (extra) {
    for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) base[k] = extra[k];
  }
  return base;
}

function isOverlayOpen(){
  var login = $("#loginView");
  if (login && !login.classList.contains("hidden")) return "login";
  var mv = $("#mvPlayerView");
  if (mv && mv.classList.contains("show")) return "mv";
  var fp = $("#fullPlayer");
  if (fp && fp.classList.contains("show")){
    if (fp.classList.contains("lyrics-focus")) return "lyrics";
    return "player";
  }
  return null;
}

function syncAppUnderlay(){
  var app = $("#app");
  if (!app) return;
  if (isOverlayOpen()) app.classList.add("overlay-hidden");
  else app.classList.remove("overlay-hidden");
}

/** Solene: 子页 none（返回走 WebView history）；首页 auto（原生可退出全屏） */
function setSubviewChrome(isSubview){
  try {
    if (window.fm && window.fm.ui && typeof window.fm.ui.setChrome === "function"){
      window.fm.ui.setChrome({
        mode: "edge",
        statusBarStyle: "light",
        navigationBarStyle: "light",
        restoreAffordance: isSubview ? "none" : "auto"
      }).catch(function(){});
    }
  } catch(e) {}
}

function hashFor(name, params){
  params = params || {};
  // 首页必须裸 URL，不能带 #home（Solene 注释：否则原生永远认为还没回主页）
  if (name === "home") return location.pathname + location.search;
  var h = "#"+name;
  if (params.id) h += "/"+params.id;
  if (params.mid) h += "/"+params.mid;
  if (params.kw) h += "/"+encodeURIComponent(params.kw);
  return h;
}

/** 各视图滚动位置记忆：离开时保存，返回时还原 */
var _viewScrollPos = {};
function saveViewScroll(name){
  if (!name) return;
  try {
    var node = $("#view-" + name);
    if (node) _viewScrollPos[name] = node.scrollTop || 0;
  } catch(e) {}
}
function restoreViewScroll(name){
  if (!name) return;
  var y = 0;
  try { y = +(_viewScrollPos[name] || 0) || 0; } catch(e0) { y = 0; }
  function apply(){
    try {
      var node = $("#view-" + name);
      if (node) node.scrollTop = y;
      // viewport 在部分布局下也可能承接滚动
      var vp = $("#viewport");
      if (vp && name === state.view) {
        // 仅当目标视图是当前激活视图时，不强制动 viewport；多数滚动在 .view 上
      }
    } catch(e1) {}
  }
  apply();
  try {
    requestAnimationFrame(function(){
      apply();
      requestAnimationFrame(apply);
    });
  } catch(e2) {
    setTimeout(apply, 0);
    setTimeout(apply, 50);
  }
}

function switchView(name, params, push){
  params = params || {};
  var prev = state.view;
  // 离开前记住上一页滚动位置
  if (prev && prev !== name) saveViewScroll(prev);
  state.view = name;
  state.viewParams = params;

  VIEWS.forEach(function(v){
    var node = $("#view-"+v);
    if (node) node.classList.toggle("active", v === name);
  });
  $all(".nav-item").forEach(function(n){
    n.classList.toggle("active", n.dataset.view === name);
  });
  // 新打开的详情类页面从顶部开始；返回旧页则还原记忆位置
  if (push !== false && (name === "detail" || name === "singerDetail")){
    _viewScrollPos[name] = 0;
  }

  if (push !== false){
    var url = hashFor(name, params);
    // 全屏播放器/歌词焦点打开时，禁止把 history.overlay 清掉，否则手势返回会丢层直接退出
    var keepOv = null;
    try {
      var ovNow = isOverlayOpen();
      if (ovNow === "player" || ovNow === "lyrics") keepOv = ovNow;
      else if (history.state && (history.state.overlay === "player" || history.state.overlay === "lyrics")) {
        var fp0 = $("#fullPlayer");
        if (fp0 && fp0.classList.contains("show")) keepOv = history.state.overlay;
      }
    } catch(eOv) {}
    var st = currentHistoryState({view:name, params:params, overlay: keepOv});
    try {
      if (name === "home"){
        // 回首页只 replace 成裸 URL（真正弹栈由 handleBack / history.back 完成）
        // 禁止在子页上误把当前 entry 直接改成 home，否则 Native 会认为已在主页并退出
        history.replaceState(st, "", url);
      } else if (MAIN_TABS.indexOf(name) > -1){
        if (prev === "home") history.pushState(st, "", url);
        else history.replaceState(st, "", url);
      } else {
        history.pushState(st, "", url);
      }
    } catch(e) {}
  }

  // 首页 auto；其它视图 / 浮层 none
  setSubviewChrome(name !== "home" || !!isOverlayOpen());
  renderView(name, params);
  restoreViewScroll(name);
  syncAppUnderlay();
}

function pushOverlayState(kind){
  try {
    // 盘链经验：必须改 URL（hash），同 URL 的 pushState 在部分 WebView/宿主上
    // 不会让 canGoBack/侧滑返回生效，表现为「进了全屏却滑不回去」。
    var url = location.href;
    if (kind === "player") url = "#player";
    else if (kind === "lyrics") url = "#player/lyrics";
    else if (kind === "login") url = "#login";
    else if (kind === "mv") url = "#mv";
    history.pushState(currentHistoryState({overlay: kind}), "", url);
  } catch(e) {}
  setSubviewChrome(true);
}

function closeOverlayUI(kind){
  if (kind === "login") closeLoginView(true);
  else if (kind === "mv") closeMv(true);
  else if (kind === "lyrics") exitLyricsFocus(true);
  else if (kind === "player") closeFullPlayer(true);
  setSubviewChrome(state.view !== "home");
  syncAppUnderlay();
}

function tryCloseOverlay(fromPopstate){
  var kind = isOverlayOpen();
  if (!kind) return false;
  // 是否在历史栈里真正压过这一层（没有则绝不能 history.back，否则会退出 WebView）
  var hadHistory = false;
  try {
    hadHistory = !!(history.state && history.state.overlay === kind) ||
      (kind === "player" && _fpHistoryPushed) ||
      (kind === "lyrics" && _lyricsFocusPushed) ||
      (kind === "player" && history.state && history.state.overlay === "lyrics"); // 歌词层返回会先到 player
  } catch(eH) {
    hadHistory = (kind === "player" && _fpHistoryPushed) || (kind === "lyrics" && _lyricsFocusPushed);
  }

  if (kind === "login") closeLoginView(true);
  else if (kind === "mv") closeMv(true);
  else if (kind === "lyrics"){
    exitLyricsFocus(true);
  }
  else if (kind === "player"){
    _fpHistoryPushed = false;
    _lyricsFocusPushed = false;
    _fpClosing = false;
    closeFullPlayer(true);
  }
  // 关闭后立刻按当前 view 校正 chrome
  setSubviewChrome(state.view !== "home");
  syncAppUnderlay();

  if (!fromPopstate){
    if (hadHistory){
      _overlayNavLock = true;
      _ignorePop = 1;
      try { history.back(); } catch(e) {}
      setTimeout(function(){
        _overlayNavLock = false;
        if (_ignorePop > 0) _ignorePop = 0;
        // 兜底：UI 已关但 history 仍挂 overlay → 清掉，避免下次手势被吞/连退
        try {
          var fp = $("#fullPlayer");
          var stillOpen = fp && fp.classList.contains("show") && !_fpClosing;
          if (!stillOpen && history.state && (history.state.overlay === "player" || history.state.overlay === "lyrics")){
            history.replaceState(currentHistoryState({ overlay: null }), "", location.href);
            _fpHistoryPushed = false;
            _lyricsFocusPushed = false;
          }
        } catch(e3) {}
      }, 360);
    } else {
      // 没有浮层历史：只清 state，禁止 back 到原生
      try {
        history.replaceState(currentHistoryState({ overlay: null }), "", location.href);
      } catch(e2) {}
      _fpHistoryPushed = false;
      _lyricsFocusPushed = false;
    }
  }
  return true;
}

/** 强制回到首页并清洗历史，防止栈深度为 1 时 Native 直接退出 */
function forceGoHome(){
  // 尽量关掉浮层
  try { tryCloseOverlay(true); } catch(e) {}
  try { tryCloseOverlay(true); } catch(e) {}

  state.view = "home";
  state.viewParams = {};
  VIEWS.forEach(function(v){
    var node = $("#view-" + v);
    if (node) node.classList.toggle("active", v === "home");
  });
  $all(".nav-item").forEach(function(n){
    n.classList.toggle("active", n.dataset.view === "home");
  });
  try {
    history.replaceState(
      { view: "home", params: {}, qqm: 1, overlay: null },
      "",
      location.pathname + location.search
    );
  } catch(e) {}

  setSubviewChrome(false);
  syncAppUnderlay();
  renderView("home", {});
  restoreViewScroll("home");
}

function handleBack(){
  var qs = $("#queueSheet");
  if (qs && qs.classList.contains("show")){
    closeQueueSheet();
    return true;
  }

  // 全屏播放器 / 登录 / MV：必须先关浮层，绝不交给原生
  if (isOverlayOpen()){
    tryCloseOverlay(false);
    return true;
  }
  // 兜底：DOM 仍显示播放器但 isOverlayOpen 偶发读失败
  try {
    var fpB = $("#fullPlayer");
    if (fpB && fpB.classList.contains("show")){
      closeFullPlayer(false);
      return true;
    }
  } catch(eB) {}

  if (state.view !== "home"){
    // 优先真弹栈；栈已空或丢失首页层时强制回首页，避免 Native 直接退出
    var canPop = false;
    try {
      canPop = history.length > 1 && !!(history.state && history.state.qqm);
    } catch(e) {}

    if (canPop) {
      try {
        history.back();
        return true;
      } catch(e) {
        canPop = false;
      }
    }

    forceGoHome();
    return true;
  }

  // 首页：不拦截。canGoBack 应为 false，交给原生退出全屏
  return false;
}

window.addEventListener("popstate", function(e){
  if (_overlayExpected || _ignorePop > 0){
    if (_ignorePop > 0) _ignorePop--;
    _overlayNavLock = false;
    _overlayExpected = null;
    try {
      var sIgn = e.state;
      var openIgn = isOverlayOpen();
      if (openIgn && !(sIgn && sIgn.overlay)){
        if (openIgn === "player" || openIgn === "lyrics"){
          _fpHistoryPushed = false;
          _lyricsFocusPushed = false;
          _fpClosing = false;
          closeOverlayUI(openIgn === "lyrics" ? "player" : openIgn);
        }
      }
    } catch(eIgn) {}
    setSubviewChrome(state.view !== "home" || !!isOverlayOpen());
    syncAppUnderlay();
    return;
  }

  var s = e.state || { view: "home", params: {}, qqm: 1 };
  var open = isOverlayOpen();

  // 浮层已不在 state 里 → 关 DOM（系统手势返回 / 物理返回键）
  if (open && !(s && s.overlay === open)){
    // lyrics → player：state 变成 player，应只退歌词焦点，不要整页关播放器
    if (open === "lyrics" && s && s.overlay === "player"){
      exitLyricsFocus(true);
      _fpHistoryPushed = true;
      setSubviewChrome(true);
      syncAppUnderlay();
      return;
    }
    if (open === "player") _fpHistoryPushed = false;
    if (open === "lyrics") _lyricsFocusPushed = false;
    _fpClosing = false;
    if (open === "lyrics") closeOverlayUI("player");
    else closeOverlayUI(open);
    // 保险：再确认播放器 DOM 已关（部分 WebView state 与 class 不同步）
    try {
      var fpChk = $("#fullPlayer");
      if (fpChk && fpChk.classList.contains("show") && !(s && (s.overlay === "player" || s.overlay === "lyrics"))){
        _fpClosing = false;
        closeFullPlayer(true);
      }
    } catch(eChk) {}
    var targetView = (s && s.view && VIEWS.indexOf(s.view) > -1) ? s.view : state.view;
    if (targetView === state.view && !(s && s.overlay)){
      setSubviewChrome(state.view !== "home");
      syncAppUnderlay();
      return;
    }
  }

  if (s && s.overlay){
    if (s.overlay === "player"){
      _fpHistoryPushed = true;
      showFullPlayerUI();
      exitLyricsFocus(true);
    } else if (s.overlay === "lyrics"){
      _fpHistoryPushed = true;
      _lyricsFocusPushed = true;
      showFullPlayerUI();
      enterLyricsFocus(true);
    } else if (s.overlay === "login"){
      var login = $("#loginView");
      if (login) login.classList.remove("hidden");
    }
    setSubviewChrome(true);
    syncAppUnderlay();
    return;
  }

  // 无 overlay：确保播放器 DOM 已关（防止偶发只弹栈不关 UI）
  try {
    var fpLeft = $("#fullPlayer");
    if (fpLeft && fpLeft.classList.contains("show")){
      _fpHistoryPushed = false;
      _lyricsFocusPushed = false;
      closeFullPlayer(true);
    }
  } catch(eFp) {}

  var view = (s && s.view && VIEWS.indexOf(s.view) > -1) ? s.view : "home";
  var params = (s && s.params) || {};
  if (view !== state.view || JSON.stringify(params) !== JSON.stringify(state.viewParams||{})){
    switchView(view, params, false);
  } else {
    setSubviewChrome(view !== "home");
    syncAppUnderlay();
  }
});

function renderView(name, params){
  if (name==="home") renderHome();
  else if (name==="toplist") renderToplist();
  else if (name==="playlists") renderPlaylists(params || {});
  else if (name==="singers") renderSingers();
  else if (name==="radio") renderRadio();
  else if (name==="mv") renderMv(params || {});
  else if (name==="mine") renderMine();
  else if (name==="search") {
    if (params && params.kw) renderSearchResults(params.kw);
    else renderSearchEmpty();
  }
  else if (name==="detail") renderDetail(params);
  else if (name==="singerDetail") renderSingerDetail(params);
}

var IMG_PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">'+
  '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a2a22"/><stop offset="100%" stop-color="#0d1512"/></linearGradient></defs>'+

);
function safeImg(src, cls){

  var u = raw ? esc(mediaUrl(raw)) : IMG_PLACEHOLDER;
  return '<img src="'+u+'"'+(cls?' class="'+cls+'"':'')+' loading="lazy" decoding="async" onerror="this.onerror=null;this.src=\''+IMG_PLACEHOLDER+'\';">';
}
/** 安全设置 img：失败时加 img-err（露出 CSS 底图）并回退 SVG */
function setImgSrc(el, src, fallbackSrc){
  if (!el) return;
  var primary = src ? mediaUrl(fixCover(src)) : "";
  var fallback = fallbackSrc ? mediaUrl(fixCover(fallbackSrc)) : "";
  // 同一地址不重复赋值，避免切歌封面闪一下
  if (primary && el.dataset.curSrc === primary && !el.classList.contains("img-err")) return;
  el.onerror = function(){
    if (fallback && this.dataset.tried !== "1"){
      this.dataset.tried = "1";
      this.src = fallback;
      this.dataset.curSrc = fallback;
      return;
    }
    this.onerror = null;
    this.classList.add("img-err");
    // 失败时保留上一张可见图，不强制换成占位图造成闪白
  };
  el.dataset.tried = "0";
  if (!primary){
    el.classList.add("img-err");
    return;
  }
  el.classList.remove("img-err");
  el.dataset.curSrc = primary;
  el.src = primary;
}

/** 早 / 中 / 晚 三个时段：5–11 上午，11–17 中午，其余晚上 */
function getDailyPeriodInfo(){
  var now = new Date();
  var h = now.getHours();
  var period = h >= 5 && h < 11 ? "morning" : (h >= 11 && h < 17 ? "noon" : "evening");
  var y = now.getFullYear();
  var m = String(now.getMonth() + 1);
  if (m.length < 2) m = "0" + m;
  var d = String(now.getDate());
  if (d.length < 2) d = "0" + d;
  var day = y + "-" + m + "-" + d;
  var labels = {
    morning: { short: "上午", title: "晨间推荐", subRec: "清晨好时光<br>来点儿音乐提提神吧~", sub30: "KTV热歌频道<br>每次都不一样" },
    noon:    { short: "中午", title: "午间推荐", subRec: "午后小憩<br>换首好歌继续听~", sub30: "KTV热歌频道<br>每次都不一样" },
    evening: { short: "晚上", title: "晚间推荐", subRec: "夜色正好<br>沉浸在音乐里吧~", sub30: "KTV热歌频道<br>每次都不一样" }
  };
  var meta = labels[period] || labels.evening;
  return {
    key: day + "-" + period,
    day: day,
    period: period,
    short: meta.short,
    title: meta.title,
    subRec: meta.subRec,
    sub30: meta.sub30
  };
}

  // 强制时允许打断「加载中」卡死
  if (force) _dailyCache.loading = true;

  var recCover = $("#dailyRecCover"), d30Cover = $("#daily30Cover");
  var recMeta = $("#dailyRecMeta"), d30Meta = $("#daily30Meta");

  function setCardCover(el, song){ if (el) el.innerHTML = safeImg(songCoverUrl(song)); }
  function setMeta(el, song, sub){
    if (!el) return;
    if (!song){ el.innerHTML = '<div class="df-name">暂无数据</div><div class="df-sub">'+esc(sub||"")+'</div>'; return; }

  }
  function bindPlay(cardId, playId, getSongs, label, tag){
    function snapshotSongs(){

  }
  bindPlay("dailyRecCard", "dailyRecPlay", function(){ return _dailyCache.recSongs; }, "每日推荐", "daily-rec");

  }

  // 网易：两套接口独立

function maybeRefreshDaily(force){
  var period = getDailyPeriodInfo();
  var uinKey = (state.user && state.user.uin) ? String(state.user.uin) : "guest";
  var cacheKey = period.key + "|" + (_homePlSrc || "qq") + "|" + uinKey;
  if (window.__qqmForceDaily){
    force = true;
    try { window.__qqmForceDaily = false; } catch(eF) {}
  }
  // 跨日强制刷新
  try {
    var lastDay = storeGet("dailyLastDay", "");
    if (lastDay && lastDay !== period.day){
      force = true;
      _dailyCache.key = "";
      _dailyCache.recSongs = [];
      _dailyCache.d30Songs = [];
      _dailyCache.loading = false;
    }
  } catch(eD) {}
  // 超过 4 小时也刷新（官方日推多在凌晨换批）
  try {
    var lastTs = Number(storeGet("dailyLastTs", 0) || 0);
    if (lastTs && (Date.now() - lastTs) > 4 * 3600 * 1000) force = true;
  } catch(eT) {}
  if (force || _dailyCache.key !== cacheKey) loadDailySections(true);
}

  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState !== "visible") return;
    try { maybeRefreshDaily(false); } catch(e) {}
  });
  window.addEventListener("pageshow", function(){
    try { maybeRefreshDaily(false); } catch(e2) {}
  });
  // 每 20 分钟检查一次是否跨日
  setInterval(function(){

  }, 20 * 60 * 1000);
}

/** 合并网易免费/限免 + 喜马拉雅，按 id 去重 */
function mergeVoiceLists(free, trial, xm){
  var seen = {}, out = [];
  function push(list, defTrial){
    (list || []).forEach(function(x){
      if (!x || !x.id || seen[x.id]) return;
      seen[x.id] = 1;
      var item = Object.assign({}, x);
      if (item.trial == null) item.trial = !!defTrial;
      out.push(item);
    });
  }
  // 喜马：相声评书/段子/娱乐靠前，再网易，再其它
  var xmFunny = [], xmOther = [];
  (xm || []).forEach(function(x){
    if (!x) return;
    if (x.badgeCls === "funny" || /相声|评书|段子|娱乐/.test(String(x.badge || x.category || ""))) xmFunny.push(x);
    else xmOther.push(x);
  });
  push(xmFunny, false);
  push(free, false);
  push(trial, true);
  push(xmOther, false);
  return out;
}

function ensureVoiceCache(){
  if (_voiceCache.all) return Promise.resolve(_voiceCache.all);
  var freeP = _voiceCache.free
    ? Promise.resolve(_voiceCache.free)
    : API.neteaseVoiceFree().then(function(list){ _voiceCache.free = list || []; return _voiceCache.free; })
        .catch(function(){ _voiceCache.free = []; return []; });
  var trialP = _voiceCache.trial
    ? Promise.resolve(_voiceCache.trial)
    : API.neteaseVoiceTrial().then(function(list){ _voiceCache.trial = list || []; return _voiceCache.trial; })
        .catch(function(){ _voiceCache.trial = []; return []; });
  var xmP = _voiceCache.xm
    ? Promise.resolve(_voiceCache.xm)
    : API.ximalayaVoiceFree().then(function(list){ _voiceCache.xm = list || []; return _voiceCache.xm; })
        .catch(function(){ _voiceCache.xm = []; return []; });
  return Promise.all([freeP, trialP, xmP]).then(function(parts){
    _voiceCache.all = mergeVoiceLists(parts[0], parts[1], parts[2]);
    return _voiceCache.all;
  });
}

function openHomeVoice(item){
  if (!item || !item.id) return;

        hasMore: !!st.hasMore,
        scrollTop: 0
      };
      var dv = document.getElementById("view-detail");
      if (dv) window._qqmVoiceAllRemember.scrollTop = dv.scrollTop || 0;
    }
  } catch(eMem) {}
  toast("加载节目…");
  // 喜马拉雅专辑
  if (item.source === "ximalaya" || item.xmAlbumId || String(item.id).indexOf("xm_") === 0){
    var aid = item.xmAlbumId || String(item.id).replace(/^xm_/, "");
    // 并行拉前 2 页（mobwsa 每页约 20 条），接近官方秒开体验
    Promise.all([
      API.ximalayaAlbumTracks(aid, 1, 50),
      API.ximalayaAlbumTracks(aid, 2, 50)
    ]).then(function(parts){
      var seen = {}, songs = [];
      parts.forEach(function(res){
        ((res && res.songs) || []).forEach(function(s){
          if (!s || !s.xmTrackId || seen[s.xmTrackId]) return;
          seen[s.xmTrackId] = 1;
          songs.push(s);
        });
      });
      if (!songs.length){
        toast("该内容暂无节目或需会员");
        return;
      }
      // 补封面：节目没封面时用专辑封面
      if (item.cover){
        songs.forEach(function(s){ if (s && !s.cover) s.cover = item.cover; });
      }
      // 首屏两页；实际接口常约 20 条/页，约 40 集。继续上拉加载更多
      var likelyMore = songs.length >= 30;
      var albumTitle = item.title || "听书";
      var albumCover = item.cover || (songs[0] && songs[0].cover) || "";
      switchView("detail", {
        type: "album",
        id: "xm-voice-" + aid,
        title: albumTitle,
        cover: albumCover,
        songs: songs,
        source: "ximalaya",
        queueTag: "xm-voice-" + aid,
        isVoiceBook: true,
        voiceRadioId: aid,
        voiceAlbumId: aid,
        voiceAsc: true,
        voiceSource: "ximalaya",
        voicePage: 2,
        voiceHasMore: likelyMore,
        fromVoiceAll: true
      });
      // 最近听书：定位到上次那一集并续播
      if (item.autoPlay || item.resumeSongmid || item.resumeTrackId || item.fromRecent){
        resumeVoicePlayback(songs, item, "xm-voice-" + aid, albumTitle, albumCover);
      }
    }).catch(function(err){
      console.warn("[xm] tracks fail", err);
      toast("加载失败，请稍后重试");
    });
    return;
  }
  // 网易电台
  var rid = String(item.id).replace(/^ne-voice-/, "");
  API.neteaseDjPrograms(rid, 80, false).then(function(res){
    var songs = (res && res.songs) || [];
    if (!songs.length){
      toast("该内容暂无节目");
      return;
    }
    var albumTitleNe = item.title || "听书";
    var albumCoverNe = item.cover || "";
    switchView("detail", {
      type: "album",
      id: "ne-voice-" + rid,
      title: albumTitleNe,
      cover: albumCoverNe,
      songs: songs,
      source: "netease",
      queueTag: "ne-voice-" + rid,
      isVoiceBook: true,
      voiceRadioId: rid,
      voiceAsc: false,
      voiceSource: "netease",
      fromVoiceAll: true
    });
    if (item.autoPlay || item.resumeSongmid || item.resumeTrackId || item.fromRecent){
      resumeVoicePlayback(songs, item, "ne-voice-" + rid, albumTitleNe, albumCoverNe);
    }
  }).catch(function(){ toast("加载失败"); });
}

/** 从最近记录续播：定位集数 + 进度 seek */
function resumeVoicePlayback(songs, item, queueTag, albumTitle, albumCover){
  if (!songs || !songs.length) return;
  function findIdx(list){
    if (!item) return -1;
    for (var i = 0; i < list.length; i++){
      var s = list[i];
      if (!s) continue;
      if (item.resumeSongmid && s.songmid && String(s.songmid) === String(item.resumeSongmid)) return i;
      if (item.resumeTrackId && s.xmTrackId && String(s.xmTrackId) === String(item.resumeTrackId)) return i;
    }
    if (typeof item.resumeIndex === "number" && item.resumeIndex >= 0 && item.resumeIndex < list.length){
      return item.resumeIndex;
    }
    return -1;
  }
  var idx = findIdx(songs);
  function doPlay(list, i){
    if (i < 0) i = 0;
    var s = list[i];
    if (item && item.resumeTime > 3 && s){
      try {
        _resumeSeek = {
          key: String(s.songmid || s.xmTrackId || s.id || ""),
          time: Number(item.resumeTime) || 0,
          savedAt: Date.now()
        };
      } catch(eR) {}
    }
    try {
      state.queueTag = queueTag;
      playQueue(list, i, queueTag);
      // 补记书名封面
      recordRecentVoiceBook(list[i], { albumTitle: albumTitle, title: albumTitle, cover: albumCover, time: item && item.resumeTime });
    } catch(eP) {}
    if (item && (item.resumeSongmid || item.resumeTrackId) && findIdx(list) < 0){
      try { toast("已打开，未找到上次集数（可上拉加载更多）", 2200); } catch(eT) {}
    } else if (item && item.resumeName){
      try { toast("继续收听 · " + item.resumeName, 1600); } catch(eT2) {}
    }
  }
  if (idx >= 0){
    doPlay(songs, idx);
    return;
  }
  // 喜马：首屏两页没有上次那集时，再往后翻几页尝试定位
  if (item && item.source === "ximalaya" && item.xmAlbumId){
    var aid = item.xmAlbumId;
    var pages = [3,4,5,6];
    Promise.all(pages.map(function(p){ return API.ximalayaAlbumTracks(aid, p, 50).catch(function(){ return { songs: [] }; }); }))
      .then(function(parts){
        var seen = {};
        songs.forEach(function(s){ if (s && s.xmTrackId) seen[s.xmTrackId] = 1; });
        parts.forEach(function(res){
          ((res && res.songs) || []).forEach(function(s){
            if (!s || !s.xmTrackId || seen[s.xmTrackId]) return;
            seen[s.xmTrackId] = 1;
            if (albumCover && !s.cover) s.cover = albumCover;
            songs.push(s);
          });
        });
        // 刷新详情列表
        try {
          if (state.view === "detail" && state.viewParams && state.viewParams.queueTag === queueTag){
            state.viewParams.songs = songs;
            state.viewParams.voicePage = 6;
            var wrap = $("#detailSongs");
            if (wrap) renderSongList(wrap, songs, queueTag);
            try {
              var sub = document.querySelector("#view-detail .detail-sub");
              if (sub) sub.textContent = (sub.textContent || "").replace(/共\d+集/, "共" + songs.length + "集");
            } catch(eS) {}
          }
        } catch(eU) {}
        var i2 = findIdx(songs);
        doPlay(songs, i2 >= 0 ? i2 : 0);
      }).catch(function(){ doPlay(songs, 0); });
    return;
  }
  doPlay(songs, 0);
}

/** 频道点开即播：拉分类歌单/榜单歌曲直接进播放队列 */
function openHomeChannel(ch){
  if (!ch) return;
  var cat = ch.cat;
  var tag = "channel-" + String(ch.name || cat || "play");

  function startPlay(songs, label){
    songs = (songs || []).filter(function(s){ return s && s.songmid; });
    if (!songs.length){
      toast((label || ch.name) + "暂时没有可播歌曲");
      return;
    }
    try {
      if (songs.length > 8){
        for (var i = songs.length - 1; i > 0; i--){
          var j = Math.floor(Math.random() * (i + 1));
          var t = songs[i]; songs[i] = songs[j]; songs[j] = t;
        }
      }
    } catch(eSh) {}
    setChannelPlaying(ch.name);
    playQueue(songs, 0, tag);
    toast("正在播放 · " + (label || ch.name));
  }

  if (cat === "hot" || cat === "billboard"){
    toast("加载中…");
    var topId = cat === "billboard" ? 108 : 26;
    API.toplistDetail(topId).then(function(d){
      var songs = (d && d.songs) || [];
      if (songs.length){ startPlay(songs, ch.name); return null; }
      return API.toplistDetail(26);
    }).then(function(d2){
      if (!d2) return;
      startPlay((d2 && d2.songs) || [], ch.name);
    }).catch(function(){ toast("加载失败"); });
    return;
  }

  toast("加载中…");
  var catId = (cat == null || cat === "") ? 10000000 : cat;
  API.playlistsByTagPage(catId, 3, Math.floor(Math.random() * 3) * 10, 8).then(function(list){
    list = list || [];
    if (!list.length) return API.playlistsByTagPage(10000000, 3, 0, 8);
    return list;
  }).then(function(list){
    list = list || [];
    if (!list.length){ toast(ch.name + "暂无内容"); return; }
    var picks = list.slice(0, 3);
    return Promise.all(picks.map(function(p){
      return API.playlistDetail(p.dissid, 0, 40).then(function(res){
        return (res && res.songs) || [];
      }).catch(function(){ return []; });
    })).then(function(parts){
      var merged = [];
      var seen = {};
      (parts || []).forEach(function(arr){
        (arr || []).forEach(function(s){
          if (!s || !s.songmid || seen[s.songmid]) return;
          seen[s.songmid] = 1;
          merged.push(s);
        });
      });
      startPlay(merged, ch.name);
    });
  }).catch(function(){ toast("加载失败，请稍后重试"); });
}


/** 首页下拉刷新：日推 / 歌单 / 频道 / 榜单 */
function bindHomePullRefresh(viewEl){
  if (!viewEl || viewEl._homePtrBound) return;
  viewEl._homePtrBound = true;
  var ptr = document.createElement("div");
  ptr.className = "home-ptr";
  ptr.innerHTML = '<div class="home-ptr-inner"><span class="home-ptr-spinner"></span><span class="home-ptr-text">下拉刷新</span></div>';
  // 插到内容最前，不随滚动跑走：用 sticky 替代 absolute 在滚动容器内
  ptr.style.position = "sticky";
  ptr.style.top = "0";
  ptr.style.marginBottom = "0";
  viewEl.insertBefore(ptr, viewEl.firstChild);

  var startY = 0, startX = 0, pulling = false, armed = false, loading = false;
  var dy = 0;
  var THRESHOLD = 64;
  var MAX = 96;
  var textEl = ptr.querySelector(".home-ptr-text");

  function setPull(px){
    dy = Math.max(0, Math.min(MAX, px));
    var show = dy > 6;
    ptr.classList.toggle("show", show);
    ptr.classList.toggle("ready", dy >= THRESHOLD);
    ptr.style.height = (show ? Math.max(28, dy * 0.55) : 0) + "px";
    if (textEl){
      textEl.textContent = loading ? "刷新中…" : (dy >= THRESHOLD ? "松开刷新" : "下拉刷新");
    }
  }
  function resetPtr(){
    pulling = false; armed = false; dy = 0;
    viewEl.classList.remove("ptr-pulling");
    if (!loading){
      ptr.classList.remove("show", "ready");
      ptr.style.height = "0px";
      if (textEl) textEl.textContent = "下拉刷新";
    }
  }
  function doRefresh(){
    if (loading) return;
    loading = true;
    ptr.classList.add("loading", "show");
    ptr.style.height = "40px";
    if (textEl) textEl.textContent = "刷新中…";
    viewEl.classList.remove("ptr-pulling");
    try {
      window.__qqmForceDaily = true;
      _dailyCache.key = "";
      _dailyCache.recSongs = [];
      _dailyCache.d30Songs = [];
      _dailyCache.loading = false;
    } catch(e0) {}
    var tasks = [];
    try { loadDailySections(true); } catch(e1) {}
    try { fillHomePlaylists(true); } catch(e2) {}
    try { fillHomeChannels(); } catch(e3) {}
    try { _voiceCache = { free: null, trial: null, xm: null, all: null }; fillHomeVoiceBooks(); } catch(eVb) {}
    try { if (typeof fillHomeToplist === "function") fillHomeToplist(); } catch(e4) {}
    try { if (typeof enhanceHomeChannelCovers === "function") enhanceHomeChannelCovers(); } catch(e5) {}
    // 给请求一点时间；不阻塞 UI 收起指示器
    setTimeout(function(){
      loading = false;
      ptr.classList.remove("loading", "ready", "show");
      ptr.style.height = "0px";
      if (textEl) textEl.textContent = "下拉刷新";
      try { toast("已刷新", 1200); } catch(eT) {}
    }, 900);
  }

  function onStart(e){
    if (loading) return;
    if (state.view && state.view !== "home") return;
    if (viewEl.scrollTop > 2) return;
    var tch = e.touches ? e.touches[0] : e;
    if (!tch) return;
    startY = tch.clientY; startX = tch.clientX;
    pulling = false; armed = true; dy = 0;
  }
  function onMove(e){
    if (!armed || loading) return;
    if (state.view && state.view !== "home") return;
    var tch = e.touches ? e.touches[0] : e;
    if (!tch) return;
    var ady = tch.clientY - startY;
    var adx = tch.clientX - startX;
    if (!pulling){
      if (viewEl.scrollTop > 2){ armed = false; return; }
      if (Math.abs(adx) > Math.abs(ady) && Math.abs(adx) > 10){ armed = false; return; }
      if (ady < 8) return;
      pulling = true;
      viewEl.classList.add("ptr-pulling");
    }
    if (!pulling) return;
    // 阻尼
    var damp = Math.pow(Math.min(ady, 180) / 180, 0.85) * MAX;
    setPull(damp);
    if (e.cancelable) e.preventDefault();
  }
  function onEnd(){
    if (!armed && !pulling) return;
    var should = pulling && dy >= THRESHOLD && !loading;
    if (should) doRefresh();
    else resetPtr();
    armed = false;
  }

  viewEl.addEventListener("touchstart", onStart, { passive: true });
  viewEl.addEventListener("touchmove", onMove, { passive: false });
  viewEl.addEventListener("touchend", onEnd, { passive: true });
  viewEl.addEventListener("touchcancel", onEnd, { passive: true });
}

var heroTimer=null, heroIdx=0, heroCount=0;
function goHero(i){
  if (!heroCount) return;
  heroIdx = (i + heroCount) % heroCount;
  var track = $("#heroTrack");
  if (track){
    track.style.transition = "transform .35s var(--ease)";
    track.style.transform = "translateX(-"+(heroIdx*100)+"%)";
  }
  $all(".hero-dot").forEach(function(d,j){ d.classList.toggle("active", j===heroIdx); });
}
function startHeroAuto(n){
  heroCount = n; heroIdx = 0;
  clearInterval(heroTimer);
  if (n <= 1) return;
  heroTimer = setInterval(function(){ goHero(heroIdx + 1); }, 5000);
}
function initHeroSwipe(n){
  var box = $("#heroBox");
  if (!box || !n) return;
  if (box._swipeBound) return;
  box._swipeBound = true;
  startHeroAuto(n);
  var startX=0, startY=0, dx=0, dragging=false, locked=false;
  function onStart(e){
    if (!heroCount) return;
    var t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY; dx = 0; dragging = true; locked = false;
    clearInterval(heroTimer);
    var track = $("#heroTrack");
    if (track) track.style.transition = "none";
  }
  function onMove(e){
    if (!dragging) return;
    var t = e.touches ? e.touches[0] : e;
    var adx = t.clientX - startX, ady = t.clientY - startY;
    if (!locked){
      if (Math.abs(ady) > Math.abs(adx) && Math.abs(ady) > 8){ dragging = false; return; }
      if (Math.abs(adx) > 8) locked = true;
    }
    if (!locked) return;
    dx = adx;
    var track = $("#heroTrack");
    if (track){
      var pct = heroIdx * 100 - (dx / box.clientWidth * 100);
      track.style.transform = "translateX(-"+pct+"%)";
    }
    if (e.cancelable) e.preventDefault();
  }
  function onEnd(){
    if (!dragging && !locked){ startHeroAuto(heroCount); return; }
    dragging = false;
    if (Math.abs(dx) > box.clientWidth * 0.18) goHero(heroIdx + (dx < 0 ? 1 : -1));
    else goHero(heroIdx);
    startHeroAuto(heroCount);
  }
  box.addEventListener("touchstart", onStart, { passive: true });
  box.addEventListener("touchmove", onMove, { passive: false });
  box.addEventListener("touchend", onEnd, { passive: true });
  box.addEventListener("touchcancel", onEnd, { passive: true });
  // 点击圆点切换
  box.addEventListener("click", function(e){
    var dot = e.target.closest(".hero-dot");
    if (!dot) return;
    var dots = $all(".hero-dot");
    var i = dots.indexOf(dot);
    if (i >= 0){ clearInterval(heroTimer); goHero(i); startHeroAuto(heroCount); }
  });
}

var _plTabsReady = false;
API.qqPlaylistCategories = function(){
  var url = "https://c.y.qq.com/splcloud/fcgi-bin/fcg_get_diss_tag_conf.fcg?format=json&inCharset=utf8&outCharset=utf-8&g_tk=5381&loginUin=0&hostUin=0&notice=0&platform=yqq.json&needNewCode=0";
  return ADAPTER_request(url, { headers: withCookie({ "Referer": "https://y.qq.com/" }) }).then(function(txt){
    var d = jsonp_safeParse(txt);
    var groups = (d && d.data && d.data.categories) || [];
    var out = [];
    var seen = { "10000000": 1 };
    // 优先常用分组顺序
    var prefer = ["流派", "主题", "语种", "心情", "场景"];
    var ordered = [];
    prefer.forEach(function(name){
      groups.forEach(function(g){
        if (g && g.categoryGroupName === name) ordered.push(g);
      });
    });
    groups.forEach(function(g){
      if (ordered.indexOf(g) < 0) ordered.push(g);
    });
    ordered.forEach(function(g){
      if (!g || g.categoryGroupName === "热门") return;
      (g.items || []).forEach(function(it){
        var id = it && it.categoryId;
        if (id == null || seen[String(id)]) return;
        // usable===0 且不是全部 的跳过
        if (it.usable === 0 && Number(id) !== 10000000) return;
        seen[String(id)] = 1;
        var name = String(it.categoryName || "").replace(/&amp;/g, "&").replace(/&#38;/g, "&").trim();
        if (!name) return;
        out.push({ id: id, name: name });
      });
    });
    return out;
  }).catch(function(){ return []; });
};

    if (v._plSwipeBound){
      try {
        v.removeEventListener("touchstart", v._plSwipeStart, { passive: true });
        v.removeEventListener("touchmove", v._plSwipeMove, { passive: false });
        v.removeEventListener("touchend", v._plSwipeEnd, { passive: true });
        v.removeEventListener("touchcancel", v._plSwipeEnd, { passive: true });
      } catch(eRm) {}
    }
    var sx = 0, sy = 0, axis = null, locked = false;
    var EDGE = 28; // 左边缘留给系统返回
    function onStart(e){
      if (state.view !== "playlists") return;
      var t = e.touches ? e.touches[0] : e;
      if (!t) return;
      // 系统侧滑返回区域不接管
      if (t.clientX <= EDGE){ axis = "cancel"; return; }
      // Tab 条本身横向滚动：不在这里抢，避免切分类与滚 Tab 打架
      if (e.target && e.target.closest && e.target.closest("#plTabs")){
        axis = "cancel";
        return;
      }
      sx = t.clientX; sy = t.clientY;
      axis = null;
      locked = false;
    }
    function onMove(e){
      if (axis === "cancel" || locked) return;
      if (state.view !== "playlists") return;
      var t = e.touches ? e.touches[0] : e;
      if (!t) return;
      var dx = t.clientX - sx;
      var dy = t.clientY - sy;
      if (axis == null){
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
        // 明显纵向 → 交给页面滚动
        if (Math.abs(dy) > Math.abs(dx)){
          axis = "v";
          return;
        }
        axis = "h";
      }
      if (axis === "h"){
        // 锁定横向，避免页面跟着斜滑
        if (e.cancelable) e.preventDefault();
      }
    }
    function onEnd(e){
      if (locked || axis === "cancel" || axis === "v"){
        axis = null;
        return;
      }
      if (state.view !== "playlists"){ axis = null; return; }
      var t = (e.changedTouches && e.changedTouches[0]) || e;
      if (!t){ axis = null; return; }
      var dx = t.clientX - sx;
      var dy = t.clientY - sy;
      axis = null;
      // 阈值：水平位移够大，且明显大于垂直
      if (Math.abs(dx) < 56) return;
      if (Math.abs(dx) < Math.abs(dy) * 1.2) return;
      if (plState.loading) return;
      var idx = currentPlTabIndex();
      // 左滑 → 下一分类；右滑 → 上一分类
      if (dx < 0){
        if (idx >= tabs.length - 1){
          try { toast("已是最后一个分类", 900); } catch(eT) {}
          return;
        }
        locked = true;
        activatePlTab(idx + 1, { smooth: true });
      } else {
        if (idx <= 0){
          try { toast("已是第一个分类", 900); } catch(eT2) {}
          return;
        }
        locked = true;
        activatePlTab(idx - 1, { smooth: true });
      }
      setTimeout(function(){ locked = false; }, 320);
    }
    v._plSwipeStart = onStart;
    v._plSwipeMove = onMove;
    v._plSwipeEnd = onEnd;
    v.addEventListener("touchstart", onStart, { passive: true });
    v.addEventListener("touchmove", onMove, { passive: false });
    v.addEventListener("touchend", onEnd, { passive: true });
    v.addEventListener("touchcancel", onEnd, { passive: true });
    v._plSwipeBound = true;
  })();

  // 频道跳转：把选中的分类 Tab 滚到可视区
  try {
    var actTab = $("#plTabs .sr-tab.active");
    if (actTab && actTab.scrollIntoView) actTab.scrollIntoView({ inline: "center", block: "nearest", behavior: "instant" });
  } catch(eSc) {}

  load(currentCat, false, false);

  // QQ：后台拉官方分类表，修正错误 ID（不打断当前已加载内容）
  if (!isNe){
    try {
      ensurePlTabs().then(function(){

        var idx = resolveInitIdx(next);
        // 若当前 cat 仍在新表中，保持选中
        for (var i = 0; i < next.length; i++){
          if (String(next[i].id) === String(currentCat)){ idx = i; break; }
        }
        paintTabs(next, idx);
      });
    } catch(eEt) {}
  }
}
