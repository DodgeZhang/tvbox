      albumFn ? albumFn(q) : Promise.resolve([])
    ]).then(function(parts){
      var res = parts[0] || { list: [] };
      var albums = parts[1] || [];
      var songs = res.list || [];
      // 优先歌手名匹配的歌曲
      songs = songs.slice().sort(function(a,b){
        var sa = (a.singer && name && a.singer.indexOf(name) >= 0) ? 1 : 0;
        var sb = (b.singer && name && b.singer.indexOf(name) >= 0) ? 1 : 0;
        return sb - sa;
      });
      // 专辑优先本歌手
      albums = (albums || []).filter(function(a){
        if (!name) return true;
        if (a.singer && a.singer.indexOf(name) >= 0) return true;
        if (a.name && name && a.name.indexOf(name) >= 0) return true;
        return false;
      });
      // 若过滤后太少，回退全部
      if (albums.length < 2 && (parts[1] || []).length){
        albums = parts[1];
      }
      var cover = (res.singers && res.singers[0] && res.singers[0].cover) || (songs[0] && songs[0].cover) || (albums[0] && albums[0].cover) || "";
      return {
        songs: songs,
        total: songs.length,
        info: { name: name, cover: cover },
        albums: albums,
        albumSongLoader: function(a){
          if (!albumSongFn) return Promise.resolve({ songs: [] });
          return albumSongFn(a.albumId || a.mid);
        }
      };
    });
  }

  loadParts().then(function(parts){
    parts = parts || {};
    var songRes = { songs: parts.songs || [], total: parts.total || 0, info: parts.info || {} };
    var albums = parts.albums || [];
    var songs = songRes.songs || [];
    var albumSongLoader = parts.albumSongLoader || function(a){ return API.albumSongs(a.mid); };
    var cover = (songRes.info && songRes.info.cover) || (src === "qq" ? coverUrl(mid, "singer") : "") || (songs[0] && songs[0].cover) || "";
    var displayName = name || (songRes.info && songRes.info.name) || "歌手";

    v.innerHTML =
      '<div class="sec-head" style="margin-top:8px"><button type="button" id="singerBackBtn" style="padding:6px 12px;border-radius:10px;background:rgba(118,118,128,0.16);color:var(--text-0);font-size:14px">‹ 返回</button></div>'+
      '<div class="mine-header">'+
        '<div class="mine-avatar" style="border-radius:50%">'+safeImg(cover)+'</div>'+
        '<div><div class="mine-name">'+esc(displayName)+'</div>'+
        '<div class="mine-uin">'+(songRes.total || songs.length)+' 首热门 · '+albums.length+' 张专辑</div></div>'+
        '<button class="hero-play" id="playAllSinger" style="margin-left:auto"><svg><use href="#i-play"/></svg>播放全部</button>'+
      '</div>'+
      '<div class="sr-tabs" id="singerTabs" style="margin:12px 0;gap:10px">'+
        '<div class="sr-tab active" data-tab="hot">热门歌曲</div>'+
        '<div class="sr-tab" data-tab="album">专辑</div>'+
      '</div>'+
      '<div id="singerBody"></div>';

    var body = $("#singerBody");
    function showHot(){
      if (!songs.length){
        body.innerHTML = emptyHtml("暂无热门歌曲", "可切换到「专辑」浏览");
        return;
      }
      body.innerHTML = '<div class="song-list" id="singerSongs"></div>';
      renderSongList($("#singerSongs"), songs);
    }
    function showAlbums(){
      if (!albums.length){
        body.innerHTML = emptyHtml("暂无专辑", "");
        return;
      }
      // 每个专辑下方自带展开面板，点击就地展开，不跳到底部
      body.innerHTML = albums.map(function(a, i){
        return '<div class="album-block" data-i="'+i+'">'+
          '<div class="song-row singer-album" data-i="'+i+'">'+
            '<div class="song-cover">'+safeImg(a.cover)+'</div>'+
            '<div class="song-meta">'+
              '<div class="song-title">'+esc(a.name)+'</div>'+
              '<div class="song-sub">'+(a.pubTime ? esc(String(a.pubTime).slice(0,10)) : "专辑")+(a.company && a.company !== "未确定" ? " · "+esc(a.company) : "")+'</div>'+
            '</div>'+
            '<span class="album-chevron" style="color:var(--text-2);font-size:16px;padding-right:8px;transition:transform .2s">›</span>'+
          '</div>'+
          '<div class="album-panel" data-i="'+i+'" style="display:none;padding:0 0 8px 12px;border-left:2px solid rgba(var(--accent-rgb),.35);margin:0 12px 6px 18px"></div>'+
        '</div>';
      }).join("");

      $all(".singer-album", body).forEach(function(row){
        row.onclick = function(){
          var i = Number(row.dataset.i);
          var a = albums[i];
          if (!a) return;
          var block = row.closest(".album-block") || row.parentNode;
          var panel = block.querySelector(".album-panel");
          var chev = row.querySelector(".album-chevron");
          if (!panel) return;

          // 已展开：收起
          if (panel.style.display === "block"){
            panel.style.display = "none";
            panel.innerHTML = "";
            row.style.background = "";
            if (chev) chev.style.transform = "";
            return;
          }

          // 收起其它已展开项
          $all(".album-panel", body).forEach(function(p){
            if (p !== panel){ p.style.display = "none"; p.innerHTML = ""; }
          });
          $all(".singer-album", body).forEach(function(x){ x.style.background = ""; });
          $all(".album-chevron", body).forEach(function(c){ c.style.transform = ""; });

          row.style.background = "rgba(var(--accent-rgb),.1)";
          if (chev) chev.style.transform = "rotate(90deg)";
          panel.style.display = "block";
          panel.innerHTML =
            '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 4px 4px">'+
              '<span style="font-size:12px;color:var(--text-2)">加载中…</span>'+
              '<button type="button" class="play-album-btn sec-more" style="border:none;background:none;font-size:13px">播放专辑</button>'+
            '</div>'+
            '<div class="song-list album-song-list">'+skeletonRows(4)+'</div>';

          albumSongLoader(a).then(function(res){
            // 面板可能已被收起/切换
            if (panel.style.display !== "block") return;
            var list = (res && res.songs) || [];
            var head = panel.querySelector("span");
            var wrap = panel.querySelector(".album-song-list");
            var pb = panel.querySelector(".play-album-btn");
            if (head) head.textContent = list.length ? (list.length + " 首") : "暂无歌曲";
            if (!wrap) return;
            if (!list.length){ wrap.innerHTML = emptyHtml("专辑暂无歌曲",""); return; }
            // 统一标记音源，方便播放
            list.forEach(function(s){ if (!s.source) s.source = src; });
            renderSongList(wrap, list);
            if (pb) pb.onclick = function(e){ e.stopPropagation(); playQueue(list, 0); };
          });
        };
      });
    }

    showHot();
    $all("#singerTabs .sr-tab").forEach(function(t){
      t.onclick = function(){
        $all("#singerTabs .sr-tab").forEach(function(x){ x.classList.remove("active"); });
        t.classList.add("active");
        if (t.dataset.tab === "album") showAlbums();
        else showHot();
      };
    });
    var playAll = $("#playAllSinger");
    if (playAll) playAll.onclick = function(){ if (songs.length) playQueue(songs, 0); else toast("暂无可播放歌曲"); };
    var sb = $("#singerBackBtn");
    if (sb) sb.onclick = function(){ handleBack(); };
  }).catch(function(){
    v.innerHTML = emptyHtml("加载歌手失败", "请返回重试");
  });
}

/** Cookie 派生 g_tk（QQ 登录态签名） */
function getGtk(){
  try {
    var ck = (state.user && state.user.cookie) || "";
    var map = typeof parseCookieStr === "function" ? parseCookieStr(ck) : {};
    var skey = map.p_skey || map.skey || map.qqmusic_key || map.qm_keyst || "";
    var hash = 5381;
    for (var i = 0; i < skey.length; i++){
      hash += (hash << 5) + skey.charCodeAt(i);
      hash = hash & hash;
    }
    return hash & 0x7fffffff;
  } catch(e) { return 5381; }
}

/**
 * QQ 云端「我喜欢」歌曲
 * 多路兜底：CgiGetDiss(dirid=201) → PlaylistDetailRead → 自建「我喜欢」tid
 */
API.qqCloudFavSongs = function(begin, num){
  if (!state.user || !state.user.uin) return Promise.resolve({ songs: [], total: 0 });
  begin = Math.max(0, begin || 0);
  num = num || 200;
  var uin = String(state.user.uin).replace(/^o0*/, "");
  var gtk = getGtk();
  var authst = state.user.qqmusic_key || state.user.qm_keyst || "";
  var hdr = withCookie({
    "Content-Type": "application/json",
    "Referer": "https://y.qq.com/",
    "Origin": "https://y.qq.com"
  });

  function mapTrack(it){
    if (!it) return null;
    try {
      var track = it.songInfo || it.track || it.song || it;
      if (track && track.track) track = track.track;
      // 部分接口包在 {songInfo:{...}} / {base:{...}}
      if (track.base) track = Object.assign({}, track, track.base);
      var n = null;
      try { n = normalizeSongFromPlaylist(track); } catch(e0) {}
      if (!n || !n.songmid){
        try { n = normalizeSongFromSearch(track); } catch(e1) {}
      }
      if (!n || !n.songmid){
        var mid = track.mid || track.songmid || track.song_mid || track.songMid || it.mid || it.songmid || "";
        if (!mid) return null;
        var singers = track.singer || track.singer_list || [];
        var singer = Array.isArray(singers)
          ? singers.map(function(a){ return (a && (a.name || a.title || a.singer_name)) || ""; }).filter(Boolean).join("/")
          : (track.singername || track.singer_name || track.singerName || "");
        var album = track.album || {};
        n = {
          songmid: String(mid),
          media_mid: (track.file && (track.file.media_mid || track.file.mediaMid)) || track.media_mid || track.strMediaMid || mid,
          name: track.name || track.title || track.songname || track.song_name || mid,
          singer: singer || "未知",
          albummid: album.mid || album.pmid || track.albummid || track.albumMid || "",
          albumname: album.name || track.albumname || track.album_name || "",
          interval: Number(track.interval || track.time || track.pay_time || 0) || 0,
          cover: "",
          isVip: !!(track.pay && (track.pay.pay_play || track.pay.pay_month)),
          source: "qq"
        };
      }
      n.source = "qq";
      if (!n.cover && n.albummid) n.cover = coverUrl(n.albummid);
      return n;
    } catch(e) { return null; }
  }
  function mapList(list){
    return (list || []).map(mapTrack).filter(function(s){ return s && s.songmid; });
  }
  function pickSongs(data){
    if (!data) return { songs: [], total: 0 };
    var list = data.songlist || data.songList || data.tracks || data.list ||
      data.song_list || data.v_songinfo || data.songInfoList || [];
    // 有时在 data.detail / data.playlist
    if (!list.length && data.detail){
      list = data.detail.songlist || data.detail.songList || [];
    }
    var total = data.total_song_num || data.totalNum || data.songNum || data.total ||
      data.songlist_size || data.song_num || list.length || 0;
    return { songs: mapList(list), total: Number(total) || list.length };
  }

  // 路径1：srfDissInfo.DissInfo / CgiGetDiss（官方收藏最稳）
  function viaCgiGetDiss(){
    var body = JSON.stringify({
      comm: {
        uin: Number(uin) || 0,
        format: "json",
        ct: 24,
        cv: 0,
        g_tk: gtk,
        authst: authst
      },
      req_0: {
        module: "music.srfDissInfo.DissInfo",
        method: "CgiGetDiss",
        param: {
          disstid: 0,
          dirid: 201,
          song_begin: begin,
          song_num: num,
          song_order: 0,
          userinfo: 1,
          tag: 1,
          orderlist: 1,
          onlysonglist: 0,
          enc_host_uin: ""
        }
      }
    });
    // 旧模块名兼容
    var body2 = JSON.stringify({
      comm: { uin: Number(uin) || 0, format: "json", ct: 24, cv: 0, g_tk: gtk, authst: authst },
      req_0: {
        module: "srf_diss_info.DissInfoServer",
        method: "CgiGetDiss",
        param: {
          disstid: 0,
          dir_id: 201,
          dirid: 201,
          song_begin: begin,
          song_num: num,
          num: num,
          page_no: 0,
          orderlist: 1,
          onlysonglist: 0,
          enc_host_uin: ""
        }
      }
    });
    function post(b){
      return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
        method: "POST", headers: hdr, body: b, credentials: "include", timeout: 20
      }).then(function(txt){
        var d = jsonp_safeParse(txt);
        var data = d && d.req_0 && d.req_0.data;
        var code = d && d.req_0 && d.req_0.code;
        if (code !== 0 && code !== undefined && code !== null && Number(code) !== 0) return null;
        var r = pickSongs(data);
        return r.songs.length ? r : null;
      }).catch(function(){ return null; });
    }
    return post(body).then(function(r){ return r || post(body2); });
  }

  // 路径2：PlaylistDetailRead
  function viaPlaylistDetailRead(){
    var body = JSON.stringify({
      comm: { uin: Number(uin) || 0, format: "json", ct: 24, cv: 0, g_tk: gtk, authst: authst },
      req_0: {
        module: "music.musicasset.PlaylistDetailRead",
        method: "GetPlaylistDetail",
        param: { dirId: 201, tid: 0, songBegin: begin, songNum: num, order: 0 }
      }
    });
    return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
      method: "POST", headers: hdr, body: body, credentials: "include", timeout: 20
    }).then(function(txt){
      var d = jsonp_safeParse(txt);
      var data = d && d.req_0 && d.req_0.data;
      var r = pickSongs(data);
      return r.songs.length ? r : null;
    }).catch(function(){ return null; });
  }

  // 路径3：从自建歌单里找「我喜欢」tid，再拉详情
  function viaMyLikeTid(){
    var createdUrl = "https://c.y.qq.com/rsc/fcgi-bin/fcg_user_created_diss?" +
      "hostUin=0&format=json&inCharset=utf8&outCharset=utf-8&notice=0&platform=yqq.json&needNewCode=0" +
      "&cid=205360838&g_tk=" + gtk + "&uin=" + encodeURIComponent(uin) + "&loginUin=" + encodeURIComponent(uin);
    return ADAPTER_request(createdUrl, {
      headers: withCookie({ "Referer": "https://y.qq.com/" }),
      credentials: "include",
      timeout: 15
    }).then(function(txt){
      var d = jsonp_safeParse(txt);
      var list = (d && d.data && (d.data.disslist || d.data.list)) || [];
      var hit = null;
      for (var i = 0; i < list.length; i++){
        var p = list[i] || {};
        var dirId = Number(p.dirid || p.dirId || p.dir_id || 0);
        var name = p.dissname || p.title || p.name || "";
        if (dirId === 201 || /我喜欢/.test(name)){
          hit = p;
          break;
        }
      }
      if (!hit) return null;
      var tid = String(hit.dissid || hit.disstid || hit.tid || "").replace(/\D/g, "") || hit.dissid;
      if (!tid) return null;
      // 用已有歌单详情接口
      return API.playlistDetail(tid, 0, Math.min(num, 200)).then(function(res){
        var songs = (res && res.songs) || [];
        if (!songs.length) return null;
        return { songs: songs, total: (res.info && res.info.songCount) || songs.length };
      });
    }).catch(function(){ return null; });
  }

  // 路径4：老版 fav 接口
  function viaOldFav(){
    var url = "https://c.y.qq.com/splcloud/fcgi-bin/fcg_music_custom_get_fav_songlist.fcg?" +
      "g_tk=" + gtk + "&uin=" + encodeURIComponent(uin) + "&loginUin=" + encodeURIComponent(uin) +
      "&hostUin=0&format=json&inCharset=utf8&outCharset=utf-8&notice=0&platform=yqq.json&needNewCode=0" +
      "&cid=205361558&reqtype=1&dirid=201&from=1&song_begin=" + begin + "&song_num=" + num;
    return ADAPTER_request(url, {
      headers: withCookie({ "Referer": "https://y.qq.com/" }),
      credentials: "include",
      timeout: 15
    }).then(function(txt){
      var d = jsonp_safeParse(txt);
      var data = (d && d.data) || d;
      var r = pickSongs(data);
      if (!r.songs.length && data && data.songlist) r = pickSongs({ songlist: data.songlist, total: data.total_song_num });
      return r.songs.length ? r : null;
    }).catch(function(){ return null; });
  }

  // 串行尝试：谁先有数据用谁
  return viaCgiGetDiss().then(function(r){
    if (r && r.songs.length) return r;
    return viaPlaylistDetailRead();
  }).then(function(r){
    if (r && r.songs.length) return r;
    return viaMyLikeTid();
  }).then(function(r){
    if (r && r.songs.length) return r;
    return viaOldFav();
  }).then(function(r){
    return r || { songs: [], total: 0 };
  });
};

/** 同步官方「我喜欢」：有官方数据时以官方为准覆盖本地 QQ 收藏 */
function syncQQCloudFavorites(){
  if (!state.user || !state.user.uin) return Promise.resolve(false);
  return API.qqCloudFavSongs(0, 300).then(function(res){
    var remote = (res && res.songs) || [];
    if (!remote.length){
      console.warn("[qqm] cloud fav empty");
      return false;
    }
    // 保留本地非 QQ 源收藏，QQ 源以官方列表为准
    var localExtra = (state.favorites || []).filter(function(it){
      var src = (typeof it === "object" && it.source) ? it.source : "qq";
      var mid = favMidOf(it);
      if (!mid) return false;
      if (src && src !== "qq") return true;
      // 官方已有则丢弃本地重复
      return false;
    }).map(function(it){ return typeof it === "object" ? it : { songmid: it, source: "qq" }; });

    var cloud = remote.map(function(s){
      return slimSong(s) || s;
    });
    // 官方顺序在前，本地其它源在后
    var seen = {};
    var merged = [];
    cloud.forEach(function(s){
      if (!s || !s.songmid || seen[s.songmid]) return;
      seen[s.songmid] = 1;
      merged.push(s);
    });
    localExtra.forEach(function(s){
      var m = favMidOf(s);
      if (!m || seen[m]) return;
      seen[m] = 1;
      merged.push(s);
    });
    state.favorites = merged;
    storeSet("favorites", state.favorites);
    console.log("[qqm] synced fav", merged.length, "from cloud", remote.length);
    return true;
  }).catch(function(e){
    console.warn("[qqm] sync fav fail", e);
    return false;
  });
}

/**
 * QQ 云端歌单：自建 + 收藏
 * 返回 { created: [], collected: [] } 每项 { dissid, title, cover, songCount, creator }
 */
API.qqCloudPlaylists = function(){
  if (!state.user || !state.user.uin) return Promise.resolve({ created: [], collected: [] });
  var uin = String(state.user.uin).replace(/^o0*/, "");
  var gtk = getGtk();
  var hdr = withCookie({
    "Referer": "https://y.qq.com/",
    "Origin": "https://y.qq.com"
  });

  function normPl(p, kind){
    if (!p) return null;
    var id = String(
      p.dissid || p.disstid || p.tid || p.content_id || p.id || p.dirId || ""
    ).replace(/\D/g, "") || String(p.dissid || p.disstid || p.tid || "");
    if (!id || id === "0") return null;
    var title = p.dissname || p.title || p.name || p.dirName || "未命名歌单";
    // 跳过系统「我喜欢」占位（dirid 201 另拉）
    if (kind === "created" && (Number(p.dirId) === 201 || /我喜欢/.test(title))) {
      // still include as entry but mark
    }
    var cover = p.logo || p.picurl || p.pic || p.cover || p.dir_pic_url2 || p.pic_url || "";
    return {
      dissid: id,
      title: title,
      cover: fixCover(cover),
      songCount: Number(p.songnum || p.song_cnt || p.songNum || p.num0 || p.diss_song_num || 0) || 0,
      creator: p.nickname || p.hostname || p.creator || (state.user.nickname || ""),
      kind: kind || "created"
    };
  }

  // 自建歌单
  var createdUrl = "https://c.y.qq.com/rsc/fcgi-bin/fcg_user_created_diss?" +
    "hostUin=0&format=json&inCharset=utf8&outCharset=utf-8&notice=0&platform=yqq.json&needNewCode=0" +
    "&cid=205360838&g_tk=" + gtk + "&uin=" + encodeURIComponent(uin) + "&loginUin=" + encodeURIComponent(uin);

  // 收藏歌单（reqtype=3）
  var collectedUrl = "https://c.y.qq.com/fav/fcgi-bin/fcg_get_profile_order_asset.fcg?" +
    "loginUin=" + encodeURIComponent(uin) + "&hostUin=0&format=json&inCharset=utf8&outCharset=utf-8" +
    "&notice=0&platform=yqq.json&needNewCode=0&ct=20&cid=205360956&userid=" + encodeURIComponent(uin) +
    "&reqtype=3&sin=0&ein=49&g_tk=" + gtk;

  // 备用 musicu 自建/收藏
  var bodyMu = JSON.stringify({
    comm: { uin: Number(uin) || 0, format: "json", ct: 24, cv: 0 },
    req_0: {
      module: "music.playlist.PlaylistSquare",
      method: "GetSelfCreatedPlaylist",
      param: { uin: uin, offset: 0, size: 50 }
    },
    req_1: {
      module: "music.playlist.PlaylistSquare",
      method: "GetSelfCollectedPlaylist",
      param: { uin: uin, offset: 0, size: 50 }
    }
  });

  var pCreated = ADAPTER_request(createdUrl, { headers: hdr, credentials: "include", timeout: 15 }).then(function(txt){
    var d = jsonp_safeParse(txt);
    var list = (d && d.data && (d.data.disslist || d.data.list)) || (d && d.disslist) || [];
    return (list || []).map(function(p){ return normPl(p, "created"); }).filter(Boolean);
  }).catch(function(){ return []; });

  var pCollected = ADAPTER_request(collectedUrl, { headers: hdr, credentials: "include", timeout: 15 }).then(function(txt){
    var d = jsonp_safeParse(txt);
    var list = (d && d.data && (d.data.cdlist || d.data.list || d.data.mymusic || d.data.disslist)) || [];
    if (!list.length && d && d.data && d.data.orderlist) list = d.data.orderlist;
    return (list || []).map(function(p){ return normPl(p, "collected"); }).filter(Boolean);
  }).catch(function(){ return []; });

  var pMu = ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
    method: "POST",
    headers: withCookie({ "Content-Type": "application/json", "Referer": "https://y.qq.com/" }),
    body: bodyMu,
    credentials: "include",
    timeout: 15
  }).then(function(txt){
    var d = jsonp_safeParse(txt);
    var c0 = (d && d.req_0 && d.req_0.data && (d.req_0.data.v_playlist || d.req_0.data.list || d.req_0.data.disslist)) || [];
    var c1 = (d && d.req_1 && d.req_1.data && (d.req_1.data.v_playlist || d.req_1.data.list || d.req_1.data.disslist)) || [];
    return {
      created: (c0 || []).map(function(p){ return normPl(p, "created"); }).filter(Boolean),
      collected: (c1 || []).map(function(p){ return normPl(p, "collected"); }).filter(Boolean)
    };
  }).catch(function(){ return { created: [], collected: [] }; });

  return Promise.all([pCreated, pCollected, pMu]).then(function(parts){
    var created = parts[0] || [];
    var collected = parts[1] || [];
    if (!created.length && parts[2] && parts[2].created) created = parts[2].created;
    if (!collected.length && parts[2] && parts[2].collected) collected = parts[2].collected;
    // 去重
    function dedupe(arr){
      var seen = {};
      return (arr || []).filter(function(p){
        if (!p || !p.dissid || seen[p.dissid]) return false;
        seen[p.dissid] = 1;
        return true;
      });
    }
    return { created: dedupe(created), collected: dedupe(collected) };
  });
};

/** 登录后同步官方收藏歌曲到本地 favorites（合并，不丢本地） */
function syncQQCloudFavorites(){
  if (!state.user || !state.user.uin) return Promise.resolve(false);
  return API.qqCloudFavSongs(0, 200).then(function(res){
    var remote = (res && res.songs) || [];
    if (!remote.length) return false;
    var map = {};
    (state.favorites || []).forEach(function(it){
      var m = favMidOf(it);
      if (m) map[m] = typeof it === "object" ? it : { songmid: m };
    });
    remote.forEach(function(s){
      if (!s || !s.songmid) return;
      var slim = slimSong(s) || s;
      map[s.songmid] = Object.assign({}, map[s.songmid] || {}, slim);
    });
    state.favorites = Object.keys(map).map(function(k){ return map[k]; });
    storeSet("favorites", state.favorites);
    return true;
  }).catch(function(){ return false; });
}

/** 拉取并渲染 QQ 官方收藏 / 歌单 */
function loadMineCloudData(manual){
  if (!state.user || !state.user.uin) return;
  if (manual) toast("正在同步官方数据…", 1600);

  // 歌曲
  syncQQCloudFavorites().then(function(ok){
    if (state.view !== "mine") return;
    var wrap = $("#mineFav");
    var head = document.querySelector("#view-mine .sec-title");
    // 更新数量标题
    var titles = document.querySelectorAll("#view-mine .sec-title");
    if (titles && titles[1]) titles[1].innerHTML = '<span class="dot"></span>我喜欢（'+state.favorites.length+'）';
    var list = resolveFavoriteSongs();
    if (wrap){
      if (list.length) renderSongList(wrap, list);
      else wrap.innerHTML = emptyHtml("官方暂无收藏歌曲","确认 Cookie 含登录态后重试");
    }
    if (manual) toast(ok ? ("已同步官方收藏 "+state.favorites.length+" 首") : "官方收藏为空：请确认 Cookie 含 qqmusic_key，并在 QQ 音乐 App 里打开过「我喜欢」", 3200);
    var playAll = $("#btnPlayAllFav");
    if (playAll) playAll.onclick = function(){
      var ls = resolveFavoriteSongs();
      if (ls.length) playQueue(ls, 0);
    };
  });

  // 歌单
  API.qqCloudPlaylists().then(function(res){
    if (state.view !== "mine") return;
    function fill(id, arr, emptyTip){
      var el = $(id);
      if (!el) return;
      if (!arr || !arr.length){
        el.innerHTML = emptyHtml(emptyTip, "登录态失效或暂无数据");
        return;
      }
      el.innerHTML = arr.map(function(p){
        return '<div class="card" data-id="'+esc(p.dissid)+'">'+
          '<div class="card-cover">'+safeImg(p.cover)+'</div>'+
          '<div class="card-name">'+esc(p.title)+'</div>'+
          '<div class="card-sub">'+(p.songCount ? (p.songCount+" 首") : "")+'</div></div>';
      }).join("");
      $all(".card", el).forEach(function(c){
        c.onclick = function(){
          switchView("detail", { type: "playlist", id: c.dataset.id, title: (c.querySelector(".card-name")||{}).textContent || "" });
        };
      });
    }
    fill("#mineCreatedPl", res.created, "暂无自建歌单");
    fill("#mineCollectedPl", res.collected, "暂无收藏歌单");
    if (manual){
      toast("歌单：自建 "+(res.created||[]).length+" · 收藏 "+(res.collected||[]).length, 2000);
    }
  }).catch(function(){
    if (manual) toast("歌单同步失败", 2000);
  });
}

/* ============================================================
   § 7. 详情页（歌单 / 排行榜） + 歌曲列表渲染
   ============================================================ */
function renderDetail(params){
  var v = $("#view-detail");
  v.innerHTML = '<div class="skeleton" style="height:180px;border-radius:24px;margin-top:16px"></div>';
  function paint(res){
    var info = res.info || {};
    var cover = info.cover || info.frontPicUrl || params.cover || "";
    var title = info.title || info.topTitle || params.title || "";
    var songs = (res.songs || []).slice();
    var isVoice = !!params.isVoiceBook;
    var sortBar = isVoice
      ? ('<div class="voice-sort-bar">'+
          '<button type="button" class="voice-sort-btn'+(params.voiceAsc ? ' active' : '')+'" data-asc="1">正序</button>'+
          '<button type="button" class="voice-sort-btn'+(!params.voiceAsc ? ' active' : '')+'" data-asc="0">倒序</button>'+
        '</div>')
      : '';
    v.innerHTML =
      '<div class="sec-head" style="margin-top:8px;align-items:center">'+
        '<button type="button" id="detailBackBtn" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:10px;background:rgba(118,118,128,0.16);color:var(--text-0);font-size:14px;font-weight:500">‹ 返回</button>'+
      '</div>'+
      '<div class="detail-header">'+
      '<div class="detail-cover">'+safeImg(cover)+'</div>'+
      '<div class="detail-meta">'+
        '<div class="detail-title">'+esc(title)+'</div>'+
        '<div class="detail-sub">'+esc(info.creator||"")+(info.playCount?(' · '+fmtCount(info.playCount)+'次播放'):'')+' · 共'+songs.length+(isVoice?'集':'首')+'</div>'+
        (info.desc?'<div class="detail-desc">'+esc(info.desc)+'</div>':'')+
      '</div>'+
      '<button class="hero-play detail-play-all" id="playAllDetail"><svg><use href="#i-play"/></svg>播放</button></div>'+
      sortBar+
      '<div class="song-list" id="detailSongs" style="margin-top:8px"></div>';
    // 喜马听书：列表底部加载提示
    var isXmVoice = isVoice && ((params.voiceSource || params.source) === "ximalaya");
    if (isXmVoice){
      var tip0 = (params.voiceHasMore === false)
        ? ("已加载全部 " + songs.length + " 集")
        : "上拉加载更多";
      v.insertAdjacentHTML("beforeend",
        '<div id="detailLoadMore" style="text-align:center;padding:16px 0 24px;font-size:12px;color:var(--text-2)">'+tip0+'</div>');
    }
    renderSongList($("#detailSongs"), songs, params.queueTag || null);
    $("#playAllDetail").onclick = function(){
      playQueue(songs, 0, params.queueTag || null);
    };
    var db = $("#detailBackBtn");
    if (db) db.onclick = function(){ handleBack(); };

    // 更新「共 N 集」副标题
    function updateVoiceSubCount(n){
      try {
        var sub = v.querySelector(".detail-sub");
        if (!sub) return;
        var txt = sub.textContent || "";
        sub.textContent = txt.replace(/共\d+(集|首)/, "共" + n + (isVoice ? "集" : "首"));
      } catch(eU) {}
    }

    if (isVoice){
      $all(".voice-sort-btn", v).forEach(function(btn){
        btn.onclick = function(){
          var wantAsc = btn.getAttribute("data-asc") === "1";
          if (!!params.voiceAsc === wantAsc) return;
          params.voiceAsc = wantAsc;
          var vsrc = params.voiceSource || params.source || "netease";
          toast(wantAsc ? "切换正序…" : "切换倒序…");
          if (vsrc === "ximalaya"){
            // 喜马：已加载列表本地反转，保留分页状态
            var nextXm = songs.slice().reverse();
            params.songs = nextXm;
            paint({ info: { title: title, cover: cover }, songs: nextXm });
            return;
          }
          var rid = params.voiceRadioId || String(params.id || "").replace(/^ne-voice-/, "");
          if (!rid) return;
          API.neteaseDjPrograms(rid, 80, wantAsc).then(function(r2){
            var next = (r2 && r2.songs) || [];
            if (!next.length) next = songs.slice().reverse();
            params.songs = next;
            paint({ info: { title: title, cover: cover }, songs: next });
          }).catch(function(){
            var next = songs.slice().reverse();
            params.songs = next;
            paint({ info: { title: title, cover: cover }, songs: next });
          });
        };
      });
    }

    // 喜马拉雅听书：上拉自动加载更多集数
    if (isXmVoice){
      var xmAid = params.voiceAlbumId || params.voiceRadioId || String(params.id || "").replace(/^xm-voice-/, "").replace(/^xm_/, "");
      var xmState = {
        page: Math.max(2, +params.voicePage || 2),
        hasMore: params.voiceHasMore !== false,
        loading: false,
        seen: {},
        cover: cover || params.cover || ""
      };
      songs.forEach(function(s){
        if (s && s.xmTrackId) xmState.seen[s.xmTrackId] = 1;
      });
      params._xmVoiceState = xmState;

      function setXmTip(msg){
        var tip = $("#detailLoadMore");
        if (tip) tip.textContent = msg;
      }
      function appendXmSongs(more){
        if (!more || !more.length) return 0;
        var added = 0;
        var batch = more.slice();
        // 倒序展示时：新页（升序）反转后接到末尾
        if (!params.voiceAsc) batch = batch.reverse();
        batch.forEach(function(s){
          if (!s || !s.xmTrackId || xmState.seen[s.xmTrackId]) return;
          xmState.seen[s.xmTrackId] = 1;
          if (xmState.cover && !s.cover) s.cover = xmState.cover;
          songs.push(s);
          added++;
        });
        if (!added) return 0;
        params.songs = songs;
        params.voicePage = xmState.page;
        renderSongList($("#detailSongs"), songs, params.queueTag || null);
        updateVoiceSubCount(songs.length);
        // 若当前播放队列就是本专辑，同步追加（不打断当前曲）
        try {
          if (state.queueTag && params.queueTag && state.queueTag === params.queueTag){
            var qSeen = {};
            state.queue.forEach(function(q){ if (q && q.xmTrackId) qSeen[q.xmTrackId] = 1; });
            batch.forEach(function(s){
              if (s && s.xmTrackId && !qSeen[s.xmTrackId]){
                state.queue.push(s);
                qSeen[s.xmTrackId] = 1;
              }
            });
            try { renderPlaylistPanel(); } catch(eP) {}
          }
        } catch(eQ) {}
        return added;
      }
      function loadXmMore(){
        if (xmState.loading || !xmState.hasMore || !xmAid) return;
        xmState.loading = true;
        setXmTip("加载中…");
        var nextPage = xmState.page + 1;
        API.ximalayaAlbumTracks(xmAid, nextPage, 50).then(function(res){
          xmState.loading = false;
          var arr = (res && res.songs) || [];
          xmState.page = nextPage;
          params.voicePage = nextPage;
          var added = appendXmSongs(arr);
          if (!arr.length || added === 0){
            xmState.hasMore = false;
            params.voiceHasMore = false;
            setXmTip("已加载全部 " + songs.length + " 集");
          } else {
            // 本页明显不满时，大概率没有更多
            if (arr.length < 8 && added < 8){
              xmState.hasMore = false;
              params.voiceHasMore = false;
              setXmTip("已加载全部 " + songs.length + " 集");
            } else {
              params.voiceHasMore = true;
              setXmTip("上拉加载更多");
            }
          }
        }).catch(function(){
          xmState.loading = false;
          setXmTip("加载失败，上拉重试");
        });
      }

      // 滚动加载（挂在详情 view 上）
      if (v._xmVoiceScrollBound){
        try { v.removeEventListener("scroll", v._xmVoiceScrollBound); } catch(eR) {}
      }
      v._xmVoiceScrollBound = function(){
        if (state.view !== "detail") return;
        if (xmState.loading || !xmState.hasMore) return;
        var remain = v.scrollHeight - v.scrollTop - v.clientHeight;
        if (remain < 180) loadXmMore();
      };
      v.addEventListener("scroll", v._xmVoiceScrollBound, { passive: true });
      // 列表较短时自动再拉一页，避免「看不到底」
      setTimeout(function(){
        try {
          if (xmState.hasMore && v.scrollHeight <= v.clientHeight + 40) loadXmMore();
        } catch(eA) {}
      }, 200);
    }
  }
  // 听书查看全部：分类 Tab + 分页加载更多
  if (params.type === "voiceAll"){
    var VOICE_ALL_TABS = [
      { id: "recent", name: "最近听书" },
      { id: "funny", name: "相声评书" },
      { id: "ent", name: "娱乐" },
      { id: "book", name: "有声书" },
      { id: "kids", name: "儿童" },
      { id: "history", name: "历史" },
      { id: "growth", name: "个人成长" },
      { id: "edu", name: "教育培训" },
      { id: "film", name: "影视" },

        '<div class="song-dur">'+fmtTime(s.interval)+'</div></div>';
    }).join("");
    wrap.insertAdjacentHTML("beforeend", html);
    // 重新绑定整表点击（用最新 songs）
    $all(".song-row", wrap).forEach(function(row){
      row.onclick = function(){
        var i = +row.dataset.i;
        playQueue(detailState.songs, i, params.queueTag || null);
      };
    });
    var tip = $("#detailLoadMore");
    if (tip) tip.textContent = detailState.hasMore ? "上拉加载更多" : "已加载全部 "+detailState.songs.length+" 首";
    var sub = $("#detailSub");
    if (sub && detailState.info){
      var info = detailState.info;
      var totalShow = info.songCount || detailState.songs.length;
      sub.textContent = (info.creator||"")+(info.playCount?(' · '+fmtCount(info.playCount)+'次播放'):'')+' · 已加载'+detailState.songs.length+'/'+totalShow+'首';
    }
  }
  function loadDetailPage(isFirst){
    if (detailState.loading) return Promise.resolve();
    if (!isFirst && !detailState.hasMore) return Promise.resolve();
    detailState.loading = true;
    var tip = $("#detailLoadMore");
    if (tip && !isFirst) tip.textContent = "加载中…";

    // 若首页 cdlist 已给全量，后续本地切片
    if (!isFirst && detailState.cdAll && detailState.cdAll.length){
      var start = detailState.page * PAGE;
      var slice = detailState.cdAll.slice(start, start + PAGE);
      detailState.songs = detailState.songs.concat(slice);
      detailState.page++;
      detailState.hasMore = start + slice.length < detailState.cdAll.length;
      detailState.loading = false;
      appendDetailSongs(slice);
      return Promise.resolve();
    }

    return API.playlistDetail(detailState.dissid, detailState.page, PAGE).then(function(res){
      detailState.loading = false;
      if (!res) res = { songs: [], info: {}, hasMore: false };
      if (isFirst){
        detailState.info = res.info || {};
        detailState.songs = res.songs || [];
        detailState.cdAll = res._cdAll || null;
        detailState.hasMore = !!res.hasMore || !!(detailState.cdAll && detailState.cdAll.length > detailState.songs.length);
        detailState.page = 1;
        paintDetail();
        // 若首页已用 cdAll 切了第一页，标记
        if (detailState.cdAll && detailState.cdAll.length > detailState.songs.length){
          detailState.hasMore = true;
        }
        var tip2 = $("#detailLoadMore");
        if (tip2) tip2.textContent = detailState.hasMore ? "上拉加载更多" : (detailState.songs.length ? "已加载全部" : "");
      } else {
        var more = res.songs || [];
        // 去重
        var seen = {};
        detailState.songs.forEach(function(x){ if (x.songmid) seen[x.songmid]=1; });
        more = more.filter(function(x){ return x.songmid && !seen[x.songmid]; });
        detailState.songs = detailState.songs.concat(more);
        detailState.page++;
        detailState.hasMore = !!res.hasMore && more.length > 0;
        if (res.info && res.info.songCount) detailState.info.songCount = res.info.songCount;
        appendDetailSongs(more);
        if (!more.length) detailState.hasMore = false;
      }
    }).catch(function(){
      detailState.loading = false;
      if (isFirst) paint({ info:{}, songs:[] });
      else {
        var tip3 = $("#detailLoadMore");
        if (tip3) tip3.textContent = "加载失败，上拉重试";
        detailState.hasMore = true;
      }
    });
  }
  function bindDetailScroll(){
    var scroller = v; // .view 自身可滚动
    if (!scroller) return;
    if (scroller._detailScrollBound) return;
    scroller._detailScrollBound = true;
    scroller.addEventListener("scroll", function(){
      if (state.view !== "detail") return;
      var st = window._qqmDetailState;
      if (!st || st.loading || !st.hasMore) return;
      var remain = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight;
      if (remain < 160){
        // 触发当前详情的加载（通过全局状态识别 dissid 一致时由闭包 loadDetailPage 处理）
        try { scroller._qqmLoadMore && scroller._qqmLoadMore(); } catch(e) {}
      }
    }, { passive: true });
  }
  v._qqmLoadMore = function(){ loadDetailPage(false); };
  loadDetailPage(true);
}

/** 收藏项统一取 songmid */
function favMidOf(item){
  if (!item) return "";
  if (typeof item === "string") return item;
  return item.songmid || item.mid || "";
}
function isFavorite(mid){
  if (!mid) return false;
  for (var i=0;i<state.favorites.length;i++){
    if (favMidOf(state.favorites[i]) === mid) return true;
  }
  return false;
}
function favIndexOf(mid){
  if (!mid) return -1;
  for (var i=0;i<state.favorites.length;i++){
    if (favMidOf(state.favorites[i]) === mid) return i;
  }
  return -1;
}
/** 从完整 song 抽可持久化字段 */
function slimSong(song){
  if (!song) return null;
  var mid = song.songmid || song.mid || "";
  if (!mid) return null;
  return {
    songmid: mid,
    media_mid: song.media_mid || song.strMediaMid || song.mediaMid || "",
    name: song.name || song.title || mid,
    singer: song.singer || "",
    albummid: song.albummid || song.album_mid || "",
    albumname: song.albumname || "",
    cover: song.cover || "",
    interval: song.interval || 0,
    source: song.source || "qq",
    isVip: !!song.isVip,
    isSQ: !!song.isSQ,
    rid: song.rid || "",
    videoId: song.videoId || "",
    hash: song.hash || ""
  };
}
/** 解析收藏列表为可播放 song 对象（旧版纯 mid 会先占位再补全） */
function resolveFavoriteSongs(){
  return (state.favorites || []).map(function(item){
    if (typeof item === "string"){
      return { songmid: item, name: item, singer: "", interval: 0, source: "qq", _needHydrate: true };
    }
    var s = slimSong(item) || { songmid: favMidOf(item), name: favMidOf(item), singer: "", interval: 0 };
    if (!s.name || s.name === s.songmid) s._needHydrate = true;
    return s;
  });
}
/** 用 QQ 接口补全歌名/歌手（仅 qq 源 mid） */
API.hydrateSongs = function(songs){
  var list = (songs || []).filter(function(s){
    return s && s.songmid && (!s.source || s.source === "qq") &&
      (s._needHydrate || !s.name || s.name === s.songmid || !s.singer);
  });
  if (!list.length) return Promise.resolve(songs || []);
  var mids = [];
  var seen = {};
  list.forEach(function(s){
    if (!seen[s.songmid]){ seen[s.songmid] = 1; mids.push(s.songmid); }
  });
  mids = mids.slice(0, 40);
  // 逐首 get_song_detail_yqq（兼容性最好）
  var chain = Promise.resolve({});
  var byMid = {};
  mids.forEach(function(mid){
    chain = chain.then(function(){
      var body = JSON.stringify({
        comm: { ct: 24, cv: 0, uin: String((state.user && state.user.uin) || "0") },
        songinfo: {
          module: "music.pf_song_detail_svr",
          method: "get_song_detail_yqq",
          param: { song_mid: mid }
        }
      });
      return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
        method: "POST",
        headers: withCookie({ "Content-Type": "application/json", "Referer": "https://y.qq.com/" }),
        body: body
      }).then(function(txt){
        var d = jsonp_safeParse(txt);
        var info = d && d.songinfo && d.songinfo.data && (d.songinfo.data.track_info || d.songinfo.data);
        if (!info) return;
        var n = null;
        try { n = normalizeSongFromSearch(info); } catch(eN) {}
        if (!n || !n.songmid){
          var name = info.name || info.title || "";
          var singers = info.singer || [];
          var singer = Array.isArray(singers) ? singers.map(function(a){ return a.name || ""; }).filter(Boolean).join("/") : (info.singer_name || "");
          var amid = (info.album && (info.album.mid || info.album.pmid)) || info.albummid || "";
          var mediaMid = (info.file && (info.file.media_mid || info.file.mediaMid)) || info.media_mid || mid;
          n = {
            songmid: info.mid || info.songmid || mid,
            media_mid: mediaMid,
            name: name || mid,
            singer: singer,
            albummid: amid,
            albumname: (info.album && info.album.name) || "",
            cover: "",
            interval: info.interval || 0,
            source: "qq"
          };
        }
        n.source = "qq";
        byMid[mid] = n;
        byMid[n.songmid] = n;
      }).catch(function(){});
    });
  });
  return chain.then(function(){
    var changed = false;
    (songs || []).forEach(function(s){
      var info = byMid[s.songmid];
      if (!info) return;
      s.name = info.name || s.name;
      s.singer = info.singer || s.singer;
      s.albummid = info.albummid || s.albummid;
      s.media_mid = info.media_mid || s.media_mid;
      s.interval = info.interval || s.interval;
      s.cover = info.cover || s.cover;
      s.albumname = info.albumname || s.albumname;
      s.source = s.source || "qq";
      delete s._needHydrate;
      var idx = favIndexOf(s.songmid);
      if (idx > -1){
        state.favorites[idx] = slimSong(s);
        changed = true;
      }
    });
    if (changed) storeSet("favorites", state.favorites);
    return songs;
  }).catch(function(){ return songs || []; });
};

function toggleFavorite(song){
  if (!song || !song.songmid) return;
  var i = favIndexOf(song.songmid);
  if (i > -1){
    state.favorites.splice(i, 1);
    toast("已取消收藏");
  } else {
    var slim = slimSong(song);
    if (slim) state.favorites.push(slim);
    toast("已收藏");
  }
  storeSet("favorites", state.favorites);
  syncLikeButtons();
}
function syncLikeButtons(){
  var cur = state.queue[state.queueIndex];
  var on = cur && isFavorite(cur.songmid);
  var icon = on ? "#i-heart-fill" : "#i-heart";
  ["#pbLike", "#fpLike"].forEach(function(sel){
    var btn = $(sel);
    if (!btn) return;
    btn.classList.toggle("on", !!on);
    var use = btn.querySelector("use");
    if (use) use.setAttribute("href", icon);
  });
}

function syncSourceIndicator(animate){
  var tabs = $("#sourceTabs");
  if (!tabs) return;
  var ind = $("#sourceIndicator") || tabs.querySelector(".sr-indicator");
  var active = tabs.querySelector(".sr-tab.active");
  if (!ind || !active) return;
  var w = active.offsetWidth;
  if (!w) {
    setTimeout(function(){ try { syncSourceIndicator(false); } catch(e){} }, 60);
    return;
  }
  // offsetLeft 相对 offsetParent；指示器 absolute 已脱流，tab 的 offsetLeft 即目标位置
  var left = active.offsetLeft;
  if (animate === false){
    ind.style.transition = "none";
    ind.style.width = w + "px";
    ind.style.transform = "translate3d(" + left + "px,0,0)";
    void ind.offsetWidth;
    ind.style.transition = "transform .34s cubic-bezier(.34,1.4,.5,1), width .34s cubic-bezier(.34,1.4,.5,1)";
  } else {
    ind.style.transition = "transform .34s cubic-bezier(.34,1.4,.5,1), width .34s cubic-bezier(.34,1.4,.5,1)";

  var sb = $("#searchSuggestBack");

  API.smartbox(kw).then(function(box){

      html += box.albums.slice(0, 6).map(function(a){

      }).join("");

    body.innerHTML = html;
    if (box.songs && box.songs.length){
      renderSongList($("#suggestSongs"), box.songs.slice(0, 8));
    }
    $all(".suggest-singer", body).forEach(function(row){
      row.onclick = function(){
        switchView("singerDetail", { mid: row.dataset.mid, name: row.dataset.name });

    $all(".suggest-album", body).forEach(function(row){
      row.onclick = function(){
        // 专辑：拉取专辑歌曲并进入详情式列表
        var amid = row.dataset.mid, aname = row.dataset.name;
        toast("加载专辑…");
        API.albumSongs(amid).then(function(res){

          switchView("detail", { type: "album", id: amid, title: aname, songs: res.songs, cover: coverUrl(amid) });

/** 完整搜索结果：单曲 + 歌手 + 歌单 + 专辑 */
function renderSearchResults(kw){
  kw = (kw || "").trim();
  var v = $("#view-search");
  if (!v) return;
  var seq = ++_searchSeq;

  if (state.source === "kugou" || state.source === "kuwo" || state.source === "netease" || state.source === "ytmusic"){
    var srcLabel = { kugou:"酷狗", kuwo:"酷我", netease:"网易", ytmusic:"YTM" }[state.source] || state.source;
    v.innerHTML =
      '<div class="sec-head" style="margin-top:12px;align-items:center">'+
        '<button type="button" class="sr-back" id="searchBackBtn" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:10px;background:rgba(118,118,128,0.16);color:var(--text-0);font-size:14px;font-weight:500;margin-right:8px">‹ 返回</button>'+
        '<div class="sec-title" style="font-size:17px">'+srcLabel+'「'+esc(kw)+'」</div>'+
      '</div>'+
      renderSourceSwitch()+
      '<div id="searchResults" style="margin-top:8px">'+skeletonRows(8)+'</div>';
    $("#searchBackBtn").onclick = function(){ handleBack(); };
    bindSourceTabs(v);
    var searchFn = state.source === "kuwo" ? API.kuwoSearch
      : state.source === "netease" ? API.neteaseSearch
      : state.source === "kugou" ? API.kugouSearch
      : state.source === "ytmusic" ? API.ytmusicSearch
      : API.search;
    var plFn = state.source === "kuwo" ? API.kuwoSearchPlaylists
      : state.source === "netease" ? API.neteaseSearchPlaylists
      : state.source === "kugou" ? API.kugouSearchPlaylists
      : null;
    Promise.all([
      searchFn(kw, 1),
      plFn ? plFn(kw, 1).catch(function(){ return []; }) : Promise.resolve([])
    ]).then(function(arr){
      if (seq !== _searchSeq) return;
      var wrap = $("#searchResults");
      if (!wrap) return;
      var res = arr[0] || {};
      var songs = (res && res.list) || [];
      var singers = (res && res.singers) || [];
      var playlists = arr[1] || [];
      if (!songs.length && !singers.length && !playlists.length){
        wrap.innerHTML = emptyHtml(srcLabel+"未找到结果", "换个关键词试试");
        return;
      }
      // 歌手横排（头像下名字）+ 歌单 + 单曲
      if ((state.source === "ytmusic" || state.source === "kuwo" || state.source === "netease" || state.source === "kugou") && (singers.length || songs.length || playlists.length)){
        var html = "";
        if (singers.length){
          html += '<div class="sec" style="margin-top:6px"><div class="sec-head"><div class="sec-title" style="font-size:16px">歌手</div></div>';
          html += '<div class="singer-hscroll">';
          html += singers.slice(0, 12).map(function(s){
            return '<div class="singer-chip src-artist-row" data-name="'+esc(s.name)+'" data-mid="'+(esc(s.mid||""))+'">'+
              '<div class="singer-chip-avatar">'+safeImg(s.cover||"")+'</div>'+
              '<div class="singer-chip-name">'+esc(s.name)+'</div></div>';
          }).join("");
          html += '</div></div>';
        }
        if (playlists.length){
          html += '<div class="sec" style="margin-top:10px"><div class="sec-head"><div class="sec-title" style="font-size:16px">歌单</div></div>';
          html += playlists.slice(0, 12).map(function(p){
            var id = String(p.dissid || p.id || "");
            var title = p.dissname || p.title || p.name || "";
            var cover = fixCover(p.imgurl || p.logo || p.cover || "");
            var creator = p.nickname || (p.creator && (p.creator.name || p.creator.nickname)) || "";
            return '<div class="song-row src-pl-row" data-id="'+esc(id)+'" data-src="'+esc(p.source||state.source)+'">'+
              '<div class="song-cover">'+safeImg(cover)+'</div>'+
              '<div class="song-meta"><div class="song-title">'+esc(title)+'</div>'+
              '<div class="song-sub">歌单'+(creator?(' · '+esc(creator)):'')+'</div></div></div>';
          }).join("");
          html += '</div>';
        }
        if (songs.length){
          html += '<div class="sec" style="margin-top:10px"><div class="sec-head"><div class="sec-title" style="font-size:16px">单曲</div></div>'+
            '<div class="song-list" id="altSongList"></div></div>';
        }
        wrap.innerHTML = html;
        if (songs.length){
          renderSongList($("#altSongList"), songs);
        }
        $all(".src-artist-row", wrap).forEach(function(row){
          row.onclick = function(){
            var name = row.dataset.name || "";
            var mid = row.dataset.mid || "";
            if (!name && !mid) return;
            openSourceArtist(name, mid, state.source);
          };
        });
        $all(".src-pl-row", wrap).forEach(function(row){
          row.onclick = function(){
            var id = row.dataset.id || "";
            var src = row.dataset.src || state.source;
            if (!id) return;
            switchView("detail", { type: "playlist", id: id, source: src });
          };
        });
        return;
      }
      renderSongList(wrap, songs);
    });
    return;
  }

  v.innerHTML =
    '<div class="sec-head" style="margin-top:12px;align-items:center">'+
      '<button type="button" class="sr-back" id="searchBackBtn" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:10px;background:rgba(118,118,128,0.16);color:var(--text-0);font-size:14px;font-weight:500;margin-right:8px">‹ 返回</button>'+
      '<div class="sec-title" style="font-size:17px">搜索「'+esc(kw)+'」</div>'+
    '</div>'+
    renderSourceSwitch()+
    '<div class="sr-tabs" id="srTabs" style="margin:10px 0 12px;gap:10px">'+
      '<div class="sr-tab active" data-tab="all">综合</div>'+
      '<div class="sr-tab" data-tab="song">单曲</div>'+
      '<div class="sr-tab" data-tab="singer">歌手</div>'+
      '<div class="sr-tab" data-tab="playlist">歌单</div>'+
      '<div class="sr-tab" data-tab="album">专辑</div>'+
    '</div>'+
    '<div id="searchResults">'+skeletonRows(8)+'</div>';
  var backBtn = $("#searchBackBtn");
  if (backBtn) backBtn.onclick = function(){ handleBack(); };
  bindSourceTabs(v);

  API.search(kw, 1).then(function(res){
    if (seq !== _searchSeq) return;
    var wrap = $("#searchResults");
    if (!wrap) return;
    var hasAny = (res.list && res.list.length) || (res.singers && res.singers.length) ||
      (res.playlists && res.playlists.length) || (res.albums && res.albums.length);
    if (!hasAny){
      wrap.innerHTML = emptyHtml('没有找到 "'+esc(kw)+'" 相关结果',"换个关键词试试");
      return;
    }

    function renderTab(tab){
      var html = "";
      if (tab === "all" || tab === "singer"){
        if (res.singers && res.singers.length){
          html += '<div class="sec" style="margin-top:6px"><div class="sec-head"><div class="sec-title" style="font-size:16px">歌手</div></div>';
          var sl = (tab === "all") ? res.singers.slice(0, 10) : res.singers.slice(0, 30);
          html += '<div class="singer-hscroll">';
          html += sl.map(function(s){
            var mid = s.singer_mid || s.mid || s.singerMID || "";
            var name = s.singer_name || s.name || s.singerName || "";
            var pic = s.singer_pic || s.pic || coverUrl(mid, "singer");
            return '<div class="singer-chip sr-singer" data-mid="'+esc(mid)+'" data-name="'+esc(name)+'">'+
              '<div class="singer-chip-avatar">'+safeImg(pic)+'</div>'+
              '<div class="singer-chip-name">'+esc(name)+'</div></div>';
          }).join("");
          html += '</div></div>';
        }
      }
      if (tab === "all" || tab === "song"){
        if (res.list && res.list.length){
          html += '<div class="sec" style="margin-top:6px"><div class="sec-head"><div class="sec-title" style="font-size:16px">单曲</div>'+
            (res.total ? '<div class="sec-more" style="font-size:12px;color:var(--text-2)">共 '+fmtCount(res.total)+' 首</div>' : '')+
            '</div><div class="song-list" id="srSongList"></div></div>';
        }
      }
      if (tab === "all" || tab === "playlist"){
        if (res.playlists && res.playlists.length){
          html += '<div class="sec" style="margin-top:6px"><div class="sec-head"><div class="sec-title" style="font-size:16px">歌单</div></div>';
          var pl = (tab === "all") ? res.playlists.slice(0, 6) : res.playlists.slice(0, 20);
          html += pl.map(function(p){
            var id = String(p.dissid || p.id || p.tid || "");
            var title = p.dissname || p.title || p.name || "";
            var cover = fixCover(p.imgurl || p.logo || p.picurl || p.cover || "");
            var creator = (p.creator && (p.creator.name || p.creator.nickname)) || p.nickname || "";
            return '<div class="song-row sr-pl" data-id="'+esc(id)+'">'+
              '<div class="song-cover">'+safeImg(cover)+'</div>'+
              '<div class="song-meta"><div class="song-title">'+esc(title)+'</div><div class="song-sub">歌单'+(creator?(' · '+esc(creator)):'')+'</div></div></div>';
          }).join("");
          html += '</div>';
        }
      }
      if (tab === "all" || tab === "album"){
        if (res.albums && res.albums.length){
          html += '<div class="sec" style="margin-top:6px"><div class="sec-head"><div class="sec-title" style="font-size:16px">专辑</div></div>';
          var al = (tab === "all") ? res.albums.slice(0, 6) : res.albums.slice(0, 20);
          html += al.map(function(a){
            var mid = a.albumMID || a.album_mid || a.mid || "";
            var name = a.albumName || a.album_name || a.name || "";
            var singer = a.singerName || a.singer_name || "";
            var pic = a.albumPic || a.pic || coverUrl(mid);
            return '<div class="song-row sr-album" data-mid="'+esc(mid)+'">'+
              '<div class="song-cover">'+safeImg(pic)+'</div>'+
              '<div class="song-meta"><div class="song-title">'+esc(name)+'</div><div class="song-sub">专辑'+(singer?(' · '+esc(singer)):'')+'</div></div></div>';
          }).join("");
          html += '</div>';
        }
      }
      if (!html){
        html = emptyHtml("该分类暂无结果", "试试其它分类或换个词");
      }
      wrap.innerHTML = html;
      if ((tab === "all" || tab === "song") && res.list && res.list.length){
        var songWrap = $("#srSongList");
        if (songWrap) renderSongList(songWrap, tab === "all" ? res.list.slice(0, 15) : res.list);
      }
      $all(".sr-singer", wrap).forEach(function(row){
        row.onclick = function(){ switchView("singerDetail", { mid: row.dataset.mid, name: row.dataset.name }); };
      });
      $all(".sr-pl", wrap).forEach(function(row){
        row.onclick = function(){ switchView("detail", { type: "playlist", id: row.dataset.id }); };
      });
      $all(".sr-album", wrap).forEach(function(row){
        row.onclick = function(){
          var amid = row.dataset.mid;
          toast("加载专辑…");
          API.albumSongs(amid).then(function(res){
            if (!res.songs || !res.songs.length){ toast("专辑暂无歌曲"); return; }
            var title = (row.querySelector(".song-title") || {}).textContent || "";
            switchView("detail", { type: "album", id: amid, title: title, songs: res.songs, cover: coverUrl(amid) });
          });
        };
      });
    }

    renderTab("all");
    $all("#srTabs .sr-tab").forEach(function(t){
      t.onclick = function(){
        $all("#srTabs .sr-tab").forEach(function(x){ x.classList.remove("active"); });
        t.classList.add("active");
        renderTab(t.dataset.tab);
      };
    });
    // 后台补歌手/专辑/歌单，不挡首屏单曲
    API.searchExtra(kw).then(function(extra){
      if (seq !== _searchSeq) return;
      if (!extra) return;
      if (!res.singers) res.singers = [];
      var ids = {};
      res.singers.forEach(function(s){ if (s.mid) ids[s.mid] = true; });
      (extra.singers || []).forEach(function(s){ if (s.mid && !ids[s.mid]) res.singers.push(s); });
      res.albums = extra.albums || [];
      res.playlists = extra.playlists || [];
      var active = $("#srTabs .sr-tab.active");
      var tab = (active && active.dataset.tab) || "all";
      if (tab !== "song") renderTab(tab);
    });
  });
}

/** 歌手页：QQ 走原生 mid；其它音源走 singerDetail 同源样式（含专辑展开） */
function openSourceArtist(name, mid, source){
  name = (name || "").trim();
  source = source || state.source || "qq";
  mid = mid || "";
  if (!name && !mid){
    toast("无效歌手");
    return;
  }
  // QQ 原生歌手
  if (source === "qq" && mid && !/^(kg_|kw_|ne_|yt_|kw_ar_|kg_ar_|ne_ar_|yt_artist_)/i.test(mid)){
    switchView("singerDetail", { mid: mid, name: name, source: "qq" });
    return;
  }
  switchView("singerDetail", {
    mid: mid || name,
    name: name || mid,
    source: source
  });
}

function doSearch(kw){
  kw = (kw || "").trim();
  if (!kw) return;
  // 首次搜索即解锁全部音源（保留「宝宝巴士」彩蛋兼容）
  if (!state.sourceUnlocked){
    unlockAllSources(true);
  }
  if (state.view === "search"){
    state.viewParams = { kw: kw };
    try {
      history.replaceState(currentHistoryState({view:"search", params:{kw:kw}}), "", "#search/"+encodeURIComponent(kw));
    } catch(e) {}
    renderSearchResults(kw);
    return;
  }
  switchView("search", {kw:kw});
}
function openSearchPage(){
  if (state.view === "search") return;
  switchView("search", {}, true);
}

/** 搜索页无关键词时判定为「空搜」 */
function isSearchQueryEmpty(){
  try {
    var si = $("#searchInput");
    if (si && String(si.value || "").trim()) return false;
  } catch(e0) {}
  try {
    if (state.viewParams && state.viewParams.kw && String(state.viewParams.kw).trim()) return false;
  } catch(e1) {}
  return true;
}

/**
 * 搜索页且未输入内容时，点击空白处回主页
 * （热搜标签 / 音源切换 / 搜索框 / 顶栏按钮 不触发）
 */
function bindSearchBlankToHome(){
  if (window._qqmSearchBlankBound) return;
  window._qqmSearchBlankBound = true;
  document.addEventListener("click", function(e){
    try {
      if (state.view !== "search") return;
      if (!isSearchQueryEmpty()) return;
      if (typeof isOverlayOpen === "function" && isOverlayOpen()) return;
      var t = e.target;
      if (!t) return;
      var el = t.nodeType === 1 ? t : t.parentElement;
      if (!el || !el.closest) return;
      // 交互控件：不回首页
      if (el.closest("#searchBox") || el.closest("#searchInput") || el.closest("#topbar") ||
          el.closest("#playerBar") || el.closest("#bottomNav") || el.closest("#fullPlayer") ||
          el.closest("button") || el.closest("a") || el.closest("input") || el.closest("textarea") ||
          el.closest("select") || el.closest(".hot-search-tag") || el.closest(".sr-tab") ||
          el.closest("#sourceTabs") || el.closest(".song-row") || el.closest(".card") ||
          el.closest(".mv-card") || el.closest(".radio-card") || el.closest(".singer-chip") ||
          el.closest("#loginView") || el.closest(".sheet-mask")){
        return;
      }
      // 空白区域（搜索页内容区 / viewport 空隙）
      if (!(el.closest("#view-search") || el.closest("#viewport") || el.id === "app" || el === document.body)){
        return;
      }
      var si = $("#searchInput");
      if (si){
        try { si.blur(); } catch(eB) {}
        try { si.value = ""; } catch(eV) {}
      }
      state.viewParams = {};
      if (typeof handleBack === "function") handleBack();
      else if (typeof forceGoHome === "function") forceGoHome();
      else switchView("home", {}, false);
    } catch(err) {}
  }, false);
}
function skeletonRows(n){
  var s="";
  for (var i=0;i<n;i++) s += '<div class="song-row"><div class="song-cover skeleton"></div><div class="song-meta"><div class="skeleton" style="height:12px;width:40%;border-radius:6px;margin-bottom:8px"></div><div class="skeleton" style="height:10px;width:25%;border-radius:6px"></div></div></div>';
  return s;
}

/* ============================================================
   § 9. MV 播放
   ============================================================ */
function openMv(mv){
  var mvEl = $("#mvPlayerView");
  if (!mvEl || !mv) return;
  if (!mv.vid){
    toast("该MV缺少视频ID，无法播放");
    return;
  }
  if (!mvEl.classList.contains("show")){
    pushOverlayState("mv");
  }
  _mvClosing = false;
  try {
    mvEl.style.transition = "none";
    mvEl.style.transform = "translate3d(0,0,0)";
    mvEl.style.opacity = "1";
  } catch(eSt) {}
  mvEl.classList.add("show");
  try { bindMvPlayerGesture(); } catch(eG) {}
  syncAppUnderlay();
  $("#mvTopTitle").textContent = (mv.title || "MV") + (mv.singer ? ("  ·  " + mv.singer) : "");
  var video = $("#mvVideo");
  if (!video) return;
  try{ video.pause(); }catch(e){}
  try{ video.removeAttribute("src"); video.load(); }catch(e2){}
  video.poster = fixCover(mv.cover || "") || "";
  // 暂停后台音乐，避免 MV 与音频叠播
  try{
    if (audio && !audio.paused){ audio.pause(); setPlayingUI(false); }
  }catch(e3){}
  toast("正在解析MV地址…", 1500);
  var _mvGen = (openMv._gen = (openMv._gen || 0) + 1);

  function proxyPlayUrl(url){
    if (!url) return url;
    try{
      if (window.fm && typeof window.fm.res === "function"){
        var proxied = window.fm.res(url, {
          headers: withCookie({
            "Referer": "https://y.qq.com/",
            "User-Agent": QQ_HEADERS["User-Agent"],
            "Origin": "https://y.qq.com"
          }),
          credentials: "include"
        });
        if (proxied) return proxied;
      }
    }catch(e1){}
    return url;
  }

  function mvStillActive(){
    if (_mvGen !== openMv._gen) return false;
    if (_mvClosing) return false;
    var el = $("#mvPlayerView");
    if (!el || !el.classList.contains("show")) return false;
    return true;
  }
  function tryPlayCandidates(urls, idx){
    if (!mvStillActive()) return;
    if (!urls || idx >= urls.length){
      if (mvStillActive()) toast("MV播放失败，可能被防盗链限制或需登录");
      return;
    }
    var raw = urls[idx];
    var playSrc = proxyPlayUrl(raw);
    try{
      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");
      video.controls = true;
      video.preload = "auto";
      // 恢复可听（上次关闭可能 muted）

      // 不强制 crossOrigin，避免 CDN 无 CORS 头时整段失败

    }catch(eSet){

      return;
    }
    if (!mvStillActive()){
      try { stopMvVideo(); } catch(eX) {}

    }
    var p = null;
    try{ p = video.play(); }catch(eP){ p = null; }

        if (!mvStillActive()){ try { stopMvVideo(); } catch(eA) {} }
      }).catch(function(err){
        if (!mvStillActive()) return;

        if (playSrc !== raw){
          try{
            if (!mvStillActive()) return;
            video.src = raw;
            video.load();

            if (p2 && p2.catch){

          }catch(e3){

  }

  API.mvUrl(mv.vid).then(function(res){

    // 兼容：字符串 URL 或 {url, urls}

/** MV 全屏页：下滑关闭（左边缘留给系统返回） */
function bindMvPlayerGesture(){
  var mv = $("#mvPlayerView");
  if (!mv || mv._gestureBound) return;
  mv._gestureBound = true;
  var startY = 0, startX = 0, dragging = false, moved = false, edgeStart = false;
  var EDGE = 56;

  function onStart(e){
    if (!mv.classList.contains("show") || _mvClosing) return;
    var t = e.touches ? e.touches[0] : e;
    if (t.clientX <= EDGE){
      edgeStart = true; dragging = false; moved = false;
      return;
    }
    edgeStart = false;
    // 关闭按钮本身不启动拖拽
    if (e.target.closest && e.target.closest("#mvClose, .fp-close")) return;
    // 视频底部控件区（大约下 56px）不抢，避免拖进度条误关
    try {
      var vh = window.innerHeight || 0;
      if (e.target && e.target.id === "mvVideo" && t.clientY > vh - 64) return;
    } catch(eV) {}
    startY = t.clientY; startX = t.clientX;
    dragging = true; moved = false;
    mv.style.transition = "none";
  }
  function onMove(e){
    if (edgeStart || _mvClosing) return;
    if (!dragging) return;
    var t = e.touches ? e.touches[0] : e;
    var dy = t.clientY - startY;
    var dx = t.clientX - startX;
    if (!moved && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10){
      dragging = false;
      mv.style.transform = "translate3d(0,0,0)";
      mv.style.opacity = "1";
      return;
    }
    if (dy < 0) dy = 0;
    if (dy > 6) moved = true;
    if (moved){
      mv.style.transform = "translateY("+dy+"px)";
      mv.style.opacity = String(Math.max(0.35, 1 - dy / (window.innerHeight * 0.7)));
      if (e.cancelable) e.preventDefault();
    }
  }
  function onEnd(e){
    if (edgeStart){ edgeStart = false; dragging = false; moved = false; return; }
    if (!dragging && !moved) return;
    dragging = false;
    if (_mvClosing) return;
    var t = (e.changedTouches && e.changedTouches[0]) || e;
    var dy = (t ? t.clientY : startY) - startY;
    if (moved && dy > 100){
      closeMv(false);
    } else {
      mv.style.transition = "transform .45s cubic-bezier(0.34,1.56,0.64,1), opacity .3s ease";
      mv.style.transform = "translate3d(0,0,0)";
      mv.style.opacity = "1";
    }
    moved = false;
  }
  mv.addEventListener("touchstart", onStart, { passive: true });
  mv.addEventListener("touchmove", onMove, { passive: false });
  mv.addEventListener("touchend", onEnd, { passive: true });
  mv.addEventListener("touchcancel", onEnd, { passive: true });
}

/* ---- WebAudio 真实频谱 + 播放同步模拟兜底 ----
   设计目标：既要有声音，又要频谱随音乐跳动。
   - createMediaElementSource 一旦创建不可撤销，且部分 WebView 会抢走扬声器输出；
     因此默认「尝试」建图，失败或判定静音数据时改用时间驱动的模拟频谱（不影响出声）。
   - 模拟频谱按 audio.currentTime 多频段合成，播放中持续跳动，暂停时回落。
*/
var _audioCtx = null, _analyser = null, _freqData = null, _vizRaf = 0, _vizLive = false;
var _mediaSourceNode = null;
var _audioGraphTried = false;
var _audioGraphOk = false;       // 成功建图且能读到非全零数据

var _zeroBinStreak = 0;

function ensureAudioGraph(){
  /* 不创建 MediaElementSource：
     一旦创建不可撤销，fongmi/部分 Android WebView 会抢走 <audio> 扬声器输出导致静音。
     频谱由 fillSimulatedFreq 按 currentTime 驱动，保证「有声 + 会跳」。 */
  try { if (_audioCtx && _audioCtx.state === "suspended") _audioCtx.resume(); } catch(e0){}
  if (!_simFreq) _simFreq = new Uint8Array(128);
  _audioGraphTried = true;
  _audioGraphOk = false;
  _vizLive = false;

}

function resumeAudioCtx(){

  } catch(e) {}
}

/** 多频段时间驱动模拟频谱：播放中随 currentTime 跳动，不依赖 WebAudio */
function fillSimulatedFreq(out, t, playing){
  if (!out || !out.length) return 0;
  var n = out.length;
  if (!playing){
    for (var z = 0; z < n; z++) out[z] = Math.max(0, (out[z] || 0) * 0.82);
    return 0;
  }
  // 节拍感：约 2.1Hz 底鼓 + 多层谐波，低频更强
  var kick = Math.pow(Math.max(0, Math.sin(t * Math.PI * 2.15)), 10);
  var hat = Math.pow(Math.max(0, Math.sin(t * Math.PI * 8.4 + 0.4)), 4);
  var sum = 0;
  for (var i = 0; i < n; i++){
    var band = i / n;
    var bass = 0.55 + 0.45 * Math.sin(t * 3.7 + band * 1.8);
    var mid = 0.5 + 0.5 * Math.sin(t * 6.9 + band * 4.6 + 1.2);
    var high = 0.45 + 0.55 * Math.sin(t * 12.5 + band * 9.1 + 0.6);
    var flutter = 0.5 + 0.5 * Math.sin(t * 21 + i * 0.73);
    var energy = (1 - band * 0.62) * (0.22 + bass * 0.42 + mid * 0.28 + high * 0.14);
    energy += kick * (1 - band) * 0.55;
    energy += hat * band * 0.22;
    energy *= 0.75 + flutter * 0.35;
    energy = Math.max(0.04, Math.min(1, energy));
    var v = (energy * 255) | 0;
    out[i] = v;
    sum += v;
  }
  return sum / (n * 255);
}

var _vizAvgSmooth = 0.18;
var _vizFakeState = null;
function startVizLoop(){
  if (_vizRaf) return;

function stopVizLoop(){
  // 保持 rAF；暂停时柱子由 updateFpVisualizer 压低
}

function updateFpVisualizer(){
  var art = $("#fpArt");
  if (!art) return;
  var style = art.getAttribute("data-style") || "vinyl";
  var need = (style === "spectrum" || style === "wave" || style === "pulse" || style === "ring");
  if (!need) return;

  var playing = !!(audio && !audio.paused);
  var live = false;
  var avg = 0.18;
  var data = null;
  var len = 0;

  if (_analyser && _freqData && playing){
    try {
      _analyser.getByteFrequencyData(_freqData);
      var sum = 0, n = _freqData.length, nonZero = 0;
      for (var i = 0; i < n; i++){
        sum += _freqData[i];
        if (_freqData[i] > 2) nonZero++;
      }
      avg = sum / (n * 255);
      // 连续全零：跨域/静音数据 → 用模拟；偶发有数据则认真实
      if (nonZero > 4 && avg > 0.01){
        live = true;
        _audioGraphOk = true;
        _zeroBinStreak = 0;
        data = _freqData;
        len = n;
      } else {
        _zeroBinStreak++;
        // 播放中连续约 45 帧全零，判定 analyser 读不到有效 PCM
        if (_zeroBinStreak > 45) _audioGraphOk = false;
      }
    } catch(e) { live = false; }
  }

  if (!live){
    if (!_simFreq) _simFreq = new Uint8Array(128);
    var t = 0;
    try { t = audio && isFinite(audio.currentTime) ? audio.currentTime : (Date.now() / 1000); } catch(eT){ t = Date.now() / 1000; }
    avg = fillSimulatedFreq(_simFreq, t, playing);
    data = _simFreq;
    len = _simFreq.length;
  }

  // 平滑能量，避免柱子/光环抖闪
  _vizAvgSmooth = _vizAvgSmooth * 0.82 + avg * 0.18;
  avg = _vizAvgSmooth;
  if (_vizFakeState !== !live){
    _vizFakeState = !live;
    art.classList.toggle("is-fake", !live);
  }
  if (!data || !len) return;

  if (style === "spectrum"){
    var bars = art.querySelectorAll("#fpSpectrum i");
    var bn = bars.length;
    if (!bn) return;
    // 环形声波：对称镜像 + 平滑邻域
    var levels = [];
    var half = Math.max(1, Math.floor(bn / 2));
    for (var j = 0; j < bn; j++){
      var idx = Math.min(len - 1, Math.floor((j % half) / half * len * 0.55) + 1);
      levels[j] = data[idx] / 255;
    }
    for (var p = 0; p < 2; p++){
      var next = levels.slice();
      for (var j2 = 0; j2 < bn; j2++){
        var a = levels[(j2 - 1 + bn) % bn], b = levels[j2], c = levels[(j2 + 1) % bn];
        next[j2] = a * 0.2 + b * 0.6 + c * 0.2;
      }
      levels = next;
    }
    var peak = 0;
    for (var j3 = 0; j3 < bn; j3++){
      var v = levels[j3];
      if (v > peak) peak = v;
      var scale = playing ? (0.22 + v * 1.65) : 0.12;
      bars[j3].style.transform = "var(--tr) scaleY(" + scale.toFixed(3) + ")";
      bars[j3].style.opacity = String(playing ? (0.35 + v * 0.65) : 0.2);
    }
    var glow = $("#fpSpectrumGlow");
    if (glow){
      var g = 1 + peak * 0.08;
      glow.style.transform = "scale(" + g.toFixed(3) + ")";
      glow.style.opacity = String(playing ? (0.35 + peak * 0.5) : 0.15);
    }
  } else if (style === "wave"){
    // 粒子扩散：从封面【外缘】向外扩散（edgeR≈封面半径，避免被封面挡住）
    ensureFpArtDecor();
    var waveEl = $("#fpWave");
    var pool = waveEl && waveEl._particlePool;
    if (!pool) return;
    var stageEl = art.querySelector(".fp-art-stage");
    var half = stageEl && stageEl.offsetWidth ? stageEl.offsetWidth / 2 : 130;
    // 关键点必须在圆形封面外侧，否则会被封面盖住看不见
    var edgeR = half * 1.02;
    if (playing){
      _waveSpawnAcc += 4.5 + avg * 10;
      var burst = Math.min(16, Math.floor(_waveSpawnAcc));
      _waveSpawnAcc -= burst;
      for (var bi = 0; bi < burst; bi++){
        for (var pi = 0; pi < pool.length; pi++){
          if (pool[pi].active) continue;
          var p = pool[pi];
          p.active = true;
          p.ang = Math.random() * Math.PI * 2;
          var near = Math.random() < 0.65;
          // 贴边 / 略外一圈，全部在封面外
          p.r = edgeR * (near ? (1.0 + Math.random() * 0.04) : (1.06 + Math.random() * 0.12));
          if (near){
            p.vr = 0.25 + avg * 0.9 + Math.random() * 0.5;
            p.maxLife = 36 + Math.random() * 44;
            p.size = 0.9 + Math.random() * 1.1 + avg * 0.5;
          } else {
            p.vr = 0.7 + avg * 2.2 + Math.random() * 1.2;
            p.maxLife = 28 + Math.random() * 36 + avg * 14;
            p.size = 0.7 + Math.random() * 0.9 + avg * 0.4;
          }
          p.life = 0;
          break;
        }
      }
    } else {
      _waveSpawnAcc += 0.8;
      if (_waveSpawnAcc >= 1){
        _waveSpawnAcc -= 1;
        for (var pi2 = 0; pi2 < pool.length; pi2++){
          if (pool[pi2].active) continue;
          var p2 = pool[pi2];
          p2.active = true;
          p2.ang = Math.random() * Math.PI * 2;
          p2.r = edgeR * (1.0 + Math.random() * 0.05);
          p2.vr = 0.15 + Math.random() * 0.25;
          p2.maxLife = 45 + Math.random() * 40;
          p2.size = 0.8 + Math.random() * 1.0;
          p2.life = 0;
          break;
        }
      }
    }
    for (var wi = 0; wi < pool.length; wi++){
      var wp = pool[wi];
      if (!wp.active){
        if (wp.el.style.opacity !== "0") wp.el.style.opacity = "0";
        continue;
      }
      wp.life++;
      wp.r += wp.vr;
      wp.vr *= 0.99;
      var wt = wp.life / wp.maxLife;
      if (wt >= 1 || wp.r > half * 1.55){
        wp.active = false;
        wp.el.style.opacity = "0";
        continue;
      }
      var radial = 1 - Math.max(0, (wp.r - edgeR) / (half * 0.6));
      var wop = (wt < 0.08 ? (wt / 0.08) : (1 - (wt - 0.08) / 0.92));
      // 提高可见度：最低也要能看清
      wop *= (0.5 + radial * 0.5) * (playing ? (0.7 + avg * 0.3) : 0.45);
      var wx = Math.cos(wp.ang) * wp.r;

/** 播放列表底部弹层：下滑关闭（列表在顶部时可拖；把手/标题栏始终可拖） */
function bindQueueSheetGesture(){
  var sheet = $("#queueSheet");
  var mask = $("#queueSheetMask");
  if (!sheet || sheet._gestureBound) return;
  sheet._gestureBound = true;
  var startY = 0, startX = 0, dragging = false, moved = false, fromHandle = false;
  var startT = 0;

  function canDragFromTarget(target, clientY){
    if (!target) return false;
    // 把手 / 标题栏：始终允许
    if (target.closest && target.closest(".queue-sheet-handle, .queue-sheet-head")) return true;
    // 关闭/模式按钮不抢
    if (target.closest && target.closest(".queue-sheet-close, .queue-sheet-mode")) return false;
    var list = $("#queueSheetList");
    if (list && list.contains(target)){
      // 仅列表滚到顶时允许下拉关闭
      if ((list.scrollTop || 0) > 2) return false;
      return true;
    }
    // 点在 sheet 空白（非 list 内容）也可拖
    return sheet.contains(target);
  }

  function onStart(e){
    if (!sheet.classList.contains("show")) return;
    var t = e.touches ? e.touches[0] : e;
    if (!canDragFromTarget(e.target, t.clientY)) return;
    fromHandle = !!(e.target.closest && e.target.closest(".queue-sheet-handle, .queue-sheet-head"));
    startY = t.clientY; startX = t.clientX;
    startT = Date.now();
    dragging = true; moved = false;
    sheet.classList.add("dragging");
    sheet.style.transition = "none";
  }
  function onMove(e){
    if (!dragging) return;
    var t = e.touches ? e.touches[0] : e;
    var dy = t.clientY - startY;
    var dx = t.clientX - startX;
    // 横向优先则放弃
    if (!moved && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 12){
      dragging = false;
      sheet.classList.remove("dragging");
      sheet.style.transform = "";
      sheet.style.transition = "";
      return;
    }
    // 上推：若从列表发起且列表可滚，交给原生滚动
    if (dy < 0){
      if (!fromHandle){
        dragging = false;
        sheet.classList.remove("dragging");
        sheet.style.transform = "";
        return;
      }
      dy = 0;
    }
    if (dy > 6) moved = true;
    if (moved){
      sheet.style.transform = "translateY("+dy+"px)";
      // 遮罩随拖动变淡
      if (mask && mask.classList.contains("show")){
        var op = Math.max(0, 1 - dy / 420);
        mask.style.opacity = String(op * 1); // CSS 默认 opacity 过渡由 .show 控制
        mask.style.transition = "none";
      }
      if (e.cancelable) e.preventDefault();
    }
  }
  function onEnd(e){
    if (!dragging && !moved) return;
    dragging = false;
    var t = (e.changedTouches && e.changedTouches[0]) || e;
    var dy = (t ? t.clientY : startY) - startY;
    var dt = Math.max(1, Date.now() - startT);
    var velocity = dy / dt; // px/ms
    sheet.classList.remove("dragging");
    if (moved && (dy > 90 || (dy > 48 && velocity > 0.45))){
      // 滑出关闭
      sheet.style.transition = "transform .28s cubic-bezier(0.22,1,0.36,1)";
      sheet.style.transform = "translateY(105%)";
      if (mask){
        mask.style.transition = "opacity .28s ease";
        mask.style.opacity = "0";
      }
      setTimeout(function(){
        closeQueueSheet(true);
        if (mask){ mask.style.opacity = ""; mask.style.transition = ""; }
      }, 280);
    } else {
      // 回弹
      sheet.style.transition = "transform .38s cubic-bezier(0.34,1.56,0.64,1)";
      sheet.style.transform = "translateY(0)";
      if (mask){
        mask.style.transition = "opacity .25s ease";
        mask.style.opacity = "";
      }
      setTimeout(function(){
        if (sheet.classList.contains("show")){
          sheet.style.transition = "";
          sheet.style.transform = "";
        }
      }, 400);
    }
    moved = false;
  }
  sheet.addEventListener("touchstart", onStart, { passive: true });
  sheet.addEventListener("touchmove", onMove, { passive: false });
  sheet.addEventListener("touchend", onEnd, { passive: true });
  sheet.addEventListener("touchcancel", onEnd, { passive: true });
}

function requestPlayWakeLock(){
  _wakeLockWanted = true;

function recoverStalledPlayback(reason){
  try {
    if (_userPaused) return;
    if (!state.queue || !state.queue.length) return;
    var now = Date.now();
    if (now - _stalledRecoverAt < 2800) return;
    _stalledRecoverAt = now;
    var s = state.queue[state.queueIndex];
    if (!s) return;
    var t = 0;
    try { t = audio.currentTime || 0; } catch(eT) {}
    if (t > 2){
      _resumeSeek = {
        key: String(s.songmid || s.xmTrackId || s.id || ""),
        time: t,
        savedAt: now
      };
    }
    var hard = !!(audio && audio.error) || reason === "error" || reason === "emptied";
    if (!hard && audio && audio.paused === false){
      try {
        var ct = audio.currentTime || 0;
        if (ct > 1) audio.currentTime = Math.max(0, ct - 0.01);
      } catch(eSeek) {}
      try {
        var p = audio.play();
        if (p && p.catch) p.catch(function(){});
      } catch(eP) {}
      return;
    }
    if (hard){
      try { clearSongPlayUrl(s); } catch(eC) {}
      _wasPlayingBeforeHide = true;
      loadCurrent();
    } else if (_wasPlayingBeforeHide || (audio && !audio.paused)){
      try {

        if (p2 && p2.catch){
          p2.catch(function(){
            try { clearSongPlayUrl(s); loadCurrent(); } catch(eL) {}
          });
        }
      } catch(eP2) {
        try { clearSongPlayUrl(s); loadCurrent(); } catch(eL2) {}
      }
    }
  } catch(e) {}
}
