  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 10%,#000 88%,transparent 100%);}
.lyric-line{
  font-size:18px;line-height:2.1;color:var(--text-2);
  cursor:pointer;padding:6px 8px;text-align:center;font-weight:500;
  transform:scale(1) translateY(0);transform-origin:center center;
  opacity:.72;
  transition:
    color .4s cubic-bezier(0.22,1,0.36,1),
    opacity .4s cubic-bezier(0.22,1,0.36,1),
    font-size .48s cubic-bezier(0.22,1,0.36,1),
    transform .48s cubic-bezier(0.22,1,0.36,1),
    letter-spacing .4s ease,
    font-weight .3s ease;
  will-change:transform,font-size,opacity;
}
.lyric-line:hover{color:var(--text-1);opacity:.9;}
.lyric-line.active{
  color:var(--text-0);font-size:28px;font-weight:700;letter-spacing:-0.3px;
  opacity:1;
  transform:scale(1.04) translateY(0);
}

.lyric-line.is-leaving{
  opacity:.45;
  transform:scale(0.96) translateY(-6px);
}
.lyric-line.is-entering{
  animation:lyricEnter .48s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes lyricEnter{
  from{ opacity:.4; transform:scale(0.94) translateY(10px); }
  to{ opacity:1; transform:scale(1.04) translateY(0); }
}
.lyric-tr{display:block;font-size:13px;color:var(--text-2);margin-top:2px;font-weight:400;}
/* ---- KTV 逐字高亮（需压过 #fullPlayer .lyric-line.active 整行色） ---- */
.lyric-main{display:inline;}
.lyric-word{
  display:inline;
  color:inherit;
  transition:color .08s linear, opacity .08s linear, text-shadow .12s ease;
}
#fullPlayer .lyric-line.active .lyric-word,
.lyric-line.active .lyric-word{
  color:rgba(60,60,67,.28)!important;
  opacity:1!important;
}

.lyric-line.active .lyric-word.sung{
  color:var(--green)!important;
  opacity:1!important;
  text-shadow:0 0 10px rgba(var(--accent-rgb),.3);
}

.lyric-line.active .lyric-word.sung.current{
  color:var(--green)!important;
  font-weight:700!important;
}
/* 整行 KTV 扫光：颜色连续从左流入，避免单字闪烁 */
.lyric-line.active .lyric-main.ktv-sweep,
#fullPlayer .lyric-line.active .lyric-main.ktv-sweep{
  color:transparent!important;
  -webkit-text-fill-color:transparent!important;
  background-image:linear-gradient(
    90deg,
    var(--green) 0%,
    var(--green) var(--ktv-fill, 0%),
    rgba(60,60,67,.28) var(--ktv-fill, 0%),
    rgba(60,60,67,.28) 100%
  );
  -webkit-background-clip:text!important;
  background-clip:text!important;
}
html[data-mode="dark"] .lyric-line.active .lyric-main.ktv-sweep,
html[data-mode="dark"] #fullPlayer .lyric-line.active .lyric-main.ktv-sweep{
  background-image:linear-gradient(
    90deg,
    var(--green) 0%,
    var(--green) var(--ktv-fill, 0%),
    rgba(235,235,245,.26) var(--ktv-fill, 0%),
    rgba(235,235,245,.26) 100%
  );
}
.lyric-line:not(.active) .lyric-main.ktv-sweep{
  color:inherit!important;
  -webkit-text-fill-color:inherit!important;
  background-image:none!important;
  -webkit-background-clip:border-box!important;
  background-clip:border-box!important;
}
.lyric-line.active .lyric-word{
  /* 颜色由父级扫光控制，避免子级闪烁 */
  transition:none!important;
  color:inherit!important;
  -webkit-text-fill-color:inherit!important;
  background:none!important;
}

html[data-mode="dark"] .lyric-line.active .lyric-word{

}

html[data-mode="dark"] .lyric-line.active .lyric-word.sung{
  color:var(--green)!important;

}

/* 官方封面上的轻渐变遮罩，避免刺眼并统一观感 */
.channel-avatar.has-cover::after{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,.12) 0%, transparent 42%, rgba(0,0,0,.22) 100%);
  border-radius:inherit;
}
/* 有官方封面时先藏设计底，加载失败再由 onerror 显示 */
.channel-avatar.has-cover .ch-art{display:none;}
/* 无官方图时的设计底：多层光斑 + 大字 */
.channel-avatar .ch-art{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:1;overflow:hidden;
}
.channel-avatar .ch-art::before{
  content:"";position:absolute;width:140%;height:140%;left:-20%;top:-30%;
  background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.28) 0%, transparent 48%),
             radial-gradient(circle at 80% 75%, rgba(0,0,0,.22) 0%, transparent 50%);
  pointer-events:none;
}
.channel-avatar .ch-art-mark{
  position:relative;z-index:2;
  font-size:28px;font-weight:800;letter-spacing:-0.5px;line-height:1;
  color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.28);
  opacity:.95;
}
.channel-avatar .ch-art-sub{
  position:relative;z-index:2;margin-top:6px;
  font-size:10px;font-weight:600;letter-spacing:.12em;
  color:rgba(255,255,255,.72);text-transform:uppercase;
}
.channel-avatar .ch-art-ring{
  position:absolute;right:-18%;bottom:-18%;width:62%;aspect-ratio:1;border-radius:50%;
  border:2px solid rgba(255,255,255,.14);pointer-events:none;z-index:1;
}
.channel-avatar .ch-art-ring2{
  position:absolute;left:-22%;top:-22%;width:55%;aspect-ratio:1;border-radius:50%;
  background:rgba(255,255,255,.08);pointer-events:none;z-index:0;
}
.channel-name{
  font-size:13px;color:var(--text-0);margin-top:9px;line-height:1.35;
  width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;
  transition:color .2s;text-align:center;letter-spacing:-0.1px;
}
/* 正在播放高亮 */
.channel-item.is-playing .channel-avatar{
  border-color:rgba(var(--accent-rgb),.55);
  box-shadow:0 0 0 2px var(--green), 0 10px 28px rgba(0,0,0,.35);
}
.channel-item.is-playing .channel-name{
  color:var(--green);font-weight:700;
}
.channel-item.is-playing .channel-avatar .ch-playing{
  position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;
  background:var(--green);box-shadow:0 2px 10px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;z-index:3;
}
.channel-item.is-playing .channel-avatar .ch-playing svg{
  width:12px;height:12px;color:#fff;margin-left:1px;
}
html[data-mode="dark"] .channel-item.is-playing .channel-avatar{
  border-color:rgba(255,255,255,.4);
  box-shadow:0 0 0 2px #fff, 0 10px 28px rgba(0,0,0,.45);
}
html[data-mode="dark"] .channel-item.is-playing .channel-name{color:#fff;}
html[data-mode="dark"] .channel-item.is-playing .channel-avatar .ch-playing{
  background:#fff;
}
html[data-mode="dark"] .channel-item.is-playing .channel-avatar .ch-playing svg{color:#111;}
@media (max-width:860px){
  .channel-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;}
  .channel-avatar{border-radius:14px;}
  .channel-name{font-size:12px;margin-top:7px;}
  .channel-tab{padding:4px 10px;font-size:13px;}
  .channel-sec-head{gap:8px;}
  .channel-avatar .ch-art-mark{font-size:24px;}
  .channel-item.is-playing .channel-avatar .ch-playing{width:24px;height:24px;right:6px;bottom:6px;}
  .channel-item.is-playing .channel-avatar .ch-playing svg{width:11px;height:11px;}
}
@media (min-width:861px){
  .channel-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:18px 14px;}
  .channel-avatar{border-radius:18px;}
  .channel-name{font-size:13px;}
  .channel-avatar .ch-art-mark{font-size:30px;}
}
html.tv-mode .channel-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px;}
html.tv-mode .channel-avatar{border-radius:20px;}
html.tv-mode .channel-name{font-size:15px;}

/* ============================================================
   SEARCH OVERLAY
   ============================================================ */
.sr-tabs,#srTabs{display:flex;gap:10px;margin:10px 0 14px;flex-wrap:nowrap;overflow-x:auto;align-items:center;}
.sr-tab{padding:7px 14px;border-radius:10px;font-size:13px;color:var(--text-1);background:rgba(118,118,128,0.16);
  white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;line-height:1.2;
  writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;font-weight:500;margin:0 2px;}
.sr-tab.active{background:rgba(255,255,255,0.14);color:var(--text-0);font-weight:600;}
/* 音源切换：更大分段控件 + Apple 风格滑动指示器 */
#sourceTabs.sr-tabs{
  position:relative;
  display:flex;flex-wrap:nowrap;gap:0;align-items:center;justify-content:center;
  margin:14px auto 22px;padding:4px;width:fit-content;max-width:calc(100% - 24px);
  overflow:visible;
  background:rgba(118,118,128,0.22);border:none;border-radius:980px;
  backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);
  box-shadow:0 1px 0 rgba(255,255,255,0.06) inset, 0 4px 16px rgba(0,0,0,0.12);
}
#sourceTabs .sr-indicator{
  position:absolute;top:4px;bottom:4px;left:0;
  width:0;border-radius:980px;background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.22), 0 1px 0 rgba(255,255,255,.55) inset;
  pointer-events:none;z-index:0;
  /* 参考 av 切站源：带轻微过冲的弹性曲线 */
  transition:transform .34s cubic-bezier(.34,1.4,.5,1), width .34s cubic-bezier(.34,1.4,.5,1);
  will-change:transform,width;
}
#sourceTabs .sr-tab,#sourceTabs .sr-tab[data-src]{
  position:relative;z-index:1;
  padding:10px 18px;margin:0;border-radius:980px;font-size:14.5px;font-weight:600;
  color:rgba(235,235,245,0.58);background:transparent!important;border:none;
  box-shadow:none!important;
  transition:color .28s ease, transform .28s var(--ease-spring);
  letter-spacing:0.01em;
  min-width:52px;text-align:center;
}
#sourceTabs .sr-tab:active{transform:scale(0.96);}
#sourceTabs .sr-tab.active[data-src],
#sourceTabs .sr-tab.active[data-src="qq"],
#sourceTabs .sr-tab.active[data-src="kuwo"],
#sourceTabs .sr-tab.active[data-src="netease"],
#sourceTabs .sr-tab.active[data-src="kugou"],
#sourceTabs .sr-tab.active[data-src="ytmusic"]{
  color:#111!important;background:transparent!important;border:none;
  box-shadow:none!important;
  font-weight:700;
}
#plTabs.sr-tabs,.hscroll#plTabs{align-items:center;flex-wrap:nowrap;gap:10px;}
#hotTags{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:8px;margin:18px auto 0;max-width:560px;padding:0 8px;
  width:100%;box-sizing:border-box;
}
.hot-search-tag{
  padding:8px 14px;border-radius:12px;font-size:13px;
  background:rgba(118,118,128,0.16);color:var(--text-1);font-weight:500;
  margin:0;flex:0 0 auto;text-align:center;
}

/* ============================================================
   MINE / LOGIN-STATE PAGE
   ============================================================ */
.mine-header{display:flex;align-items:center;gap:14px;padding:16px 4px;}
.mine-avatar{width:74px;height:74px;border-radius:50%;overflow:hidden;background:var(--bg-2);border:2px solid var(--glass-border);flex-shrink:0;}
.mine-avatar img{width:100%;height:100%;object-fit:cover;}
.mine-name{font-size:19px;font-weight:700;line-height:1.3;}
.mine-uin{font-size:12px;color:var(--text-2);margin-top:4px;line-height:1.4;}
.detail-header{display:flex;align-items:center;gap:14px;padding:10px 2px 6px;}
.detail-cover{width:88px;height:88px;border-radius:14px;overflow:hidden;flex-shrink:0;background:var(--bg-2);}
.detail-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.detail-meta{flex:1;min-width:0;}
.detail-title{font-size:17px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.detail-sub{font-size:11.5px;color:var(--text-2);margin-top:4px;line-height:1.4;}
.detail-desc{font-size:11.5px;color:var(--text-2);margin-top:6px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.detail-play-all{flex-shrink:0;padding:9px 14px;font-size:12.5px;}
.mine-vip{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:linear-gradient(90deg,#ffd60a,#ff9f0a);color:#1c1200;
  padding:3px 10px;border-radius:100px;margin-top:6px;font-weight:700;}
.mine-logout{margin-left:auto;font-size:12px;color:var(--text-2);padding:8px 16px;border-radius:100px;background:var(--glass);}
/* 自建 / 收藏歌单并排切换（对齐官方「自建歌单 | 收藏歌单」） */

.mine-pl-tab{font-size:16px;font-weight:600;color:var(--text-2);padding:4px 2px;cursor:pointer;transition:color .2s var(--ease);line-height:1.3;background:none;border:none;}
.mine-pl-tab.active{color:var(--text-0);font-weight:700;}
.mine-pl-tab:active{opacity:.75;}
.mine-pl-sep{font-size:14px;color:var(--text-2);margin:0 10px;opacity:.55;font-weight:400;pointer-events:none;}
.mine-pl-pane{display:none;}
.mine-pl-pane.active{display:grid;}

/* ============================================================
   TOAST / MODAL
   ============================================================ */
#toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,20px);z-index:99;padding:12px 22px;
  border-radius:14px;background:rgba(44,44,46,.94);backdrop-filter:blur(20px) saturate(1.4);font-size:14px;
  opacity:0;pointer-events:none;transition:transform .5s var(--ease-spring),opacity .3s var(--ease);border:1px solid rgba(255,255,255,.08);
  box-shadow:0 8px 30px rgba(0,0,0,.4);font-weight:500;}
#toast.show{opacity:1;transform:translate(-50%,0);}

.sheet-mask{position:fixed;inset:0;z-index:38;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;}
.sheet-mask.show{opacity:1;pointer-events:auto;}

   TV MODE
   ============================================================ */

/* ---------- 首页下拉刷新 ---------- */
.home-ptr{
  position:absolute;left:0;right:0;top:0;height:0;overflow:visible;
  display:flex;align-items:flex-end;justify-content:center;
  pointer-events:none;z-index:5;
}
.home-ptr-inner{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:0 0 10px;min-height:0;
  color:var(--text-2);font-size:13px;font-weight:500;
  opacity:0;transform:translateY(-8px);
  transition:opacity .15s ease;
}
.home-ptr.show .home-ptr-inner{opacity:1;transform:translateY(0);}
.home-ptr.ready .home-ptr-inner{color:var(--text-0);}
.home-ptr.loading .home-ptr-inner{opacity:1;}
.home-ptr-spinner{
  width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(128,128,128,.25);
  border-top-color:var(--text-0, #111);
  box-sizing:border-box;
  opacity:0;
}
.home-ptr.loading .home-ptr-spinner{
  opacity:1;
  animation:homePtrSpin .7s linear infinite;
}
@keyframes homePtrSpin{to{transform:rotate(360deg);}}
#view-home.ptr-pulling{overflow-y:hidden;}

(function(){
  try{
    var raw = localStorage.getItem("qqm_user");
    if (raw && raw !== "null" && raw !== "{}"){
      var u = JSON.parse(raw);
      if (u && (u.uin || u.cookie)) document.documentElement.classList.add("qqm-authed");
    }
  }catch(e){}
  /* 默认跳过登录闪屏，直接进主页；需要登录时再点头像打开 */
  try{
    document.documentElement.classList.add("qqm-authed");
    if (localStorage.getItem("qqm_skip_login") !== "1") {
      localStorage.setItem("qqm_skip_login", "1");
    }
  }catch(e2){}
})();

<script>
(function(){
"use strict";

/* ============================================================
   § 0. 网络适配层 —— fm.req 桥接
   ------------------------------------------------------------
   与 solene / pinglian 项目保持一致的约定：原生环境下用
   fm.req 发起跨域请求（绕过 WebView CORS 限制，且原生端会
   保留域内 Cookie，QR/Cookie 登录都依赖这一点）。
   如果你在其它项目里 fm.req 的实际签名与这里不同，
   只需要改 ADAPTER 这一处，其余业务代码不用动。
   ============================================================ */
var _jsonpSeq = 0;

/** 是否处于 Fongmi/WebHome 原生环境（运行时检测，不要在脚本顶层写死） */
function isNativeFm(){
  return !!(window.fm && typeof window.fm.req === "function");
}

/** 等待 SDK 注入（Native 在 onPageFinished 后注入并派发 fmsdk） */
function whenFm(timeoutMs){
  if (isNativeFm()) return Promise.resolve(window.fm);
  return new Promise(function(resolve){
    var done = false;
    function finish(v){
      if (done) return;
      done = true;
      resolve(v || window.fm || null);
    }
    try{
      window.addEventListener("fmsdk", function(){ finish(window.fm); }, { once: true });
    }catch(e){
      window.addEventListener("fmsdk", function(){ finish(window.fm); });
    }
    var n = 0, max = Math.ceil((timeoutMs || 4000) / 50);
    var timer = setInterval(function(){
      n++;
      if (isNativeFm()){ clearInterval(timer); finish(window.fm); }
      else if (n >= max){ clearInterval(timer); finish(null); }
    }, 50);
  });
}

/** 把 fm.req 返回值统一成「响应文本字符串」——官方返回 { ok, status, body } */
function unwrapFmResponse(res){
  if (res == null) return "";
  if (typeof res === "object"){
    if (res.body != null){
      if (typeof res.body === "string") return res.body;
      try{ return JSON.stringify(res.body); }catch(e){ return String(res.body); }
    }
    if (res.error) return "";
    try{ return JSON.stringify(res); }catch(e){ return ""; }
  }
  if (typeof res === "string") return res;
  return String(res);
}

/** JSONP 请求：浏览器预览兜底 */
function jsonpRequest(url, timeoutMs){
  return new Promise(function(resolve, reject){
    var cb = "__qqm_jp_" + (++_jsonpSeq) + "_" + Date.now();
    var timer = setTimeout(function(){
      cleanup();
      reject(new Error("jsonp timeout"));
    }, timeoutMs || 12000);
    function cleanup(){
      clearTimeout(timer);
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      if (script && script.parentNode) script.parentNode.removeChild(script);
    }
    window[cb] = function(data){
      cleanup();
      try{
        resolve(typeof data === "string" ? data : JSON.stringify(data));
      }catch(e){ resolve(String(data)); }
    };
    var sep = url.indexOf("?") >= 0 ? "&" : "?";
    var finalUrl = url;
    if (/([?&])(callback|jsonpCallback)=/.test(finalUrl)){
      finalUrl = finalUrl.replace(/([?&])(callback|jsonpCallback)=[^&]*/g, "$1$2=" + cb);
    } else {
      finalUrl = finalUrl + sep + "callback=" + cb + "&jsonpCallback=" + cb;
    }
    finalUrl = finalUrl.replace(/([?&])format=json\b/g, "$1format=jsonp");
    var script = document.createElement("script");
    script.async = true;
    script.src = finalUrl;
    script.onerror = function(){
      cleanup();
      reject(new Error("jsonp script error"));
    };
    (document.head || document.documentElement).appendChild(script);
  });
}

/**
 * 统一网络请求：
 * 1) App 内：fm.req（官方返回 {ok,status,body}，这里解包成文本）
 * 2) 浏览器：JSONP / fetch 兜底
 */
function ADAPTER_request(url, opts){
  opts = opts || {};
  var method = (opts.method || "GET").toUpperCase();
  var headers = opts.headers || {};
  var body = opts.body;
  if (body != null && typeof body !== "string"){
    try{ body = JSON.stringify(body); }catch(e){ body = String(body); }
  }

  if (isNativeFm()){
    var reqOpts = {
      method: method,
      headers: headers,
      body: body || "",
      responseType: "text",
      timeout: opts.timeout || 30,
      credentials: opts.credentials || "include"
    };
    return Promise.resolve()
      .then(function(){ return window.fm.req(url, reqOpts); })
      .then(function(res){
        var text = unwrapFmResponse(res);
        if (res && typeof res === "object" && res.ok === false && !text){
          console.warn("[adapter] fm.req not ok", res.status, res.error || "", url);
        }
        return text;
      })
      .catch(function(e){
        console.warn("[adapter] fm.req failed", e, url);
        return "";
      });
  }

  try{
    var jpUrl = url;
    if (method === "POST" && body && /u\.y\.qq\.com\/cgi-bin\/musicu\.fcg/i.test(url)){
      var sep = url.indexOf("?") >= 0 ? "&" : "?";
      jpUrl = url + sep + "data=" + encodeURIComponent(body);
      if (jpUrl.indexOf("format=") < 0) jpUrl += "&format=jsonp&inCharset=utf8&outCharset=utf-8&platform=yqq.json&needNewCode=0";
    } else if (method === "POST"){
      return fetch(url, { method: method, headers: headers, body: body, mode:"cors", credentials:"omit" })
        .then(function(r){ return r.text(); })
        .catch(function(){ return ""; });
    }
    return jsonpRequest(jpUrl).catch(function(err){
      console.warn("[adapter] JSONP failed, try fetch", err);
      return fetch(url, { method: method === "POST" ? "POST" : "GET", headers: headers, body: method === "POST" ? body : undefined, mode:"cors", credentials:"omit" })
        .then(function(r){ return r.text(); })
        .catch(function(){ return ""; });
    });
  }catch(e){
    console.warn("[adapter] request error", e);
    return Promise.resolve("");
  }
}

/** 原生播放已关闭：统一走页面 <audio>，避免跳进 fm 播放器 */
function nativePlay(url, headers, title){
  return false;
}

/** 浏览器可播地址：HTTPS 页面禁止 http 音源（混合内容会被静默拦截） */
function safePlaySrc(url){
  if (!url) return url;
  var u = String(url);
  try {
    if (typeof location !== "undefined" && location.protocol === "https:" && /^http:\/\//i.test(u)){
      // 优先升级为 https；部分长青节点仅 http，升级失败时由上层换源
      u = u.replace(/^http:/i, "https:");
    }
  } catch(e) {}
  return u;
}
/** 当前是否为纯浏览器（无 fm 壳） */
function isBrowserOnly(){
  try { return !isNativeFm(); } catch(e) { return true; }
}

/** 图片资源：App 内走 fm.res 网关 */
function mediaUrl(url, headers){
  if (!url) return "";
  url = String(url).trim();
  if (url.indexOf("//") === 0) url = "https:" + url;
  url = url.replace(/^http:/, "https:");
  try{
    if (window.fm && typeof window.fm.res === "function"){
      var r = window.fm.res(url, {
        headers: headers || { "Referer": "https://y.qq.com/" },
        credentials: "include"
      });
      // fm.res 异常时可能返回 null/undefined，必须回退原链，否则全站裂图
      if (r) return r;
    }
  }catch(e){}
  return url;
}

function storeGet(key, def){
  try{
    var raw = localStorage.getItem("qqm_"+key);
    if (raw === null) return def;
    return JSON.parse(raw);
  }catch(e){ return def; }
}
function storeSet(key, val){
  var s = JSON.stringify(val);
  try{ localStorage.setItem("qqm_"+key, s); }catch(e){}
}

/** 听书最近收听（专辑维度，本地持久化） */
var RECENT_VOICE_MAX = 40;
function getRecentVoiceList(){
  try {
    var list = storeGet("recentVoice", []);
    return Array.isArray(list) ? list : [];
  } catch(e) { return []; }
}
function setRecentVoiceList(list){
  try { storeSet("recentVoice", (list || []).slice(0, RECENT_VOICE_MAX)); } catch(e) {}
}
function isVoicePlaybackSong(s){
  if (!s) return false;
  if (s.isDjProgram || s.source === "ximalaya") return true;
  var tag = String(state.queueTag || "");
  if (tag.indexOf("xm-voice-") === 0 || tag.indexOf("ne-voice-") === 0) return true;
  var mid = String(s.songmid || "");
  if (mid.indexOf("xm_") === 0) return true;
  return false;
}
/** 写入/更新最近听书；同一专辑挪到最前 */
function recordRecentVoiceBook(song, extra){
  if (!isVoicePlaybackSong(song)) return;
  extra = extra || {};
  var tag = String(state.queueTag || "");
  var source = song.source || (tag.indexOf("xm-voice-") === 0 ? "ximalaya" : (tag.indexOf("ne-voice-") === 0 ? "netease" : ""));
  if (!source) source = "ximalaya";
  var albumId = "";
  var xmAlbumId = song.xmAlbumId || "";
  if (tag.indexOf("xm-voice-") === 0){
    albumId = tag;
    xmAlbumId = xmAlbumId || tag.slice("xm-voice-".length);
  } else if (tag.indexOf("ne-voice-") === 0){
    albumId = tag;
  } else if (xmAlbumId){
    albumId = "xm-voice-" + xmAlbumId;
    source = "ximalaya";
  } else if (song.songmid){
    albumId = "track-" + song.songmid;
  } else {
    return;
  }
  var t = 0;
  try { t = (audio && audio.currentTime) || 0; } catch(e0) {}
  if (!(t > 0)) t = +(extra.time || 0) || 0;
  var trackIdx = -1;
  try {
    if (state.queue && state.queueIndex >= 0) trackIdx = state.queueIndex;
  } catch(e1) {}
  var entry = {
    id: albumId,
    source: source,
    xmAlbumId: xmAlbumId || "",
    title: extra.title || song.albumname || song.album || song.singer || "听书",
    cover: extra.cover || song.cover || "",
    dj: extra.dj || song.singer || "",
    trackId: String(song.xmTrackId || ""),
    songmid: String(song.songmid || ""),
    trackName: String(song.name || ""),
    trackIndex: trackIdx,
    time: t > 2 ? t : (extra.time || 0),
    ts: Date.now()
  };
  // 专辑名：优先队列外透传的书名
  if (extra.albumTitle) entry.title = extra.albumTitle;
  var list = getRecentVoiceList().filter(function(x){ return x && x.id && x.id !== entry.id; });
  list.unshift(entry);
  setRecentVoiceList(list);
}
function recentVoiceAsCards(){
  return getRecentVoiceList().map(function(e){
    return {
      id: e.id,
      source: e.source,
      xmAlbumId: e.xmAlbumId || (e.source === "ximalaya" ? String(e.id || "").replace(/^xm-voice-/, "").replace(/^xm_/, "") : ""),
      title: e.title || "听书",
      cover: e.cover || "",
      dj: e.dj || "",
      desc: e.trackName ? ("听到 · " + e.trackName) : "继续收听",
      category: e.trackName ? ("听到 · " + e.trackName) : "继续收听",
      badge: e.source === "ximalaya" ? "喜马" : "网易",
      badgeCls: e.source === "ximalaya" ? "xm" : "free",
      resumeTrackId: e.trackId || "",
      resumeSongmid: e.songmid || "",
      resumeTime: e.time || 0,
      resumeName: e.trackName || "",
      resumeIndex: typeof e.trackIndex === "number" ? e.trackIndex : -1,
      autoPlay: true,
      fromRecent: true
    };
  });
}


/* ============================================================
   § 1. 工具函数
   ============================================================ */
function $(sel, ctx){ return (ctx||document).querySelector(sel); }
function $all(sel, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }
function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec||0));
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function fmtCount(n){
  n = Number(n)||0;
  if (n >= 1e8) return (n/1e8).toFixed(1)+"亿";
  if (n >= 1e4) return (n/1e4).toFixed(1)+"万";
  return String(n);
}
function toast(msg, ms){
  var t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._tm);
  toast._tm = setTimeout(function(){ t.classList.remove("show"); }, ms||2200);
}
function guid(){
  var s = storeGet("device_guid", null);
  if (s) return s;
  s = String(Math.floor(Math.random()*9000000000)+1000000000);
  storeSet("device_guid", s);
  return s;
}
function debounce(fn, ms){
  var tm;
  return function(){
    var args = arguments, ctx = this;
    clearTimeout(tm);
    tm = setTimeout(function(){ fn.apply(ctx, args); }, ms);
  };

function jsonp_safeParse(txt){

  // type: album(专辑) / singer(歌手) / playlist(歌单封面走接口自带url)

  if (mid.indexOf("http") === 0) return mid.replace(/^http:/, "https:");

  if (/^T00[12]R/i.test(mid)) return "https://y.gtimg.cn/music/photo_new/"+mid+(mid.indexOf(".jpg")>-1?"":".jpg");

var API = {};

/* kugou · 酷狗（搜索走酷狗接口，取流走洛雪 kg） */
API.kugouSearch = function(kw, page){
  kw = (kw || "").trim();
  page = page || 1;
  if (!kw) return Promise.resolve({ list: [], singers: [] });
  var hdr = {
    "User-Agent": "Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 Chrome/122.0.0.0 Mobile Safari/537.36",
    "Referer": "https://www.kugou.com/",
    "Accept": "application/json, text/plain, */*"
  };
  var songUrl = "https://mobilecdn.kugou.com/api/v3/search/song?format=json&keyword=" +
    encodeURIComponent(kw) + "&page=" + page + "&pagesize=20&showtype=1";
  var songUrl2 = "https://songsearch.kugou.com/song_search_v2?keyword=" +
    encodeURIComponent(kw) + "&page=" + page + "&pagesize=20&userid=-1&clientver=&platform=WebFilter&filter=2&iscorrection=1&privilege_filter=0";
  var artistUrl = "https://mobilecdn.kugou.com/api/v3/search/singer?format=json&keyword=" +
    encodeURIComponent(kw) + "&page=1&pagesize=12";

  function mapSong(it){
    if (!it) return null;
    var hash = it.FileHash || it.filehash || it.HQFileHash || it.hash || it.Hash || "";
    var name = it.SongName || it.songname || it.songName || it.name || "";
    // 去掉热词高亮
    name = String(name).replace(/<[^>]+>/g, "");
    var singer = it.SingerName || it.singername || it.singerName || it.choricSinger || it.singer || "";
    singer = String(singer).replace(/<[^>]+>/g, "");
    var album = it.AlbumName || it.album_name || it.albumName || "";
    album = String(album).replace(/<[^>]+>/g, "");
    var dur = Number(it.Duration || it.duration || it.timeLength || 0) || 0;
    if (dur > 10000) dur = Math.round(dur / 1000);
    var img = it.img || it.Image || it.album_img || it.trans_param && it.trans_param.union_cover || "";
    if (img){
      img = String(img).replace(/\{size\}/g, "240").replace(/^http:/, "https:");
    }
    if (!hash || !name) return null;
    return {
      songmid: "kg_" + hash,
      media_mid: hash,
      hash: hash,
      kgHash: hash,
      name: name,
      singer: singer || "酷狗",
      albumname: album,
      cover: fixCover(img),
      interval: dur,
      isVip: false,
      playUrl: "",
      source: "kugou"
    };
  }

  function fetchSongs(){
    return ADAPTER_request(songUrl, { headers: hdr, timeout: 12, credentials: "omit" }).then(function(txt){
      var d = jsonp_safeParse(txt);
      var list = (d && d.data && (d.data.info || d.data.lists || d.data.list)) || [];
      var out = (list || []).map(mapSong).filter(Boolean);
      if (out.length) return out;
      return ADAPTER_request(songUrl2, { headers: hdr, timeout: 12, credentials: "omit" }).then(function(txt2){
        var d2 = jsonp_safeParse(txt2);
        var list2 = (d2 && d2.data && (d2.data.lists || d2.data.list || d2.data.info)) || [];
        return (list2 || []).map(mapSong).filter(Boolean);
      });
    }).catch(function(){
      return ADAPTER_request(songUrl2, { headers: hdr, timeout: 12, credentials: "omit" }).then(function(txt2){
        var d2 = jsonp_safeParse(txt2);
        var list2 = (d2 && d2.data && (d2.data.lists || d2.data.list || d2.data.info)) || [];
        return (list2 || []).map(mapSong).filter(Boolean);
      }).catch(function(){ return []; });
    });
  }

  function fetchArtists(){
    return ADAPTER_request(artistUrl, { headers: hdr, timeout: 10, credentials: "omit" }).then(function(txt){
      var d = jsonp_safeParse(txt);
      var list = (d && d.data && (d.data.info || d.data.list)) || [];
      return (list || []).map(function(it){
        var name = it.singername || it.SingerName || it.name || "";
        name = String(name).replace(/<[^>]+>/g, "");
        var id = it.singerid || it.SingerId || it.id || name;
        var pic = it.imgurl || it.image || it.img || "";
        if (pic) pic = String(pic).replace(/\{size\}/g, "240").replace(/^http:/, "https:");
        if (!name) return null;
        return { mid: "kg_ar_" + id, name: name, cover: fixCover(pic), source: "kugou" };
      }).filter(Boolean);
    }).catch(function(){ return []; });
  }

  function singersFromSongs(songs){
    var seen = {}, out = [];
    (songs || []).forEach(function(s){
      var n = ((s.singer || "").split(/[\/、,&]/)[0] || "").trim();
      if (!n || seen[n]) return;
      seen[n] = 1;
      out.push({ mid: "kg_ar_" + n, name: n, cover: s.cover || "", source: "kugou", fromSong: true });
    });
    return out;
  }

  return Promise.all([fetchSongs(), fetchArtists()]).then(function(arr){
    var list = arr[0] || [];
    var singers = arr[1] || [];
    if (singers.length < 3){
      var extra = singersFromSongs(list);
      var seen = {};
      singers.forEach(function(a){ if (a.name) seen[a.name] = 1; });
      extra.forEach(function(a){ if (!seen[a.name]){ seen[a.name] = 1; singers.push(a); } });
    }
    return { list: list, singers: singers.slice(0, 12) };
  }).catch(function(){ return { list: [], singers: [] }; });
}

API.kugouLyric = function(song){
  // 酷狗官方歌词：lyrics.kugou.com/search → download(fmt=lrc) → 失败再按歌名走 QQ
  var hash = String((song && (song.hash || song.kgHash)) || "").replace(/^kg_/i, "").trim();
  var name = (song && song.name) || "";
  var singer = (song && song.singer) || "";
  var durMs = 0;
  try {
    var sec = Number(song && song.interval) || 0;
    if (sec > 0) durMs = Math.round(sec * 1000);
  } catch(eD) {}
  var hdr = {
    "User-Agent": QQ_HEADERS["User-Agent"],
    "Referer": "https://www.kugou.com/",
    "Accept": "application/json, text/plain, */*"
  };

  function decodeKgContent(content){
    if (!content) return "";
    var raw = String(content);
    // 官方 download fmt=lrc 时 content 多为 base64
    if (raw.indexOf("[") === -1){
      try {
        var bin = atob(raw);
        try { raw = decodeURIComponent(escape(bin)); }
        catch(e1){ raw = bin; }
      } catch(e2) {}
    }
    return String(raw || "").trim();
  }

  function downloadById(id, accesskey){
    if (!id || !accesskey) return Promise.resolve("");
    var url = "https://lyrics.kugou.com/download?ver=1&client=pc&id=" +
      encodeURIComponent(id) + "&accesskey=" + encodeURIComponent(accesskey) +
      "&fmt=lrc&charset=utf8";
    return ADAPTER_request(url, { headers: hdr, timeout: 12, credentials: "omit" }).then(function(txt){
      var d = jsonp_safeParse(txt);
      var content = (d && (d.content || d.lyric || d.lrc)) || "";
      return decodeKgContent(content);
    }).catch(function(){ return ""; });
  }

  function pickCandidate(d){
    var cands = (d && d.candidates) || (d && d.data && d.data.candidates) || [];
    if (!cands.length) return null;
    return cands[0];
  }

  function searchByHash(){
    if (!hash) return Promise.resolve(null);
    var url = "https://lyrics.kugou.com/search?ver=1&man=yes&client=pc&hash=" +
      encodeURIComponent(hash);
    return ADAPTER_request(url, { headers: hdr, timeout: 12, credentials: "omit" }).then(function(txt){
      return pickCandidate(jsonp_safeParse(txt));
    }).catch(function(){ return null; });
  }

  function searchByKeyword(){
    var kw = (name + (singer ? (" - " + ((singer.split(/[\/、,&]/)[0] || "").trim())) : "")).trim();
    if (!kw) return Promise.resolve(null);
    var url = "https://lyrics.kugou.com/search?ver=1&man=yes&client=pc&keyword=" +
      encodeURIComponent(kw) + (durMs ? ("&duration=" + durMs) : "");
    return ADAPTER_request(url, { headers: hdr, timeout: 12, credentials: "omit" }).then(function(txt){
      return pickCandidate(jsonp_safeParse(txt));
    }).catch(function(){ return null; });
  }

  return searchByHash().then(function(c){
    if (c && c.id && c.accesskey) return downloadById(c.id, c.accesskey);
    return searchByKeyword().then(function(c2){
      if (c2 && c2.id && c2.accesskey) return downloadById(c2.id, c2.accesskey);
      return "";
    });
  }).then(function(lrc){
    if (lrc && lrc.replace(/\s+/g, "").length > 4) return { lyric: lrc, trans: "" };
    // 兜底：按歌名匹配 QQ 歌词
    if (typeof API.lyricByMeta === "function" && name){
      return API.lyricByMeta(name, singer);
    }
    return { lyric: "", trans: "" };
  }).catch(function(){
    if (typeof API.lyricByMeta === "function" && name) return API.lyricByMeta(name, singer);
    return { lyric: "", trans: "" };
  });
};

/** 酷我歌词：优先 songinfoandlrc（带时间轴），失败再试 lyric 文本接口 */
API.kuwoLyric = function(song){
  var rid = (song && (song.rid || String(song.songmid || "").replace(/^kw_/, ""))) || "";
  rid = String(rid).replace(/^MUSIC_/i, "").trim();
  if (!rid) return Promise.resolve({ lyric: "", trans: "" });

  function lrclistToLrc(list){
    if (!list || !list.length) return "";
    var lines = [];
    for (var i = 0; i < list.length; i++){
      var it = list[i] || {};
      var text = String(it.lineLyric || it.line_lyric || it.lyric || it.text || "").trim();
      if (!text || text === "null") continue;
      var t = parseFloat(it.time != null ? it.time : (it.startTime != null ? it.startTime : 0));
      if (isNaN(t)) t = 0;
      // 酷我 time 多为秒（可带小数）；偶发毫秒
      if (t > 10000) t = t / 1000;
      var m = Math.floor(t / 60);
      var s = t - m * 60;
      var ss = s.toFixed(2);
      if (ss.length < 5) ss = (s < 10 ? "0" : "") + ss;
      var mm = (m < 10 ? "0" : "") + m;
      lines.push("[" + mm + ":" + ss + "]" + text);
    }
    return lines.join("\n");
  }

  function extractLrc(txt){
    if (!txt) return "";
    var d = _parseKuwoBody(txt);
    if (!d) {
      // 纯 LRC 文本
      if (String(txt).indexOf("[") !== -1 && /\[\d{1,2}:\d{2}/.test(txt)) return String(txt);
      return "";
    }
    // songinfoandlrc
    var data = d.data || d;
    if (data && data.lrclist && data.lrclist.length){
      return lrclistToLrc(data.lrclist);
    }
    if (data && data.lrc && data.lrc.list){
      return lrclistToLrc(data.lrc.list);
    }
    // 直接字符串字段
    var raw = (data && (data.lyric || data.lrc || data.lrcContent || data.lyricContent)) ||
              d.lyric || d.lrc || "";
    if (typeof raw === "string" && raw.trim()) return raw.trim();
    if (Array.isArray(raw)) return lrclistToLrc(raw);
    return "";
  }

  var urls = [

API.kuwoSearch = function(kw, page){

  }

    return ADAPTER_request(artistUrl, { headers: hdr, timeout: 10, credentials: "omit" }).then(function(txt){
      var d = _parseKuwoBody(txt);

        var pic = it.hts_PIC || it.PIC || it.pic || it.img || it.image || "";

        };
      }).filter(Boolean);
    }).catch(function(){ return []; });

    var seen = {}, out = [];
    (songs || []).forEach(function(s){
      var n = ((s.singer || "").split(/[\/、,&]/)[0] || "").trim();
      if (!n || seen[n]) return;
      seen[n] = 1;
      out.push({ mid: "kw_ar_" + n, name: n, cover: s.cover || "", source: "kuwo", fromSong: true });
    });
    return out;

    trySongs(songUrls[0]).then(function(list){

      return trySongs(songUrls[1]);
    }),
    fetchArtists()
  ]).then(function(arr){

    if (singers.length < 3){
      var extra = singersFromSongs(list);
      var seen = {};
      singers.forEach(function(a){ if (a.name) seen[a.name] = 1; });
      extra.forEach(function(a){ if (!seen[a.name]){ seen[a.name] = 1; singers.push(a); } });
    }
    return { list: list, singers: singers.slice(0, 12) };
  }).catch(function(){ return { list: [], singers: [] }; });
};
API.kuwoUrl = function(song){
  var rid = (song && (song.rid || String(song.songmid || "").replace(/^kw_/, ""))) || "";
  if (!rid) return Promise.resolve(null);
  rid = String(rid).replace(/^MUSIC_/i, "");

  function norm(u){
    if (!u || typeof u !== "string") return null;
    u = u.trim().replace(/^["']|["']$/g, "");
    if (u.indexOf("http") !== 0) return null;
    u = u.replace(/^http:/, "https:");
    // 仅过滤明确的提示音文件，避免误杀
    if (/588957081\.mp3|M5000004Gmy54cGDqK/i.test(u)) return null;
    if (/kuwo\.cn\/(download|app\/download)/i.test(u)) return null;
    return u;
  }
  function req(url){
    return ADAPTER_request(url, {
      headers: {
        "User-Agent": QQ_HEADERS["User-Agent"],
        "Referer": "https://www.kuwo.cn/",
        "Accept": "*/*"
      },
      timeout: 14,
      credentials: "omit"
    });
  }
  function pick(txt){
    if (!txt) return null;
    txt = String(txt).trim();
    // 纯链接
    var n = norm(txt);
    if (n) return n;
    // JSON
    var d = _parseKuwoBody(txt);
    if (d){
      var data = d.data || d;
      // 提示音：bitrate=1 且很短
      if (data && Number(data.bitrate) === 1 && Number(data.duration || 0) > 0 && Number(data.duration) < 20){
        return null;
      }
      var u = (data && data.url) || d.url || "";
      if (!u && d.mp3base && d.mp3url) u = String(d.mp3base) + String(d.mp3url);
      n = norm(u);
      if (n) return n;
    }
    // 文本中抽链接
    var m = /https?:\/\/[^\s"'<>]+/i.exec(txt);
    return m ? norm(m[0]) : null;
  }

  var endpoints = [
    "https://antiserver.kuwo.cn/anti.s?type=convert_url&rid=MUSIC_" + encodeURIComponent(rid) + "&format=mp3&response=url",
    "https://antiserver.kuwo.cn/anti.s?type=convert_url&rid=" + encodeURIComponent(rid) + "&format=mp3&response=url",
    "https://mobi.kuwo.cn/mobi.s?f=web&type=convert_url_with_sign&rid=" + encodeURIComponent(rid) + "&format=mp3",
    "https://mobi.kuwo.cn/mobi.s?f=web&type=convert_url_with_sign&source=jiakong&rid=" + encodeURIComponent(rid) + "&format=mp3&br=128kmp3",
    "https://nmobi.kuwo.cn/mobi.s?f=web&type=convert_url_with_sign&source=jiakong&rid=" + encodeURIComponent(rid) + "&format=mp3&br=128kmp3"
  ];

  var chain = Promise.resolve(null);
  endpoints.forEach(function(ep){
    chain = chain.then(function(got){
      if (got) return got;
      return req(ep).then(pick).catch(function(){ return null; });
    });
  });
  return chain;
};

API.fallbackViaQQ = function(song){
  var name = (song && song.name) || "";
  var singer = (song && song.singer) || "";
  if (!name) return Promise.resolve(null);
  var kw = (name + " " + singer.split(/[\/、,&]/)[0]).trim();
  return API._searchByType(kw, 0, 1, 8).then(function(songRes){
    var list = (((songRes || {}).data || {}).song || {}).list || [];
    if (!list.length) return null;
    var best = null, bestScore = -1;
    list.forEach(function(it){
      var n = normalizeSongFromSearch(it);
      var score = 0;
      if (n.name === name) score += 5;
      else if (n.name && name && n.name.indexOf(name) >= 0) score += 3;
      else if (n.name && name && name.indexOf(n.name) >= 0) score += 2;
      if (singer && n.singer && n.singer.indexOf(singer.split(/[\/、]/)[0]) >= 0) score += 3;
      if (score > bestScore){ bestScore = score; best = n; }
    });
    if (!best || bestScore < 2) best = normalizeSongFromSearch(list[0]);
    if (!best || !best.songmid) return null;
    return API.songUrl(best).then(function(url){
      if (url) return url;
      return null;
    });
  }).catch(function(){ return null; });
};

  function fromInnertube(){

      };
    }
    return _ytmPost("search", { query: kw }, "web").then(function(d){

      if (p.list.length || p.singers.length) return p;

  function fromYoutubeWeb(){
    // 普通 YouTube 搜索兜底（结构不同）
    var url = "https://www.youtube.com/youtubei/v1/search?prettyPrint=false&key=" + encodeURIComponent(YTM_KEY);
    var body = JSON.stringify({
      context: { client: { clientName: "WEB", clientVersion: "2.20250312.00.00", hl: "en", gl: "US" } },
      query: kw
    });
    return ADAPTER_request(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "User-Agent": YTM_HDR["User-Agent"],
        "Origin": "https://www.youtube.com",
        "Referer": "https://www.youtube.com/"
      },
      body: body,
      timeout: 16,
      credentials: "omit"
    }).then(function(txt){
      if (!txt) return [];
      var d = null;
      try { d = JSON.parse(txt); } catch(e){ d = jsonp_safeParse(txt); }
      if (!d) return [];
      var out = [];
      function walk(node, depth){
        if (!node || depth > 14) return;
        if (Array.isArray(node)){ node.forEach(function(n){ walk(n, depth+1); }); return; }
        if (typeof node !== "object") return;
        var vr = node.videoRenderer || node.playlistVideoRenderer;
        if (vr && vr.videoId){
          var title = _ytmWalkRuns(((vr.title || {}).runs) || []) || (vr.title && vr.title.simpleText) || "";
          var author = "";
          try {
            author = _ytmWalkRuns(((((vr.ownerText || vr.shortBylineText) || {}).runs) || []));
          } catch(e){}
          var dur = 0;
          try {
            var ds = (vr.lengthText && (vr.lengthText.simpleText || _ytmWalkRuns(vr.lengthText.runs || []))) || "";
            dur = _ytmParseDuration(ds);
          } catch(e2){}
          var cover = "";
          try {
            var th = (vr.thumbnail && vr.thumbnail.thumbnails) || [];
            cover = _ytmThumb(th) || ("https://i.ytimg.com/vi/" + vr.videoId + "/hqdefault.jpg");
          } catch(e3){}
          if (title){
            out.push({
              songmid: "yt_" + vr.videoId,
              videoId: vr.videoId,
              media_mid: vr.videoId,
              name: title,
              singer: author || "YouTube",
              albumname: "",
              cover: cover,
              interval: dur,
              isVip: false,
              playUrl: "",
              source: "ytmusic"
            });
          }
        }
        Object.keys(node).forEach(function(k){
          if (k === "videoRenderer" || k === "playlistVideoRenderer") return;
          if (node[k] && typeof node[k] === "object") walk(node[k], depth+1);
        });
      }
      walk(d, 0);
      return _ytmDedup(out);
    }).catch(function(){ return []; });
  }

  function withSingers(list, singers){
    list = list || [];
    singers = singers || [];
    if (singers.length < 3 && list.length){
      var seen = {};
      singers.forEach(function(a){ if (a.name) seen[a.name] = 1; });
      list.forEach(function(s){
        var n = (s.singer || "").split(/[\/、,&]/)[0].trim();
        if (!n || seen[n] || /YouTube/i.test(n)) return;
        seen[n] = 1;
        singers.push({
          mid: "yt_artist_" + n,
          browseId: "",
          name: n,
          cover: s.cover || "",
          source: "ytmusic",
          fromSong: true
        });
      });
    }
    return { list: list.slice(0, 30), total: list.length, singers: singers.slice(0, 12) };
  }

  // 并行：YT Music Innertube + 普通 YouTube 搜索，谁先有结果用谁
  return Promise.all([
    fromInnertube().catch(function(){ return { list: [], singers: [] }; }),
    fromYoutubeWeb().catch(function(){ return []; })
  ]).then(function(arr){
    var pack = arr[0] || { list: [], singers: [] };
    var webList = arr[1] || [];
    var list = (pack.list && pack.list.length) ? pack.list : webList;
    var singers = pack.singers || [];
    // Innertube 有歌手但没歌时，用 web 补歌
    if ((!list || !list.length) && webList.length) list = webList;
    return withSingers(list, singers);
  }).catch(function(){
    return fromYoutubeWeb().then(function(list2){
      return withSingers(list2 || [], []);
    }).catch(function(){ return { list: [], total: 0, singers: [] }; });
  });
};

/** 从 player 响应提取最佳音频直链 */
function _ytmPickAudio(d){
  if (!d) return null;
  var formats = [];
  try {
    var sf = (d.streamingData && d.streamingData.adaptiveFormats) || [];
    var f2 = (d.streamingData && d.streamingData.formats) || [];
    formats = sf.concat(f2);
  } catch(e){}
  var best = null, bestBr = -1;
  formats.forEach(function(f){
    if (!f || !f.url) return;
    var mime = String(f.mimeType || "");
    // 只要纯音频
    if (mime.indexOf("audio/") < 0 && !(f.audioQuality || f.audioSampleRate)) return;
    if (mime.indexOf("video/") >= 0 && !(f.audioQuality)) return;
    var br = Number(f.bitrate || f.averageBitrate || 0);
    if (br > bestBr){ bestBr = br; best = f; }
  });
  if (best && best.url) return String(best.url).replace(/^http:/, "https:");
  // 部分响应只有 signatureCipher，浏览器端难解，跳过
  return null;
}

API.ytmusicUrl = function(song){
  var vid = (song && (song.videoId || String(song.songmid || "").replace(/^yt_/, ""))) || "";
  if (!vid) return Promise.resolve(null);
  // 仅复用仍新鲜的直链（googlevideo 过期极快）
  if (song.playUrl && isPlayUrlFresh(song) &&
      /^https?:\/\//i.test(song.playUrl) &&
      /googlevideo\.com|youtube\.com|piped|invidious|ytimg/i.test(song.playUrl)){
    return Promise.resolve(song.playUrl);
  }

  // 自定义代理：优先（用户自建最稳）
  var base = (state.ytmApi || "").replace(/\/$/, "");
  function fromCustomProxy(){
    if (!base) return Promise.resolve(null);
    var tries = [
      base + (base.indexOf("?") >= 0 ? "&" : "?") + "id=" + encodeURIComponent(vid),
      base + (base.indexOf("?") >= 0 ? "&" : "?") + "v=" + encodeURIComponent(vid),
      base.replace(/\/$/, "") + "/stream/" + encodeURIComponent(vid),
      base.replace(/\/$/, "") + "/streams/" + encodeURIComponent(vid)
    ];
    var chain = Promise.resolve(null);
    tries.forEach(function(u){
      chain = chain.then(function(got){
        if (got) return got;
        return ADAPTER_request(u, { headers: { "User-Agent": QQ_HEADERS["User-Agent"] }, timeout: 14 }).then(function(txt){
          if (!txt) return null;
          if (/^https?:\/\//i.test(String(txt).trim())) return String(txt).trim().replace(/^http:/, "https:");
          var d = null;
          try { d = JSON.parse(txt); } catch(e){ d = jsonp_safeParse(txt); }
          if (!d) return null;
          var url = d.url || d.playUrl || d.music || d.stream || d.audioUrl ||
            (d.data && (d.data.url || d.data.playUrl || d.data.stream)) || "";
          // 部分代理返回 audioStreams 数组
          if (!url && d.audioStreams && d.audioStreams[0]) url = d.audioStreams[0].url;
          return url ? String(url).replace(/^http:/, "https:") : null;
        }).catch(function(){ return null; });
      });
    });
    return chain;
  }

  function pickAudio(d){
    if (!d) return null;
    var status = (d.playabilityStatus && d.playabilityStatus.status) || "";
    if (status && status !== "OK" && status !== "LIVE_STREAM_OFFLINE"){
      // UNPLAYABLE / LOGIN_REQUIRED 等直接放弃该 client
      return null;
    }
    var formats = [];
    try {
      var sf = (d.streamingData && d.streamingData.adaptiveFormats) || [];
      var f2 = (d.streamingData && d.streamingData.formats) || [];
      formats = sf.concat(f2);
    } catch(e){}
    var best = null, bestBr = -1;
    formats.forEach(function(f){
      if (!f) return;
      // 优先明文 url；cipher 无法在无解签器时使用
      var raw = f.url || "";
      if (!raw && f.signatureCipher){
        try {
          var sp = String(f.signatureCipher);
          var um = /(?:^|&)url=([^&]+)/.exec(sp);
          if (um) raw = decodeURIComponent(um[1]);
        } catch(eC) {}
      }
      if (!raw || !/^https?:\/\//i.test(raw)) return;
      var mime = String(f.mimeType || "");
      var isAudio = mime.indexOf("audio/") >= 0 || !!f.audioQuality || !!f.audioSampleRate;
      if (!isAudio) return;
      var br = Number(f.bitrate || f.averageBitrate || 0);
      if (br > bestBr){ bestBr = br; best = raw; }
    });
    return best ? String(best).replace(/^http:/, "https:") : null;
  }

  function playerTry(clientName, clientVersion, host, extraClient){
    var client = Object.assign({
      clientName: clientName,
      clientVersion: clientVersion,
      hl: "zh-CN",
      gl: "US"
    }, extraClient || {});
    var body = {
      context: { client: client },
      videoId: vid,
      contentCheckOk: true,
      racyCheckOk: true,
      playbackContext: {
        contentPlaybackContext: { html5Preference: "HTML5_PREF_WANTS" }
      }
    };
    var url = host + "/youtubei/v1/player?prettyPrint=false&key=" + encodeURIComponent(YTM_KEY);
    return ADAPTER_request(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "User-Agent": (clientName.indexOf("ANDROID") >= 0)
          ? ("com.google.android.youtube/" + clientVersion + " (Linux; U; Android 11) gzip")
          : YTM_HDR["User-Agent"],
        "Origin": host,
        "Referer": host + "/watch?v=" + encodeURIComponent(vid)
      },
      body: JSON.stringify(body),
      timeout: 11,
      credentials: "omit"
    }).then(function(txt){
      if (!txt) return null;
      var d = null;
      try { d = JSON.parse(txt); } catch(e){ d = jsonp_safeParse(txt); }
      return pickAudio(d);
    }).catch(function(){ return null; });
  }

  function parseProxyStreams(txt){
    if (!txt) return null;
    var d = null;
    try { d = JSON.parse(txt); } catch(e){ return null; }
    if (!d) return null;
    // Piped
    var audio = d.audioStreams || [];
    if (audio.length){
      audio = audio.slice().sort(function(a,b){ return (b.bitrate||0)-(a.bitrate||0); });
      for (var i = 0; i < audio.length; i++){
        var u2 = audio[i] && audio[i].url;
        if (u2) return String(u2).replace(/^http:/, "https:");
      }
    }
    // Invidious / 通用
    if (d.adaptiveFormats || d.formatStreams){
      var af = [].concat(d.adaptiveFormats || [], d.formatStreams || []);
      var best = null, bestBr = -1;
      af.forEach(function(f){
        var t = String(f.type || f.mimeType || "");
        if (t.indexOf("audio") < 0 && !f.audioSampleRate) return;
        var br = Number(f.bitrate || 0);
        var fu = f.url || "";
        if (fu && br >= bestBr){ bestBr = br; best = fu; }
      });
      if (best) return String(best).replace(/^http:/, "https:");
    }
    // Cobalt 等
    var one = d.url || d.audio || d.stream || d.audioUrl ||
      (d.data && (d.data.url || d.data.audio)) || "";
    if (one && /^https?:\/\//i.test(String(one))) return String(one).replace(/^http:/, "https:");
    return null;
  }

  function fromPublicProxies(){
    var endpoints = [
      "https://pipedapi.kavin.rocks/streams/" + encodeURIComponent(vid),
      "https://pipedapi.adminforge.de/streams/" + encodeURIComponent(vid),
      "https://api.piped.private.coffee/streams/" + encodeURIComponent(vid),
      "https://pipedapi.leptons.xyz/streams/" + encodeURIComponent(vid),
      "https://invidious.jing.rocks/api/v1/videos/" + encodeURIComponent(vid),
      "https://inv.nadeko.net/api/v1/videos/" + encodeURIComponent(vid),
      "https://yt.artemislena.eu/api/v1/videos/" + encodeURIComponent(vid),
      "https://invidious.fdn.fr/api/v1/videos/" + encodeURIComponent(vid)
    ];
    // 并行竞速：谁先返回可用音频链用谁（总等待封顶约 12s）
    return new Promise(function(resolve){
      var settled = false;
      var left = endpoints.length;
      if (!left){ resolve(null); return; }
      var timer = setTimeout(function(){
        if (!settled){ settled = true; resolve(null); }
      }, 12000);
      endpoints.forEach(function(mu){
        ADAPTER_request(mu, {
          headers: { "User-Agent": QQ_HEADERS["User-Agent"], "Accept": "application/json" },
          timeout: 10,
          credentials: "omit"
        }).then(function(txt){
          var u = parseProxyStreams(txt);
          if (u && !settled){
            settled = true;
            clearTimeout(timer);
            resolve(u);
          }
        }).catch(function(){}).then(function(){
          left--;
          if (left <= 0 && !settled){
            settled = true;
            clearTimeout(timer);
            resolve(null);
          }
        });
      });
    });
  }

  function fromCobalt(){
    // Cobalt 公共 API：只要音频
    var body = JSON.stringify({
      url: "https://www.youtube.com/watch?v=" + vid,
      downloadMode: "audio",
      audioFormat: "mp3",
      filenameStyle: "basic"
    });
    return ADAPTER_request("https://api.cobalt.tools/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json",
        "User-Agent": QQ_HEADERS["User-Agent"]
      },
      body: body,
      timeout: 12,
      credentials: "omit"
    }).then(function(txt){
      return parseProxyStreams(txt);
    }).catch(function(){ return null; });
  }

  // 顺序：自定义代理 → 多 client player → 公共代理竞速 → Cobalt
  return fromCustomProxy().then(function(u0){
    if (u0) return u0;
    var clients = [
      function(){ return playerTry("ANDROID", "19.17.34", "https://www.youtube.com", { androidSdkVersion: 30 }); },
      function(){ return playerTry("ANDROID_MUSIC", "7.27.52", "https://music.youtube.com", { androidSdkVersion: 30 }); },
      function(){ return playerTry("IOS", "19.09.3", "https://www.youtube.com", { deviceMake: "Apple", deviceModel: "iPhone16,2" }); },
      function(){ return playerTry("TVHTML5_SIMPLY", "1.0", "https://www.youtube.com", {}); },
      function(){ return playerTry("WEB", "2.20250312.00.00", "https://www.youtube.com", {}); },
      function(){ return playerTry("WEB_REMIX", "1.20250312.01.00", "https://music.youtube.com", {}); }
    ];
    var chain = Promise.resolve(null);
    clients.forEach(function(fn){
      chain = chain.then(function(got){ return got || fn(); });
    });
    return chain.then(function(u1){
      if (u1) return u1;
      return fromPublicProxies().then(function(u2){
        if (u2) return u2;
        return fromCobalt();
      });
    });
  });
};

/** 清洗 YT 标题，便于 QQ/酷我跨源匹配 */
API.ytCleanTitle = function(song){
  var raw = (song && song.name) || "";
  var singer = (song && song.singer) || "";
  // 书名号优先
  var book = /[《「]([^」》]+)[」》]/.exec(raw);
  if (book && book[1]) return book[1].trim();
  var name = String(raw)
    .replace(/\s*[\(（\[]?\s*Official\s*(Music\s*)?Video\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Official\s*Audio\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Official\s*Lyric\s*Video\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Lyrics?\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Audio\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*MV\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*HD\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*4K\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Live\s*(Performance|Session|at)[^\)）\]]*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Topic\s*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*Color\s*Coded[^\)）\]]*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*feat\.?[^\)）\]]*[\)）\]]?/ig, "")
    .replace(/\s*[\(（\[]?\s*ft\.?[^\)）\]]*[\)）\]]?/ig, "")
    .replace(/\s*\|\s*Official.*$/ig, "")
    .replace(/\s*【[^】]*】/g, "")
    .replace(/\s*\[[^\]]*\]/g, "")
    .replace(/Joker\s*Xue/ig, "")
    .replace(/\s+[-–—]\s+(Official|Audio|Video|Lyrics|MV).*$/ig, "")
    .replace(/\s+/g, " ")
    .trim();
  if (singer){
    var s0 = singer.split(/[\/、,&]/)[0].trim();
    if (s0 && name.toLowerCase().indexOf(s0.toLowerCase()) === 0){
      name = name.slice(s0.length).replace(/^[\s\-–—_:：]+/, "").trim();
    }
  }
  return name || raw;
};

API.ytmusicLyric = function(videoId){
  if (!videoId) return Promise.resolve({ lyric: "", trans: "" });
  // next → watchNext → lyrics browseId
  return _ytmPost("next", {
    enablePersistentPlaylistPanel: true,
    isAudioOnly: true,
    tunerSettingValue: "AUTOMIX_SETTING_NORMAL",
    videoId: videoId
  }, "web").then(function(d){
    if (!d) return { lyric: "", trans: "" };
    var browseId = "";
    try {
      var tabs = (((((d.contents || {}).singleColumnMusicWatchNextResultsRenderer || {}).tabbedRenderer || {}).tabbedSearchResultsRenderer || {}).tabs) ||
        (((((d.contents || {}).singleColumnMusicWatchNextResultsRenderer || {}).tabbedRenderer || {}).watchNextTabbedResultsRenderer || {}).tabs) || [];
      // 结构多变，深度找 lyrics
      function findLyricsId(node, depth){
        if (!node || depth > 14) return "";
        if (Array.isArray(node)){
          for (var i=0;i<node.length;i++){ var x=findLyricsId(node[i], depth+1); if (x) return x; }
          return "";
        }
        if (typeof node !== "object") return "";
        if (node.browseId && String(node.browseId).indexOf("MPLYt") === 0) return node.browseId;
        if (node.endpoint && node.endpoint.browseEndpoint && node.endpoint.browseEndpoint.browseId){
          var bid = node.endpoint.browseEndpoint.browseId;
          if (String(bid).indexOf("MPLYt") === 0) return bid;
        }
        if (node.browseEndpoint && node.browseEndpoint.browseId){
          var bid2 = node.browseEndpoint.browseId;
          if (String(bid2).indexOf("MPLYt") === 0) return bid2;
        }
        var keys = Object.keys(node);
        for (var k=0;k<keys.length;k++){
          var v = node[keys[k]];
          if (v && typeof v === "object"){
            var f = findLyricsId(v, depth+1);
            if (f) return f;
          }
        }
        return "";
      }
      browseId = findLyricsId(d, 0);
    } catch(e){}
    if (!browseId) return { lyric: "", trans: "" };
    return _ytmPost("browse", { browseId: browseId }, "web").then(function(bd){
      if (!bd) return { lyric: "", trans: "" };
      var lines = [];
      function collectLines(node, depth){
        if (!node || depth > 12) return;
        if (Array.isArray(node)){ node.forEach(function(n){ collectLines(n, depth+1); }); return; }
        if (typeof node !== "object") return;
        if (node.lyricsLineRenderer){
          var t = _ytmWalkRuns((((node.lyricsLineRenderer || {}).runs) || (node.lyricsLineRenderer && node.lyricsLineRenderer.text && node.lyricsLineRenderer.text.runs) || []));
          // 另一结构
          if (!t && node.lyricsLineRenderer.text) t = _ytmWalkRuns(node.lyricsLineRenderer.text.runs || []);
          if (t) lines.push(t);
        }
        if (node.description && node.description.runs){
          var full = _ytmWalkRuns(node.description.runs);
          if (full && full.length > 20) lines.push(full);
        }
        Object.keys(node).forEach(function(k){
          if (node[k] && typeof node[k] === "object") collectLines(node[k], depth+1);
        });
      }
      collectLines(bd, 0);
      // 去重保序
      var seen = {}, out = [];
      lines.forEach(function(l){ if (l && !seen[l]){ seen[l]=1; out.push(l); } });
      // 无时间轴：包成简单 LRC（每行 +3s 估）
      var lrc = out.map(function(line, i){
        var sec = i * 3;
        var m = Math.floor(sec/60), s = sec%60;
        return "[" + (m<10?"0":"")+m + ":" + (s<10?"0":"")+s + ".00]" + line;
      }).join("\n");
      return { lyric: lrc, trans: "" };
    });
  }).catch(function(){ return { lyric: "", trans: "" }; });
};

function _normAlbums(list){
  return (list || []).map(function(a){
    var mid = a.albumMID || a.album_mid || a.mid || "";
    var name = a.albumName || a.album_name || a.name || "";
    return {
      mid: mid, albumMID: mid, name: name, albumName: name,
      singerName: a.singerName || a.singer_name || "",
      pic: a.albumPic || a.pic || (mid ? coverUrl(mid) : ""),
      albumPic: a.albumPic || a.pic || ""
    };
  }).filter(function(a){ return a.name; });
}
function _normPlaylists(list){
  return (list || []).map(function(p){
    if (!p || typeof p !== "object") return null;
    // 兼容 SearchCgi / songlist / diss_by_tag 多种字段
    var id = String(
      p.dissid || p.disstid || p.diss_id || p.tid || p.content_id || p.contentId ||
      p.id || p.playlist_id || p.playlistId || (p.basic && (p.basic.tid || p.basic.dissid)) || ""
    ).replace(/^0+/, "") || String(p.dissid || p.id || "");
    var title = p.dissname || p.title || p.name || p.diss_name || p.playlist_name ||
      (p.basic && (p.basic.title || p.basic.dissname)) || "";
    var cover = p.imgurl || p.logo || p.picurl || p.cover || p.pic || p.img_url || p.cover_url ||
      p.pic_url || p.introduction || (p.basic && (p.basic.cover || p.basic.pic)) || "";
    if (cover && typeof cover === "string") cover = cover.replace(/http:\/\//, "https://");
    var nick = p.nickname || p.creator_name || p.author ||
      (p.creator && (p.creator.name || p.creator.nickname || p.creator.nick)) ||
      (p.u && (p.u.name || p.u.nickname)) || "";
    if (!id || !title) return null;
    return {
      dissid: id, id: id, dissname: title, title: title,
      imgurl: cover,
      logo: p.logo || cover,
      cover: cover,
      creator: p.creator || { name: nick },
      nickname: nick,
      source: p.source || "qq"
    };
  }).filter(function(p){ return !!p; });
}

/** QQ 歌单搜索：musicu SearchCgiService search_type=3
 *  实测：Desktop + yqq.json 的 songlist.list 常为空；
 *  必须用 Mobile 方法 + 移动端 comm（ct:11 / platform:h5）→ body.item_songlist
 */
API.searchPlaylists = function(kw, page){
  kw = (kw || "").trim();
  page = page || 1;
  if (!kw) return Promise.resolve([]);
  var pn = Math.max(1, page|0);
  var hdr = withCookie({
    "Referer": "https://y.qq.com/",
    "Origin": "https://y.qq.com",
    "Content-Type": "application/json;charset=utf-8",
    "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148"
  });
  var uin = "0";
  try {
    if (state.user && state.user.uin) uin = String(state.user.uin).replace(/^o0*/, "") || "0";
  } catch(eU) {}

  function digList(d){
    if (!d || typeof d !== "object") return [];
    var node = d.req || d.req_1 || d.req_0 || d["music.search.SearchCgiService"] || d;
    var data = (node && node.data) ? node.data : node;
    if (data && data.data) data = data.data;
    var body = (data && data.body) ? data.body : data;
    if (!body || typeof body !== "object") return [];

    var raw =
      body.item_songlist ||
      body.songlist ||
      body.diss ||
      body.playlist ||
      body.list ||
      null;
    var items = [];
    if (Array.isArray(raw)) items = raw;
    else if (raw && typeof raw === "object"){
      items = raw.list || raw.item_list || raw.songlist || raw.disslist || [];
    }
    if ((!items || !items.length) && Array.isArray(body.list)) items = body.list;

    items = (items || []).map(function(it){
      if (!it || typeof it !== "object") return it;
      var x = it.doc || it.playlist || it.diss || it;
      if (x && x.basic){
        try { x = Object.assign({}, x, x.basic); } catch(eM) { x = x.basic || x; }
      }
      if (x && !x.dissid && (x.tid || x.content_id || x.docid || x.diss_id)){
        x.dissid = String(x.tid || x.content_id || x.docid || x.diss_id);
      }
      if (x && !x.imgurl && !x.logo){
        x.imgurl = x.picurl || x.cover || x.pic || x.img_url || x.logo || "";
      }
      if (x && !x.dissname && !x.title){
        x.dissname = x.name || x.title || x.diss_name || "";
      }
      return x;
    });
    return _normPlaylists(items);
  }

  function postSearch(methodName, mobileComm){
    var payload = {
      comm: mobileComm ? {
        ct: 11,
        cv: 10030020,
        g_tk: 5381,
        uin: uin,
        format: "json",
        platform: "h5",
        needNewCode: 1
      } : {
        ct: 24,
        cv: 0,
        g_tk: 5381,
        uin: uin,
        format: "json",
        platform: "yqq.json"
      },
      req: {
        method: methodName,
        module: "music.search.SearchCgiService",
        param: {
          grp: 1,
          num_per_page: 20,
          page_num: pn,
          query: kw,
          search_type: 3,
          highlight: 0,
          nqc_flag: 0,
          searchid: String(Date.now()) + String(Math.floor(Math.random() * 1e6))
        }
      }
    };
    payload.req_1 = payload.req;

    var url = "https://u.y.qq.com/cgi-bin/musicu.fcg?_=" + Date.now();
    return ADAPTER_request(url, {
      method: "POST",
      headers: hdr,
      body: payload,
      timeout: 16
    }).then(function(txt){
      var d = jsonp_safeParse(txt);
      return digList(d);
    }).catch(function(){ return []; });
  }

  // 优先 Mobile+h5（实测有数据）；Desktop 作兜底
  return postSearch("DoSearchForQQMusicMobile", true).then(function(list){
    if (list && list.length) return list;
    return postSearch("DoSearchForQQMusicDesktop", false).then(function(list2){
      if (list2 && list2.length) return list2;
      return postSearch("DoSearchForQQMusicMobile", false);
    });
  }).then(function(out){
    var seen = {}, uniq = [];
    (out || []).forEach(function(p){
      if (!p || !p.dissid || seen[p.dissid]) return;
      seen[p.dissid] = 1;
      uniq.push(p);
    });
    return uniq;
  }).catch(function(){ return []; });
};

API.kugouAlbumSongs = function(albumId){
  albumId = String(albumId || "").replace(/^kg_al_/, "");
  if (!albumId) return Promise.resolve({ songs: [] });
  // 酷狗专辑歌曲
  var url = "https://mobilecdn.kugou.com/api/v3/album/song?albumid=" + encodeURIComponent(albumId) +
    "&page=1&pagesize=50&format=json";
  return ADAPTER_request(url, {
    headers: { "User-Agent": QQ_HEADERS["User-Agent"], "Referer": "https://www.kugou.com/", "Accept": "application/json" },
    timeout: 12, credentials: "omit"
  }).then(function(txt){
    var d = jsonp_safeParse(txt);
    var list = (d && d.data && (d.data.info || d.data.list)) || [];
    var songs = (list || []).map(function(it){
      var hash = it.hash || it.FileHash || it.hqhash || "";
      var name = (it.songname || it.filename || "").replace(/<[^>]+>/g, "");
      // filename 常为 "歌手 - 歌名"
      if (it.filename && !it.songname){
        var parts = String(it.filename).split(" - ");
        if (parts.length >= 2) name = parts.slice(1).join(" - ");
      }
      var singer = it.singername || it.author_name || "";
      if (!singer && it.filename){
        var p2 = String(it.filename).split(" - ");
        if (p2.length >= 2) singer = p2[0];
      }
      var dur = Number(it.duration || it.timeLength || 0) || 0;
      if (dur > 10000) dur = Math.round(dur / 1000);
      var img = it.img || it.album_img || "";
      if (img) img = String(img).replace(/\{size\}/g, "240").replace(/^http:/, "https:");
      if (!hash || !name) return null;
      return {
        songmid: "kg_" + hash,
        media_mid: hash,
        hash: hash,
        kgHash: hash,
        name: name,
        singer: singer || "酷狗",
        albumname: it.album_name || it.albumname || "",
        cover: fixCover(img),
        interval: dur,
        isVip: false,
        playUrl: "",
        source: "kugou"
      };
    }).filter(Boolean);
    return { songs: songs };
  }).catch(function(){ return { songs: [] }; });
}

/* netease */
API.neteaseSearch = function(kw, page){
  kw = (kw || "").trim();
  page = page || 1;
  if (!kw) return Promise.resolve({ list: [], singers: [] });
  var offset = (page - 1) * 20;
  var hdr = {
    "User-Agent": QQ_HEADERS["User-Agent"],
    "Referer": "https://music.163.com/"
  };
  var songUrl = "https://music.163.com/api/search/get?s=" + encodeURIComponent(kw) +
    "&type=1&limit=20&offset=" + offset;
  var artistUrl = "https://music.163.com/api/search/get?s=" + encodeURIComponent(kw) +
    "&type=100&limit=12&offset=0";

  function mapSongs(d){
    var songs = (d && d.result && d.result.songs) || [];
    return songs.map(function(s){
      var artists = (s.artists || s.ar || []).map(function(a){ return a.name; }).join("/") || "";
      var album = (s.album && s.album.name) || (s.al && s.al.name) || "";
      var pic = (s.album && (s.album.picUrl || s.album.blurPicUrl)) ||
        (s.al && (s.al.picUrl || s.al.blurPicUrl)) || "";
      var dur = Math.round(((s.duration || s.dt || 0) / 1000)) || 0;
      return {
        songmid: "ne_" + s.id,
        media_mid: String(s.id),
        neteaseId: String(s.id),
        name: s.name || "",
        singer: artists,
        albumname: album,
        albummid: String((s.album && s.album.id) || (s.al && s.al.id) || ""),
        cover: pic ? String(pic).replace(/^http:/, "https:") : "",
        interval: dur,
        isVip: !!(s.fee === 1 || s.fee === 4 || s.fee === 8),
        playUrl: "",
        source: "netease"
      };
    }).filter(function(s){ return s.neteaseId && s.name; });
  }
  function mapArtists(d){
    var arts = (d && d.result && d.result.artists) || [];
    return (arts || []).map(function(a){
      var pic = a.picUrl || a.img1v1Url || "";
      return {
        mid: "ne_ar_" + a.id,
        name: a.name || "",
        cover: pic ? String(pic).replace(/^http:/, "https:") : "",
        source: "netease",
        neteaseId: String(a.id)
      };
    }).filter(function(a){ return a.name; });
  }
  function fillCovers(list){
    if (!list.length) return Promise.resolve(list);
    var ids = list.map(function(s){ return s.neteaseId; }).join(",");
    var detailUrl = "https://music.163.com/api/song/detail/?ids=[" + ids + "]";
    return ADAPTER_request(detailUrl, { headers: hdr, timeout: 12 }).then(function(txt2){
      var d2 = jsonp_safeParse(txt2);
      var details = (d2 && d2.songs) || [];
      var map = {};
      details.forEach(function(ds){
        var pic = (ds.album && (ds.album.picUrl || ds.album.blurPicUrl)) ||
          (ds.al && (ds.al.picUrl || ds.al.blurPicUrl)) || "";
        if (pic) map[String(ds.id)] = String(pic).replace(/^http:/, "https:");
        var al = (ds.album && ds.album.name) || (ds.al && ds.al.name) || "";
        if (al) map[String(ds.id) + "_al"] = al;
      });
      list.forEach(function(s){
        if (map[s.neteaseId]) s.cover = map[s.neteaseId];
        if (!s.albumname && map[s.neteaseId + "_al"]) s.albumname = map[s.neteaseId + "_al"];
      });
      return list;
    }).catch(function(){ return list; });
  }
  function singersFromSongs(songs){
    var seen = {}, out = [];
    (songs || []).forEach(function(s){
      var n = ((s.singer || "").split(/[\/、,&]/)[0] || "").trim();
      if (!n || seen[n]) return;
      seen[n] = 1;
      out.push({ mid: "ne_ar_" + n, name: n, cover: s.cover || "", source: "netease", fromSong: true });
    });
    return out;
  }

  return Promise.all([
    ADAPTER_request(songUrl, { headers: hdr, timeout: 15 }).then(function(txt){
      return mapSongs(jsonp_safeParse(txt));
    }).catch(function(){ return []; }),
    ADAPTER_request(artistUrl, { headers: hdr, timeout: 12 }).then(function(txt){
      return mapArtists(jsonp_safeParse(txt));
    }).catch(function(){ return []; })
  ]).then(function(arr){
    var list = arr[0] || [];
    var singers = arr[1] || [];
    return fillCovers(list).then(function(list2){
      if (singers.length < 3){
        var extra = singersFromSongs(list2);
        var seen = {};
        singers.forEach(function(a){ if (a.name) seen[a.name] = 1; });
        extra.forEach(function(a){ if (!seen[a.name]){ seen[a.name] = 1; singers.push(a); } });
      }
      return { list: list2, singers: singers.slice(0, 12) };
    });
  }).catch(function(){ return { list: [], singers: [] }; });
}
API.neteaseUrl = function(song){
  var id = (song && (song.neteaseId || String(song.songmid || "").replace(/^ne_/, ""))) || "";
  if (!id) return Promise.resolve(null);
  /** 试听 / 权益限制：一律当失败，交给洛雪/长青/跨源拿完整曲 */
  function isTrialOrBlocked(item){
    if (!item) return true;
    if (!item.url) return true;
    if (item.freeTrialInfo) return true;
    if (item.freeTrialPrivilege && (item.freeTrialPrivilege.resConsumable || item.freeTrialPrivilege.userConsumable)) return true;
    // type: 0=正常 1=试听；flag 含试听位
    if (item.type === 1 || item.type === "1") return true;
    // 时长明显短于曲目（约 <40% 且 <60s）视为试听片段
    var fullDur = (song && song.interval) ? Number(song.interval) : 0;
    if (fullDur > 90 && item.time && item.time > 0 && item.time < Math.min(60, fullDur * 0.4) * 1000) return true;
    return false;
  }
  function pickUrl(item){
    if (isTrialOrBlocked(item)) return null;
    return String(item.url).replace(/^http:/, "https:");
  }
  // 优先 320k，再 128k；两路都拒试听
  var brList = [320000, 128000];
  function tryBr(i){
    if (i >= brList.length) return Promise.resolve(null);

API.neteasePlaylistDetail = function(playlistId, pageNo, pageSize){
  pageNo = Math.max(0, pageNo || 0);
  pageSize = pageSize || 50;
  var id = String(playlistId || "").replace(/^ne_pl_/, "").replace(/\D/g, "");
  if (!id) return Promise.resolve({ info: {}, songs: [], hasMore: false, pageNo: pageNo });
  return ADAPTER_request("https://music.163.com/api/v6/playlist/detail?id=" + id + "&n=100000", { headers: _neHdr(), timeout: 18 }).then(function(txt){

    if (!pl) return { info: {}, songs: [], hasMore: false, pageNo: pageNo };
    var info = {
      title: pl.name || "", cover: (pl.coverImgUrl || "").replace(/^http:/, "https:"),
      desc: (pl.description || "").replace(/\n+/g, " ").slice(0, 200),
      playCount: pl.playCount || 0, creator: (pl.creator && pl.creator.nickname) || "",
      songCount: pl.trackCount || 0, source: "netease"
    };
    var trackIds = (pl.trackIds || []).map(function(t){ return t && (t.id || t); }).filter(Boolean);
    if (!trackIds.length && pl.tracks && pl.tracks.length) trackIds = pl.tracks.map(function(t){ return t.id; }).filter(Boolean);
    info.songCount = info.songCount || trackIds.length;
    var start = pageNo * pageSize;
    var sliceIds = trackIds.slice(start, start + pageSize);
    var hasMore = (start + sliceIds.length) < trackIds.length;
    // 始终按 trackIds 顺序拉详情，避免有时用 pl.tracks（常只有前 20 首）导致两次打开列表不一致

      pl.tracks.forEach(function(t){
        if (t && t.id) trackMap[String(t.id)] = t;
      });
    }
    if (!sliceIds.length) return { info: info, songs: [], hasMore: false, pageNo: pageNo };
    var missing = sliceIds.filter(function(tid){ return !trackMap[String(tid)]; });
    function buildPage(fullMap){
      var songs = sliceIds.map(function(tid){
        var raw = fullMap[String(tid)] || trackMap[String(tid)];
        return _mapNeteaseSong(raw);
      }).filter(Boolean);
      return { info: info, songs: songs, hasMore: hasMore, pageNo: pageNo };
    }
    if (!missing.length) return buildPage(trackMap);
    return ADAPTER_request("https://music.163.com/api/song/detail/?ids=[" + missing.join(",") + "]", { headers: _neHdr(), timeout: 15 }).then(function(txt2){
      var d2 = jsonp_safeParse(txt2);
      var map = Object.assign({}, trackMap);
      ((d2 && d2.songs) || []).forEach(function(s){ if (s && s.id) map[String(s.id)] = s; });
      return buildPage(map);
    }).catch(function(){ return buildPage(trackMap); });
  }).catch(function(){ return { info: {}, songs: [], hasMore: false, pageNo: pageNo }; });
};

/** 专辑节目列表：多接口兜底，尽量列出可点的集数 */
API.ximalayaAlbumTracks = function(albumId, pageNum, pageSize){
  pageNum = pageNum || 1;
  pageSize = pageSize || 50;
  var aid = String(albumId).replace(/^xm_/, "");
  var ts = Date.now();

  function extractTracks(d){
    if (!d) return [];
    var list = [];
    if (d.data){
      list = d.data.tracks || d.data.list || d.data.trackList || d.data.items ||
        (d.data.albumPage && (d.data.albumPage.tracks || d.data.albumPage.list)) ||
        (d.data.tracksInfo && d.data.tracksInfo.tracks) || [];
      if (!Array.isArray(list) && d.data.audioInfo) list = [d.data];
    }
    if (!Array.isArray(list) || !list.length){
      // mobwsa 直接顶层 list
      list = d.tracks || d.list || d.items || [];
    }
    if (!Array.isArray(list)) list = [];
    return list;
  }
  function mapTrack(t){
    if (!t) return null;
    var node = t.track || t.trackInfo || t;
    var tid = node.trackId || node.track_id || node.id || t.trackId || t.id;
    if (!tid) return null;
    var isPaid = node.isPaid === true || node.is_paid === true || t.isPaid === true;
    var isFree = node.isFree === true || node.is_free === true || node.isFree === 1 ||
      node.isTryOut === true || node.is_try_out === true || t.isTryOut === true ||
      node.sampleDuration > 0 || node.isSample === true ||
      node.paidType === 0 || node.paid_type === 0 || node.isAuthorized === true;
    var cover = _xmPickCover(node) || _xmPickCover(t) || "";
    var dur = node.duration || node.trackDuration || t.duration || node.length || 0;
    if (dur > 10000) dur = Math.round(dur / 1000);
    var playUrl = node.playUrl64 || node.playUrl32 || node.playPathAacv164 || node.playPathAacv224 ||
      node.playPathHq || node.play_path_64 || node.play_path_32 || node.playUrl || node.play_path ||
      t.playUrl64 || t.playUrl32 || "";
    if (playUrl && String(playUrl).indexOf("//") === 0) playUrl = "https:" + playUrl;
    if (playUrl && String(playUrl).indexOf("http://") === 0) playUrl = "https://" + playUrl.slice(7);
    return {
      songmid: "xm_" + tid,
      media_mid: String(tid),
      xmTrackId: String(tid),
      xmAlbumId: String(aid),
      name: node.title || node.trackName || node.name || t.title || t.trackName || "节目",
      singer: node.anchorName || node.nickname || t.anchorName || t.nickname || "喜马拉雅",
      cover: cover,
      interval: dur || 0,
      source: "ximalaya",
      playUrl: playUrl || "",
      playUrlAt: playUrl ? Date.now() : 0,
      playUrlTs: playUrl ? Date.now() : 0,
      isDjProgram: true,

      uniq.push(s);
    });
    return uniq;

  // ===== 主路径：官方移动端同款（列表内直接带 playUrl，一次请求秒开）=====
  // https://mobwsa.ximalaya.com/mobile/playlist/album/page?albumId=&pageId=
  var mobwsa = "https://mobwsa.ximalaya.com/mobile/playlist/album/page?albumId=" +

    var urls = [
      {

          return toSongs(extractTracks(d2));
        }).catch(function(){ return []; });
    })).then(function(parts){
      var best = [];
      parts.forEach(function(arr){ if (arr && arr.length > best.length) best = arr; });

  });
