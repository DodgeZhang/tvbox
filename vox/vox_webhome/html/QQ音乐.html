/** 预取下一首 playUrl，并预装到 audioNext，切歌时几乎零等待 */
var _prefetchGen = 0;
function prefetchNextPlayUrl(){
  if (!state.queue.length) return;
  if (state.playMode === "single") return;
  var idx = _lockNextIndex();
  if (idx < 0) return;
  var s = state.queue[idx];
  if (!s) return;
  var gen = ++_prefetchGen;
  var songmid = s.songmid;
  var seamGen = _seamless.gen;

  function primeNext(url){
    if (!url || gen !== _prefetchGen || seamGen !== _seamless.gen) return;
    _seamless.nextIdx = idx;
    _seamless.nextUrl = String(url);
    try {
      if (!audioNext) { _seamless.primed = true; return; }
      // fm 内预缓存也走本地网关，否则副轨加载失败、无缝切歌空响
      var playSrc = safePlaySrc(url) || url;
      try {
        if (isNativeFm() && window.fm && typeof window.fm.res === "function"){
          var px = window.fm.res(url, {
            headers: { "Referer": "https://y.qq.com/", "User-Agent": (typeof QQ_HEADERS !== "undefined" && QQ_HEADERS["User-Agent"]) || "" },
            credentials: "include"
          });
          if (px) playSrc = px;
        }
      } catch(ePx) {}
      // 完整 URL 比较（含 query）：网关 path 相同不能当同一首
      var curNext = "";
      try { curNext = String(audioNext.src || ""); } catch(eCs) {}
      if (_seamless.primed && curNext && (curNext === playSrc || curNext.indexOf(playSrc) >= 0) && audioNext.readyState >= 2) return;
      audioNext.preload = "auto";
      try { audioNext.crossOrigin = null; } catch(eC) {}
      try { audioNext.pause(); } catch(eP0) {}
      audioNext.src = playSrc;
      try { audioNext.playbackRate = state.playbackRate || 1; } catch(eNr) {}
      try { audioNext.load(); } catch(eLd) {}
      _seamless.primed = false; // 等 loadeddata/canplay 再标 primed
      var onReady = function(){
        try {
          if (audioNext.readyState >= 2){
            // 预取阶段的试听兜底：之前只有真正播放时（主轨 loadedmetadata）才会检查时长，
            // 预取/预热副轨从来没验证过——一条试听链会被直接标记"已就绪"缓存进 s.playUrl，
            // 手动切歌时命中这份缓存就直接播了试听，且没有播放中那次兜底重试兜着。
            // 这里提前拦一道：副轨时长明显短于原曲，就当场作废，不标 primed，让缓存失效。
            var ndur = audioNext.duration;
            if (_isLikelyTrialDuration(s, ndur)){
              try { clearSongPlayUrl(s); } catch(eCl) {}
              _seamless.nextUrl = "";
              _seamless.primed = false;
              try { stopAudioNext(true); } catch(eSp) {}
            } else {
              _seamless.primed = true;
            }
          }
        } catch(eR) {}
        try { audioNext.removeEventListener("loadeddata", onReady); } catch(eRm) {}
        try { audioNext.removeEventListener("canplay", onReady); } catch(eRm2) {}
        try { audioNext.removeEventListener("canplaythrough", onReady); } catch(eRm3) {}
      };
      try { audioNext.addEventListener("loadeddata", onReady); } catch(eA) {}
      try { audioNext.addEventListener("canplay", onReady); } catch(eA2) {}
      try { audioNext.addEventListener("canplaythrough", onReady); } catch(eA3) {}
      // 主轨正在播时，借同一用户手势上下文预热副轨（静音 play 再 pause）
      // 必须用 _allowNextPlay 窗口 + 超时强制停，否则快速切歌会留下第二路声音
      try {
        if (audio && !audio.paused){
          var prevVol = (typeof state.volume === "number" ? state.volume : 0.8);
          try { audioNext.volume = 0; audioNext.muted = true; } catch(eM) {}
          _allowNextPlay = true;
          var warmDone = false;
          function finishWarm(){
            if (warmDone) return;
            warmDone = true;
            _allowNextPlay = false;
            try { audioNext.pause(); } catch(e1) {}
            try { audioNext.currentTime = 0; } catch(e1b) {}
            // 预热结束保持静音待命，真正切歌时再恢复音量
            try { audioNext.muted = true; audioNext.volume = 0; } catch(e2) {}
            _seamless.primed = true;
          }
          var warm = null;
          try { warm = audioNext.play(); } catch(ePlay) { finishWarm(); }
          if (warm && typeof warm.then === "function"){
            warm.then(function(){ finishWarm(); }).catch(function(){ finishWarm(); });
          } else {
            finishWarm();
          }
          // 预热多缓冲一会儿再静音待命（仍 muted，不会出声）
          setTimeout(function(){ finishWarm(); }, 800);
        }
      } catch(eW) {
        _allowNextPlay = false;
        try { stopAudioNext(false); } catch(eWx) {}
      }
    } catch(e) {
      _seamless.primed = true;
    }
  }

  if (s.playUrl && isPlayUrlFresh(s)){
    primeNext(s.playUrl);
    return;
  }
  if (s.playUrl && !isPlayUrlFresh(s)) clearSongPlayUrl(s);
  resolvePlayUrlForSong(s).then(function(url){
    if (gen !== _prefetchGen) return;
    if (!url) return;
    var t = state.queue[idx];
    if (t && t.songmid === songmid){
      try { stampPlayUrl(t, url); } catch(eC) {}
    }
    primeNext(url);
  }).catch(function(){});
}

/**
 * 本曲提前约 1 秒结束 → 直接切下一首（下一首 URL 已预解析）
 */
/** 把已缓冲的 audioNext 提升为主轨并立刻播放（不走 loadCurrent 重新拉流） */
function promotePrefetchedNext(nextIdx){
  /* 已关闭无缝副轨交接：曲末不再交换 audio / audioNext，避免快结束时卡死。
     预解析的 URL 仍通过 stampPlayUrl + loadCurrent 使用。 */
  return false;
}

function tryEarlyCutToNext(cur, d){
  /* 已关闭：提前切歌会在曲末把当前轨弄断，且 cutDone 可能吞掉 ended。
     仅保留 prefetchNextPlayUrl 预解析下一首直链，等本曲自然 ended 再 nextTrack。 */
  return;
}

function tryResumeAfterBackground(){
  if (!state.queue.length) return;
  // 用户主动暂停过：回前台也不自动续播
  if (_userPaused) return;
  try { unlockAudioFromGesture(); } catch(e0) {}
  // 后台过久：直链几乎必过期，先清缓存再走续播/重载
  try {
    var away = _appHiddenAt ? (Date.now() - _appHiddenAt) : 0;
    if (away > 12 * 60 * 1000) clearStalePlayUrls(true);
    else clearStalePlayUrls(false);
  } catch(eStale) {}
  var d = 0;
  try {
    d = audio.duration;
    if (!d || !isFinite(d) || d <= 0){
      d = (state.queue[state.queueIndex] && state.queue[state.queueIndex].interval) || 0;
    }
  } catch(e1) { d = 0; }
  var cur = 0;
  try { cur = audio.currentTime || 0; } catch(e2) {}
  var endedLike = false;
  try {
    // 息屏回来：曲末 / 已 ended / 进度异常停在尾部都算该切下一首
    endedLike = !!audio.ended ||
      (d > 2 && cur >= d - 1.2) ||
      (d > 2 && audio.paused && cur >= d - 2.5);
  } catch(e3) {}
  if (endedLike){
    try { _seamless.cutDone = false; } catch(eC) {}
    nextTrack(true);
    return;
  }
  var sNow = state.queue[state.queueIndex];
  // 缓存直链已过期：不要对旧 src 硬 play，直接重取（先记下进度）
  function _saveSeekForResume(){
    try {
      var s0 = state.queue[state.queueIndex];
      var t0 = (audio && audio.currentTime) || (_resumeSeek && _resumeSeek.time) || 0;
      if (s0 && t0 > 2){
        _resumeSeek = {
          key: String(s0.songmid || s0.xmTrackId || s0.id || ""),
          time: t0,
          savedAt: Date.now()
        };
      }
    } catch(e) {}
  }
  // 主轨仍在正常出声时不要因 TTL 误杀重载
  if (sNow && !isPlayUrlFresh(sNow) && !isCurrentStreamUsable()){
    _saveSeekForResume();
    clearSongPlayUrl(sNow);
    if (_wasPlayingBeforeHide){
      loadCurrent();
      return;
    }
  }
  // 进入后台前在播，回来被系统暂停：尝试续播（不要 seek(0)）
  if (_wasPlayingBeforeHide && audio.paused){
    var p = audio.play();
    if (p && typeof p.then === "function"){
      p.then(function(){ setPlayingUI(true); try { startBgWatch(); } catch(eW) {} }).catch(function(){
        var s = state.queue[state.queueIndex];
        if (s){
          _saveSeekForResume();
          clearSongPlayUrl(s);
          loadCurrent();
        }
      });
    } else {
      // 无 Promise 的老内核：重载并恢复进度
      if (sNow){
        _saveSeekForResume();
        clearSongPlayUrl(sNow);
        loadCurrent();
      }
    }
  } else if (!audio.paused){
    try { startBgWatch(); } catch(eW2) {}
  }
}

function startBgWatch(){
  stopBgWatch();
  // 前台/后台都跑；后台 WebView 可能限频，间隔略缩短并加重试
  _bgWatchTimer = setInterval(function(){
    try {
      if (!state.queue.length) return;
      var d = audio.duration;
      if (!d || !isFinite(d) || d <= 0){
        d = (state.queue[state.queueIndex] && state.queue[state.queueIndex].interval) || 0;
      }
      var cur = 0;
      try { cur = audio.currentTime || 0; } catch(eT) {}
      var ended = false;
      try { ended = !!audio.ended; } catch(eE) {}
      var bg = false;
      try { bg = isAppBackgrounded(); } catch(eBg) {}

      // 已结束或卡在曲末 → 切下一首
      if (ended || (d > 2 && cur >= d - 0.45)){
        if (!audio._qqmEndGuard || (Date.now() - audio._qqmEndGuard) > 1600){
          audio._qqmEndGuard = Date.now();
          try { _seamless.cutDone = false; } catch(eC) {}
          try { _wasPlayingBeforeHide = true; } catch(eW) {}
          nextTrack(true);
        }
        return;
      }

      // 用户主动暂停：只允许预取，绝不能自动 play / 切歌续播
      if (_userPaused){
        if (bg && d > 5 && (d - cur) < 60){
          if (!audio._qqmPrefetchTick || (Date.now() - audio._qqmPrefetchTick) > 6000){
            audio._qqmPrefetchTick = Date.now();
            try { prefetchNextPlayUrl(); } catch(eP0) {}
          }
        }
        return;
      }

      // 暂停但非用户意图：接近结尾则切；否则尝试恢复播放（后台常被系统 pause）
      if (audio.paused && _wasPlayingBeforeHide){
        if (d > 2 && cur >= d - 2.5){
          if (!audio._qqmEndGuard || (Date.now() - audio._qqmEndGuard) > 1600){
            audio._qqmEndGuard = Date.now();
            nextTrack(true);
          }
          return;
        }
        // 非曲末的意外暂停：尝试 resume（用户暂停过则上面已 return）
        if (bg && cur > 0.5 && (!audio._qqmResumeGuard || (Date.now() - audio._qqmResumeGuard) > 2500)){
          audio._qqmResumeGuard = Date.now();
          try {
            var pr = audio.play();
            if (pr && pr.catch) pr.catch(function(){});
            setPlayingUI(true);
          } catch(eR) {}
        }
        return;
      }

      // 后台：持续预取下一首（尽量保证第 3 首及以后也能切）
      // 同样要节流：这个定时器 800ms 一次，prefetchNextPlayUrl 内部靠 _prefetchGen
      // 自增丢弃"过期"请求，不节流的话请求永远来不及落地就被自己打断。
      if (bg && d > 5 && (d - cur) < 90){
        if (!audio._qqmPrefetchTick || (Date.now() - audio._qqmPrefetchTick) > 6000){
          audio._qqmPrefetchTick = Date.now();
          try { prefetchNextPlayUrl(); } catch(eP) {}
        }
      }
      // 进度卡住不动（>4s）触发轻推；连续两轮仍卡死则强制换新直链重载
      // 前台/后台都要跑，否则前台静默卡死（readyState 不掉但 currentTime 不走）没人管
      // 注意：paused 时进度必然不动，绝不能当成卡死去 play（否则「暂停后切后台又自己响」）
      if (audio.paused) return;
      if (d > 10 && cur > 1){
        if (audio._qqmLastCur == null) audio._qqmLastCur = cur;
        if (Math.abs(cur - (audio._qqmLastCur || 0)) < 0.05){
          audio._qqmStuck = (audio._qqmStuck || 0) + 1;
        } else {
          audio._qqmStuck = 0;
          audio._qqmStuckRounds = 0;
          audio._qqmLastCur = cur;
        }
        if (audio._qqmStuck >= 5){
          audio._qqmStuck = 0;
          audio._qqmStuckRounds = (audio._qqmStuckRounds || 0) + 1;
          try { prefetchNextPlayUrl(); } catch(eP2) {}
          if (audio._qqmStuckRounds >= 2){
            // 轻推已经试过一轮仍不动：直链多半已失效/连接死了，直接换新直链重载
            audio._qqmStuckRounds = 0;
            try {
              var sStuck = state.queue[state.queueIndex];
              if (sStuck){
                var tStuck = audio.currentTime || 0;
                if (tStuck > 2){
                  _resumeSeek = {
                    key: String(sStuck.songmid || sStuck.xmTrackId || sStuck.id || ""),
                    time: tStuck,
                    savedAt: Date.now()
                  };
                }
                clearSongPlayUrl(sStuck);
                _wasPlayingBeforeHide = true;
                loadCurrent();
              }
            } catch(eHard) {}
          } else {
            try { recoverStalledPlayback("stuck"); } catch(eR2) {}
          }
        }
      }
    } catch(e) {}
  }, 800);
}
function stopBgWatch(){
  if (_bgWatchTimer){ clearInterval(_bgWatchTimer); _bgWatchTimer = null; }
}

function loadCurrent(){
  var s = state.queue[state.queueIndex];
  if (!s) return;
  var gen = ++_loadGen;
  _userPaused = false; /* 主动 load/切歌视为要播 */
  _wasPlayingBeforeHide = true;
  ensurePlayerBarVisible();
  try { unlockAudioFromGesture(); } catch(eU) {}
  // 手动/逻辑切歌：取消进行中的无缝衔接
  try { _resetSeamless(); } catch(eSm) {}
  try { if (audio){ audio.muted = false; if (!(audio.volume > 0.05)) _syncAudioVolume(); } } catch(eVol) {}
  // 切歌不再重跑 initFpArtStyle（会重建 80 根频谱柱，整页闪）

  // 切歌立刻停旧音频；若是锁屏恢复同一首，保留待 seek 进度，不要清成 0
  var _restoreT = 0;
  try {
    var sk = String(s.songmid || s.xmTrackId || s.id || "");
    if (_resumeSeek && _resumeSeek.key && _resumeSeek.key === sk &&
        (Date.now() - (_resumeSeek.savedAt || 0)) < 45 * 60 * 1000 &&
        (_resumeSeek.time || 0) > 2){
      _restoreT = Number(_resumeSeek.time) || 0;
    }
  } catch(eRs) { _restoreT = 0; }
  try {
    audio.pause();
    // 不要 removeAttribute+load 清空：部分 WebView 会白闪；仅 pause，等新 src 再设
    if (!_restoreT){
      try { audio.currentTime = 0; } catch(eT) {}
    }
  } catch(e0) {}
  // _resetSeamless 已清副轨；再补一刀，覆盖竞态里刚被预热起来的 play
  stopAudioNext(true);
  var knownDur = Number(s.interval) || 0;
  updateProgressUI(_restoreT || 0, knownDur);
  lastLyricIdx = -1;
  _lyricRenderGen++; // 作废进行中的歌词渲染

  updatePlayerMeta(s);
  syncLikeButtons();
  setPlayingUI(false);
  highlightPlayingRow();
  // renderPlaylistPanel 已在 updatePlayerMeta 内调用，此处不重复

  var urlPromise = resolvePlayUrlForSong(s);
  urlPromise.then(function(url){
    // 已切到下一首：丢弃过期回调，防止进度/音频串歌
    if (gen !== _loadGen) return;
    if (!url){
      if (s.source === "kugou") toast("酷狗与备用音源均无地址，换一首试试", 2800);
      else if (s.source === "kuwo") toast("酷我与备用音源均无地址，换一首试试", 2800);
      else if (s.source === "netease") toast("网易与备用音源均无地址", 3200);
      else if (s.source === "ytmusic") toast("YT 无法取流（官方/代理均失败）。可在设置填 YTM 代理，或换 QQ/网易源播放", 3600);
      else toast((s.isVip ? "VIP 曲目，" : "") + "官方与备用音源均无地址。可登录 Cookie 或稍后再试", 3200);
      setPlayingUI(false);
      return;
    }
    // 缓存直链（拒绝试听链）；VIP 未登录时提示走洛雪
    try {
      if (url && !s.playUrl) stampPlayUrl(s, url);
    } catch(eCache) {}
    try{
      if (gen !== _loadGen) return;
      updateProgressUI(0, knownDur);

      var ref = s.source === "kugou" ? "https://www.kugou.com/"
        : s.source === "kuwo" ? "https://www.kuwo.cn/"
        : s.source === "netease" ? "https://music.163.com/"
        : s.source === "ytmusic" ? "https://music.youtube.com/"
        : "https://y.qq.com/";
      var hdrs = withCookie({ "Referer": ref, "User-Agent": QQ_HEADERS["User-Agent"] });

      // 仅页面 <audio> 播放，不调用 fm.play
      // 对齐可播版：原链优先；fm.res 作第二候选（防盗链/跨域失败时切换）
      // 长青 http 网关禁止 safePlaySrc 强升 https（无证书会全挂）
      function keepPlayUrl(u){
        if (!u) return u;
        u = String(u);
        if (/175\.27\.166\.236|haitangw\.(cc|net)|\/kgqq1\/|\/wy1\/|\/music1\/|\/musicapi1\//i.test(u)) return u;
        try { return safePlaySrc(u) || u; } catch(e){ return u; }
      }
      function buildPlayCandidates(rawUrl, refHdrs){
        var list = [];
        var raw = keepPlayUrl(rawUrl);
        var proxied = null;
        try {
          if (window.fm && typeof window.fm.res === "function"){
            // 网关用原始 URL（保留 http），由 native 代拉
            proxied = window.fm.res(rawUrl, { headers: refHdrs || {}, credentials: "include" });
            if (proxied && proxied === rawUrl) proxied = null;
          }
        } catch(eP) { proxied = null; }
        // 与可播版一致：原链 → fm.res
        if (raw) list.push(raw);
        if (proxied) list.push(proxied);
        var seen = {}, out = [];
        list.forEach(function(u){
          if (!u || seen[u]) return;
          seen[u] = 1;
          out.push(u);
        });
        return out;
      }
      var candidates = buildPlayCandidates(url, hdrs);
      var _playCandIdx = 0;

      function isAudioActuallyPlaying(){
        try {
          if (!audio) return false;
          // 已出声或已缓冲出进度 → 视为成功，禁止再弹失败 toast
          if (!audio.paused && (audio.currentTime || 0) > 0.15) return true;
          if (!audio.paused && audio.readyState >= 3) return true;
          return false;
        } catch(e){ return false; }
      }
      function tryPlayAt(i){
        if (gen !== _loadGen) return;
        // 已经在播：忽略过期的失败回调，避免「能播却弹失败」
        if (isAudioActuallyPlaying()) return;
        _playCandIdx = i;
        if (i >= candidates.length){
          // 最后再走一次 QQ 兜底
          if (s.source && s.source !== "qq" && !s._fbTried){
            s._fbTried = 1;
            API.fallbackViaQQ(s).then(function(fb){
              if (gen !== _loadGen) return;
              if (isAudioActuallyPlaying()) return;
              if (!fb){ toast("播放失败：无可用音频地址"); setPlayingUI(false); return; }
              stampPlayUrl(s, fb);
              candidates = buildPlayCandidates(fb, withCookie({ "Referer": "https://y.qq.com/", "User-Agent": QQ_HEADERS["User-Agent"] }));
              tryPlayAt(0);
            });
            return;
          }
          // 重定向链路可能先 error 再成功：最终仍在播就不要误报
          if (isAudioActuallyPlaying()) return;
          try {
            if (!audio.paused && audio.readyState >= 2) return;
          } catch(eAlive) {}
          toast("播放失败，请检查网络或换一首");
          setPlayingUI(false);
          return;
        }
        var src = candidates[i];
        try {
          audio.muted = false;
          var vol = (typeof state.volume === "number" && state.volume > 0) ? state.volume : 0.8;
          audio.volume = vol;
          try { audio.removeAttribute("crossorigin"); } catch(eC) {}
          src = keepPlayUrl(src);
          if (!src){ tryPlayAt(i + 1); return; }
          // 暴露给 audio.error：失败时切下一候选（fm 内最关键）
          window.__qqmAdvancePlaySrc = function(){
            if (gen !== _loadGen) return;
            // 已在正常播放则忽略 error（302/换源瞬间常会误触发）
            if (isAudioActuallyPlaying()) return;
            if (i + 1 < candidates.length){
              console.warn("[qqm] audio error/advance → candidate", i + 1);
              tryPlayAt(i + 1);
            } else {
              // 最后一源也 error：稍等看是否仍恢复播放（长青 302）
              setTimeout(function(){
                if (gen !== _loadGen) return;
                if (isAudioActuallyPlaying()) return;
                tryPlayAt(candidates.length);
              }, 400);
            }
          };
          audio.src = src;
          try { audio.playbackRate = state.playbackRate || 1; } catch(eRate) {}
          try { audio.load(); } catch(eL) {}
          var p = audio.play();
          if (p && typeof p.then === "function"){
            p.then(function(){
              if (gen !== _loadGen) return;
              audio.muted = false;
              if (!(audio.volume > 0.05)) audio.volume = vol;
              // 锁屏/重载恢复进度
              try {
                if (_restoreT > 2){
                  var dur0 = audio.duration || knownDur || 0;
                  var seekTo = _restoreT;
                  if (dur0 > 5 && seekTo > dur0 - 2) seekTo = Math.max(0, dur0 - 3);
                  audio.currentTime = seekTo;
                  _restoreT = 0;
                  try { _resumeSeek = null; } catch(eClr) {}
                }
              } catch(eSeek2) {}
              setPlayingUI(true);
              try { resumeAudioCtx(); } catch(eR) {}
              updateProgressUI(audio.currentTime || 0, audio.duration || knownDur);
              try { startBgWatch(); } catch(eW) {}
              setTimeout(function(){
                try { prefetchNextPlayUrl(); } catch(ePf) {}
              }, 600);
              // 卡住 0 秒则换下一条候选地址
              setTimeout(function(){
                if (gen !== _loadGen) return;
                if (isAudioActuallyPlaying()) return;
                if (!audio.paused && (audio.currentTime || 0) < 0.05 && (i + 1) < candidates.length){
                  console.warn("[qqm] stuck at 0, try next");
                  tryPlayAt(i + 1);
                }
              }, 1500);
            }).catch(function(err){
              console.warn("audio.play fail", i, err);
              // 换 src 导致的 AbortError / 已在播：不提示、不打断
              if (err && (err.name === "AbortError" || err.name === "NotAllowedError")){
                if (err.name === "NotAllowedError" && i + 1 >= candidates.length && !isAudioActuallyPlaying()){
                  try { toast("浏览器拦截了自动播放，请再点一次播放键", 2800); } catch(eT) {}
                }
                if (err.name === "AbortError") return;
              }
              if (isAudioActuallyPlaying()) return;
              tryPlayAt(i + 1);
            });
          } else {
            setPlayingUI(true);
          }
        } catch(eTry){
          tryPlayAt(i + 1);
        }
      }
      tryPlayAt(0);
    }catch(e){
      if (gen !== _loadGen) return;
      console.warn("loadCurrent play error", e);
      toast("播放失败");
      setPlayingUI(false);
    }
  });
  // 非 QQ 源不要走 QQ 歌词接口（会把已加载歌词盖成空）
  var lyricGen = _loadGen;
  function applyLyrics(lyric, trans){
    if (lyricGen !== _loadGen) return; // 已切歌，丢弃
    state.currentLyrics = parseLrc(lyric || "", trans || "");
    renderLyrics();
  }
  function hasLrcText(t){
    return !!(t && String(t).replace(/\s+/g, "").length > 4);
  }
  function fallbackMeta(){
    var nm = s.name || "";
    var sg = s.singer || "";
    if (s.source === "ytmusic" && typeof API.ytCleanTitle === "function"){
      try { nm = API.ytCleanTitle(s) || nm; } catch(eC) {}
    }
    if (!nm || typeof API.lyricByMeta !== "function"){
      applyLyrics("", "");
      return;
    }
    API.lyricByMeta(nm, sg).then(function(ly2){
      applyLyrics(ly2 && ly2.lyric, ly2 && ly2.trans);
    }).catch(function(){ applyLyrics("", ""); });
  }
  if (!s.source || s.source === "qq"){
    API.lyric(s.songmid).then(function(res){
      if (hasLrcText(res && res.lyric)) applyLyrics(res.lyric, res && res.trans);
      else fallbackMeta();
    }).catch(function(){ fallbackMeta(); });
  } else if (s.source === "netease"){
    var neId = s.neteaseId || String(s.songmid || "").replace(/^ne_/, "");
    API.neteaseLyric(neId).then(function(ly){
      if (hasLrcText(ly && ly.lyric)) applyLyrics(ly.lyric, ly && ly.trans);
      else fallbackMeta();
    }).catch(function(){ fallbackMeta(); });
  } else if (s.source === "kuwo"){
    if (s.lyricText) applyLyrics(s.lyricText, "");
    API.kuwoLyric(s).then(function(ly){
      var text = (ly && ly.lyric) || "";
      if (hasLrcText(text)){
        s.lyricText = text;
        applyLyrics(text, ly && ly.trans);
      } else if (!s.lyricText){
        fallbackMeta();
      }
    }).catch(function(){
      if (!s.lyricText) fallbackMeta();
    });
  } else if (s.source === "ytmusic"){
    var yid = s.videoId || String(s.songmid || "").replace(/^yt_/, "");
    API.ytmusicLyric(yid).then(function(ly){
      var text = (ly && ly.lyric) || "";
      if (hasLrcText(text)) applyLyrics(text, ly && ly.trans);
      else fallbackMeta();
    }).catch(function(){ fallbackMeta(); });
  } else if (s.source === "kugou"){
    API.kugouLyric(s).then(function(ly){
      if (hasLrcText(ly && ly.lyric)) applyLyrics(ly.lyric, ly && ly.trans);
      else fallbackMeta();
    }).catch(function(){ fallbackMeta(); });
  } else {
    fallbackMeta();
  }
  highlightPlayingRow();
}

/* ============================================================
   Media Session：系统状态栏 / 锁屏 / 通知中心接管
   （页面 audio 播放时生效；fm.play 原生通道由宿主自行接管）
   ============================================================ */
var _mediaSessionBound = false;
function updateMediaSession(s){
  try {
    if (!("mediaSession" in navigator)) return;
    s = s || (state.queue && state.queue[state.queueIndex]) || null;
    if (!s){
      try { navigator.mediaSession.metadata = null; } catch(e0){}
      return;
    }
    var cover = "";
    try {
      var raw = typeof songCoverUrl === "function" ? songCoverUrl(s) : (s.cover || "");
      // 状态栏封面尽量用原站 https 图，避免 blob/代理地址失效
      cover = (raw || "").replace(/^http:/, "https:");
      if (cover && cover.indexOf("//") === 0) cover = "https:" + cover;
    } catch(e1){}
    var artwork = [];
    if (cover && /^https?:\/\//i.test(cover)){
      [96, 128, 192, 256, 384, 512].forEach(function(sz){
        artwork.push({ src: cover, sizes: sz + "x" + sz, type: "image/jpeg" });
      });
    }
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.name || "QQ音乐",
      artist: s.singer || "",
      album: s.albumname || s.album || "",
      artwork: artwork
    });
    bindMediaSessionHandlers();
    try {
      navigator.mediaSession.playbackState = (audio && !audio.paused) ? "playing" : "paused";
    } catch(e2){}
    try { syncMediaSessionPosition(); } catch(e3){}
  } catch(e){
    console.warn("[mediaSession] update fail", e);
  }
}
function syncMediaSessionPosition(){
  try {
    if (!("mediaSession" in navigator) || typeof navigator.mediaSession.setPositionState !== "function") return;
    var dur = Number(audio.duration) || 0;
    var cur = Number(audio.currentTime) || 0;
    if (!isFinite(dur) || dur <= 0){
      var s = state.queue && state.queue[state.queueIndex];
      dur = Number(s && s.interval) || 0;
    }
    if (!isFinite(dur) || dur <= 0) return;
    navigator.mediaSession.setPositionState({
      duration: dur,
      playbackRate: audio.playbackRate || 1,
      position: Math.max(0, Math.min(cur, dur))
    });
  } catch(e){}
}
function bindMediaSessionHandlers(){
  if (_mediaSessionBound || !("mediaSession" in navigator)) return;
  _mediaSessionBound = true;
  var ms = navigator.mediaSession;
  try {
    ms.setActionHandler("play", function(){
      try {
        _userPaused = false;
        _wasPlayingBeforeHide = true;
        audio.muted = false;
        var p = audio.play();
        if (p && p.catch) p.catch(function(){
          try {
            var s = state.queue[state.queueIndex];
            if (s){ clearSongPlayUrl(s); loadCurrent(); }
          } catch(eL) {}
        });
        setPlayingUI(true);
        try { startBgWatch(); } catch(eW) {}
        ms.playbackState = "playing";
      } catch(e){}
    });
  } catch(e){}
  try {
    ms.setActionHandler("pause", function(){
      try {
        _userPaused = true;
        _wasPlayingBeforeHide = false;
        audio.pause();
        setPlayingUI(false);
        ms.playbackState = "paused";
      } catch(e){}
    });
  } catch(e){}
  try {
    ms.setActionHandler("previoustrack", function(){ prevTrack(); });
  } catch(e){}
  try {
    ms.setActionHandler("nexttrack", function(){ nextTrack(false); });
  } catch(e){}
  try {
    ms.setActionHandler("stop", function(){
      try {
        audio.pause();
        audio.currentTime = 0;
        setPlayingUI(false);
        ms.playbackState = "none";
      } catch(e){}
    });
  } catch(e){}
  try {
    ms.setActionHandler("seekto", function(details){
      try {
        if (details && typeof details.seekTime === "number" && isFinite(details.seekTime)){
          audio.currentTime = details.seekTime;
          syncMediaSessionPosition();
        }
      } catch(e){}
    });
  } catch(e){}
  try {
    ms.setActionHandler("seekbackward", function(details){
      try {
        var off = (details && details.seekOffset) || 10;
        audio.currentTime = Math.max(0, (audio.currentTime || 0) - off);
        syncMediaSessionPosition();
      } catch(e){}
    });
  } catch(e){}
  try {
    ms.setActionHandler("seekforward", function(details){
      try {
        var off = (details && details.seekOffset) || 10;
        var dur = audio.duration || 0;
        audio.currentTime = Math.min(dur || 1e9, (audio.currentTime || 0) + off);
        syncMediaSessionPosition();
      } catch(e){}
    });
  } catch(e){}
}

/** 每日推荐 / 每日30 卡片：正在播这批时，大字/封面都实时跟着当前播放的歌走；
 *  没在播这批时，退回列表第 1 首（与进详情/点播放一致）。 */
function syncDailyPlayingMeta(s){
  try {
    var tag = state.queueTag || "";
    if (tag !== "daily-rec" && tag !== "daily-30") return;
    var metaEl = tag === "daily-rec" ? $("#dailyRecMeta") : $("#daily30Meta");
    var coverEl = tag === "daily-rec" ? $("#dailyRecCover") : $("#daily30Cover");
    if (!metaEl) return;
    var list = tag === "daily-rec"
      ? (_dailyCache && _dailyCache.recSongs) || []
      : (_dailyCache && _dailyCache.d30Songs) || [];
    var cur = (state.queue && state.queue[state.queueIndex]) || s || null;
    var playing = !!(typeof audio !== "undefined" && audio && !audio.paused && state.queueTag === tag);
    var face, sub;
    if (playing && cur && cur.name){
      face = cur;
      sub = "正在播放";
    } else {
      face = list[0] || cur || null;
      sub = tag === "daily-rec" ? "每日推荐" : "每日30首";
    }
    if (!face) return;
    metaEl.innerHTML = '<div class="df-name">'+esc(face.name||"")+(face.singer?(" - "+esc(face.singer)):"")+'</div><div class="df-sub">'+esc(sub)+'</div>';
    if (coverEl){
      try { coverEl.innerHTML = safeImg(songCoverUrl(face)); } catch(eC) {}
    }
  } catch(e) {}
}
function updatePlayerMeta(s){
  var rawCover = songCoverUrl(s);
  var cover = rawCover ? mediaUrl(rawCover) : "";
  var pt = $("#pbTitle"), pa = $("#pbArtist");
  if (pt) pt.textContent = s.name || "";
  if (pa) pa.textContent = s.singer || "";
  try { schedulePbLyricMode(); } catch(ePb) {}
  setImgSrc($("#pbCoverImg"), rawCover);
  $("#fpTitle").textContent = s.name;
  $("#fpArtist").textContent = s.singer;
  setImgSrc($("#fpCoverImg"), rawCover);
  // 已关闭封面取色同步：切歌改色是闪烁主因
  renderPlaylistPanel();
  try { updateMediaSession(s); } catch(eMS) {}
  try { syncDailyPlayingMeta(s); } catch(eDm) {}
}

/* 全屏封面视觉样式：黑胶 / 频谱 / 脉冲 / 方封 / 波形 / 光环 / 虫洞 / 轨道 / 全息 */
var FP_ART_STYLES = [
  { id: "vinyl", name: "黑胶" },
  { id: "spectrum", name: "频谱" },
  { id: "pulse", name: "脉冲" },
  { id: "square", name: "方封" },
  { id: "wave", name: "粒子扩散" },
  { id: "ring", name: "光环" },
  { id: "portal", name: "虫洞" },
  { id: "orbit", name: "轨道" },
  { id: "holo", name: "全息" }
];
function ensureFpArtDecor(){
  var art = $("#fpArt");
  var stage = art && art.querySelector(".fp-art-stage");
  var spec = $("#fpSpectrum");
  // 半径：封面外一圈（舞台宽度的一半略大一点）
  var radius = 100;
  if (stage && stage.offsetWidth) radius = Math.round(stage.offsetWidth * 0.46);
  if (spec && !spec.childNodes.length){
    var n = 80, html = "";
    for (var i = 0; i < n; i++){
      var rot = (i / n) * 360;
      var delay = (i % 12) * 0.04;
      html += '<i style="--tr:rotate('+rot+'deg) translateY(-'+radius+'px);transform:var(--tr) scaleY(.3);animation-delay:'+delay+'s"></i>';
    }
    spec.innerHTML = html;
  }
  var wave = $("#fpWave");
  if (wave && !wave._particlePool){
    // 粒子扩散：预建密集粒子池，模拟星尘环
    wave.innerHTML = "";
    var pool = [];
    for (var pi = 0; pi < 140; pi++){
      var el = document.createElement("i");
      el.className = "fp-particle";
      wave.appendChild(el);
      pool.push({ el: el, active: false, ang: 0, r: 0, vr: 0, life: 0, maxLife: 1, size: 1 });
    }
    wave._particlePool = pool;
  }
}
var _waveSpawnAcc = 0;
function applyFpArtStyle(id){
  var art = $("#fpArt");
  if (!art) return;
  var st = null;
  for (var i = 0; i < FP_ART_STYLES.length; i++){
    if (FP_ART_STYLES[i].id === id){ st = FP_ART_STYLES[i]; break; }
  }
  if (!st) st = FP_ART_STYLES[0];
  ensureFpArtDecor();
  art.setAttribute("data-style", st.id);

  var groove = art.querySelector(".fp-groove");
  var spec = $("#fpSpectrum");
  var wave = $("#fpWave");
  var rings = art.querySelectorAll(".fp-pulse-ring");
  var ringSpin = art.querySelector(".fp-ring-spin");
  var vinyl = $("#fpVinyl");
  var img = $("#fpCoverImg");
  var stage = art.querySelector(".fp-art-stage");

  // reset all
  if (groove) groove.style.display = "none";
  if (spec) spec.style.display = "none";
  var glowReset = $("#fpSpectrumGlow");
  if (glowReset){ glowReset.style.display = "none"; glowReset.style.transform = ""; glowReset.style.opacity = ""; }
  if (wave){
    wave.style.display = "none";
    wave.style.left = "";
    wave.style.right = "";
    wave.style.bottom = "";
    wave.style.height = "";
    wave.style.width = "";
  }
  for (var r = 0; r < rings.length; r++) rings[r].style.display = "none";
  if (ringSpin) ringSpin.style.display = "none";
  var portalEl = $("#fpPortal") || (art && art.querySelector(".fp-portal"));
  var orbitEl = $("#fpOrbit") || (art && art.querySelector(".fp-orbit"));
  var holoEl = $("#fpHolo") || (art && art.querySelector(".fp-holo"));
  if (portalEl) portalEl.style.display = "none";
  if (orbitEl) orbitEl.style.display = "none";
  if (holoEl) holoEl.style.display = "none";
  if (vinyl){
    vinyl.classList.remove("spin", "paused");
    vinyl.style.cssText = ""; // clear inline overrides
    vinyl.className = "fp-vinyl";
  }
  if (img){
    img.style.width = "";
    img.style.height = "";
    img.style.borderRadius = "";
    img.style.border = "";
  }
  if (stage){
    stage.style.marginBottom = "";
    stage.style.overflow = "";
  }

  // apply one style
  if (st.id === "vinyl"){
    if (groove) groove.style.display = "block";
    if (vinyl) vinyl.classList.add("spin");
    // 黑胶：大黑盘 + 纹路 + 中心小图旋转
  } else if (st.id === "spectrum"){
    // 按当前舞台尺寸重算环半径
    ensureFpArtDecor();
    if (spec) spec.style.display = "block";
    var glowEl = $("#fpSpectrumGlow");
    if (glowEl) glowEl.style.display = "block";
    if (vinyl){
      vinyl.style.background = "transparent";
      vinyl.style.boxShadow = "0 12px 36px rgba(0,0,0,.4)";
    }
    if (img){
      img.style.width = "82%";
      img.style.height = "82%";
      img.style.border = "none";
      img.style.borderRadius = "50%";
    }
  } else if (st.id === "pulse"){
    for (var r2 = 0; r2 < rings.length; r2++) rings[r2].style.display = "block";
    if (vinyl){
      vinyl.style.background = "transparent";
      vinyl.style.boxShadow = ""; // 由 CSS data-style=pulse 使用主题色
    }
    if (img){
      img.style.width = "88%";
      img.style.height = "88%";
      img.style.border = "none";
    }
  } else if (st.id === "square"){
    if (vinyl){
      vinyl.style.borderRadius = "18px";
      vinyl.style.background = "transparent";
      vinyl.style.boxShadow = "0 18px 40px rgba(0,0,0,.45)";
      vinyl.style.overflow = "hidden";
    }
    if (img){
      img.style.width = "100%";
      img.style.height = "100%";
      img.style.borderRadius = "18px";
      img.style.border = "none";
    }
  } else if (st.id === "wave"){
    // 粒子扩散：细密星尘环
    ensureFpArtDecor();
    if (vinyl){
      vinyl.style.background = "transparent";
      vinyl.style.boxShadow = "0 12px 36px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.06)";
      vinyl.style.borderRadius = "50%";
      vinyl.style.overflow = "hidden";
    }
    if (img){
      img.style.width = "100%";
      img.style.height = "100%";
      img.style.borderRadius = "50%";
      img.style.border = "none";
    }
    if (wave){
      wave.style.cssText = "display:block;position:absolute;left:50%;top:50%;width:240%;height:240%;margin-left:-120%;margin-top:-120%;overflow:visible;pointer-events:none;z-index:4;";
      // 强制重建粒子池，避免旧版残留
      wave._particlePool = null;
      ensureFpArtDecor();
      // 立刻撒一圈初始粒子，切换样式时就能看见
      try {
        var stage0 = art.querySelector(".fp-art-stage");
        var half0 = stage0 && stage0.offsetWidth ? stage0.offsetWidth / 2 : 130;
        var edge0 = half0 * 1.02;
        var pool0 = wave._particlePool || [];
        for (var si = 0; si < Math.min(48, pool0.length); si++){
          var sp = pool0[si];
          sp.active = true;
          sp.ang = (si / 48) * Math.PI * 2 + Math.random() * 0.08;
          sp.r = edge0 * (1.0 + Math.random() * 0.08);
          sp.vr = 0.2 + Math.random() * 0.5;
          sp.life = Math.floor(Math.random() * 10);
          sp.maxLife = 40 + Math.random() * 40;
          sp.size = 0.9 + Math.random() * 1.1;
          var sx = Math.cos(sp.ang) * sp.r;
          var sy = Math.sin(sp.ang) * sp.r;
          sp.el.style.opacity = "0.85";
          sp.el.style.transform = "translate(" + sx.toFixed(1) + "px," + sy.toFixed(1) + "px) scale(" + sp.size.toFixed(2) + ")";
        }
        _waveSpawnAcc = 6;
      } catch(eSeed) {}
    }
    if (stage){
      // 仅放行粒子溢出，不改高度，避免歌词/列表区与其它样式错位
      stage.style.overflow = "visible";
      stage.style.marginBottom = "";
    }
    try { startVizLoop(); updateFpVisualizer(); } catch(eV) {}
  } else if (st.id === "ring"){
    if (ringSpin){
      ringSpin.style.display = "block";
      ringSpin.style.opacity = "";
      ringSpin.style.transform = "";
      ringSpin.style.boxShadow = "";
    }
    if (vinyl){
      vinyl.style.background = "transparent";
      vinyl.style.boxShadow = "0 12px 36px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.04)";
      vinyl.style.borderRadius = "50%";
      vinyl.style.overflow = "hidden";
    }
    if (img){
      img.style.width = "100%";
      img.style.height = "100%";
      img.style.border = "none";
      img.style.borderRadius = "50%";
    }
  } else if (st.id === "portal"){
    if (portalEl) portalEl.style.display = "block";
    if (stage) stage.style.overflow = "visible";
    if (vinyl){
      vinyl.style.background = "transparent";
      vinyl.style.boxShadow = "";
      vinyl.style.borderRadius = "50%";
      vinyl.style.overflow = "hidden";
      vinyl.classList.add("spin");
    }
    if (img){
      img.style.width = "100%";
      img.style.height = "100%";
      img.style.border = "none";
      img.style.borderRadius = "50%";
    }
  } else if (st.id === "orbit"){
    if (orbitEl){
      orbitEl.style.display = "block";
      try {
        var stgW = stage && stage.offsetWidth ? stage.offsetWidth : 280;
        // 光点轨道：封面外缘（黑胶外圈约满舞台）
        orbitEl.style.setProperty("--orbit-r", Math.round(stgW / 2 + 6) + "px");
      } catch(eOr) {}
    }
    if (stage) stage.style.overflow = "visible";
    if (vinyl){
      vinyl.style.background = "";
      vinyl.style.boxShadow = "";
      vinyl.style.borderRadius = "50%";
      vinyl.style.overflow = "hidden";
      vinyl.classList.add("spin");
    }
    if (img){
      img.style.width = "78%";
      img.style.height = "78%";
      img.style.border = "none";
      img.style.borderRadius = "50%";
    }
  } else if (st.id === "holo"){
    if (holoEl) holoEl.style.display = "block";
    if (stage) stage.style.overflow = "visible";
    if (vinyl){
      vinyl.style.background = "";
      vinyl.style.boxShadow = "";
      vinyl.style.borderRadius = "50%";
      vinyl.style.overflow = "hidden";
      vinyl.classList.add("spin");
    }
    if (img){
      img.style.width = "86%";
      img.style.height = "86%";
      img.style.border = "none";
      img.style.borderRadius = "50%";
    }
  }

  try { storeSet("fpArtStyle", st.id); } catch(e) {}
  // 同步播放旋转状态
  try {
    var playing = !audio.paused;
    setPlayingUI(playing);
    if (playing){ ensureAudioGraph(); resumeAudioCtx(); startVizLoop(); }
    updateFpVisualizer();
  } catch(e2) {}
}
function cycleFpArtStyle(){
  var art = $("#fpArt");
  if (!art) return;
  var cur = art.getAttribute("data-style") || "vinyl";
  var idx = 0;
  for (var i = 0; i < FP_ART_STYLES.length; i++){
    if (FP_ART_STYLES[i].id === cur){ idx = i; break; }
  }
  var next = FP_ART_STYLES[(idx + 1) % FP_ART_STYLES.length];
  applyFpArtStyle(next.id);
  toast(next.name);
}
var _fpArtInited = false;
function initFpArtStyle(){
  var art = $("#fpArt");
  if (art && !art._bound){
    art._bound = true;
    art.addEventListener("click", function(e){
      cycleFpArtStyle();
    });
  }
  if (_fpArtInited) return; // 切歌不重复应用，避免闪烁

function _bindAudioEvents(el){

      if (left < 90 && left > 1.2){

function prevTrack(){
  if (!state.queue.length) return;
  if (state.playMode==="shuffle") state.queueIndex = Math.floor(Math.random()*state.queue.length);
  else state.queueIndex = (state.queueIndex-1+state.queue.length)%state.queue.length;
  loadCurrent();
}
function nextTrack(auto){
  if (!state.queue.length) return;
  if (state.playMode==="single" && auto){
    try { audio.currentTime=0; audio.play(); } catch(e) {}
    return;
  }
  var from = state.queueIndex;
  var target = -1;
  // 优先用预取锁定的下一首（与预解析一致）；必须与当前不同
  if (_seamless.nextIdx >= 0 && _seamless.nextIdx < state.queue.length && _seamless.nextIdx !== from){
    target = _seamless.nextIdx;
  } else if (state.playMode==="shuffle"){
    if (state.queue.length <= 1){
      target = 0;
    } else {
      var n = Math.floor(Math.random()*state.queue.length);
      if (n === from) n = (from + 1) % state.queue.length;
      target = n;
    }
  } else {
    target = (from + 1) % state.queue.length;
  }
  // 使用预解析直链（若有），切歌时免等重新取链；不再做副轨无缝交接
  if (target >= 0 && target !== from){
    try {
      var nsPref = state.queue[target];
      if (nsPref && _seamless.nextUrl && _seamless.nextIdx === target){
        stampPlayUrl(nsPref, _seamless.nextUrl);
      }
    } catch(ePref) {}
  }
  state.queueIndex = target;
  // 清掉过期预取，避免下一轮仍指向旧曲
  try { _resetSeamless(); } catch(eRs) {}
  loadCurrent();
  // 后台：loadCurrent 的 play 可能被拒，多轮重试
  if (auto){
    try { _wasPlayingBeforeHide = true; } catch(eW2) {}
    try { startBgWatch(); } catch(eB2) {}
    var retries = [600, 1500, 3200];
    retries.forEach(function(ms){
      setTimeout(function(){
        try {
          if (!state.queue.length) return;
          if (!audio) return;
          // 仍停着且用户意图是继续播
          if (audio.paused && _wasPlayingBeforeHide){
            var p = audio.play();
            if (p && p.catch) p.catch(function(){});
            setPlayingUI(true);
          }
        } catch(eR) {}
      }, ms);
    });
  }
}

/* ---------- 歌词解析与滚动同步 ---------- */
function _lrcTimeToSec(mm, ss, frac){
  var f = +frac;
  var den = (String(frac).length === 3) ? 1000 : 100;
  return (+mm) * 60 + (+ss) + (f / den);
}
/** 解析增强 LRC 行内逐字时间：文字<mm:ss.xx>文字 */
function _parseInlineWordTimes(raw, lineStart){
  if (!raw || raw.indexOf("<") < 0) return null;
  var words = [];
  var re = /([^<]*)<(\d{2}):(\d{2})[.:](\d{2,3})>/g;
  var m, lastT = lineStart, tail = raw, found = false;
  var pos = 0;
  while ((m = re.exec(raw))){
    found = true;
    var pre = m[1] || "";
    var wt = _lrcTimeToSec(m[2], m[3], m[4]);
    if (pre){
      // 前缀字落在上一时间点
      var chars = Array.from(pre);
      for (var i = 0; i < chars.length; i++){
        words.push({ t: lastT, text: chars[i] });
      }
    }
    lastT = wt;
    pos = m.index + m[0].length;
  }
  if (!found) return null;
  tail = raw.slice(pos);
  if (tail){
    Array.from(tail).forEach(function(ch){ words.push({ t: lastT, text: ch }); });
  }
  // 去掉时间标签后的纯文本
  var plain = raw.replace(/<\d{2}:\d{2}[.:]\d{2,3}>/g, "");
  return { words: words.filter(function(w){ return w.text; }), text: plain };
}
function parseLrc(lrc, trans){
  if (!lrc) return [];
  var transMap = {};
  (trans||"").split("\n").forEach(function(line){
    var m = /\[(\d{2}):(\d{2})[.:](\d{2,3})\]([\s\S]*)/.exec(line);
    if (m) transMap[(+m[1]*60+ +m[2]).toFixed(0)] = m[4].trim();
  });
  var out = [];
  lrc.split("\n").forEach(function(line){
    var m = /\[(\d{2}):(\d{2})[.:](\d{2,3})\]([\s\S]*)/.exec(line);
    if (!m) return;
    var tt = _lrcTimeToSec(m[1], m[2], m[3]);
    var raw = (m[4] || "").trim();
    if (!raw) return;
    var words = null;
    var text = raw;
    var inline = _parseInlineWordTimes(raw, tt);
    if (inline && inline.words && inline.words.length){
      words = inline.words;
      text = inline.text || raw;
    }
    out.push({
      time: tt,
      text: text,
      tr: transMap[Math.round(+m[1]*60+ +m[2])] || "",
      words: words
    });
  });
  out.sort(function(a,b){ return a.time-b.time; });
  // B 兜底：无逐字时间则按字符在本行时长内均分
  attachKtvWords(out);
  return out;
}
/** 为缺少 words 的行生成估算时间轴（KTV 观感） */
function attachKtvWords(lines){
  if (!lines || !lines.length) return lines;
  for (var i = 0; i < lines.length; i++){
    var L = lines[i];
    if (L.words && L.words.length){
      // 真实逐字时间略提前
      var leadR = 0.12;
      for (var wi = 0; wi < L.words.length; wi++){
        L.words[wi].t = Math.max(0, (L.words[wi].t || 0) - leadR);
      }
      L.ktv = true;
      continue;
    }
    var plain = String(L.text || "");
    // 按 Unicode 码点拆字，保留空格
    var chars = Array.from(plain);
    if (!chars.length){ L.words = []; L.ktv = false; continue; }
    var start = L.time || 0;
    var next = (i + 1 < lines.length) ? lines[i + 1].time : (start + Math.max(3, chars.length * 0.28));
    // 略提前（比 0.55 稍慢半拍，更贴耳感）
    var lead = 0.38;
    var span = Math.max(0.2, (next - start) * 0.62);
    var words = [];
    for (var c = 0; c < chars.length; c++){
      words.push({
        t: Math.max(0, start - lead + (c / Math.max(1, chars.length)) * span),
        text: chars[c]
      });
    }
    L.words = words;
    L.ktv = true; // 估算也算 ktv 模式
  }
  return lines;
}
function _renderLyricLineHtml(l, i){
  var main;
  if (l.words && l.words.length){

    }).join("") + '</span>';
  } else {
    main = esc(l.text || "");

  return '<div class="lyric-line" data-i="'+i+'" data-t="'+l.time+'">'+main+(l.tr?'<span class="lyric-tr">'+esc(l.tr)+'</span>':'')+'</div>';
}

var _lastKtvFillKey = "";
function _syncKtvWords(activeEl, line, t, force){
  if (!activeEl || !line || !line.words || !line.words.length) return;
  var words = line.words;
  var n = words.length;
  var tStart = words[0].t;
  var tEnd = words[n - 1].t;
  // 末字也给一点扫完时间
  if (n >= 2) tEnd = words[n - 1].t + Math.max(0.12, (words[n - 1].t - words[0].t) / n);
  else tEnd = tStart + 0.4;
  if (tEnd <= tStart) tEnd = tStart + 0.35;

  var ratio = (t - tStart) / (tEnd - tStart);
  if (ratio < 0) ratio = 0;
  if (ratio > 1) ratio = 1;
  // 0.5% 步进，配合 rAF 接近丝滑
  var fillPct = Math.round(ratio * 200) / 2;
  var key = (line.time || 0) + ":" + fillPct;
  if (!force && key === _lastKtvFillKey) return;
  _lastKtvFillKey = key;
  lastWordIdx = Math.min(n - 1, Math.max(-1, Math.floor(ratio * n - 0.0001)));

  var sungColor = "";
  try {
    sungColor = (getComputedStyle(document.documentElement).getPropertyValue("--green") || "").trim();
  } catch(eC) {}
  if (!sungColor) sungColor = "#31c27c";
  var isDark = false;
  try { isDark = document.documentElement.getAttribute("data-mode") === "dark"; } catch(eD) {}
  var dimColor = isDark ? "rgba(235,235,245,.28)" : "rgba(60,60,67,.30)";

  // 整行扫光：挂在 .lyric-main 上，避免单字在「透明/实色」间切换导致闪烁
  var main = activeEl.querySelector(".lyric-main");
  if (main){
    main.classList.add("ktv-sweep");
    main.style.setProperty("--ktv-fill", fillPct + "%");
    main.style.backgroundImage = "linear-gradient(90deg," + sungColor + " 0%," + sungColor + " " + fillPct + "%," + dimColor + " " + fillPct + "%," + dimColor + " 100%)";
    main.style.webkitBackgroundClip = "text";
    main.style.backgroundClip = "text";
    main.style.color = "transparent";
    main.style.webkitTextFillColor = "transparent";
  }
  // 子字不再单独改色，去掉旧状态
  var spans = activeEl.querySelectorAll(".lyric-word");
  for (var j = 0; j < spans.length; j++){
    spans[j].classList.remove("sung", "current", "is-filling");
    spans[j].style.color = "";
    spans[j].style.backgroundImage = "";
    spans[j].style.webkitTextFillColor = "";
    spans[j].style.fontWeight = "";
  }
}

var _lyricScrollRaf = 0;
var _prevLyricForAnim = -1;
function smoothScrollLyrics(wrap, target, duration){
  if (!wrap) return;
  duration = duration || 0;
  if (duration <= 0 || Math.abs((wrap.scrollTop || 0) - target) < 1.5){
    wrap.scrollTop = target;
    return;
  }
  if (_lyricScrollRaf){
    try { cancelAnimationFrame(_lyricScrollRaf); } catch(e) {}
    _lyricScrollRaf = 0;
  }
  var start = wrap.scrollTop || 0;
  var diff = target - start;
  var t0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
  function step(now){
    _lyricScrollRaf = 0;
    var p = Math.min(1, (now - t0) / duration);
    // ease-out-cubic
    var e = 1 - Math.pow(1 - p, 3);
    wrap.scrollTop = start + diff * e;
    if (p < 1) _lyricScrollRaf = requestAnimationFrame(step);
  }
  _lyricScrollRaf = requestAnimationFrame(step);
}

function syncLyricsScroll(t, force){
  var arr = state.currentLyrics;
  if (!arr.length){
    try { updatePbLyricLine(t, true); } catch(e0) {}
    return;
  }
  var idx = 0;
  for (var i=0;i<arr.length;i++){ if (arr[i].time <= t) idx = i; else break; }
  var wrapList = $("#lyricsList");
  var lineChanged = force || (idx !== lastLyricIdx);

  if (lineChanged){
    _prevLyricForAnim = lastLyricIdx;
    lastLyricIdx = idx;
    lastWordIdx = -1;
    _lastKtvFillKey = "";
    try { updatePbLyricLine(t, force); } catch(e2) {}
    var lines = wrapList ? $all(".lyric-line", wrapList) : $all(".lyric-line");
    for (var j = 0; j < lines.length; j++){
      lines[j].classList.remove("active");
      // 清掉旧行逐字状态，避免残留绿色
      if (String(lines[j].dataset.i) !== String(idx)){
        var main0 = lines[j].querySelector(".lyric-main");
        if (main0){
          main0.classList.remove("ktv-sweep");
          main0.style.backgroundImage = "";
          main0.style.webkitBackgroundClip = "";
          main0.style.backgroundClip = "";
          main0.style.color = "";
          main0.style.webkitTextFillColor = "";
          main0.style.removeProperty("--ktv-fill");
        }
        var oldWs = lines[j].querySelectorAll(".lyric-word");
        for (var k = 0; k < oldWs.length; k++){
          oldWs[k].classList.remove("sung", "current", "is-filling");
          oldWs[k].style.color = "";
          oldWs[k].style.fontWeight = "";
          oldWs[k].style.backgroundImage = "";
          oldWs[k].style.webkitTextFillColor = "";
        }
      }
    }
    var active = wrapList ? $('.lyric-line[data-i="'+idx+'"]', wrapList) : $('.lyric-line[data-i="'+idx+'"]');
    if (active){
      if (typeof _prevLyricForAnim === "number" && _prevLyricForAnim >= 0 && wrapList){
        var prevEl = $('.lyric-line[data-i="'+_prevLyricForAnim+'"]', wrapList);
        if (prevEl && prevEl !== active){
          prevEl.classList.add("is-leaving");
          setTimeout(function(el){ try { el.classList.remove("is-leaving"); } catch(e){} }, 480, prevEl);
        }
      }
      active.classList.add("active");
      active.classList.remove("is-leaving");
      active.classList.add("is-entering");
      setTimeout(function(el){ try { el.classList.remove("is-entering"); } catch(e){} }, 500, active);
      var wrap = $("#lyricsWrap");
      if (wrap){
        var target = active.offsetTop - wrap.clientHeight/2 + active.clientHeight/2;
        target = Math.max(0, target);
        try { smoothScrollLyrics(wrap, target, force ? 0 : 420); } catch(eSc) {
          wrap.scrollTop = target;
        }
      }
      try { _syncKtvWords(active, arr[idx], t, true); } catch(eW) {}
    }
    _prevLyricForAnim = idx;
  } else {
    // 同行：只推进逐字高亮
    try { updatePbLyricLine(t, false); } catch(e1) {}
    var active2 = wrapList ? $('.lyric-line[data-i="'+idx+'"]', wrapList) : $('.lyric-line[data-i="'+idx+'"]');
    try { _syncKtvWords(active2, arr[idx], t, false); } catch(eW2) {}
  }
}

/* ---------- 专辑色彩提取 → 呼吸背景（signature element） ---------- */
var _colorCanvas = document.createElement("canvas"); _colorCanvas.width=16; _colorCanvas.height=16;
var _colorCtx = _colorCanvas.getContext("2d", {willReadFrequently:true});
/** 取色后压到中低亮度，保持饱和但不刺眼 */
function _boostColor(r, g, b){
  var max = Math.max(r,g,b), min = Math.min(r,g,b);
  var mid = (max + min) / 2;
  var sat = max === min ? 0 : (max - min) / (255 - Math.abs(2*mid - 255) || 1);
  var targetSat = Math.min(0.85, sat * 1.2 + 0.12);
  // 抬高亮度，让氛围光更接近 Apple Music 流动光晕
  var targetLum = Math.max(72, Math.min(160, mid * 0.9 + 36));
  function ch(c){
    var v = mid + (c - mid) * (targetSat / (sat || 0.01));
    v = v * (targetLum / (mid || 1));
    return Math.max(0, Math.min(255, Math.round(v)));
  }
  return "rgb("+ch(r)+","+ch(g)+","+ch(b)+")";
}
/** 浅色播放页用：粉彩高亮，饱和度适中，避免发脏发灰 */
function _boostLightColor(r, g, b){
  var max = Math.max(r,g,b), min = Math.min(r,g,b);
  var mid = (max + min) / 2;
  var sat = max === min ? 0 : (max - min) / (255 - Math.abs(2*mid - 255) || 1);
  var targetSat = Math.min(0.55, sat * 0.85 + 0.18);
  var targetLum = Math.max(175, Math.min(230, mid * 0.35 + 175));
  function ch(c){
    var v = mid + (c - mid) * (targetSat / (sat || 0.01));
    v = v * (targetLum / (mid || 1));
    return Math.max(0, Math.min(255, Math.round(v)));
  }
  return "rgb("+ch(r)+","+ch(g)+","+ch(b)+")";
}
function themeLightAmbientColors(){
  var t = state.theme || "apple";
  if (t === "qq") return ["#b8f0d4", "#b0e8f0", "#c4d4f8"];
  if (t === "kuwo") return ["#ffe2a8", "#ffd4a0", "#d8c8f0"];
  if (t === "kugou") return ["#b8e4ff", "#b0d0f0", "#c8d4f0"];
  if (t === "ytmusic") return ["#ffc0cc", "#f0b0c8", "#d4c0f0"];
  return ["#ffc8d0", "#d8c8f8", "#c4daf8"];
}
function themeAmbientColors(){
  var t = state.theme || "apple";
  // 更亮、更饱和，配合 screen 混合形成流动光
  if (t === "qq") return ["#2ecf8a", "#2aa8c4", "#4a6fe0"];
  if (t === "kuwo") return ["#ffc04a", "#e09030", "#7a5ad0"];
  if (t === "kugou") return ["#3ab8ff", "#2a7ad0", "#4a6ab0"];
  if (t === "ytmusic") return ["#ff4060", "#c03060", "#6040a0"];

function extractAmbientColor(url){
  if (!url){ applyAmbient(themeAmbientColors(), themeLightAmbientColors()); return; }
  var img = new Image();
  img.crossOrigin = "anonymous";
  var fallback = true;
  // 不再 900ms 强制回落主题色（会与封面取色打架导致闪一下）
  var tm = null;
  img.onload = function(){
    fallback = false; if (tm) clearTimeout(tm);
    try{
      if (!_colorCtx){ applyAmbient(themeAmbientColors(), themeLightAmbientColors()); return; }
      _colorCtx.drawImage(img,0,0,16,16);
      var data = _colorCtx.getImageData(0,0,16,16).data;
      var buckets = {};
      for (var i=0;i<data.length;i+=4){
        var r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
        if (a < 200) continue;
        if (r+g+b < 50 || r+g+b > 700) continue;
        var key = (r>>4)+","+(g>>4)+","+(b>>4);
        buckets[key] = (buckets[key]||0)+1;
      }
      var sorted = Object.keys(buckets).sort(function(a,b){ return buckets[b]-buckets[a]; });
      var top = sorted.slice(0,3).map(function(k){
        var p = k.split(",").map(function(n){ return (+n)<<4; });
        return _boostColor(p[0], p[1], p[2]);
      });
      var topLight = sorted.slice(0,3).map(function(k){
        var p = k.split(",").map(function(n){ return (+n)<<4; });
        return _boostLightColor(p[0], p[1], p[2]);
      });
      var defaults = themeAmbientColors();
      var defaultsL = themeLightAmbientColors();
      while (top.length<3) top.push(defaults[top.length] || defaults[0]);
      while (topLight.length<3) topLight.push(defaultsL[topLight.length] || defaultsL[0]);
      applyAmbient(top, topLight);
    }catch(e){ applyAmbient(themeAmbientColors(), themeLightAmbientColors()); }
  };
  img.onerror = function(){ fallback=false; if (tm) clearTimeout(tm); /* 失败保留上一套氛围色，不闪回主题色 */ };
  img.src = url;
}

   § 11. 登录
   ------------------------------------------------------------
   三种方式：

function parseCookieStr(str){
  var map = {};
  str.split(/;\s*/).forEach(function(kv){

    map[kv.slice(0,idx).trim()] = kv.slice(idx+1).trim();

/* ---------- 扫码登录（QQ互联标准流程） ---------- */
var qrPollTimer = null, qrSig = "";
function startQrLogin(){
  clearInterval(qrPollTimer);
  $("#qrMask").classList.remove("show");
  var t = Date.now();
  var url = "https://ssl.ptlogin2.qq.com/ptqrshow?appid=716027609&e=2&l=M&s=3&d=72&v=4&t="+Math.random()+"&daid=383&pt_3rd_aid=100497308";
  ADAPTER_request(url, {headers:{}}).then(function(resp){
    // 期望原生端返回 {body: base64图片, headers:{'set-cookie': 'qrsig=...'}} 或直接给出可用的 <img> 数据URI。
    drawQrFallback(); // 若原生未按预期返回结构化数据，退化为提示用户使用APP内「登录设备管理」扫描本机专属链接
    qrPollTimer = setInterval(pollQrStatus, 2500);
    setTimeout(function(){ clearInterval(qrPollTimer); $("#qrMask").classList.add("show"); }, 120000);
  }).catch(function(){
    drawQrFallback();
  });
}
function drawQrFallback(){
  var ctx = $("#qrCanvas").getContext("2d");
  ctx.fillStyle = "#111"; ctx.fillRect(0,0,160,160);
  ctx.fillStyle = "#fff"; ctx.font = "12px sans-serif"; ctx.textAlign="center";
  ctx.fillText("请在真机环境", 80, 70);
  ctx.fillText("联调二维码渲染", 80, 90);
}
function pollQrStatus(){
  var url = "https://ssl.ptlogin2.qq.com/ptqrlogin?u1=https%3A%2F%2Fy.qq.com%2F&ptqrtoken="+qrSig+
    "&ptredirect=0&h=1&t=1&g=1&from_ui=1&ptlang=2052&action=0-0-"+Date.now()+"&js_ver=20102616&js_type=1&pt_uistyle=40&aid=716027609&daid=383&&pt_3rd_aid=100497308";
  ADAPTER_request(url, {headers:{}}).then(function(txt){
    if (/ptuiCB\('0'/.test(txt)){
      // 扫码成功，txt 中包含跳转 URL，据此换取最终 Cookie（需原生端在跟随重定向时保留 Set-Cookie）
      clearInterval(qrPollTimer);
      toast("扫码成功，正在登录…");
      // 实际 Cookie 通常由原生端在重定向链路中自动落盘；此处尝试直接读取原生 CookieManager（如可用）
      if (window.fm && typeof window.fm.getCookie === "function"){
        var ck = window.fm.getCookie("y.qq.com");
        if (ck) applyLogin(ck);
        else toast("未获取到登录 Cookie，请改用「Cookie登录」手动粘贴");
      } else {
        toast("请改用「Cookie登录」标签页，从浏览器或登录态路径中粘贴完整 Cookie 完成登录");
      }
    } else if (/ptuiCB\('65'/.test(txt)){
      clearInterval(qrPollTimer); $("#qrMask").classList.add("show");
    }
  }).catch(function(){});
}


function bindEvents(){
  $all(".nav-item").forEach(function(n){ n.onclick = function(){ switchView(n.dataset.view); }; });

  // 主界面左右滑动切换一级 tab（推荐/排行/歌单/歌手/我的）
  (function bindMainTabSwipe(){
    var vp = document.getElementById("viewport");
    if (!vp || vp._mainSwipeBound) return;
    vp._mainSwipeBound = true;
    var MAIN_TABS = ["home", "toplist", "playlists", "singers", "mine"];
    var sx = 0, sy = 0, tracking = false, decided = false, axis = "";
    var THRESH = 64;
    function curIdx(){
      var v = state.view || "home";
      var i = MAIN_TABS.indexOf(v);
      return i < 0 ? 0 : i;
    }
    vp.addEventListener("touchstart", function(e){
      if (!e.touches || !e.touches[0]) return;
      // 浮层 / 详情 / 搜索 / 全屏播放器打开时不抢手势
      if (state.view === "detail" || state.view === "search" || state.view === "singerDetail") return;
      try {
        var fp = document.getElementById("fullPlayer");
        if (fp && fp.classList.contains("show")) return;
      } catch(e0) {}
      // 横向滚动容器内不触发
      var t = e.target;
      if (t && t.closest){
        if (t.closest(".hscroll, .singer-hscroll, .voice-hscroll, .hero, #sourceTabs, .channel-tabs, .voice-all-tabs")) return;
      }
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
      tracking = true;
      decided = false;
      axis = "";
    }, { passive: true });
    vp.addEventListener("touchmove", function(e){
      if (!tracking || !e.touches || !e.touches[0]) return;
      var dx = e.touches[0].clientX - sx;
      var dy = e.touches[0].clientY - sy;
      if (!decided){
        if (Math.abs(dx) < 14 && Math.abs(dy) < 14) return;
        decided = true;
        axis = Math.abs(dx) > Math.abs(dy) * 1.35 ? "x" : "y";
      }
    }, { passive: true });
    vp.addEventListener("touchend", function(e){
      if (!tracking) return;
      tracking = false;
      if (axis !== "x") return;
      if (state.view === "detail" || state.view === "search" || state.view === "singerDetail") return;
      var t = (e.changedTouches && e.changedTouches[0]) || null;
      if (!t) return;
      var dx = t.clientX - sx;
      if (Math.abs(dx) < THRESH) return;
      var idx = curIdx();
      if (dx < 0 && idx < MAIN_TABS.length - 1){
        switchView(MAIN_TABS[idx + 1]);
      } else if (dx > 0 && idx > 0){
        switchView(MAIN_TABS[idx - 1]);
      }
    }, { passive: true });
    vp.addEventListener("touchcancel", function(){ tracking = false; }, { passive: true });
  })();

    function clear(){ if (tm){ clearTimeout(tm); tm = null; } }
    function onStart(e){
      moved = false; longPressed = false;
      var t = e.touches ? e.touches[0] : e;
      startX = t.clientX; startY = t.clientY;
      clear();
      tm = setTimeout(function(){
        tm = null; longPressed = true;

      }, 480);
    }
    function onMove(e){
      if (!tm && !longPressed) return;
      var t = e.touches ? e.touches[0] : e;

        moved = true; clear();
      }
    }
    function onEnd(){ clear(); }
    mark.addEventListener("touchstart", onStart, { passive: true });
    mark.addEventListener("touchmove", onMove, { passive: true });
    mark.addEventListener("touchend", onEnd, { passive: true });
    mark.addEventListener("touchcancel", onEnd, { passive: true });

  // 播放倍速：1.0 → 1.25 → 1.5 → 1.75 → 2.0 → 0.75 → 1.0
  var SPEED_STEPS = [1, 1.25, 1.5, 1.75, 2, 0.75];
  function formatSpeed(r){
    var n = Math.round((+r || 1) * 100) / 100;
    if (n === 1) return "1.0x";
    if (n === Math.floor(n)) return n.toFixed(1) + "x";
    return String(n) + "x";
  }
  function applyPlaybackSpeed(rate, silent){
    var r = +rate || 1;
    if (!(r > 0) || !isFinite(r)) r = 1;
    state.playbackRate = r;
    try { if (audio) audio.playbackRate = r; } catch(e1) {}
    try { if (typeof audioNext !== "undefined" && audioNext) audioNext.playbackRate = r; } catch(e2) {}
    var btn = $("#fpSpeed");
    if (btn){
      btn.textContent = formatSpeed(r);
      btn.title = "播放倍速 " + formatSpeed(r) + "（点击切换）";
      btn.classList.toggle("on", Math.abs(r - 1) > 0.01);
    }
    try { storeSet("playbackRate", r); } catch(e3) {}
    if (!silent && Math.abs(r - 1) > 0.01) toast("倍速 " + formatSpeed(r));
  }
  function cyclePlaybackSpeed(){
    var cur = +state.playbackRate || 1;
    var idx = 0, best = 1e9;
    for (var i = 0; i < SPEED_STEPS.length; i++){
      var d = Math.abs(SPEED_STEPS[i] - cur);
      if (d < best){ best = d; idx = i; }
    }
    var next = SPEED_STEPS[(idx + 1) % SPEED_STEPS.length];
    applyPlaybackSpeed(next, false);
  }
  try {
    var savedSp = parseFloat(storeGet("playbackRate", 1));
    if (isFinite(savedSp) && savedSp > 0) state.playbackRate = savedSp;
    else state.playbackRate = 1;

  // progress bar drag（迷你栏 + 全屏播放器）
  var draggingBar = false, activeSeekBar = null;
  function seekFromEvent(e, barEl){
    var bar = barEl || activeSeekBar || $("#pbBar");
    if (!bar) return;
    var rect = bar.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    var d = audio.duration || (state.queue[state.queueIndex]&&state.queue[state.queueIndex].interval) || 0;
    if (d) audio.currentTime = pct * d;
    updateProgressUI(pct * d, d);
  }
  function bindSeekBar(bar){
    if (!bar) return;
    bar.addEventListener("mousedown", function(e){ draggingBar=true; activeSeekBar=bar; seekFromEvent(e, bar); });
    bar.addEventListener("touchstart", function(e){ draggingBar=true; activeSeekBar=bar; seekFromEvent(e, bar); e.preventDefault(); }, {passive:false});
    bar.addEventListener("touchmove", function(e){ if (draggingBar){ seekFromEvent(e, bar); e.preventDefault(); } }, {passive:false});
    bar.addEventListener("touchend", function(){ draggingBar=false; activeSeekBar=null; });
  }
  bindSeekBar($("#pbBar"));

/** 全屏播放页手势：下滑关闭；左侧边缘不拦截，交给系统返回 */
function bindFullPlayerGesture(){
  var fp = $("#fullPlayer");
  if (!fp || fp._gestureBound) return;
  fp._gestureBound = true;
  var startY = 0, startX = 0, dragging = false, moved = false, edgeStart = false;
  var EDGE = 56; // 左侧边缘完整留给系统侧滑返回

  function onStart(e){
    if (!fp.classList.contains("show") || _fpClosing) return;
    var t = e.touches ? e.touches[0] : e;
    // 系统侧滑返回：左边缘起点完全不接管，也不 preventDefault
    if (t.clientX <= EDGE){
      edgeStart = true;
      dragging = false;
      moved = false;
      return;
    }
    edgeStart = false;
    var scrollEl = e.target.closest("#lyricsWrap, #playlistPanel");
    if (scrollEl && scrollEl.scrollTop > 2) return;
    // 顶栏关闭按钮 / 进度 / 控制区：不启动下拉，避免与点击关闭冲突
    if (e.target.closest(".fp-topbar, .fp-close, .fp-bar, .fp-ctrls, .fp-play, .fp-ctrl-btn, .fp-quick, .fp-dock")) return;
    startY = t.clientY; startX = t.clientX;
    dragging = true; moved = false;
    fp.style.transition = "none";
  }
  function onMove(e){
    // 边缘起点：全程放行，绝不 preventDefault
    if (edgeStart || _fpClosing) return;
    if (!dragging) return;
    var t = e.touches ? e.touches[0] : e;
    var dy = t.clientY - startY;
    var dx = t.clientX - startX;
    // 明显横向滑动：放弃本地下滑关闭，不 preventDefault，避免干扰系统手势
    if (!moved && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10){
      dragging = false;
      fp.style.transform = "translate3d(0,0,0)";
      fp.style.opacity = "1";
      return;
    }
    if (dy < 0) dy = 0;
    if (dy > 6) moved = true;
    if (moved){
      fp.style.transform = "translateY("+dy+"px)";
      fp.style.opacity = String(Math.max(0.35, 1 - dy / (window.innerHeight * 0.7)));
      if (e.cancelable) e.preventDefault();
    }
  }
  function onEnd(e){
    if (edgeStart){ edgeStart = false; dragging = false; moved = false; return; }
    if (!dragging && !moved) return;
    dragging = false;
    if (_fpClosing) return;
    var t = (e.changedTouches && e.changedTouches[0]) || e;
    var dy = (t ? t.clientY : startY) - startY;
    if (moved && dy > 100){
      if (fp.classList.contains("lyrics-focus")){
        fp.style.transition = "transform .35s cubic-bezier(0.22,1,0.36,1), opacity .25s ease";
        fp.style.transform = "translate3d(0,0,0)";
        fp.style.opacity = "1";
        // 只退歌词层；history.back 延后，避免与手指抬起抢手势
        setTimeout(function(){ try { exitLyricsFocus(false); } catch(eL) {} }, 10);
      } else {
        // 下拉关闭：先锁 _fpClosing，再关；history 由 closeFullPlayer 延后处理
        closeFullPlayer(false);
      }
    } else {
      fp.style.transition = "transform .45s cubic-bezier(0.34,1.56,0.64,1), opacity .3s ease";
      fp.style.transform = "translate3d(0,0,0)";
      fp.style.opacity = "1";
    }
    moved = false;
  }
  fp.addEventListener("touchstart", onStart, { passive: true });
  fp.addEventListener("touchmove", onMove, { passive: false });
  fp.addEventListener("touchend", onEnd, { passive: true });
  fp.addEventListener("touchcancel", onEnd, { passive: true });
}


var FOCUSABLE_SEL = ".nav-item,.card,.mv-card,.radio-card,.rank-card,.song-row,.hero-play,.login-btn,.cookie-area,.sr-tab,.hot-search-tag,.pb-play,.pb-ctrl-btn,.fp-tab,.lyric-line";
var curFocusEl = null;
function tvFocusables(){
  return $all(FOCUSABLE_SEL).filter(function(e){
    var r = e.getBoundingClientRect();
    return r.width>0 && r.height>0 && r.top < window.innerHeight && r.bottom > -50;
  });
}
function setTvFocus(node){
  if (curFocusEl) curFocusEl.classList.remove("tv-focus");
  curFocusEl = node;
  if (node){ node.classList.add("tv-focus"); node.scrollIntoView({block:"nearest", inline:"nearest", behavior:"smooth"}); }
}
function moveTvFocus(dir){
  var list = tvFocusables();
  if (!list.length) return;
  if (!curFocusEl || list.indexOf(curFocusEl) === -1){ setTvFocus(list[0]); return; }
  var r0 = curFocusEl.getBoundingClientRect();
  var c0 = {x:r0.left+r0.width/2, y:r0.top+r0.height/2};
  var best=null, bestScore=Infinity;
  list.forEach(function(node){
    if (node===curFocusEl) return;
    var r = node.getBoundingClientRect();
    var c = {x:r.left+r.width/2, y:r.top+r.height/2};
    var dx=c.x-c0.x, dy=c.y-c0.y;
    var ok = dir==="left"?dx<-4 : dir==="right"?dx>4 : dir==="up"?dy<-4 : dy>4;
    if (!ok) return;
    var primary = (dir==="left"||dir==="right") ? Math.abs(dx) : Math.abs(dy);
    var secondary = (dir==="left"||dir==="right") ? Math.abs(dy) : Math.abs(dx);
    var score = primary + secondary*2.2;
    if (score < bestScore){ bestScore = score; best = node; }
  });
  if (best) setTvFocus(best);
}
document.addEventListener("keydown", function(e){
  // 系统返回键 / Backspace：全局统一处理（手机 WebView + TV）
  // 输入框内的 Backspace 用于删字，绝不能当成返回
  if (e.key === "Backspace" || e.keyCode === 4 || e.key === "Escape"){
    var t = e.target;
    var tag = (t && t.tagName) ? t.tagName.toUpperCase() : "";
    var typing = tag === "INPUT" || tag === "TEXTAREA" || (t && t.isContentEditable);
    // Escape 在输入框内：仅失焦，不返回（官方常见行为）
    if (typing && e.key === "Escape"){
      try { t.blur(); } catch(err) {}
      e.preventDefault();
      return;
    }
    // 输入框内 Backspace：放行给系统删字
    if (typing && (e.key === "Backspace" || e.keyCode === 4)){
      return;
    }
    if (handleBack()){
      e.preventDefault();
      e.stopPropagation();
    }
    return;
  }
  if (!state.isTv) return;
  var map = {ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
  if (map[e.key]){ e.preventDefault(); moveTvFocus(map[e.key]); }
  else if (e.key==="Enter" || e.keyCode===13){ if (curFocusEl) curFocusEl.click(); }
});
document.addEventListener("click", function(e){
  if (!state.isTv) return;
  var target = e.target.closest(FOCUSABLE_SEL);

}, true);

  window.addEventListener("pagehide", function(){
    try {
      if (_userPaused || (audio && audio.paused)) _wasPlayingBeforeHide = false;
      else _wasPlayingBeforeHide = !!(audio && !audio.paused);
    } catch(e) {}
    try { prefetchNextPlayUrl(); } catch(e2) {}
  });
  window.addEventListener("pageshow", function(){
    try { tryResumeAfterBackground(); } catch(e) {}
    try {
      var fpP = $("#fullPlayer");
      if (fpP && fpP.classList.contains("show")) ensurePlayerHistory();
    } catch(e3) {}
  });
  // Page Lifecycle：部分 Chrome/WebView 息屏会 freeze，解冻后补续播
  try {
    document.addEventListener("freeze", function(){
      try {
        if (!_userPaused && audio && !audio.paused) _wasPlayingBeforeHide = true;
        prefetchNextPlayUrl();
      } catch(eF) {}
    });
  } catch(eF0) {}
  try {
    document.addEventListener("resume", function(){
      try { tryResumeAfterBackground(); } catch(eR) {}
    });
  } catch(eR0) {}
  // 从后台回来重新申请锁
  try {
    document.addEventListener("visibilitychange", function(){
      if (document.visibilityState === "visible" && audio && !audio.paused && !_userPaused){
        try { requestPlayWakeLock(); } catch(e) {}
      }
    });
  } catch(eV2) {}
  // 每 10 分钟检查一次是否跨入新时段（页面一直挂着不切页时也能更新）
  setInterval(function(){
    try {
      if (state.view === "home") maybeRefreshDaily(false);
    } catch(e) {}
  }, 10 * 60 * 1000);

  if (state.isTv) setTimeout(function(){ setTvFocus(tvFocusables()[0]); }, 400);
  try { syncFpLayoutMode(); } catch(e) {}
}

function init(){
  // App 内必须先等 fm 注入，再发请求；否则会误走 JSONP/fetch 拿不到数据
  whenFm(5000).then(function(fmObj){
    if (fmObj) console.log("[qqm] fm SDK ready");
    else console.warn("[qqm] fm SDK not found, fallback JSONP/fetch");
    bootApp();
  }).catch(function(){ bootApp(); });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();


/* 宿主返回键：优先走 handleBack，避免全屏播放器时直接退出 */
(function bindHostBack(){
  try {
    if (window.fm && window.fm.ui && typeof window.fm.ui.onBack === "function"){
      window.fm.ui.onBack(function(){
        return handleBack();
      });
    }
  } catch(e) {}
  // 部分 WebHome 用这个
  try {
    window.__onBackPressed = function(){ return handleBack(); };
  } catch(e2) {}
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" || e.keyCode === 27){
      if (isOverlayOpen()){
        e.preventDefault();
        handleBack();
      }
    }
  }, true);
})();

})();

</script>
