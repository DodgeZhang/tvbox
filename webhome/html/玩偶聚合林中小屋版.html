/* ══ iOS26 胶囊按钮：透明液态玻璃 ══ */
:root[data-theme="ios26"] .tab,
:root[data-theme="ios26"] .chip,
:root[data-theme="ios26"] .btn,
:root[data-theme="ios26"] .search button,
:root[data-theme="ios26"] .pager button,
:root[data-theme="ios26"] .back-fixed{position:relative;overflow:visible;border:1px solid rgba(255,255,255,.1);border-radius:999px;z-index:0;color:#fff;font-weight:700;
  background:linear-gradient(180deg,rgba(255,255,255,.1) 0%,rgba(255,255,255,.02) 60%,rgba(255,255,255,.04) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.2),0 3px 12px rgba(0,0,0,.15)}
/* ══ 镜面反射高光 ══ */
:root[data-theme="ios26"] .tab::after,
:root[data-theme="ios26"] .chip::after,
:root[data-theme="ios26"] .btn::after,
:root[data-theme="ios26"] .search button::after,
:root[data-theme="ios26"] .pager button::after,
:root[data-theme="ios26"] .back-fixed::after{content:'';position:absolute;inset:2px;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.12) 10%,transparent 35%)}
/* ══ 底部折射暗边 ══ */
:root[data-theme="ios26"] .tab::before,
:root[data-theme="ios26"] .chip::before,
:root[data-theme="ios26"] .btn::before,
:root[data-theme="ios26"] .search button::before,
:root[data-theme="ios26"] .pager button::before,
:root[data-theme="ios26"] .back-fixed::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(0deg,rgba(0,0,0,.12) 0%,transparent 30%)}
/* ══ 激活态：染色玻璃 ══ */
:root[data-theme="ios26"] .tab.active,
:root[data-theme="ios26"] .chip.active,
:root[data-theme="ios26"] .search button{border-color:rgba(141,200,255,.25);
  background:linear-gradient(180deg,rgba(94,163,249,.4) 0%,rgba(94,163,249,.08) 60%,rgba(94,163,249,.15) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.25),0 0 20px rgba(94,163,249,.25),0 0 50px rgba(94,163,249,.08)}
:root[data-theme="ios26"] .tab.active::after,
:root[data-theme="ios26"] .chip.active::after,
:root[data-theme="ios26"] .search button::after{background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.15) 12%,transparent 38%)}
:root[data-theme="ios26"] .tab.active::before,
:root[data-theme="ios26"] .chip.active::before,
:root[data-theme="ios26"] .search button::before{background:linear-gradient(0deg,rgba(0,0,0,.18) 0%,transparent 35%)}
/* ══ 卡片 ══ */
:root[data-theme="ios26"] .card{border:1px solid rgba(255,255,255,.08);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,.02) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.15)}
/* ══ 搜索框 ══ */
:root[data-theme="ios26"] .search{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}

.sheet{position:fixed;inset:0;z-index:40;display:none;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0}.sheet.active{display:block}.sheet .back-fixed{position:fixed;top:max(calc(var(--safe-top) + 10px),10px);left:12px;z-index:50;display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:6px 14px;color:#fff;background:rgba(0,0,0,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:999px}.det-hero{position:fixed;top:0;left:0;z-index:0;width:100%;height:80vh;overflow:hidden;background:#111827}.det-hero::before{content:'';position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(180deg,transparent 75%,rgba(17,24,39,.5) 86%,rgba(17,24,39,.9) 94%,var(--bg) 100%)}.det-hero img{width:100%;height:100%;object-fit:cover;object-position:center 20%;position:absolute;inset:0;transition:opacity .5s ease;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 75%,rgba(0,0,0,.4) 85%,rgba(0,0,0,.05) 93%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,#000 75%,rgba(0,0,0,.4) 85%,rgba(0,0,0,.05) 93%,transparent 100%)}.det-hero .det-hero-blur{position:absolute;inset:0;z-index:2;object-fit:cover;filter:blur(28px);-webkit-mask-image:linear-gradient(180deg,transparent 40%,#000 65%,#000 100%);mask-image:linear-gradient(180deg,transparent 40%,#000 65%,#000 100%);transform:scale(1.1)}.det-hero::after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(17,24,39,.05) 0%,rgba(17,24,39,0) 30%,rgba(17,24,39,.3) 70%,rgba(17,24,39,.8) 100%);pointer-events:none}.det-info{position:relative;z-index:10;margin-top:46vh;padding:28px 14px 20px}.det-info .title{font-size:clamp(28px,7vw,42px);font-weight:900;line-height:1.05;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.8)}.det-info .title-logo{display:block;max-width:70vw;max-height:80px;margin-bottom:8px;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}.det-info .hidden{display:none}.det-info .meta-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.det-info .meta-tag{padding:5px 10px;border-radius:999px;background:rgba(var(--accent-rgb),.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(var(--accent2-rgb),.3);color:var(--accent2);font-size:13px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5)}.det-section{position:relative;z-index:10;margin-top:24px;padding:0 14px}.det-section:last-child{padding-bottom:40px}.det-section h3{font-size:17px;font-weight:800;color:#fff;margin:0 0 10px}.det-cast{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:0 0 8px}.det-cast::-webkit-scrollbar{display:none}.cast-card{flex:0 0 90px;text-align:center;cursor:pointer}.cast-card:active{opacity:.7}.cast-card img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.08);margin:0 auto 6px}.cast-card .cast-name{font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cast-card .cast-role{font-size:11px;color:var(--muted);margin-top:2px}.rec-row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:0 0 8px}.rec-row::-webkit-scrollbar{display:none}.rec-card{flex:0 0 130px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);cursor:pointer}.rec-card:active{opacity:.7}.rec-card img{width:100%;aspect-ratio:3/4;object-fit:cover}.rec-card .rec-title{font-size:12px;font-weight:700;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}.pan-list{display:flex;flex-direction:column;gap:6px}.pan-item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}.pan-type{padding:3px 7px;border-radius:999px;background:rgba(var(--accent2-rgb),.15);border:1px solid rgba(var(--accent2-rgb),.25);color:var(--accent2);font-size:11px;font-weight:800}.pan-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pan-url{color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:20vw}.empty{padding:34px 18px;text-align:center;color:var(--muted);background:var(--soft);border:1px dashed var(--line);border-radius:var(--radius)}

async function tmdbPosterFullCached(title,year){let item=await tmdbMatchCached(title,year);return item&&item.poster_path?TMDB_IMG_FULL+item.poster_path:null}

let _suggSeq=0,_suggTimer=null;const _suggCache=new Map();
function hideSugg(){searchSugg.classList.remove('show');searchSugg.innerHTML=''}
function mediaTypeLabel(t,genres){if(t==='tv'&&genres&&genres.includes(16))return'动漫';return t==='tv'?'剧集':t==='movie'?'电影':''}
function mediaTypeClass(t,genres){if(t==='tv'&&genres&&genres.includes(16))return' anime';return t==='movie'?' movie':t==='tv'?' tv':''}
async function tmdbSuggest(q){let key=q.toLowerCase();if(_suggCache.has(key))return _suggCache.get(key);let p=tmdbJSON(`${TMDB_API}/search/multi?api_key=${TMDB_KEY}&language=zh-CN&include_adult=false&page=1&query=${encodeURIComponent(q)}`).then(d=>(d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').map(x=>({title:x.title||x.name||x.original_title||x.original_name||'',year:(x.release_date||x.first_air_date||'').slice(0,4),poster:x.poster_path?TMDB_IMG_SUGG+x.poster_path:'',type:x.media_type,genres:x.genre_ids||[],pop:x.popularity||0})).filter(x=>x.title).sort((a,b)=>b.pop-a.pop).slice(0,8)).catch(()=>[]);_suggCache.set(key,p);return p}
function renderSugg(list){if(!list.length){hideSugg();return}searchSugg.innerHTML=list.map(s=>`<div class="sugg-item"><div class="sugg-poster">${s.poster?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(s.poster)}" alt="" onerror="this.onerror=null;this.outerHTML='<span class=ph>🎬</span>'">`:'<span class="ph">🎬</span>'}</div><div class="sugg-info"><div class="sugg-title">${esc(s.title)}</div><div class="sugg-meta">${s.type?`<span class="sugg-type${mediaTypeClass(s.type,s.genres)}">${mediaTypeLabel(s.type,s.genres)}</span>`:''}${s.year?`<span class="sugg-year">${esc(s.year)}</span>`:''}</div></div></div>`).join('');[...searchSugg.children].forEach((el,i)=>{el.addEventListener('click',()=>{let s=list[i];kw.value=s.title;hideSugg();kw.blur();search(s.title,s.year?{year:s.year}:undefined)})});let r=searchForm.getBoundingClientRect();searchSugg.style.left=r.left+'px';searchSugg.style.top=(r.bottom+8)+'px';searchSugg.style.width=r.width+'px';searchSugg.classList.add('show')}
async function onSuggInput(){let q=kw.value.trim();let minLen=/[\u4e00-\u9fa5]/.test(q)?1:2;if(q.length<minLen){hideSugg();return}let seq=++_suggSeq;try{let list=await tmdbSuggest(q);if(seq!==_suggSeq)return;if(kw.value.trim()!==q)return;renderSugg(list)}catch(e){hideSugg()}}
kw.addEventListener('input',()=>{clearTimeout(_suggTimer);_suggTimer=setTimeout(onSuggInput,260)});
kw.addEventListener('focus',()=>{if(kw.value.trim())onSuggInput()});
document.addEventListener('pointerdown',function(e){if(!searchForm.contains(e.target)&&!searchSugg.contains(e.target))hideSugg()},true);

function _altHost(u){return u.indexOf('://image.tmdb.org')!==-1?u.replace('://image.tmdb.org','://images.tmdb.org'):u.indexOf('://images.tmdb.org')!==-1?u.replace('://images.tmdb.org','://image.tmdb.org'):u}
function _setPoster(imgEl,pic){if(!pic||!imgEl)return;imgEl.removeAttribute('src');imgEl.style.display='';let triedAlt=false,retried=0;imgEl.onerror=()=>{if(!triedAlt){triedAlt=true;let a=_altHost(pic);if(a&&a!==pic){imgEl.src=a;return}}if(!retried){retried=1;setTimeout(()=>{imgEl.style.display='';imgEl.src=pic+(pic.includes('?')?'&':'?')+'_t='+Date.now()},3000)}else{imgEl.style.display='none'}};imgEl.src=pic}
let _coverTimer=null,_coverIdx=0,_coverUrls=[];
function startCoverRotation(urls){stopCoverRotation();_coverUrls=urls.filter(Boolean);_coverIdx=0;if(_coverUrls.length>1){_coverTimer=setInterval(()=>{let next=(_coverIdx+1)%_coverUrls.length;let img=new Image();img.onload=()=>{_coverIdx=next;let pic=$('#detPic'),blur=document.querySelector('.det-hero-blur');if(pic)pic.src=_coverUrls[_coverIdx];if(blur)blur.src=_coverUrls[_coverIdx]};img.src=_coverUrls[next]},4500)}}
function stopCoverRotation(){if(_coverTimer){clearInterval(_coverTimer);_coverTimer=null}}
async function loadTmdbExtras(tmdbId,mediaType){let type=mediaType==='tv'?'tv':'movie';try{let d=await tmdbJSON(`${TMDB_API}/${type}/${tmdbId}?api_key=${TMDB_KEY}&language=zh-CN&append_to_response=credits,recommendations,images&include_image_language=zh,null,en`);if(!d)return;let logo=d.images&&d.images.logos;if(logo&&logo.length){let best=logo.sort((a,b)=>(b.vote_average||0)-(a.vote_average||0))[0];if(best&&best.file_path){let l=document.getElementById('detLogo'),t=document.getElementById('detTitle')||document.querySelector('.det-info .title');if(l){l.src=TMDB_IMG_FULL+best.file_path;l.classList.remove('hidden');l.onerror=()=>{l.classList.add('hidden')}}if(t)t.classList.add('hidden')}}let backdrops=(d.images&&d.images.backdrops||[]).map(b=>TMDB_IMG_FULL+b.file_path).filter(Boolean).slice(0,5);let poster=d.poster_path?TMDB_IMG_FULL+d.poster_path:'';let urls=[poster,...backdrops].filter(Boolean);if(urls.length>1)startCoverRotation(urls);let cast=(d.credits&&d.credits.cast||[]).filter(p=>p.profile_path).slice(0,10);if(cast.length){$('#detCast').style.display='';let h=cast.map(p=>`<div class="cast-card" data-search="${esc(p.name)}"><img loading="lazy" referrerpolicy="no-referrer" src="${TMDB_IMG_SUGG+p.profile_path}" onerror="this.style.display='none'"><div class="cast-name">${esc(p.name)}</div><div class="cast-role">${esc(p.character||'')}</div></div>`).join('');$('#detCastList').innerHTML=h;$('#detCastList').querySelectorAll('.cast-card').forEach(c=>c.onclick=()=>{let q=c.dataset.search;if(q){kw.value=q;closeDetail();search(q)}})}let recs=(d.recommendations&&d.recommendations.results||[]).filter(x=>x.poster_path).slice(0,18);if(recs.length){$('#detRec').style.display='';let h=recs.map(x=>`<article class="rec-card" data-search="${esc(x.title||x.name||'')}"><img loading="lazy" referrerpolicy="no-referrer" src="${TMDB_IMG_SUGG+x.poster_path}" onerror="this.style.display='none'"><div class="rec-title">${esc(x.title||x.name||'')}</div></article>`).join('');$('#detRecGrid').innerHTML=h;$('#detRecGrid').querySelectorAll('.rec-card').forEach(c=>c.onclick=()=>{let q=c.dataset.search;if(q){kw.value=q;closeDetail();search(q)}})}}catch(e){}}
async function openDetail(v){if(location.hash!=='#detail')history.pushState({wo:'detail'},'','#detail');sheet.classList.remove('detail-ready');sheet.classList.add('active');$('#backFixed').style.display='none';$('#backFixed').onclick=closeDetail;sp.innerHTML='';try{let d=await parseDetail(v),info=d.info;let srcPic=info.pic||v.pic||'';let dispTitle=info.title||v.title;let dispMeta=`<span class="meta-tag">${esc((v.sources||[v]).map(x=>x.siteName).join(' · ')+' · '+d.pans.length+'条资源')}</span>`;let tmdbItem=await tmdbMatchCached(v.title||'',extractYear(v));if(tmdbItem){let tt=tmdbItem.title||tmdbItem.name||tmdbItem.original_name||tmdbItem.original_title||'';if(tt)dispTitle=tt;let score=tmdbItem.vote_average?Number(tmdbItem.vote_average).toFixed(1):'';let year=(tmdbItem.release_date||tmdbItem.first_air_date||'').slice(0,4);let typeLabel=tmdbItem.media_type==='tv'?'剧集':'电影';let genres=(tmdbItem.genre_ids||[]).slice(0,4).map(id=>({28:'动作',12:'冒险',16:'动画',35:'喜剧',80:'犯罪',99:'纪录',18:'剧情',10751:'家庭',14:'奇幻',36:'历史',27:'恐怖',10402:'音乐',9648:'悬疑',10749:'爱情',878:'科幻',53:'惊悚',10752:'战争',37:'西部'})[id]||'').filter(Boolean);let tags=[score?score+'分':'',year,typeLabel,...genres].filter(Boolean);if(tags.length)dispMeta=tags.map(t=>`<span class="meta-tag">${esc(t)}</span>`).join('')}sp.innerHTML=`<div class="det-hero"><img id="detPic" referrerpolicy="no-referrer" src="${esc(srcPic)}" onerror="this.style.display='none'"><img class="det-hero-blur" referrerpolicy="no-referrer" src="${esc(srcPic)}" onerror="this.style.display='none'"></div><div class="det-info"><img class="title-logo hidden" id="detLogo"><div class="title">${esc(dispTitle)}</div><div class="meta-row">${dispMeta}</div></div><div class="det-section pan-section"><h3>网盘资源</h3><div class="pan-list">${d.pans.map((p,i)=>`<div class="pan-item"><span class="pan-type">${esc(p.type)}</span><div><div class="pan-name">${esc(p.name)}</div><div class="pan-url">${esc(p.url.slice(0,40))}${p.url.length>40?'…':''}</div></div><button class="btn" data-i="${i}" style="font-size:12px;padding:5px 10px">打开</button></div>`).join('')||'<div class="empty">未提取到网盘链接</div>'}</div><div class="det-section" id="detCast" style="display:none"><h3>演员表</h3><div class="det-cast" id="detCastList"></div></div><div class="det-section" id="detRec" style="display:none"><h3>相关推荐</h3><div class="rec-row" id="detRecGrid"></div></div>`;sheet.classList.add('detail-ready');$('#backFixed').style.display='';sp.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>playPan(d.pans[parseInt(b.dataset.i)]));let detPic=$('#detPic');if(detPic&&srcPic){tmdbPosterFullCached(v.title||'',extractYear(v)).then(tp=>{if(tp)_setPoster(detPic,tp)}).catch(()=>{})}if(tmdbItem&&tmdbItem.id){loadTmdbExtras(tmdbItem.id,tmdbItem.media_type)}}catch(e){sp.innerHTML='<div class="det-info"><div class="empty">详情失败：'+esc(e.message)+'</div></div>';sheet.classList.add('detail-ready');$('#backFixed').style.display=''}}
async function playPan(p){let u=p.url;if(window.fm&&fm.play){await fm.play(u.startsWith('magnet:')?u:'push://'+u,p.name);return}location.href=u}
function closeDetail(){history.back()}function _doCloseSheet(){sheet.classList.remove('active');sheet.classList.remove('detail-ready');$('#backFixed').style.display='none';stopCoverRotation()}
sheet.addEventListener('click',function(e){if(e.target===sheet)closeDetail()});
window.__woClose=closeDetail;_ensureHome();
searchForm.onsubmit=e=>{e.preventDefault();hideSugg();let q=kw.value.trim();q?search(q):loadCategory()};
aggBtn.onclick=()=>{aggregate=!aggregate;aggBtn.textContent=aggregate?'聚合':'单站'};
activeCat=site().cats[0][0];renderTabs();renderChips();loadCategory();
})();
</script>
