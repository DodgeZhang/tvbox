<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="./POMO_files/css2" rel="stylesheet">

<style>
/* ============================================================
   POMO ARCHIVE — UI 语言移植自「发布页」：档案/终端美学
   Oswald + JetBrains Mono，深海军蓝底 + 金/青强调色，
   扫描线 + 网格背景 + 粒子连线氛围，"CASE FILE" 卡片语法。
   功能移植自 pinglian.html 的 pm(pomo) 网盘明链源模块。
   ============================================================ */
:root{
  --bg:#060c16;
  --panel:#0f1f34;
  --panel-2:#142c46;
  --line:#22405f;
  --gold:#d9a840;
  --gold-dim:#8a6b2c;
  --gold-rgb:217,168,64;
  --on-accent:var(--on-accent);
  --cyan:#57d8de;
  --ink:#e8edf3;
  --slate:#5f7690;
  --red:#b23b3b;
  --green:#3ddc84;

  --safe-top: max(var(--fm-safe-top, 0px), env(safe-area-inset-top, 0px));
  --safe-bottom: max(var(--fm-safe-bottom, 0px), env(safe-area-inset-bottom, 0px));
  --safe-left: max(var(--fm-safe-left, 0px), env(safe-area-inset-left, 0px));
  --safe-right: max(var(--fm-safe-right, 0px), env(safe-area-inset-right, 0px));
}
/* ---------- 主题：点击左上角 logo 切换，靠覆写 --gold/--gold-dim/--gold-rgb/--cyan/--on-accent 实现全局换色 ---------- */
html[data-theme="cyan"]{
  --gold:#57d8de; --gold-dim:#2f7d82; --gold-rgb:87,216,222; --on-accent:#062226; --cyan:#d9a840;
}
html[data-theme="rose"]{
  --gold:#e0637a; --gold-dim:#8a3546; --gold-rgb:224,99,122; --on-accent:#2a0810; --cyan:#57d8de;
}
html[data-theme="violet"]{
  --gold:#9c7cf0; --gold-dim:#5b447f; --gold-rgb:156,124,240; --on-accent:#160f2e; --cyan:#57d8de;
}
html[data-theme="green"]{
  --gold:#5fd88a; --gold-dim:#33804f; --gold-rgb:95,216,138; --on-accent:#062611; --cyan:#57d8de;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html{ background:var(--bg); }
body{
  background:var(--bg); color:var(--ink);
  font-family:'Noto Sans SC', sans-serif;
  min-height:100vh; position:relative; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; color:inherit; cursor:pointer; background:none; border:0; }
input{ font-family:inherit; color:inherit; }
img{ display:block; max-width:100%; }
.hidden{ display:none !important; }

/* ---------- ambient background ---------- */
.bg-canvas{ position:fixed; inset:0; z-index:0; pointer-events:none; }
.bg-grid{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:64px 64px; opacity:.08;
  animation:gridDrift 26s linear infinite;
}
@keyframes gridDrift{ from{ background-position:0 0,0 0; } to{ background-position:64px 64px,64px 64px; } }
.bg-vignette{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%, rgba(var(--gold-rgb),.06), transparent 60%),
             radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.6), transparent 70%);
}
.scanlines{
  position:fixed; inset:0; z-index:2; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0px, rgba(0,0,0,.12) 1px, transparent 2px, transparent 3px);
  opacity:.35; mix-blend-mode:overlay;
}
.tv-mode .bg-canvas, .tv-mode .scanlines, .tv-mode .bg-grid{ display:none; } /* TV 端关闭低成本动效 */

.scan-sweep{
  position:fixed; left:0; right:0; top:-140px; height:140px; z-index:2; pointer-events:none;
  background:linear-gradient(180deg, transparent, rgba(var(--gold-rgb),.05), transparent);
  mix-blend-mode:screen; animation:sweepMove 9s linear infinite;
}
@keyframes sweepMove{ 0%{ top:-140px; } 100%{ top:100vh; } }
.tv-mode .scan-sweep{ display:none; }
@media (prefers-reduced-motion:reduce){ .scan-sweep{ display:none; } }

/* ---------- 开机终端动画：进站瞬间的沉浸感 ---------- */
.boot{
  position:fixed; inset:0; z-index:200; background:var(--bg);
  display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
  padding:24px calc(var(--safe-left) + 28px);
  font-family:'JetBrains Mono', monospace; font-size:12.5px; letter-spacing:.06em; color:var(--slate);
  transition:opacity .4s ease, visibility .4s ease;
}
.boot.hide{ opacity:0; visibility:hidden; pointer-events:none; }
.boot-line{ margin-bottom:8px; opacity:0; animation:bootIn .3s ease forwards; }
.boot-line:nth-child(2){ animation-delay:.35s; }
@keyframes bootIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
.boot-gold{ color:var(--gold); }
.boot-ok{ color:var(--green); }
.boot-bar{ width:220px; max-width:60vw; height:2px; background:var(--line); margin-top:14px; overflow:hidden; }
.boot-bar-fill{ height:100%; width:0%; background:var(--gold); animation:bootFill .75s ease forwards; animation-delay:.15s; }
@keyframes bootFill{ to{ width:100%; } }

/* ---------- 全局滚动条 / 选中色，去掉浏览器默认蓝，贴合终端配色 ---------- */
::selection{ background:rgba(var(--gold-rgb),.35); color:var(--ink); }
html{ scrollbar-width:thin; scrollbar-color:var(--gold-dim) var(--bg); }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:var(--bg); }
::-webkit-scrollbar-thumb{ background:var(--gold-dim); border:2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover{ background:var(--gold); }

/* ---------- layout shell ---------- */
.shell{ position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:calc(var(--safe-top) + 20px) calc(var(--safe-right) + 20px) 80px calc(var(--safe-left) + 20px); }
@media (max-width:640px){
  .shell{ padding-left:calc(var(--safe-left) + 10px); padding-right:calc(var(--safe-right) + 10px); }
}

.topbar{
  display:flex; align-items:center; justify-content:space-between; flex-wrap:nowrap; gap:14px;
  padding-bottom:16px; margin-bottom:22px; border-bottom:1px solid var(--line);
}
.topbar-id{ display:flex; align-items:center; gap:9px; min-width:0; cursor:pointer; }
.topbar-id .dot{ flex:none; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 1.8s infinite; }
.topbar-id .dot.off{ background:var(--red); box-shadow:0 0 8px var(--red); animation:none; }
.topbar-id h1{ font-family:'Oswald', sans-serif; font-weight:700; font-size:clamp(18px,4.6vw,26px); letter-spacing:.01em; text-transform:uppercase; color:var(--ink); line-height:1; white-space:nowrap; }
.topbar-id h1 em{ font-style:normal; color:var(--gold); }
.topbar-meta{
  display:flex; align-items:center; gap:14px; flex:none; max-width:56%;
  overflow-x:auto; -ms-overflow-style:none; scrollbar-width:none;
  font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:.1em; color:var(--slate); white-space:nowrap;
}
.topbar-meta::-webkit-scrollbar{ display:none; }
.topbar-meta .clock{ color:var(--cyan); letter-spacing:.12em; }
.topbar-meta .id{ color:var(--gold); }

@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

/* ---------- search / filter row ---------- */
.search-row{ display:flex; gap:10px; margin-bottom:18px; }
.search-box{ flex:1 1 auto; display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); padding:0 6px 0 14px; height:44px; transition:border-color .2s ease, box-shadow .2s ease; }
.search-box:focus-within{ border-color:var(--gold-dim); box-shadow:0 0 0 3px rgba(var(--gold-rgb),.14), 0 0 18px rgba(var(--gold-rgb),.10); }
.search-box input{ flex:1; background:transparent; border:0; outline:0; font-size:14px; color:var(--ink); font-family:'JetBrains Mono', monospace; }
.search-box input::placeholder{ color:var(--slate); }
.search-box .go{ height:32px; padding:0 16px; background:var(--gold); color:var(--on-accent); font-weight:700; font-size:12px; letter-spacing:.1em; font-family:'JetBrains Mono', monospace; }
.search-box .go:active{ background:var(--gold-dim); }
.search-box .clear{ color:var(--slate); font-size:16px; padding:0 6px; }

.chip-row{
  display:flex; gap:2px; overflow-x:auto; -ms-overflow-style:none; scrollbar-width:none;
  margin:10px 0 24px; padding:3px;
  background:var(--panel); border:1px solid var(--line);
}
.chip-row::-webkit-scrollbar{ display:none; }
.chip{
  flex:none; font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:.1em;
  color:var(--slate); background:transparent; border:1px solid transparent;
  padding:8px 16px; white-space:nowrap; transition:color .18s ease, background .18s ease, border-color .18s ease;
}
.chip.active{ color:var(--on-accent); background:var(--gold); border-color:var(--gold); font-weight:700; animation:chipGlow 2.6s ease-in-out infinite; }
@keyframes chipGlow{
  0%,100%{ box-shadow:0 0 0 0 rgba(var(--gold-rgb),0); }
  50%{ box-shadow:0 0 10px 1px rgba(var(--gold-rgb),.45); }
}
@media (prefers-reduced-motion:reduce){ .chip.active{ animation:none; } }

.totop{
  position:fixed; right:calc(var(--safe-right) + 14px); bottom:calc(var(--safe-bottom) + 24px);
  width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  background:var(--panel); border:1px solid var(--gold-dim); color:var(--gold);
  font-size:15px; cursor:pointer; z-index:40;
  opacity:0; pointer-events:none; transform:translateY(10px);
  transition:opacity .2s ease, transform .2s ease, border-color .15s ease, background .15s ease;
}
.totop.show{ opacity:1; pointer-events:auto; transform:translateY(0); }
.totop:hover, .totop:active{ border-color:var(--gold); background:var(--panel-2); }

/* ---------- section label (发布页 section-head) ---------- */
.section-head{ display:flex; align-items:baseline; gap:14px; margin:38px 0 16px; }
.section-head .tag{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.2em; color:var(--bg); background:var(--gold); padding:3px 8px; font-weight:700; }
.section-head h2{ font-family:'Oswald', sans-serif; font-weight:600; font-size:16px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); }
.section-head .rule{ flex:1; height:1px; background:var(--line); }
.section-head .more{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.1em; color:var(--slate); background:none; border:none; padding:0; cursor:pointer; }
.section-head .more[disabled]{ opacity:.5; }
.section-head .more:active{ color:var(--gold); }
.icon-btn{
  flex:none; width:30px; height:30px; display:flex; align-items:center; justify-content:center;
  font-size:15px; line-height:1; color:var(--gold); background:var(--panel); border:1px solid var(--gold-dim);
  cursor:pointer; transition:border-color .15s ease, background .15s ease, transform .1s ease;
}
.icon-btn:active{ transform:scale(.92); border-color:var(--gold); background:var(--panel-2); }
.icon-btn[disabled]{ opacity:.5; }

/* ---------- file grid / file card ---------- */
.file-grid{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
@media (min-width:720px){ .file-grid{ gap:14px; grid-template-columns:repeat(auto-fill, minmax(132px,1fr)); } }
@media (min-width:1180px){ .file-grid{ grid-template-columns:repeat(auto-fill, minmax(156px,1fr)); } }

.file{
  background:var(--panel); border:1px solid var(--line); color:inherit;
  display:flex; flex-direction:column; cursor:pointer; position:relative;
  transition:transform .22s cubic-bezier(.25,.8,.25,1), border-color .22s ease, background .22s ease, box-shadow .22s ease;
}
@media (hover:hover){
  .file:hover{
    transform:translateY(-3px);
    border-color:rgba(var(--gold-rgb),.5);
    background:var(--panel-2);
    box-shadow:0 12px 28px rgba(0,0,0,.4), 0 0 0 1px rgba(var(--gold-rgb),.16), 0 0 20px -4px rgba(var(--gold-rgb),.28);
    z-index:2;
  }
}
.file:focus-visible{ outline:none; border-color:var(--gold); box-shadow:0 0 0 2px rgba(var(--gold-rgb),.4); }
.file::after{
  content:''; position:absolute; inset:-1px; pointer-events:none; opacity:0; transition:opacity .2s ease;
  background:
    linear-gradient(var(--gold), var(--gold)) top left / 12px 2px no-repeat,
    linear-gradient(var(--gold), var(--gold)) top left / 2px 12px no-repeat,
    linear-gradient(var(--gold), var(--gold)) top right / 12px 2px no-repeat,
    linear-gradient(var(--gold), var(--gold)) top right / 2px 12px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom left / 12px 2px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom left / 2px 12px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom right / 12px 2px no-repeat,
    linear-gradient(var(--gold), var(--gold)) bottom right / 2px 12px no-repeat;
}
@media (hover:hover){ .file:hover::after{ opacity:1; } }
.file:focus-visible::after{ opacity:1; }
.file .thumb{ position:relative; width:100%; aspect-ratio:2/3; overflow:hidden; background:var(--panel-2); flex:none; }
.file .thumb:not(.loaded){
  background:linear-gradient(105deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,.03) 38%, rgba(var(--gold-rgb),.12) 50%, rgba(255,255,255,.03) 62%, rgba(255,255,255,.03) 100%);
  background-size:200% 100%; animation:fileShimmer 1.6s ease-in-out infinite;
}
@keyframes fileShimmer{ 0%{ background-position:-200% 0; } 100%{ background-position:200% 0; } }
.file .thumb img{ width:100%; height:100%; object-fit:cover; object-position:top; display:block; filter:saturate(.92) brightness(.92) contrast(1.04); opacity:0; transition:opacity .35s ease, transform .35s ease; }
.file .thumb img.on{ opacity:1; }
.file .thumb::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(6,12,22,0) 55%, rgba(6,12,22,.6) 100%); pointer-events:none; }
@media (hover:hover){ .file:hover .thumb img{ transform:scale(1.05); filter:saturate(1) brightness(.98) contrast(1.04); } }
.file .thumb .ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-size:11.5px; color:var(--slate); text-align:center; padding:8px; }
.file .thumb .tag{ position:absolute; top:6px; left:6px; background:rgba(6,12,22,.72); backdrop-filter:blur(2px); color:var(--gold); font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:.08em; padding:2px 6px; border:1px solid var(--gold-dim); pointer-events:none; }
.file .main{ padding:8px 9px 9px; flex:1; display:flex; flex-direction:column; gap:3px; }
.file .title{ font-family:'Oswald', sans-serif; font-weight:600; font-size:12.5px; letter-spacing:.01em; color:var(--ink); line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; transition:color .2s ease; }
@media (hover:hover){ .file:hover .title{ color:var(--gold); } }


/* ---------- hero-file (detail overlay header) ---------- */
.hero-file{ position:relative; background:linear-gradient(180deg, var(--panel) 0%, #0b1728 100%); border:1px solid var(--line); overflow:hidden; }
.hero-file .band{ background:var(--gold); color:var(--on-accent); font-family:'JetBrains Mono', monospace; font-weight:700; font-size:11.5px; letter-spacing:.16em; padding:6px 16px; display:flex; justify-content:space-between; box-shadow:0 2px 12px rgba(var(--gold-rgb),.22); }
.hero-file .thumb{ position:relative; width:100%; height:clamp(480px, 138vw, 680px); overflow:hidden; background:var(--panel-2); }
.hero-file .thumb img{ width:100%; height:100%; object-fit:cover; object-position:top; filter:saturate(.9) brightness(.85) contrast(1.04); opacity:0; transform:scale(1.03); transition:opacity .5s ease, transform .5s ease; }
.hero-file .thumb img.on{ opacity:1; transform:scale(1); }
.hero-file .thumb::before{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(6,12,22,.5) 0%, rgba(6,12,22,0) 22%); pointer-events:none; z-index:1; }
.hero-file .thumb::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(6,12,22,0) 38%, rgba(6,12,22,.5) 62%, rgba(6,12,22,.94) 88%, var(--panel) 100%); pointer-events:none; }
.hero-file .body{ padding:0 20px 22px; position:relative; margin-top:-118px; z-index:1; }
.hero-file .codename{ font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:.2em; color:var(--slate); margin-bottom:6px; text-shadow:0 1px 8px rgba(0,0,0,.6); }
.hero-file .name{ font-family:'Oswald', sans-serif; font-weight:700; font-size:clamp(24px,6vw,36px); letter-spacing:.01em; color:var(--ink); text-transform:uppercase; line-height:1.08; text-shadow:0 2px 18px rgba(0,0,0,.65), 0 1px 4px rgba(0,0,0,.5); }
.hero-file .note{ font-size:13px; color:var(--slate); margin-top:12px; line-height:1.6; max-height:6.4em; overflow:hidden; text-shadow:0 1px 6px rgba(0,0,0,.4); }
/* 横版海报（剧照/banner）自动识别：矮而宽，居中裁切，叠压幅度收窄 */
.hero-file.landscape .thumb{ height:clamp(200px, 58vw, 400px); }
.hero-file.landscape .thumb img{ object-position:center; }
.hero-file.landscape .body{ margin-top:-64px; }
.hero-file.landscape .thumb::after{ background:linear-gradient(180deg, rgba(6,12,22,0) 30%, rgba(6,12,22,.55) 60%, rgba(6,12,22,.94) 84%, var(--panel) 100%); }

/* ---------- back bar ---------- */
.back-bar{ display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.1em; color:var(--slate); margin-bottom:10px; cursor:pointer; }
.back-bar:active{ color:var(--gold); }

/* ---------- resource tabs + rows ---------- */
.restabs{ display:flex; gap:8px; overflow-x:auto; margin:18px 0 12px; -ms-overflow-style:none; scrollbar-width:none; }
.restabs::-webkit-scrollbar{ display:none; }
.restab{ flex:none; font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:.08em; color:var(--slate); background:var(--panel); border:1px solid var(--line); padding:7px 14px; }
.restab.active{ color:var(--on-accent); background:var(--gold); border-color:var(--gold); font-weight:700; }

.res-list{ display:flex; flex-direction:column; gap:8px; }
.res-row{ display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); padding:12px 14px; cursor:pointer; transition:border-color .15s ease, background .15s ease; }
.res-row:hover, .res-row:focus-visible{ border-color:var(--gold-dim); background:var(--panel-2); outline:none; }
.res-dot{ flex:none; width:8px; height:8px; border-radius:50%; background:var(--slate); }
.res-dot.checking{ background:var(--cyan); animation:pulse 1s infinite; }
.res-dot.ok{ background:var(--green); }
.res-dot.bad{ background:var(--red); }
.res-badge{ flex:none; font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--gold); border:1px solid var(--gold-dim); padding:3px 8px; min-width:44px; text-align:center; }
.res-main{ flex:1 1 auto; min-width:0; }

    var rows = d.querySelectorAll(".module-row-one, .module-row-info, .module-row-text, .downlist li, .down-list li, .module-blocklist .module-row-one, .download-item, .x-dbjs-accordion-inner .download-links");

      var t = row.querySelector(".module-row-title, .module-row-text h4, h4, .title, strong, .x-dbjs-download-link, a[data-url]");
      pushFrom(row, t ? t.textContent : "");

  }
  if (!pans.length) pushFrom(d && d.body ? d.body : { innerHTML: html }, "");
  // ④ 源码兜底：pomo 常把网盘链接放进 <script> JSON，DOM 解析前就被剥掉了，得对原始文本再扫一遍
  var hasDisk = false;
  for (var pi = 0; pi < pans.length; pi++) if (pans[pi].type !== "magnet") { hasDisk = true; break; }
  if (!hasDisk) {
    var rawAll = String(html || "").replace(/\\\//g, "/").replace(/\\u002[fF]/g, "/").replace(/&#0*47;/g, "/").replace(/&#x0*2[fF];/g, "/");
    var hits2 = [], m2; PAN_RE.lastIndex = 0; while ((m2 = PAN_RE.exec(rawAll))) hits2.push(m2[0]);
    for (var qi = 0; qi < hits2.length; qi++) pushOne(hits2[qi], "");
  }
  // 过滤“别的片子”混进来的资源
  var selfKey = normTitleKey(title);
  if (selfKey) pans = pans.filter(function (p) {
    var rt = p.title || ""; if (!rt) return true;
    var mk = rt.match(/[《【]([^》】]{2,30})[》】]/); if (!mk) return true;
    var other = normTitleKey(mk[1]); if (!other) return true;

}

/* 直接发起单次请求，不走 goodDomain 偏好也不走 memo 缓存，供“按域名轮询”场景使用 */
function fetchRaw(url) {
  if (state.sdkReady && window.fm && fm.req) {
    return fm.req(url, { method: "GET", responseType: "text", timeout: 15, credentials: "include",
                        headers: { "User-Agent": PM_UA, "Referer": url } })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.body; });
  }
  return fetchTimeout(url, { headers: {} }, 15000).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); });
}
/* 按“域名 × 路径变体”逐一尝试，解析出内容才算数；
   避免当前 goodDomain 对某个分类恰好返回空白/占位页时直接判空，而不去试备用镜像 */
function fetchAcrossDomains(paths) {
  var domains = pmDomains();
  function tryAt(di, pi) {
    if (di >= domains.length) return Promise.resolve([]);
    if (pi >= paths.length) return tryAt(di + 1, 0);
    var dom = domains[di], url = dom + paths[pi];
    return fetchRaw(url).then(function (html) {
      if (!html || html.length < 300) return tryAt(di, pi + 1);
      var list = parseList(html, dom);
      if (list.length) { state.goodDomain = dom; clearBad(dom); setConn(true, dom); return list; }
      return tryAt(di, pi + 1);
    }, function () { markBad(dom); return tryAt(di, pi + 1); });
  }
  return tryAt(0, 0);
}
function fetchList(cat, page) {
  var urls = [].concat(PM.categoryUrl(cat, page));
  return fetchAcrossDomains(urls);
}
var SEARCH_BUDGET_MS = 22000;
function withBudget(promise, ms, fallback) {
  return new Promise(function (resolve) {
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; resolve(fallback); } }, ms);
    promise.then(function (v) { if (!done) { done = true; clearTimeout(timer); resolve(v); } },
                 function () { if (!done) { done = true; clearTimeout(timer); resolve(fallback); } });
  });
}
function searchPm(kw) {
  var ek = encodeURIComponent(kw);
  var own = PM.searchUrls.map(function (u) { return u.replace("{kw}", ek); });
  return withBudget(fetchAcrossDomains(own), SEARCH_BUDGET_MS, []);
}

  var api = trimSlash($("#stPanApi").value.trim());
  config.panApi = api; Store.set("pmPanApi", api);
  var types = stPanTypesTemp.length ? stPanTypesTemp.slice() : CHECKABLE.slice();
  PANSOU_TYPES = types; PANSOU_KEEP = PANSOU_TYPES.concat(["guangya"]);
  Store.set("pmPanTypes", JSON.stringify(types));
  toast("设置已保存");
  closeSettings();
};

/* ---------- 滚动到底部自动加载更多，按钮仅作为状态提示 / 失败重试入口保留 ---------- */
(function () {
  if (!("IntersectionObserver" in window)) return;
  function watch(id, loader) {
    var target = $("#" + id); if (!target) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) loader(false); });
    }, { rootMargin: "600px 0px" });
    io.observe(target);
  }
  watch("homeMore", loadHomeCategory);
  watch("browseMore", loadBrowsePage);
})();

/* ================= 搜索 ================= */
function doSearch() {
  var kw = $("#searchInput").value.trim();
  if (!kw) return;
  openBrowse("", kw, "search");
}
$("#searchGo").onclick = doSearch;
$("#searchInput").addEventListener("keydown", function (e) { if (e.key === "Enter") doSearch(); });
$("#searchInput").addEventListener("input", function () { $("#searchClear").classList.toggle("hidden", !this.value); });
$("#searchClear").onclick = function () { $("#searchInput").value = ""; $("#searchClear").classList.add("hidden"); $("#searchInput").focus(); };

/* 单击 logo 切换主题色；连续三击（应急）可手动指定自定义域名 */
var THEMES = ["", "cyan", "rose", "violet", "green"];
var THEME_NAMES = { "": "琥珀金", cyan: "极光青", rose: "赤霞红", violet: "暗夜紫", green: "深林绿" };
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
var savedTheme = "";
Store.get("pmTheme").then(function (v) { savedTheme = (v && THEMES.indexOf(v) >= 0) ? v : ""; applyTheme(savedTheme); });

/* 单击 logo 切换主题色；连续三击（应急）打开设置弹窗（镜像域名/盘搜地址/盘搜网盘类型） */
var titleTapCount = 0, titleTapTimer = 0;
$("#titleTap").onclick = function () {
  titleTapCount++;
  clearTimeout(titleTapTimer);
  titleTapTimer = setTimeout(function () {
    if (titleTapCount === 1) {
      var idx = (THEMES.indexOf(savedTheme) + 1) % THEMES.length;
      savedTheme = THEMES[idx];
      applyTheme(savedTheme);
      Store.set("pmTheme", savedTheme);
      toast("主题：" + THEME_NAMES[savedTheme]);
    }
    titleTapCount = 0;
  }, 600);
  if (titleTapCount >= 3) {
    titleTapCount = 0;
    clearTimeout(titleTapTimer);
    openSettings();
  }
};

/* ================= 状态栏时钟 + 背景粒子连线（原样移植自发布页） ================= */
var clockEl = $("#clock");
function pad(n) { return String(n).padStart(2, "0"); }
function tickClock() {
  var d = new Date();
  clockEl.textContent = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "  " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}
tickClock(); setInterval(tickClock, 1000);

(function () {
  var canvas = $("#bgCanvas"); if (!canvas || !canvas.getContext || IS_TV) return;
  var ctx = canvas.getContext("2d");
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var COLORS = ["217,168,64", "87,216,222"];
  var w, h, nodes = [];
  function resize() {
    w = canvas.width = Math.floor(window.innerWidth * dpr); h = canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + "px"; canvas.style.height = window.innerHeight + "px";
  }
  function initNodes() {
    var count = Math.min(60, Math.floor((window.innerWidth * window.innerHeight) / 26000));
    nodes = Array.from({ length: count }, function () { return {
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.18 * dpr, vy: (Math.random() - 0.5) * 0.18 * dpr,
      c: COLORS[Math.random() < 0.72 ? 0 : 1]
    }; });
  }
  function frame() {
    ctx.clearRect(0, 0, w, h);
    nodes.forEach(function (n) { n.x += n.vx; n.y += n.vy; if (n.x < 0 || n.x > w) n.vx *= -1; if (n.y < 0 || n.y > h) n.vy *= -1; });
    var linkDist = 130 * dpr;
    for (var i = 0; i < nodes.length; i++) for (var j = i + 1; j < nodes.length; j++) {
      var a = nodes[i], b = nodes[j], dx = a.x - b.x, dy = a.y - b.y, dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < linkDist) { ctx.strokeStyle = "rgba(" + a.c + "," + ((1 - dist / linkDist) * 0.18) + ")"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
    nodes.forEach(function (n) { ctx.fillStyle = "rgba(" + n.c + ",0.55)"; ctx.beginPath(); ctx.arc(n.x, n.y, 1.6 * dpr, 0, Math.PI * 2); ctx.fill(); });
    if (!reduceMotion) requestAnimationFrame(frame);
  }
  resize(); initNodes();
  if (reduceMotion) frame(); else requestAnimationFrame(frame);
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { resize(); initNodes(); }, 150); });
})();

/* ================= 启动 ================= */
Store.get("pmBase").then(function (v) { if (v) state.goodDomain = v; }).then(function () {
  state.homeCat = PM.cats[0][0];
  renderChips();
  loadHomeCategory(true);
});

(function () {
  var boot = $("#bootScreen"); if (!boot) return;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (IS_TV || reduceMotion) { boot.classList.add("hide"); return; }
  var done = false;
  function dismiss() { if (done) return; done = true; boot.classList.add("hide"); }
  setTimeout(dismiss, 900);
  boot.addEventListener("click", dismiss);
})();
</script>
