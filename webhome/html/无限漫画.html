  /* FongMi 文档：responseType 仅支持 text / json / base64（base64=原始字节） */
  function fetchBin(url) {
    var headers = {
      'User-Agent': 'Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 Chrome/120.0.0.0 Mobile Safari/537.36',
      'Referer': S().base + '/',

    if (window.fm && typeof sdk().req === 'function') {
      return sdk().req(url, { responseType: 'base64', timeout: 30, headers: headers })
        .then(parseBinBody)
        .catch(function (e1) {
          return sdk().req(url, { responseType: 'text', timeout: 30, headers: headers }).then(function (r) {
            /* 有些壳把 base64 当 text 返回 */
            return parseBinBody(r);

  var _jmFailToast = 0;
  function jmDecryptToBlobUrl(url) {
    if (!url) return Promise.resolve('');
    url = absUrl(S().base, url);
    if (jmBlobCache[url]) return Promise.resolve(jmBlobCache[url]);
    return fetchBin(url).then(function (u8) {
      if (!u8 || !u8.length) throw new Error('empty img');
      var dec = decryptJmBytes(u8);
      if (!isPlainImageBytes(dec)) {
        throw new Error('decrypt fail head=' + (u8[0] & 255) + ',' + (dec[0] & 255) + ' len=' + u8.length);

        blob = new Blob([dec], { type: mime });

    }).catch(function (err) {
      try { console.warn('[jm img]', url.slice(0, 80), err && err.message); } catch (e) {}
      if (!_jmFailToast) {
        _jmFailToast = 1;

  function hydrateJmImages(root) {
    if (srcKey !== 'jm18' || !root) return;
    var imgs = root.querySelectorAll('img[data-jm]:not([data-jm-done])');
    if (!imgs.length) return;
    var list = [];
    for (var i = 0; i < imgs.length; i++) list.push(imgs[i]);
    var cursor = 0, running = 0, maxC = 4;
    function pump() {
      while (running < maxC && cursor < list.length) {
        (function (img) {
          var u = img.getAttribute('data-jm');
          if (!u) { cursor++; return; }
          img.setAttribute('data-jm-done', '1');
          running++; cursor++;
          jmDecryptToBlobUrl(u).then(function (blobUrl) {
            running--;
            if (!blobUrl) {
              img.style.opacity = '0.2';
            } else {
              img.onload = function () { img.classList.add('ok'); };
              img.onerror = function () { img.style.opacity = '0.2'; };
              img.src = blobUrl;
            }
            pump();
          }).catch(function () {
            running--;
            img.style.opacity = '0.2';
            pump();
          });
        })(list[cursor]);
      }
    }
    pump();
  }

  /* ── parsers ── */
  function parseGuaziList(html) {
    var base = SOURCES.guazi.base;
    var items = [];
    var seen = {};
    function push(id, title, cover) {
      id = String(id || '').trim();
      if (!id || seen[id]) return;
      seen[id] = 1;
      title = decodeHtml(String(title || '').replace(/漫画封面$/, '').replace(/最新更新封面$/, '').trim()) || ('漫画 ' + id);
      items.push({ id: id, title: title, cover: absUrl(base, cover) });
    }
    var m, b, idM, tM, cM;
    var cardRe = /<article[^>]*class="[^"]*(?:comic-card|update-card)[^"]*"[^>]*>([\s\S]*?)<\/article>/gi;
    while ((m = cardRe.exec(html))) {
      b = m[1];
      idM = b.match(/comic\.php\?id=(\d+)/);
      if (!idM) continue;
      tM = b.match(/<h3[^>]*>\s*<a[^>]*>([^<]+)/i) || b.match(/alt="([^"]+)"/i);
      cM = b.match(/(?:src|data-src|data-original)="([^"]+)"/i);
      push(idM[1], tM && tM[1], cM && cM[1]);
    }
    var wrapRe = /<a[^>]*class="[^"]*cover-wrap[^"]*"[^>]*href="[^"]*comic\.php\?id=(\d+)"[^>]*>([\s\S]*?)<\/a>/gi;
    while ((m = wrapRe.exec(html))) {
      b = m[2];
      cM = b.match(/(?:src|data-src)="([^"]+)"/i);
      tM = b.match(/alt="([^"]+)"/i);
      push(m[1], tM && tM[1], cM && cM[1]);
    }
    if (items.length < 3) {
      var re = /href="(?:https?:\/\/(?:www\.)?guazimanhua\.com)?\/comic\.php\?id=(\d+)"[\s\S]{0,500}?<img[^>]+(?:src|data-src)="([^"]+)"[^>]*(?:alt="([^"]*)")?/gi;
      while ((m = re.exec(html))) push(m[1], m[3], m[2]);
    }
    var re2 = /<img[^>]+(?:src|data-src)="([^"]+)"[^>]*(?:alt="([^"]*)")?[\s\S]{0,280}?comic\.php\?id=(\d+)/gi;
    while ((m = re2.exec(html))) push(m[3], m[2], m[1]);
    var h3re = /<h3[^>]*>\s*<a[^>]*href="[^"]*comic\.php\?id=(\d+)"[^>]*>([^<]+)<\/a>/gi;
    var tm = {};
    while ((m = h3re.exec(html))) tm[m[1]] = m[2];
    for (var i = 0; i < items.length; i++) if (tm[items[i].id]) items[i].title = decodeHtml(tm[items[i].id].trim());
    try {
      var ldRe = /<script[^>]*type="application\/ld\+json"[^>]*>([\s\S]*?)<\/script>/gi;
      while ((m = ldRe.exec(html))) {
        var data = JSON.parse(m[1]);
        var list = Array.isArray(data) ? data : [data];
        for (var j = 0; j < list.length; j++) {
          var els = (list[j] && list[j].itemListElement) || [];
          for (var k = 0; k < els.length; k++) {
            var el = els[k];
            var idM2 = String(el.url || '').match(/id=(\d+)/);
            if (!idM2) continue;
            if (seen[idM2[1]]) {
              for (var t = 0; t < items.length; t++) if (items[t].id === idM2[1] && el.name) items[t].title = el.name;
            } else push(idM2[1], el.name, '');
          }
        }
      }
    } catch (e) {}
    return items;
  }

  function parseJm18List(html) {
    var base = SOURCES.jm18.base;
    var items = [];
    var seen = {};
    function push(id, title, cover) {
      id = String(id || '').trim();
      if (!id || seen[id]) return;
      seen[id] = 1;
      title = decodeHtml(String(title || '').trim()) || ('漫画 ' + id);
      items.push({ id: id, title: title, cover: absUrl(base, cover) });
    }
    var m;
    /* data-src + alt */
    var re = /href="\/comic\/detail\/(\d+)"[\s\S]{0,900}?data-src="([^"]+)"[\s\S]{0,200}?alt="([^"]*)"/gi;
    while ((m = re.exec(html))) push(m[1], m[3], m[2]);
    /* h2 title after link */
    var re2 = /href="\/comic\/detail\/(\d+)"[\s\S]{0,1200}?<h2[^>]*>([^<]+)/gi;
    while ((m = re2.exec(html))) {
      if (seen[m[1]]) {
        for (var i = 0; i < items.length; i++) {
          if (items[i].id === m[1] && (!items[i].title || items[i].title.indexOf('漫画 ') === 0))
            items[i].title = decodeHtml(m[2].trim());
        }
      }
    }
    /* fallback any detail + img */
    if (items.length < 3) {
      var re3 = /href="\/comic\/detail\/(\d+)"[\s\S]{0,600}?(?:data-src|src)="(https?:\/\/[^"]+)"/gi;
      while ((m = re3.exec(html))) push(m[1], '', m[2]);
    }
    return items;
  }

  function parseList(html) {
    return srcKey === 'jm18' ? parseJm18List(html) : parseGuaziList(html);

  function parseGuaziSection(html, id) {
    var m = html.match(new RegExp('<section[^>]*id="' + id + '"[^>]*>([\\s\\S]*?)</section>', 'i'));

  function dedupeById(list, excludeIds) {
    var out = [];
    var seen = {};
    excludeIds = excludeIds || {};
    for (var i = 0; i < list.length; i++) {

      if (seen[id] || excludeIds[id]) continue;
      seen[id] = 1;
      out.push(list[i]);
    }
    return out;
  }

    else if (name === 'srch') document.getElementById('srch').classList.remove('on');
    else if (name === 'rank') document.getElementById('panel-rank').classList.remove('on');
    else if (name === 'cat') document.getElementById('panel-cat').classList.remove('on');
    else if (name === 'follow') document.getElementById('panel-follow').classList.remove('on');
    syncLayerClass();
  }
  function popRoute() {
    if (!stack.length) { syncLayerClass(); return false; }
    var name = stack.pop();
    closeRoute(name);
    if (name === 'rank' || name === 'cat' || name === 'srch' || name === 'follow') setTab('home');
    return true;
  }
  window.addEventListener('popstate', function () { popRoute(); });
  function setTab(tab) {
    var bns = document.querySelectorAll('.bn');
    for (var i = 0; i < bns.length; i++) {
      if (bns[i].getAttribute('data-tab') === tab) bns[i].classList.add('on');
      else bns[i].classList.remove('on');
    }
  }

  /* source switch */
  function updateSrcUI() {
    document.getElementById('srcLabel').textContent = S().name;
    document.getElementById('logoSub').textContent = S().name + ' · 当前源';
    var items = document.querySelectorAll('.src-item');
    for (var i = 0; i < items.length; i++) {
      if (items[i].getAttribute('data-src') === srcKey) items[i].classList.add('on');
      else items[i].classList.remove('on');
    }
  }
  function switchSource(key) {
    if (!SOURCES[key] || key === srcKey) {
      document.getElementById('srcMenu').classList.remove('on');
      return;
    }
    srcKey = key;
    try { localStorage.setItem('comic_src', key); } catch (e) {}
    document.getElementById('srcMenu').classList.remove('on');
    updateSrcUI();
    while (stack.length) popRoute();
    setTab('home');
    renderCatTags();
    toast('已切换：' + S().name);
    loadHome();
  }
  document.getElementById('srcBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    document.getElementById('srcMenu').classList.toggle('on');
  });
  document.getElementById('srcMenu').addEventListener('click', function (e) {
    var item = e.target.closest ? e.target.closest('.src-item') : null;
    if (item) switchSource(item.getAttribute('data-src'));
  });
  document.addEventListener('click', function () {
    document.getElementById('srcMenu').classList.remove('on');
  });

  document.getElementById('botnav').addEventListener('click', function (e) {
    var bn = e.target.closest ? e.target.closest('.bn') : null;
    if (!bn) return;
    var tab = bn.getAttribute('data-tab');
    if (tab === 'home') {
      while (stack.length) popRoute();
      try { history.pushState({ comic: 'home' }, '', '#home'); } catch (err) {}
      setTab('home');
      window.scrollTo(0, 0);
      return;
    }
    if (tab === 'rank') {
      setTab('rank');
      if (stack.indexOf('rank') < 0) {
        pushRoute('rank', function () {
          document.getElementById('panel-rank').classList.add('on');
          if (!rankData.length) loadRank();
        });
      }
      return;
    }
    if (tab === 'cat') {
      setTab('cat');
      if (stack.indexOf('cat') < 0) {
        pushRoute('cat', function () { document.getElementById('panel-cat').classList.add('on'); });
      }
      return;
    }
    if (tab === 'follow') {
      setTab('follow');
      if (stack.indexOf('follow') < 0) {
        pushRoute('follow', function () {
          document.getElementById('panel-follow').classList.add('on');
          renderFollowList();
        });
      } else {
        renderFollowList();
      }
      return;
    }
    if (tab === 'srch') openSearch();
  });
  document.getElementById('moreRank').addEventListener('click', function () {
    setTab('rank');
    pushRoute('rank', function () {
      document.getElementById('panel-rank').classList.add('on');
      if (!rankData.length) loadRank();
    });
  });
  document.getElementById('rankBack').addEventListener('click', function () { history.back(); });
  document.getElementById('catBack').addEventListener('click', function () { history.back(); });
  document.getElementById('followBack').addEventListener('click', function () { history.back(); });
  document.getElementById('btnRefresh').addEventListener('click', function () { loadHome(); });

  document.getElementById('catTags').addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('.cat-tag') : null;
    if (!t) return;
    var tags = document.querySelectorAll('.cat-tag');
    for (var i = 0; i < tags.length; i++) tags[i].classList.remove('on');
    t.classList.add('on');
    loadCat(t.getAttribute('data-cid'));
  });

  function openSearch() {
    setTab('srch');
    if (stack.indexOf('srch') < 0) {
      pushRoute('srch', function () {
        document.getElementById('srch').classList.add('on');
        setTimeout(function () { document.getElementById('srchInp').focus(); }, 120);
      });
    } else document.getElementById('srch').classList.add('on');
  }
  document.getElementById('openSrch').addEventListener('click', openSearch);
  document.getElementById('srchCancel').addEventListener('click', function () { history.back(); });
  document.getElementById('srchInp').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); doSearch(this.value.replace(/^\s+|\s+$/g, '')); }
  });
  function doSearch(q) {
    if (!q) return;
    var body = document.getElementById('srchBody');
    body.innerHTML = '<div class="loading"><div class="spinner"></div><div>搜索中…</div></div>';
    var url = srcKey === 'jm18'
      ? (S().base + '/comic/all?key_word=' + encodeURIComponent(q) + '&page=1')
      : (S().base + '/index.php/search?key=' + encodeURIComponent(q));
    fetchText(url).then(function (html) {
      var items = parseList(html);
      if (!items.length) { body.innerHTML = '<div class="empty">无结果</div>'; return; }
      var h = '';
      for (var i = 0; i < items.length; i++) {
        var c = items[i];
        h += '<div class="sli" data-id="' + esc(c.id) + '">' + cardImgTag(c.cover) + '<div><div class="sli-t">' + esc(c.title) + '</div><div class="sli-m">' + esc(S().name) + '</div></div></div>';
      }
      body.innerHTML = h;
      var nodes = body.querySelectorAll('.sli');
      for (var n = 0; n < nodes.length; n++) {
        nodes[n].addEventListener('click', function () { openDet(this.getAttribute('data-id')); });
      }
      hydrateJmImages(body);
    }).catch(function (e) {
      body.innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  }

  function openDet(id) {
    pushRoute('det', function () { document.getElementById('det').classList.add('on'); });
    var inner = document.getElementById('detInner');
    inner.innerHTML = '<div class="loading" style="padding-top:100px"><div class="spinner"></div><div>加载详情…</div></div>';
    var url = srcKey === 'jm18' ? (S().base + '/comic/detail/' + id) : (S().base + '/comic.php?id=' + id);
    fetchText(url).then(function (html) {
      var cover = '', title = '', desc = '';
      var coverM, titleM, descM;
      if (srcKey === 'jm18') {
        coverM = html.match(/property="og:image"\s+content="([^"]+)"/i) ||
          html.match(/data-src="(https?:\/\/[^"]+)"[^>]*alt="/i);
        titleM = html.match(/property="og:title"\s+content="([^"]+)"/i) || html.match(/<h1[^>]*>([^<]+)/i);
        descM = html.match(/property="og:description"\s+content="([^"]+)"/i);
      } else {
        coverM = html.match(/<img[^>]+class="[^"]*cover[^"]*"[^>]+src="([^"]+)"/i) ||
          html.match(/property="og:image"\s+content="([^"]+)"/i);
        titleM = html.match(/property="og:title"\s+content="([^"]+)"/i) || html.match(/<h1[^>]*>([^<]+)/i);
        descM = html.match(/property="og:description"\s+content="([^"]+)"/i);
      }
      cover = coverM ? absUrl(S().base, coverM[1]) : '';
      title = titleM ? decodeHtml(titleM[1].replace(/\s*[|\-].*$/, '').trim()) : ('漫画 ' + id);
      desc = descM ? decodeHtml(descM[1]) : '';

      curChapters = [];
      if (srcKey === 'jm18') {
        var seen = {};
        var chRe = /href="\/comic\/chapter\/(\d+)\/(\d+)"[^>]*>([\s\S]*?)<\/a>/gi;
        var cm;
        while ((cm = chRe.exec(html))) {
          var num = cm[2];
          if (seen[num]) continue;
          var name = cm[3].replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
          if (!name || /开始阅读/.test(name)) name = '第 ' + num + ' 话';
          seen[num] = 1;
          curChapters.push({ id: cm[1] + '/' + num, name: decodeHtml(name), num: parseInt(num, 10) || 0 });
        }
        curChapters.sort(function (a, b) { return a.num - b.num; });
      } else {
        var chMap = {};
        var chOrder = [];
        var cm2;
        var chRe2 = /href="\/chapter\.php\?id=(\d+)"[^>]*>([\s\S]*?)<\/a>/gi;
        while ((cm2 = chRe2.exec(html))) {
          var cid = cm2[1];
          var name2 = cm2[2].replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
          if (!name2 || /开始阅读|从第/.test(name2)) continue;
          if (!chMap[cid]) { chMap[cid] = { id: cid, name: decodeHtml(name2) }; chOrder.push(cid); }
        }
        var ml = html.match(/data-mobile-chapter-list[^>]*>([\s\S]*?)(?:<\/div>\s*<\/div>|<script)/i);
        if (ml) {
          var re3 = /href="\/chapter\.php\?id=(\d+)"[^>]*>([\s\S]*?)<\/a>/gi;
          while ((cm2 = re3.exec(ml[1]))) {
            var cid3 = cm2[1];
            var name3 = cm2[2].replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
            if (name3 && !/开始阅读|从第/.test(name3) && !chMap[cid3]) {
              chMap[cid3] = { id: cid3, name: decodeHtml(name3) };
              chOrder.push(cid3);
            }
          }
        }
        for (var i = 0; i < chOrder.length; i++) curChapters.push(chMap[chOrder[i]]);
        curChapters.sort(function (a, b) {
          var na = parseInt((a.name.match(/\d+/) || [])[0], 10) || 0;
          var nb = parseInt((b.name.match(/\d+/) || [])[0], 10) || 0;
          return na - nb;
        });
      }

      var chHtml = '';
      for (var c = 0; c < curChapters.length; c++) {
        chHtml += '<button class="ch-item" type="button" data-i="' + c + '">' + esc(curChapters[c].name) + '</button>';
      }

      inner.innerHTML =
        '<div class="det-hero">' +
          (cover ? (srcKey==='jm18' ? '<img data-jm="' + esc(cover) + '" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt=""/>' : '<img src="' + esc(imgSrc(cover)) + '" alt="" referrerpolicy="no-referrer"/>') : '') +
          '<div class="det-hero-mask"></div>' +
          '<div class="det-nav"><button class="det-back" type="button" id="detBack"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg></button></div>' +
          '<div class="det-overlay">' +
            (cover ? (srcKey==='jm18' ? '<img class="det-cover" data-jm="' + esc(cover) + '" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"/>' : '<img class="det-cover" src="' + esc(imgSrc(cover)) + '" referrerpolicy="no-referrer"/>') : '<div class="det-cover"></div>') +
            '<div class="det-meta"><div class="det-title">' + esc(title) + '</div>' +
            '<div class="det-sub">' + esc(S().name) + '</div><div class="det-stat">' + curChapters.length + ' 话</div></div></div></div>' +
        '<div class="det-body"><div class="det-actions">' +
          '<button class="btn-follow' + (isFollowed(srcKey, id) ? ' on' : '') + '" type="button" id="btnFollow">' + (isFollowed(srcKey, id) ? '已追更' : '追更') + '</button>' +
          '<button class="btn-read" type="button" id="btnRead"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>开始阅读</button>' +
          '<button class="btn-ghost" type="button" id="btnDesc">简介</button></div>' +
          '<div class="det-desc" id="detDesc" style="' + (desc ? '' : 'display:none') + '">' + esc(desc || '暂无简介') + '</div>' +
          '<div class="sec-hd"><div class="sec-title">目录 · ' + curChapters.length + ' 话</div></div>' +
          '<div class="ch-grid" id="chGrid">' + chHtml + '</div></div>';

      document.getElementById('detBack').addEventListener('click', function () { history.back(); });
      document.getElementById('btnRead').addEventListener('click', function () {
        if (!curChapters.length) { toast('暂无章节'); return; }
        openChapter(0);
      });
      var descEl = document.getElementById('detDesc');
      var btnDesc = document.getElementById('btnDesc');
      if (btnDesc && descEl) {
        btnDesc.addEventListener('click', function () {
          var expanded = descEl.classList.toggle('exp');
          if (descEl.style.display === 'none') descEl.style.display = '';
          btnDesc.textContent = expanded ? '收起' : '简介';
          if (!expanded && !desc) { /* keep */ }
          try { descEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
        });
      }
      var btnFollow = document.getElementById('btnFollow');
      if (btnFollow) {
        btnFollow.addEventListener('click', function () {
          var on = toggleFollow({
            src: srcKey,
            id: id,
            title: title,
            cover: cover,
            srcName: S().name
          });
          if (on) {
            btnFollow.classList.add('on');
            btnFollow.textContent = '已追更';
          } else {
            btnFollow.classList.remove('on');
            btnFollow.textContent = '追更';
          }
        });
      }
      var items = document.getElementById('chGrid').querySelectorAll('.ch-item');
      for (var n = 0; n < items.length; n++) {
        items[n].addEventListener('click', function () { openChapter(+this.getAttribute('data-i')); });
      }
      hydrateJmImages(inner);
    }).catch(function (e) {
      inner.innerHTML = '<div class="empty" style="padding-top:100px">' + esc(e.message) +
        '<br><button class="retry-btn" type="button" id="detBack2">返回</button></div>';
      document.getElementById('detBack2').addEventListener('click', function () { history.back(); });
    });
  }

  function openChapter(idx) {
    if (idx < 0 || idx >= curChapters.length) return;
    curChIdx = idx;
    var ch = curChapters[idx];
    if (stack.indexOf('reader') < 0) {
      pushRoute('reader', function () { document.getElementById('reader').classList.add('on'); });
    } else {
      document.getElementById('reader').classList.add('on');
      syncLayerClass();
    }
    document.getElementById('rdTitle').textContent = ch.name;
    document.getElementById('rdPrev').disabled = idx <= 0;
    document.getElementById('rdNext').disabled = idx >= curChapters.length - 1;
    barVisible = true;
    document.getElementById('rdBar').classList.remove('hide');
    document.getElementById('rdFoot').classList.remove('hide');
    var pages = document.getElementById('rdPages');
    var scroll = document.getElementById('rdScroll');
    pages.innerHTML = '<div class="loading"><div class="spinner"></div><div>加载图片…</div></div>';
    scroll.scrollTop = 0;
    var url = srcKey === 'jm18'
      ? (S().base + '/comic/chapter/' + ch.id)
      : (S().base + '/chapter.php?id=' + ch.id);
    fetchText(url).then(function (html) {
      var imgs = [];
      var m;
      if (srcKey === 'jm18') {
        var re = /(?:data-src|src)="(https?:\/\/[^"]+\.(?:jpg|jpeg|png|webp)[^"]*)"/gi;
        while ((m = re.exec(html))) {
          var u = m[1];
          if (/loading\.svg|icon|logo|avatar/i.test(u)) continue;
          if (/upload|xi\.|dzuxta|chapter|page/i.test(u) || /\.(jpg|jpeg|png|webp)/i.test(u)) {
            if (imgs.indexOf(u) < 0) imgs.push(u);
          }
        }
      } else {
        var re2 = /class="reading-image[^"]*"[^>]+src="([^"]+)"/gi;
        while ((m = re2.exec(html))) imgs.push(absUrl(S().base, m[1]));
        if (!imgs.length) {
          var re3 = /(?:data-src|data-original)="(https?:\/\/[^"]+\.(?:jpg|jpeg|png|webp)[^"]*)"/gi;
          while ((m = re3.exec(html))) {
            if (/chapter|comics\/chapters|page_/i.test(m[1])) imgs.push(m[1]);
          }
        }
      }
      if (!imgs.length) { pages.innerHTML = '<div class="empty">未解析到图片</div>'; return; }
      if (srcKey === 'jm18') {
        /* 先占位，边解密边显示 */
        var ph = '<div id="jmProg" style="position:sticky;top:0;z-index:2;background:rgba(0,0,0,.75);color:#aaa;font-size:12px;text-align:center;padding:8px 0">解密中 0/' + imgs.length + '</div>';
        for (var pi = 0; pi < imgs.length; pi++) {
          ph += '<div class="jm-slot" data-i="' + pi + '" style="min-height:120px;background:#111;margin:0 auto;width:100%;max-width:900px"></div>';
        }
        pages.innerHTML = ph;
        scroll.scrollTop = 0;
        var loaded = 0, cursor = 0, running = 0, maxC = 3;
        function place(i, blobUrl) {
          var slot = pages.querySelector('.jm-slot[data-i="' + i + '"]');
          if (!slot) return;
          if (blobUrl) {
            slot.style.minHeight = '0';
            slot.innerHTML = '<img src="' + blobUrl + '" alt="p' + (i + 1) + '" style="width:100%;display:block"/>';
          } else {
            slot.innerHTML = '<div style="padding:20px;text-align:center;color:#666;font-size:12px">第' + (i + 1) + '页失败</div>';
          }
        }
        function next() {
          while (running < maxC && cursor < imgs.length) {
            (function (i, u) {
              running++; cursor++;
              jmDecryptToBlobUrl(u).then(function (b) {
                place(i, b);
                loaded++; running--;
                var p = document.getElementById('jmProg');
                if (p) {
                  p.textContent = '解密中 ' + loaded + '/' + imgs.length + (loaded >= imgs.length ? ' · 完成' : '');
                  if (loaded >= imgs.length) setTimeout(function () { if (p.parentNode) p.parentNode.removeChild(p); }, 800);
                }
                next();
              }).catch(function () {
                place(i, '');
                loaded++; running--;
                next();
              });
            })(cursor, imgs[cursor]);
          }
        }
        next();
      } else {
        var h = '';
        for (var i = 0; i < imgs.length; i++) {
          h += '<img src="' + esc(imgSrc(imgs[i])) + '" alt="p' + (i + 1) + '" loading="' + (i < 3 ? 'eager' : 'lazy') + '" referrerpolicy="no-referrer"/>';
        }
        pages.innerHTML = h;
        scroll.scrollTop = 0;
      }
    }).catch(function (e) {
      pages.innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  }
  function closeReaderUI() {
    document.getElementById('reader').classList.remove('on');
    document.getElementById('rdPages').innerHTML = '';
  }
  document.getElementById('rdBack').addEventListener('click', function () { history.back(); });
  document.getElementById('rdPrev').addEventListener('click', function () { if (curChIdx > 0) openChapter(curChIdx - 1); });
  document.getElementById('rdNext').addEventListener('click', function () { if (curChIdx < curChapters.length - 1) openChapter(curChIdx + 1); });
  document.getElementById('rdScroll').addEventListener('click', function () {
    barVisible = !barVisible;
    document.getElementById('rdBar').classList.toggle('hide', !barVisible);
    document.getElementById('rdFoot').classList.toggle('hide', !barVisible);
  });

  function boot() {
    updateSrcUI();
    renderCatTags();
    return waitForNativeSdk(2500).then(function () {
      initViewport();
      return loadHome();
    });
  }
  boot();
})();
</script>
