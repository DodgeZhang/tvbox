<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TMDB影视 TV</title>
<style>
:root{
  color-scheme:dark;
  --side-w:86px;
  --rainbow:linear-gradient(90deg,#ff2d55,#ff8a00,#ffe600,#35e36f,#19d8ff,#526cff,#a94dff,#ff3cac,#ff2d55);
  --rainbow50:linear-gradient(90deg,rgba(255,45,85,.5),rgba(255,138,0,.5),rgba(255,230,0,.5),rgba(53,227,111,.5),rgba(25,216,255,.5),rgba(82,108,255,.5),rgba(169,77,255,.5),rgba(255,60,172,.5),rgba(255,45,85,.5));
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  background:transparent!important;
  color:#fff;
  -webkit-tap-highlight-color:transparent
}
button,input{
  font:inherit;
  color:inherit
}
button{
  border:0;
  outline:0;
  margin:0;
  padding:0;
  background:transparent;
  appearance:none;
  -webkit-appearance:none;
  cursor:pointer
}
img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover
}
[hidden]{display:none!important}

@keyframes rb{
  0%{background-position:0 50%}
  50%{background-position:100% 50%}
  100%{background-position:0 50%}
}
@keyframes shimmer{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}

.rainbow-focus{
  position:relative;
  border:3px solid transparent;
  outline:0;
  background:transparent;
  box-shadow:none
}
.rainbow-focus:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:40;
  padding:2px;
  border-radius:inherit;
  pointer-events:none;
  opacity:0;
  background:var(--rainbow);
  background-size:300% 300%;
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask-composite:exclude
}
.rainbow-focus:focus:before,
.rainbow-focus:focus-visible:before{
  opacity:1;
  animation:rb 2.4s linear infinite
}
.fill-focus:focus,
.fill-focus:focus-visible{
  color:#fff!important;
  background:var(--rainbow50)!important;
  background-size:300% 300%!important;
  animation:rb 3s linear infinite!important
}

/* 侧边栏 */
.side-nav{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:var(--side-w);
  z-index:9000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  background:transparent!important;
  transform:translateX(-110%);
  opacity:0;
  pointer-events:none;
  transition:.16s
}
body.side-open .side-nav{
  transform:translateX(0);
  opacity:1;
  pointer-events:auto
}
.side-btn{
  width:48px;
  height:48px;
  border-radius:999px;
  display:grid;
  place-items:center;
  color:#fff
}
.side-btn svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.35;
  stroke-linecap:round;
  stroke-linejoin:round
}

/* 分类侧栏 */
.cat-panel{
  display:none;
  position:fixed;
  left:calc(var(--side-w) + 12px);
  top:50%;
  transform:translateY(-50%);
  z-index:9050;
  width:200px;
  max-height:350px;
  overflow-y:auto;
  background:transparent!important;
  scrollbar-width:none
}
.cat-panel::-webkit-scrollbar{display:none}
body.cat-open .cat-panel{display:block}
.cat-item{
  display:block;
  width:max-content;
  min-width:86px;
  height:34px;
  margin:5px 0;
  padding:0 12px;
  border-radius:10px;
  font-size:15px;
  font-weight:900;
  text-align:left;
  white-space:nowrap;
  color:#fff
}
.cat-item.current:not(:focus){
  color:#fff;
  text-shadow:0 0 10px rgba(255,255,255,.8)
}

/* 搜索 */
.search-layer{
  display:none;
  position:fixed;
  inset:0;
  z-index:9500;
  background:transparent!important
}
body.search-open .search-layer{display:block}
.search-box{
  position:fixed;
  left:18vw;
  right:22vw;
  top:42px;
  display:grid;
  grid-template-columns:86px minmax(0,1fr) 72px;
  gap:12px
}
.search-back,
.search-submit{
  height:58px;
  border-radius:999px;
  font-weight:950;
  background:rgba(0,0,0,.12)
}
.search-input{
  height:58px;
  border-radius:999px;
  border:2px solid rgba(255,255,255,.28);
  background:rgba(0,0,0,.12);
  padding:0 24px;
  font-size:21px
}
.search-input:focus,
.search-input:focus-visible{
  border-color:#fff;
  box-shadow:0 0 0 3px rgba(25,216,255,.55);
  outline:0
}
.search-panel{
  position:fixed;
  left:18vw;
  right:22vw;
  top:116px;
  max-height:calc(100vh - 150px);
  overflow-y:auto;
  scrollbar-width:none
}
.search-panel::-webkit-scrollbar{display:none}
.search-item{
  width:100%;
  min-height:82px;
  padding:10px;
  display:grid;
  grid-template-columns:58px minmax(0,1fr);
  gap:12px;
  align-items:center;
  border-radius:16px;
  text-align:left;
  background:rgba(0,0,0,.08)
}
.search-item img{
  width:58px;
  height:76px;
  border-radius:8px
}
.search-title{
  font-size:18px;
  font-weight:900
}
.search-meta{
  margin-top:5px;
  font-size:13px;
  color:rgba(255,255,255,.72)
}

/* 首页 */
.app{
  min-height:100vh;
  padding:18px 54px 48px 72px;
  background:transparent!important
}
.top-tabs-wrap{
  width:100%;
  margin:0 auto 12px;
  padding:0 96px;
  overflow:visible
}
.top-tabs{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  overflow-x:auto;
  overflow-y:visible;
  scrollbar-width:none;
  scroll-padding-left:28px;
  scroll-padding-right:28px
}
.top-tabs::-webkit-scrollbar{display:none}
.tab-btn{
  flex:0 0 auto;
  min-width:116px;
  height:46px;
  padding:0 24px;
  border-radius:999px;
  color:rgba(255,255,255,.76);
  font-size:18px;
  font-weight:900;
  white-space:nowrap
}
.tab-btn.active{
  color:#fff;
  background:var(--rainbow50)!important;
  background-size:300% 300%!important;
  animation:rb 3s linear infinite!important
}
.hero-card{
  position:relative;
  width:100%;
  height:clamp(460px,60vh,610px)!important;
  min-height:460px!important;
  overflow:hidden;
  border-radius:14px;
  text-align:left;
  background:transparent!important
}
.bg-stack{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:transparent!important
}
.bg-layer{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  background-color:transparent!important;
  opacity:0;
  transition:opacity .28s ease;
  transform:scale(1.01);
  will-change:opacity
}
.bg-layer.active{opacity:1}
.bg-stack:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,rgba(0,0,0,.56),rgba(0,0,0,.16) 46%,rgba(0,0,0,.02)),
    linear-gradient(0deg,rgba(0,0,0,.32),transparent 56%)
}
.bg-stack.loading:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
  animation:shimmer 1.1s infinite
}
.hero-fake{display:none!important}
.hero-copy{
  position:absolute;
  left:44px!important;
  bottom:34px!important;
  z-index:3;
  width:33vw!important;
  max-width:33vw!important;
  pointer-events:none;
  background:transparent!important;
  text-shadow:0 3px 16px rgba(0,0,0,.55)!important
}
.hero-badge{display:none!important}
.hero-title{
  margin:0;
  width:33vw!important;
  max-width:33vw!important;
  font-size:clamp(30px,3vw,48px);
  line-height:1.08;
  font-weight:900;
  color:rgba(255,255,255,.72)!important;
  text-shadow:0 3px 16px rgba(0,0,0,.55)!important;
  display:-webkit-box!important;
  -webkit-line-clamp:2!important;
  -webkit-box-orient:vertical!important;
  overflow:hidden!important
}
.hero-meta{
  margin-top:8px;
  width:33vw!important;
  max-width:33vw!important;
  font-size:14px!important;
  line-height:1.36!important;
  color:rgba(255,255,255,.64)!important;
  text-shadow:0 2px 10px rgba(0,0,0,.55);
  display:-webkit-box!important;
  -webkit-line-clamp:2!important;
  -webkit-box-orient:vertical!important;
  overflow:hidden!important
}
.hero-dots{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:8px 0 4px
}
.hero-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:rgba(255,255,255,.38)
}
.hero-dot.active{background:#fff}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 0 14px
}
.section-head h2{
  margin:0;
  font-size:24px;
  font-weight:850;
  text-shadow:0 2px 8px #000
}
.section-head small{color:rgba(255,255,255,.72)}
.grid,
.cast-grid,
.person-work-grid,
.recommend-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr))!important;
  gap:18px
}
.vod-card,
.person-card{
  position:relative;
  aspect-ratio:2/3;
  overflow:hidden;
  border-radius:12px;
  text-align:left;
  background:transparent!important
}
.vod-card:focus,
.person-card:focus{
  z-index:5;
  transform:scale(1.035)
}
.vod-info,
.person-info{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:2;
  padding:48px 12px 12px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.86))
}
.vod-title,
.vod-remark,
.person-name,
.person-role{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  text-shadow:0 2px 8px #000
}
.vod-title,
.person-name{
  font-size:15px;
  font-weight:900
}
.vod-remark,
.person-role{
  margin-top:5px;
  font-size:12px;
  color:rgba(255,255,255,.72)
}
.page-sentinel{
  width:100%;
  height:44px;
  margin-top:18px;
  display:grid;
  place-items:center;
  color:rgba(255,255,255,.66);
  font-size:14px;
  pointer-events:none
}
.page-sentinel.loading:after{content:"正在加载下一页..."}
.page-sentinel.end:after{content:"已经到底了"}
.empty{
  min-height:110px;
  display:grid;
  place-items:center;
  color:rgba(255,255,255,.74);
  text-align:center;
  text-shadow:0 2px 8px #000
}

/* 详情 */
.detail{
  display:none;
  position:fixed;
  inset:0;
  z-index:2000;
  width:100vw;
  height:100vh;
  overflow-x:hidden;
  overflow-y:auto;
  background:transparent!important;
  color:#fff;
  overscroll-behavior:contain
}
.detail.active{display:block}
.detail-bg-stack{
  position:fixed;
  inset:0;
  z-index:0;
  background:transparent!important
}
.detail-bg-stack:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.24),rgba(0,0,0,.03)),
    linear-gradient(0deg,rgba(0,0,0,.84),transparent 74%)
}
.detail-first{
  position:relative;
  z-index:2;
  height:100vh;
  min-height:100vh
}
.detail.second-open .detail-copy{
  visibility:hidden!important;
  opacity:0!important;
  pointer-events:none!important
}
.detail-copy{
  position:absolute;
  left:72px!important;
  bottom:34px!important;
  width:33vw!important;
  max-width:33vw!important;
  height:62vh!important;
  display:flex!important;
  flex-direction:column!important;
  pointer-events:none;
  background:transparent!important;
  text-shadow:0 3px 16px rgba(0,0,0,.55)!important
}
.detail-title-zone{
  width:33vw!important;
  max-width:33vw!important;
  height:158px!important;
  min-height:158px!important;
  max-height:158px!important;
  padding:18px 16px 0 0!important;
  margin-top:10px!important;
  overflow:visible!important;
  flex:0 0 auto!important
}
.detail-title-row{
  width:33vw!important;
  max-width:33vw!important;
  height:140px!important;
  min-height:140px!important;
  display:flex;
  align-items:flex-end!important;
  overflow:visible!important
}
.detail-title-main,
.detail-title{
  margin:0;
  width:33vw!important;
  max-width:33vw!important;
  line-height:1.06;
  font-size:clamp(38px,5.2vw,64px);
  font-weight:900;
  color:rgba(255,255,255,.72)!important;
  text-shadow:0 4px 20px rgba(0,0,0,.62)!important;
  display:-webkit-box!important;
  -webkit-line-clamp:2!important;
  -webkit-box-orient:vertical!important;
  overflow:hidden!important
}
.detail-title-logo{
  display:none;
  width:auto!important;
  height:auto!important;
  max-width:calc(33vw - 8px)!important;
  max-height:126px!important;
  object-fit:contain!important;
  object-position:left bottom!important;
  margin:0 0 4px!important;
  filter:drop-shadow(0 5px 22px rgba(0,0,0,.62))!important
}
.detail-title-row.has-logo .detail-title-main{display:none!important}
.detail-title-row.has-logo .detail-title-logo{display:block!important}
.detail-title-variant{display:none!important}
.detail-meta{
  margin-top:14px!important;
  width:33vw!important;
  max-width:33vw!important;
  min-height:22px;
  font-size:clamp(10px,.86vw,13px);
  line-height:1.28;
  color:rgba(255,255,255,.62)!important;
  pointer-events:auto;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical
}
.detail-desc{
  margin-top:10px!important;
  width:33vw!important;
  max-width:33vw!important;
  font-size:clamp(11px,.86vw,14px);
  line-height:1.36;
  color:rgba(255,255,255,.64)!important;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  pointer-events:auto
}
.detail-actions{
  margin-top:auto!important;
  margin-bottom:0!important;
  display:flex!important;
  gap:14px!important;
  flex:0 0 auto!important;
  pointer-events:auto
}
.detail-btn{
  width:auto;
  min-width:0;
  height:40px;
  padding:0 18px;
  border-radius:999px;
  font-size:15px;
  font-weight:950;
  background:transparent!important
}
.detail.pan-open .detail-meta,
.detail.pan-open .detail-desc{display:none!important}
.detail.pan-open #detailBackBtn{display:none!important}

/* 盘搜 */
.pan-zone{
  display:none!important;
  width:33vw!important;
  max-width:33vw!important;
  margin-top:10px!important;
  flex:0 0 auto!important;
  pointer-events:auto
}
.detail.pan-open .pan-zone{display:block!important}
.pan-title{display:none!important}
.pan-layout{
  display:grid!important;
  grid-template-rows:34px 174px!important;
  grid-template-columns:1fr!important;
  gap:8px!important;
  width:33vw!important;
  max-width:33vw!important
}
.pan-types{
  width:33vw!important;
  max-width:33vw!important;
  height:34px!important;
  display:flex!important;
  flex-direction:row!important;
  gap:8px!important;
  overflow-x:auto!important;
  overflow-y:hidden!important;
  scrollbar-width:none!important;
  padding-bottom:2px;
  overscroll-behavior:contain
}
.pan-types::-webkit-scrollbar{display:none}
.pan-type{
  flex:0 0 auto;
  width:auto;
  min-width:0;
  height:32px;
  padding:0 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:950;
  text-align:center;
  white-space:nowrap;
  background:rgba(0,0,0,.10)
}
.pan-type.current:not(:focus){
  color:#fff;
  text-shadow:0 0 10px rgba(255,255,255,.9)
}
.pan-results{
  position:relative;
  width:33vw!important;
  max-width:33vw!important;
  height:174px!important;
  min-height:174px!important;
  max-height:174px!important;
  display:flex!important;
  flex-direction:column!important;
  gap:6px!important;
  overflow-y:auto!important;
  overflow-x:hidden!important;
  scrollbar-width:none!important;
  padding-right:2px;
  overscroll-behavior:contain!important;
  scroll-behavior:auto!important;
  -webkit-overflow-scrolling:touch;
  will-change:scroll-position
}
.pan-results::-webkit-scrollbar{display:none}
.pan-item{
  flex:0 0 50px!important;
  flex-shrink:0!important;
  width:33vw!important;
  max-width:33vw!important;
  min-height:50px!important;
  height:50px!important;
  max-height:50px!important;
  border-radius:12px!important;
  padding:7px 11px!important;
  text-align:left;
  background:rgba(0,0,0,.08)!important;
  overflow:hidden;
  display:grid;
  grid-template-columns:14px minmax(0,1fr);
  align-items:center;
  gap:8px
}
.pan-item.resolving{opacity:.7}
.pan-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.30)
}
.pan-dot.checking{
  background:#19d8ff;
  box-shadow:0 0 8px rgba(25,216,255,.75)
}
.pan-dot.ok{
  background:#35e36f;
  box-shadow:0 0 8px rgba(53,227,111,.75)
}
.pan-dot.locked{
  background:#ffe600;
  box-shadow:0 0 8px rgba(255,230,0,.75)
}
.pan-dot.uncertain,
.pan-dot.unsupported{
  background:#ff8a00;
  box-shadow:0 0 8px rgba(255,138,0,.7)
}
.pan-dot.bad{
  background:#ff2d55;
  box-shadow:0 0 8px rgba(255,45,85,.7)
}
.pan-item-title{
  width:calc(33vw - 42px)!important;
  max-width:calc(33vw - 42px)!important;
  font-size:13px!important;
  font-weight:850;
  line-height:1.32!important;
  white-space:normal;
  display:-webkit-box!important;
  -webkit-line-clamp:2!important;
  -webkit-box-orient:vertical!important;
  overflow:hidden!important
}
.pan-item-meta{display:none!important}

/* 盘搜打开时给资源框腾出稳定空间 */
.detail.pan-open .detail-title-zone{
  height:136px!important;
  min-height:136px!important;
  max-height:136px!important
}
.detail.pan-open .detail-title-row{
  height:118px!important;
  min-height:118px!important
}

/* 详情第二屏 */
.detail-second{
  position:relative;
  z-index:3;
  width:calc(100vw - 144px);
  height:calc(100vh - 54px);
  margin:0 72px 80px;
  display:grid;
  grid-template-rows:58px minmax(0,1fr)
}
.detail-tabs{
  display:flex;
  align-items:center;
  gap:34px;
  height:58px;
  border-bottom:1px solid rgba(255,255,255,.28)
}
.detail-tab{
  position:relative;
  min-width:112px;
  height:42px;
  border-radius:999px;
  padding:0 18px;
  font-size:20px;
  font-weight:900;
  color:rgba(255,255,255,.72);
  background:transparent!important
}
.detail-tab.active{
  color:#fff!important;
  background:transparent!important;
  animation:none!important;
  text-shadow:0 0 10px rgba(255,255,255,.72)
}
.detail-tab.active:after{
  content:"";
  position:absolute;
  left:24%;
  right:24%;
  bottom:-7px;
  height:4px;
  border-radius:999px;
  background:var(--rainbow);
  background-size:300% 300%;
  animation:rb 2.4s linear infinite;
  box-shadow:
    0 0 8px rgba(25,216,255,.55),
    0 0 12px rgba(255,45,85,.35)
}
.tab-viewport{
  height:100%;
  overflow:hidden
}
.tab-content{
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  padding:16px 0 100px;
  scrollbar-width:none
}
.tab-content::-webkit-scrollbar{display:none}
.tab-block{display:none}
.tab-block.active{display:block}
.tab-title{
  margin:18px 0 12px;
  font-size:19px;
  font-weight:950
}
.info-text{
  font-size:17px;
  line-height:1.72
}
.info-row{margin:0 0 9px}
.info-label{font-weight:950}
.season-layout{
  display:grid;
  grid-template-columns:170px minmax(0,1fr);
  gap:26px
}
.season-tabs{
  display:flex;
  flex-direction:column;
  gap:10px
}
.season-tab{
  height:38px;
  border-radius:999px;
  font-size:14px;
  font-weight:900
}
.episode-rail{
  display:flex;
  flex-direction:column;
  gap:14px
}
.episode-card{
  display:grid;
  grid-template-columns:230px minmax(0,1fr) 72px;
  gap:20px;
  align-items:center;
  min-height:116px;
  text-align:left;
  border-radius:10px
}
.episode-still{
  width:230px;
  height:129px;
  border-radius:10px;
  overflow:hidden
}
.episode-title{
  font-size:17px;
  font-weight:900
}
.episode-meta{
  font-size:13px;
  color:rgba(255,255,255,.72);
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden
}
.stills-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr))!important;
  gap:14px
}
.still-card{
  aspect-ratio:16/9;
  border-radius:10px;
  overflow:hidden
}
.still-card:focus{
  z-index:5;
  transform:scale(1.025)
}

/* 图片查看 */
.viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:99999;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.96);
  padding:24px
}
.viewer.active{display:flex}
.viewer img{
  width:auto;
  height:auto;
  max-width:96vw;
  max-height:92vh;
  object-fit:contain;
  border-radius:8px
}
.viewer-count{
  position:fixed;
  right:32px;
  top:24px;
  font-size:18px;
  font-weight:900
}
.toast{
  position:fixed;
  left:50%;
  bottom:42px;
  transform:translateX(-50%);
  z-index:999999;
  padding:10px 18px;
  border-radius:999px;
  background:rgba(0,0,0,.72);
  opacity:0;
  transition:.18s
}
.toast.show{opacity:1}

@media(max-width:980px){
  .app{padding:16px 16px 48px}
  .top-tabs-wrap{padding:0}
  .grid,
  .cast-grid,
  .person-work-grid,
  .recommend-grid{gap:10px}
  .hero-copy,
  .hero-title,
  .hero-meta{
    width:55vw!important;
    max-width:55vw!important
  }
  .hero-copy{
    left:22px!important;
    bottom:22px!important
  }
  .detail-copy{
    left:32px!important;
    width:38vw!important;
    max-width:38vw!important
  }
  .detail-title-zone,
  .detail-title-row,
  .detail-title-main,
  .detail-title,
  .detail-meta,
  .detail-desc,
  .pan-zone,
  .pan-layout,
  .pan-types,
  .pan-results,
  .pan-item{
    width:38vw!important;
    max-width:38vw!important
  }
  .detail-title-logo{
    max-width:calc(38vw - 8px)!important
  }
  .pan-item-title{
    width:calc(38vw - 42px)!important;
    max-width:calc(38vw - 42px)!important
  }
  .detail-second{
    width:calc(100vw - 64px);
    margin:0 32px 80px
  }
}

  opacity:0!important;
  animation:none!important;

html.low-webview-compat .rainbow-focus.compat-focus,

  outline-offset:2px!important;

}

html.low-webview-compat .pan-type.compat-focus,

.detail-title-variant,

.detail-desc,

.detail-title-zone:focus,
.detail-title-row:focus,
.detail-title-main:focus,
.detail-title:focus,
.detail-title-variant:focus,
.detail-meta:focus,
.detail-desc:focus,
.info-text:focus,
.info-text.compat-focus,

html.low-webview-compat .detail-title-row:focus,
html.low-webview-compat .detail-title-main:focus,
html.low-webview-compat .detail-title:focus,
html.low-webview-compat .detail-title-variant:focus,
html.low-webview-compat .detail-meta:focus,
html.low-webview-compat .detail-desc:focus,
html.low-webview-compat .info-text:focus,
html.low-webview-compat .info-text.compat-focus{
  background:transparent!important;
  border-color:transparent!important;
  box-shadow:none!important;
  outline:0!important;
}

html.low-webview-compat .bg-layer,

html.low-webview-compat .side-nav{width:86px!important;}

html.low-webview-compat .grid,
html.low-webview-compat .cast-grid,
html.low-webview-compat .person-work-grid,
html.low-webview-compat .recommend-grid{display:flex!important;flex-wrap:wrap!important;}
html.low-webview-compat .vod-card,

html.low-webview-compat .search-box{display:flex!important;}

                        if (movePanResultsFocus(key)) {
                            eat(event);
                        }
                        return;
                    }
                    if (key === "Enter") {
                        eat(event);
                        button.click();
                    }
                }, true);
                resultRoot.appendChild(button);
            });
            restorePanViewState(previous);
        };

        movePanTypesFocus = function (direction) {
            var current = document.activeElement;
            var list = panTypeButtons();
            var index = list.indexOf(current);
            if (!list.length) {
                if (S.pan.loading) {
                    return true;
                }
                return reveal($("detailPanBtn"));
            }
            if (index < 0) {
                return reveal(activePanType() || list[0], $("panTypes"));
            }
            if (direction === "Left" || direction === "Right") {
                var nextIndex = direction === "Left" ? Math.max(0, index - 1) : Math.min(list.length - 1, index + 1);
                if (nextIndex === index) {
                    return true;
                }
                return finalActivatePanType(list[nextIndex], false, true);
            }
            if (direction === "Up") {
                return reveal($("detailPanBtn"));
            }
            if (direction === "Down") {
                var first = firstPanItemForCurrentType();
                if (first) {
                    return focusPanItem(first);
                }
                if (S.pan.loading) {
                    return true;
                }
                return enterDetailSecond(current);
            }
            return false;
        };

        document.addEventListener("keydown", function (event) {
            if (!document.documentElement.classList.contains("low-webview-compat")) {
                return;
            }
            var key = keyOf(event);
            if (key !== "Enter") {
                return;
            }
            var active = document.activeElement;
            if (!active || !active.closest) {
                return;
            }
            var typeBtn = active.closest("#panTypes .pan-type");
            if (typeBtn) {
                eat(event);
                finalActivatePanType(typeBtn, true, false);
                return;
            }
            var panItem = active.closest("#panResults .pan-item");
            if (panItem && typeof panItem.click === "function") {
                eat(event);
                panItem.click();
            }
        }, true);
    })();


    boot();
})();

</script>
</body>
</html>
