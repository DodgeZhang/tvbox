  var QUALITY_RANK = { "4K": 5, "2K": 4, "1080P": 3, "720P": 2, "480P": 1 };

  function loadDetailResources(item, currentId, currentSrv, mediaType) {
    var slot = el("detail-resources");
    if (!slot) return;

    var chosenQuality = null;
    var lastEpisodeSrc = { id: currentId, srvId: (currentSrv && currentSrv.id) || "" };
    var itemTmdbId = item.ProviderIds && (item.ProviderIds.Tmdb || item.ProviderIds.tmdb);

    /* 本服资源优先：立刻用当前条目铺一张资源卡，不阻塞等跨服匹配 */
    var matches = [];
    if (currentId && currentSrv) {
      matches.push({
        Id: currentId,
        Name: item.Name,
        Type: item.Type,
        ProductionYear: item.ProductionYear,
        ImageTags: item.ImageTags || {},
        PrimaryImageTag: item.PrimaryImageTag,
        CommunityRating: item.CommunityRating,
        _srvId: currentSrv.id,
        _srvName: currentSrv.name
      });
    }

    function bestVersion(versions) {
      var best = null, bestScore = -1;
      (versions || []).forEach(function (v) {
        var score = QUALITY_RANK[v.label] || 0;
        if (score > bestScore) { bestScore = score; best = v; }
      });
      return best;
    }
    function versionForQuality(versions, q) {
      return (versions || []).filter(function (v) { return v.label === q; })[0] || null;
    }

    function renderResourceSection() {
      if (!slot || slot !== el("detail-resources")) return;

      var visible = matches.filter(function (it) {
        if (!chosenQuality) return true;
        if (it._versions === undefined) return true;
        return !!versionForQuality(it._versions, chosenQuality);
      });

      var cards = visible.map(function (it) {
        var msrv = getServerById(it._srvId);
        var img = imageUrl(it.Id, "Primary", { maxHeight: 300, tag: imgTag(it, "Primary") }, msrv);
        var version = chosenQuality ? versionForQuality(it._versions, chosenQuality) : bestVersion(it._versions);

        var badgeText = version ? (version.label + (version.bitrate ? " · " + version.bitrate : "")) : "";
        var badge = version ? '<span class="poster-quality-badge">' + escapeHtml(badgeText) + '</span>' :
          (it._versions === null ? '<span class="poster-quality-badge poster-quality-badge-unknown" title="画质查询失败">?</span>' : "");

        var isDefaultSource = it.Id === currentId && it._srvId === (currentSrv && currentSrv.id);
        /* vid 为空表示选中时画质版本还没查回来：此时只按 id+srvId 匹配，避免版本查回后重渲染把高亮弄丢 */
        var isPicked = !!(detailPickedResource && detailPickedResource.id === it.Id &&
          detailPickedResource.srvId === (it._srvId || "") &&
          (!detailPickedResource.vid || detailPickedResource.vid === (version ? version.id : "")));
        var isActive = detailPickedResource ? isPicked : isDefaultSource;
        var cardCls = "poster-card focusable" + (isActive ? " current" : "");
        var hdrLine = (version && version.hdr) ? '<span class="poster-media-info">' + escapeHtml(version.hdr) + '</span>' : "";
        return '<div class="' + cardCls + '" tabindex="0" data-match-id="' + it.Id + '" data-match-server="' + escapeHtml(it._srvId || "") +
          '" data-vid="' + escapeHtml(version ? version.id : "") + '" data-vlabel="' + escapeHtml(version ? version.label : "") + '">' +
          '<div class="poster-art"><img data-src="' + img + '" />' + badge + hdrLine +
            '<span class="poster-glow"></span><span class="poster-tap-hint">▶</span>' +
          '</div>' +
          '<div class="poster-name">' + escapeHtml(it._srvName || "") + '</div></div>';
      }).join("");

      var qualitySet = {};
      matches.forEach(function (it) { (it._versions || []).forEach(function (v) { qualitySet[v.label] = true; }); });
      var qualities = Object.keys(qualitySet).sort(function (a, b) { return (QUALITY_RANK[b] || 0) - (QUALITY_RANK[a] || 0); });
      var pickerHtml = qualities.length ? '<div class="quality-picker" id="detail-quality-picker">' +
        '<span class="quality-chip focusable' + (chosenQuality ? "" : " sel") + '" tabindex="0" data-quality="">全部</span>' +
        qualities.map(function (q) {
          return '<span class="quality-chip focusable' + (chosenQuality === q ? " sel" : "") + '" tabindex="0" data-quality="' + escapeHtml(q) + '">' + escapeHtml(q) + '</span>';
        }).join("") + '</div>' : '';

      var multiSource = matches.length > 1;
      var multiVersion = matches.some(function (it) {
        return Array.isArray(it._versions) && it._versions.length > 1;
      });
      var versionsPending = matches.some(function (it) { return it._versions === undefined; });
      /* 仅本服且画质已查明且无多版本/多源时才展示；跨服匹配尚未回来时也先露出本服卡 */
      var matchPending = !!slot.getAttribute("data-match-pending");
      if (!multiSource && !multiVersion && !versionsPending && !matchPending) {
        slot.innerHTML = "";
        return;
      }

      slot.innerHTML = '<div class="ep-header"><div class="detail-section-title">资源</div>' + pickerHtml + '</div><div class="row-scroll">' + cards + '</div>';
      hydrateImages(slot);

      qsa(".quality-chip", slot).forEach(function (chip) {
        chip.addEventListener("click", function (e) {
          e.stopPropagation();
          var q = chip.getAttribute("data-quality");
          /* 点"全部"或者再点一下已选中的画质，都等于取消筛选，回到"全部来源都显示"。 */
          chosenQuality = (!q || chosenQuality === q) ? null : q;
          renderResourceSection();
        });
      });
      qsa("[data-match-id]", slot).forEach(function (node) {
        node.addEventListener("click", function () {
          var id = node.getAttribute("data-match-id");
          var srvId = node.getAttribute("data-match-server") || "";
          var msrv = getServerById(srvId);
          var vid = node.getAttribute("data-vid");
          var vlabel = node.getAttribute("data-vlabel");

          var alreadyPicked = detailPickedResource && detailPickedResource.id === id &&
            detailPickedResource.srvId === srvId &&
            (!detailPickedResource.vid || !vid || detailPickedResource.vid === vid);
          if (alreadyPicked) {

            node.classList.add("launching");
            setTimeout(function () { node.classList.remove("launching"); }, 340);
            var audioIdx = detailPickedResource ? detailPickedResource.audioIndex : null;
            if (vid) playItem(id, null, msrv, { mediaSourceId: vid, qualityLabel: vlabel, audioStreamIndex: audioIdx });
            else playItem(id, null, msrv, { audioStreamIndex: audioIdx });
            return;
          }
          detailPickedResource = { id: id, srvId: srvId, srv: msrv, vid: vid || "", vlabel: vlabel || "" };
          /* 换资源后立刻按新资源预取 PlaybackInfo */
          detailPrefetchPlay = null;
          if (msrv) {
            prefetchPlaybackForResource(id, msrv, {
              asSeries: mediaType === "tv",
              seriesId: mediaType === "tv" ? id : null,
              mediaSourceId: vid || null,
              focusEpisodeId: mediaType === "tv" ? detailFocusEpisodeId : null,
              detailToken: detailHeroToken
            });
          }

          qsa(".poster-card.current", slot).forEach(function (n) { n.classList.remove("current"); });
          node.classList.add("current");

          if (mediaType === "tv" && el("episodes-slot") && (id !== lastEpisodeSrc.id || srvId !== lastEpisodeSrc.srvId)) {
            lastEpisodeSrc = { id: id, srvId: srvId };
            detailFocusEpisodeId = null;
            loadEpisodes(id, msrv || currentSrv);
          }
        });
      });
    }

    function loadVersionsFor(items) {
      if (!items || !items.length) return;
      setTimeout(function () {
        try {
          Promise.all(items.map(function (it) {
            if (it._versions !== undefined) return null;
            var msrv = getServerById(it._srvId);
            if (!msrv) { it._versions = []; return null; }
            var loaderPromise;
            try {
              loaderPromise = mediaType === "movie" ? loadItemVersions(it.Id, msrv) : loadSeriesVersions(it.Id, msrv);
            } catch (e) {
              loaderPromise = Promise.resolve([]);
            }
            return loaderPromise.then(function (versions) { it._versions = versions; }).catch(function () { it._versions = null; });
          })).then(function () {
            if (!slot || slot !== el("detail-resources")) return;
            renderResourceSection();
          }).catch(function () { /* 增强失败不影响已渲染的资源卡片，静默忽略 */ });
        } catch (e) { /* 同上 */ }
      }, 0);
    }

    /* 立刻用本服资源出卡（与 TMDB 详情「先内容后资源」同节奏） */
    if (!STATE.crossServerMatch) {
      slot.removeAttribute("data-match-pending");
      renderResourceSection();
      loadVersionsFor(matches);
      return;
    }
    slot.setAttribute("data-match-pending", "1");
    renderResourceSection();
    loadVersionsFor(matches);

    /* 后台跨服匹配：结果回来再合并补卡，不挡首屏 */
    matchTmdbOnServers(item.Name, item.ProductionYear, mediaType, itemTmdbId || "", []).then(function (found) {
      if (!slot || slot !== el("detail-resources")) return;
      slot.removeAttribute("data-match-pending");
      found = (found || []).slice();
      var seen = {};
      matches.forEach(function (it) {
        seen[(it._srvId || "") + "|" + it.Id] = true;
      });
      var added = [];
      found.forEach(function (it) {
        var key = (it._srvId || "") + "|" + it.Id;
        if (seen[key]) return;
        seen[key] = true;
        matches.push(it);
        added.push(it);
      });
      /* 保证本服条目始终排在最前 */
      if (currentId && currentSrv) {
        var curKey = currentSrv.id + "|" + currentId;
        matches.sort(function (a, b) {
          var ak = (a._srvId || "") + "|" + a.Id;
          var bk = (b._srvId || "") + "|" + b.Id;
          if (ak === curKey) return -1;
          if (bk === curKey) return 1;
          return 0;
        });
      }
      renderResourceSection();
      if (added.length) loadVersionsFor(added);
    }).catch(function () {
      if (slot && slot === el("detail-resources")) {
        slot.removeAttribute("data-match-pending");
        renderResourceSection();
      }
    });
  }

  function resetDetailScroll() {
    var sc = el("detail-screen");
    if (!sc) return;
    try {
      sc.scrollTop = 0;
      sc.scrollLeft = 0;
    } catch (e0) {}
    /* 双 rAF：等骨架/正文替换完成、布局稳定后再钉一次，避免滚动锚定把位置拉回去 */
    requestAnimationFrame(function () {
      try { sc.scrollTop = 0; sc.scrollLeft = 0; } catch (e1) {}
      requestAnimationFrame(function () {
        try { sc.scrollTop = 0; sc.scrollLeft = 0; } catch (e2) {}
      });
    });
  }

  function renderDetail(data) {
    if (data && data.tmdbId) { detailHeroReset(); openTmdbOrMatchedDetail(data); return; }
    var itemId = data.id;
    
    var srv = (data.serverId && getServerById(data.serverId)) || activeServer();
    var skipShell = !!data.skipShellSetup;
    var detailFields = DETAIL_FIELDS_FAST;

        var prevChips = [];

            '<div class="detail-actions"><button class="detail-play focusable" tabindex="0" id="detail-play-btn">▶ 播放</button></div>' +
          '</div></div><div class="detail-body">' +
            detailBodySkeletonHtml() +
            '<div id="episodes-slot" style="display:none"></div><div id="detail-resources" style="display:none"></div>' +
            '<div id="detail-cast" style="display:none"></div><div id="detail-similar" style="display:none"></div></div>';
      } else if (!cachedItem) {
        el("detail-content").innerHTML = detailSkeletonHtml();
      } else {
        el("detail-content").innerHTML = "";
      }
      el("detail-screen").classList.add("detail-loading");
      resetDetailScroll();

      document.body.classList.add("detail-active"); clearInterval(homeHeroTimer);
      detailHeroReset();

      resetDetailScroll();

    detailHeroToken = itemId;
    detailPickedResource = null;
    detailFocusEpisodeId = data.focusEpisodeId || null;
    detailPrefetchPlay = null;

    /* 缓存命中时立刻铺壁纸：不等微任务队列，首帧就能看到图而不是灰骨架 */

      var pic = imageUrl(itemId, "Primary", { maxHeight: 900, tag: imgTag(item, "Primary") }, srv);

  var EP_RANGE_CHUNK = 10;
  var EP_RANGE_SHOW_MIN = 13;

  function buildEpRangeNavHtml(count) {
    if (count <= EP_RANGE_SHOW_MIN) return "";
    var chips = [];
    for (var start = 1; start <= count; start += EP_RANGE_CHUNK) {
      var end = Math.min(start + EP_RANGE_CHUNK - 1, count);
      chips.push('<button type="button" class="ep-range-chip focusable' + (start === 1 ? ' active' : '') +
        '" tabindex="0" data-range-start="' + (start - 1) + '">' + start + (end > start ? ('-' + end) : '') + '</button>');
    }
    return '<div class="ep-range-nav">' + chips.join("") + '</div>';
  }

  function wireEpRangeNav(navEl, rowEl) {
    if (!navEl || !rowEl) return;
    var chips = qsa(".ep-range-chip", navEl);
    if (!chips.length) return;
    chips.forEach(function (chip) {
      chip.addEventListener("click", function () {
        var idx = parseInt(chip.getAttribute("data-range-start"), 10) || 0;
        var card = rowEl.children[idx];
        if (!card) return;
        rowEl.scrollTo({ left: Math.max(0, card.offsetLeft - 16), behavior: "smooth" });
        chips.forEach(function (c) { c.classList.remove("active"); });
        chip.classList.add("active");
      });
    });
    

    if (rowEl.dataset.epRangeScrollBound) return;
    rowEl.dataset.epRangeScrollBound = "1";
    var raf = null;
    rowEl.addEventListener("scroll", function () {
      if (raf) return;
      raf = requestAnimationFrame(function () {
        raf = null;
        var live = qsa(".ep-range-chip", navEl);
        if (!live.length) return;
        var kids = rowEl.children;
        var mid = rowEl.scrollLeft + 24;
        var curIdx = 0;
        for (var i = 0; i < kids.length; i++) {
          if (kids[i].offsetLeft <= mid) curIdx = i; else break;
        }
        var rangeIdx = Math.floor(curIdx / EP_RANGE_CHUNK);
        live.forEach(function (c, i) { c.classList.toggle("active", i === rangeIdx); });
      });
    }, { passive: true });
  }

  function loadEpisodes(seriesId, srv) {
    srv = srv || activeServer();
    var slot = el("episodes-slot");
    if (!slot) return;
    embyGet("/Shows/" + seriesId + "/Seasons?UserId=" + srv.userId, srv).then(function (d) {
      var seasons = (d && d.Items) || [];
      if (!slot || slot !== el("episodes-slot")) return;
      if (!seasons.length) { slot.innerHTML = ""; return; }

      function mountSeasonTabs(activeSeasonId) {
        var tabsHtml = seasons.map(function (s) {
          var isActive = s.Id === activeSeasonId;
          var sIdx = (s.IndexNumber != null) ? String(s.IndexNumber) : "";
          return '<div class="season-tab focusable' + (isActive ? ' active' : '') + '" tabindex="0" data-season="' + escapeHtml(s.Id) + '" data-season-index="' + escapeHtml(sIdx) + '">' + escapeHtml(s.Name || "") + '</div>';
        }).join("");
        slot.innerHTML = '<div class="ep-header"><div class="detail-section-title">剧集</div>' +
          '<div class="season-tabs" id="season-tabs">' + tabsHtml + '</div></div>' +
          '<div id="ep-range-nav"></div>' +
          '<div id="episode-list"></div>';
        qsa(".season-tab", slot).forEach(function (tab) {
          tab.addEventListener("click", function () {
            if (tab.classList.contains("active")) return;
            qsa(".season-tab", slot).forEach(function (t) { t.classList.remove("active"); });
            tab.classList.add("active");
            /* 手动切季后不再强制定位到「继续观看」那一集 */
            var idxAttr = tab.getAttribute("data-season-index");
            var seasonIdx = (idxAttr === "" || idxAttr == null) ? null : parseInt(idxAttr, 10);
            if (seasonIdx !== seasonIdx) seasonIdx = null; /* NaN → null */
            loadEpisodesForSeason(tab.getAttribute("data-season"), seriesId, srv, false, seasonIdx);
          });
        });
        var activeSeason = null;
        for (var si = 0; si < seasons.length; si++) {
          if (seasons[si].Id === activeSeasonId) { activeSeason = seasons[si]; break; }
        }
        var bootIdx = (activeSeason && activeSeason.IndexNumber != null) ? activeSeason.IndexNumber : null;
        loadEpisodesForSeason(activeSeasonId, seriesId, srv, true, bootIdx);
      }

      var focusEpId = detailFocusEpisodeId;
      if (!focusEpId) {
        mountSeasonTabs(seasons[0].Id);
        return;
      }
      /* 查这一集所属的季，优先打开那一季而不是默认第一季 */
      embyGet("/Users/" + srv.userId + "/Items/" + focusEpId, srv).then(function (ep) {
        if (!slot || slot !== el("episodes-slot")) return;
        var want = (ep && (ep.SeasonId || ep.ParentId)) || "";
        var match = null;
        if (want) {
          for (var i = 0; i < seasons.length; i++) {
            if (seasons[i].Id === want) { match = seasons[i].Id; break; }
          }
        }
        mountSeasonTabs(match || seasons[0].Id);
      }).catch(function () {
        if (!slot || slot !== el("episodes-slot")) return;
        mountSeasonTabs(seasons[0].Id);
      });
    }).catch(function () {});
  }

  function loadEpisodesForSeason(seasonId, seriesId, srv, shouldFocusResumeEp, seasonIndexNumber) {

    var epsPromise = embyGet("/Users/" + srv.userId + "/Items?ParentId=" + seasonId + "&SortBy=IndexNumber&SortOrder=Ascending&Fields=Overview,UserData,RunTimeTicks,PrimaryImageAspectRatio,ImageTags,PrimaryImageTag,SeriesPrimaryImageTag,ParentBackdropImageTags,ParentBackdropItemId,ParentId,SeriesId,IndexNumber,ParentIndexNumber", srv);
    var stillsPromise = Promise.resolve({});
    if (seasonIndexNumber != null && seasonIndexNumber === seasonIndexNumber) {
      stillsPromise = resolveSeriesTmdbId(seriesId, srv).then(function (tmdbId) {
        if (!tmdbId) return {};
        return fetchTmdbSeasonStillMap(tmdbId, seasonIndexNumber);
      }).catch(function () { return {}; });
    } else {
      
      stillsPromise = epsPromise.then(function (d) {
        var eps0 = (d && d.Items) || [];
        var guessed = null;
        if (eps0.length && eps0[0].ParentIndexNumber != null) guessed = eps0[0].ParentIndexNumber;
        if (guessed == null) return {};
        return resolveSeriesTmdbId(seriesId, srv).then(function (tmdbId) {
          if (!tmdbId) return {};
          return fetchTmdbSeasonStillMap(tmdbId, guessed);
        });
      }).catch(function () { return {}; });
    }
    Promise.all([epsPromise, stillsPromise]).then(function (pair) {
      var d = pair[0];
      var stillMap = pair[1] || {};
      if (!list || list !== el("episode-list")) return;
      var eps = (d && d.Items) || [];
      if (!eps.length) { list.innerHTML = '<div class="empty-row">此季暂无剧集</div>'; return; }
      list.className = "ep-row";
      list.innerHTML = eps.map(function (ep) {
        var label = ep.IndexNumber != null ? ("第 " + ep.IndexNumber + " 集") : (ep.Name || "");
        var name = (ep.Name || "").trim();
        var generic = !name || /^(第\s*\d+\s*集|Episode\s*\d+|EP?\s*\d+)$/i.test(name);
        var sub = generic ? (ep.RunTimeTicks ? Math.round(ep.RunTimeTicks / 600000000) + " 分钟" : "") : name;
        var played = ep.UserData && ep.UserData.Played;
        var tmdbStill = "";
        if (ep.IndexNumber != null) {
          tmdbStill = stillMap[ep.IndexNumber] || stillMap[String(ep.IndexNumber)] || "";

        return '<div class="ep-card focusable" tabindex="0" data-ep="' + ep.Id + '">' +
          '<div class="ep-label">' + escapeHtml(label) + '</div>' +
          '<div class="ep-thumb">' + episodeThumbImgHtml(ep, seriesId, srv, tmdbStill) +
            '<button class="ep-check' + (played ? ' on' : '') + '" data-ep-check="' + ep.Id + '">✓</button>' +
          '</div>' +
          (sub ? '<div class="ep-sub">' + escapeHtml(sub) + '</div>' : '') +
          '</div>';
      }).join("");
      
      qsa("img", list).forEach(function (img) { lazyImg(img); });
      var navEl = el("ep-range-nav");
      if (navEl && navEl.parentNode) {
        navEl.innerHTML = buildEpRangeNavHtml(eps.length);
        wireEpRangeNav(navEl, list);
      }
      /* 从继续观看进入：高亮当时那一集，并横向滚到可见位置，页面也尽量滚到剧集区块 */
      if (shouldFocusResumeEp && detailFocusEpisodeId) {
        var focusNode = list.querySelector('[data-ep="' + detailFocusEpisodeId + '"]');
        if (focusNode) {
          focusNode.classList.add("ep-playing");
          /* 聚焦集就绪时预取该集 PlaybackInfo */
          try {
            if (srv && detailFocusEpisodeId) {
              prefetchPlaybackForResource(detailFocusEpisodeId, srv, {
                asSeries: false,
                seriesId: seriesId,
                detailToken: detailHeroToken
              });
            }
          } catch (ePfEp) {}
          var focusIdx = -1;
          for (var fi = 0; fi < list.children.length; fi++) {
            if (list.children[fi] === focusNode) { focusIdx = fi; break; }
          }
          if (navEl) {
            var liveChips = qsa(".ep-range-chip", navEl);
            if (liveChips.length && focusIdx >= 0) {
              var rIdx = Math.floor(focusIdx / EP_RANGE_CHUNK);
              liveChips.forEach(function (c, i) { c.classList.toggle("active", i === rIdx); });
            }
          }
          requestAnimationFrame(function () {
            try {
              list.scrollTo({ left: Math.max(0, focusNode.offsetLeft - 16), behavior: "smooth" });
            } catch (e) {
              list.scrollLeft = Math.max(0, focusNode.offsetLeft - 16);
            }
            var epSlot = el("episodes-slot");
            if (epSlot) {
              setTimeout(function () {
                try { epSlot.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e2) {}
              }, 80);
            }
          });
        }
      }
      var epMap = {};
      eps.forEach(function (ep) { epMap[ep.Id] = ep; });
      qsa("[data-ep]", list).forEach(function (node) {
        node.addEventListener("click", function () {
          playSeriesFromEpisode(seriesId, eps, node.getAttribute("data-ep"), srv);

          embyRequest(willPlay ? "POST" : "DELETE", "/Users/" + srv.userId + "/PlayedItems/" + epId, srv).catch(function () {
            btn.classList.toggle("on", wasPlayed);
          });
        });
      });
    }).catch(function () {
      if (list && list === el("episode-list")) list.innerHTML = '<div class="empty-row">加载剧集失败</div>';
    });
  }

  function pickEpisodeMediaSource(ep, opts) {
    opts = opts || {};
    var sources = (ep && ep.MediaSources) || [];
    if (!sources.length) return null;
    if (opts.mediaSourceId) {
      var byId = null;
      for (var i = 0; i < sources.length; i++) {
        if (sources[i].Id === opts.mediaSourceId) { byId = sources[i]; break; }
      }
      if (byId) return byId;
    }
    if (opts.qualityLabel) {
      for (var j = 0; j < sources.length; j++) {
        if (mediaSourceQualityLabel(sources[j], j) === opts.qualityLabel) return sources[j];
      }
    }
    return sources[0];
  }

  function playSeriesFromEpisode(seriesId, episodes, startEpId, srv, seriesMeta, opts) {
    opts = opts || {};
    var wallPic = imageUrl(seriesId, "Backdrop", { maxWidth: 900 }, srv);
    var seriesPic = imageUrl(seriesId, "Primary", { maxHeight: 600 }, srv);
    var startEp = episodes.filter(function (e) { return e.Id === startEpId; })[0] || episodes[0];
    

    var metaPromise = seriesMeta ? Promise.resolve(seriesMeta) :
      embyGet("/Users/" + srv.userId + "/Items/" + seriesId + "?Fields=Overview,People", srv).catch(function () { return null; });

    if (!window.fm || !window.fm.vodInline) {
      toast("当前不在 App 环境内，无法调用原生播放器（预览模式）");
      return;
    }

    

    localResumePending = {
      entry: {
        cardId: seriesId, type: "Episode", name: startEp.SeriesName || "",
        epIndex: startEp.IndexNumber != null ? startEp.IndexNumber : null,
        episodeId: startEp.Id,
        srvId: srv && srv.id, srvName: srv && srv.name
      },
      startedAt: Date.now()
    };

    

    var vodId = "emby-" + ((srv && srv.id) ? srv.id + "-" : "") + seriesId + "-" +
      Date.now().toString(36) + (++_vodLaunchSeq).toString(36);

    
    var lineName = (srv && srv.name) || "Emby";

    

    var startMs = pickEpisodeMediaSource(startEp, opts);
    var startMsId = startMs ? startMs.Id : (opts.mediaSourceId || null);
    
    var startPosTicks = 0;
    if (startEp.UserData && startEp.UserData.PlaybackPositionTicks && !isEpisodeEffectivelyDone(startEp)) {
      startPosTicks = startEp.UserData.PlaybackPositionTicks;
    }
    embyBeginPlayback(startEp.Id, srv, startMsId, startPosTicks)
      .then(function (info) {
        var psid = info && info.PlaySessionId;
        var audioIdx = (opts.audioStreamIndex != null) ? opts.audioStreamIndex : null;

        

        var EP_PLAYBACK_INFO_WINDOW = 5;
        var startEpIndex = -1;
        for (var _ei = 0; _ei < episodes.length; _ei++) {
          if (episodes[_ei].Id === startEp.Id) { startEpIndex = _ei; break; }
        }
        if (startEpIndex < 0) startEpIndex = 0;

        var episodeTargets = episodes;
        if (!STATE.autoPlayNext) {
          episodeTargets = [startEp];
        }

        var epPromises = episodeTargets.map(function (e) {
          var picked = pickEpisodeMediaSource(e, opts);
          var msId = picked ? picked.Id : null;
          if (e.Id === startEp.Id) {
            return Promise.resolve({ e: e, msId: msId, psid: psid, info: info });
          }
          var epIndex = -1;
          for (var _j = 0; _j < episodes.length; _j++) {
            if (episodes[_j].Id === e.Id) { epIndex = _j; break; }
          }
          var forward = epIndex >= startEpIndex && epIndex <= startEpIndex + EP_PLAYBACK_INFO_WINDOW;
          if (forward) {
            return embyPlaybackInfo(e.Id, srv, msId).then(function (epInfo) {
              return { e: e, msId: msId, psid: (epInfo && epInfo.PlaySessionId) || psid, info: epInfo };
            }).catch(function () {
              return { e: e, msId: msId, psid: psid, info: null };
            });
          }
          /* 窗口外：不发起 PlaybackInfo，直接用起播会话 + 自拼/已有源信息拼地址 */
          return Promise.resolve({ e: e, msId: msId, psid: psid, info: null });
        });

        return Promise.all(epPromises).then(function (results) {
          var epList = results.map(function (r) {
            var e = r.e;
            var epTitle = (e.Name || "").trim();
            var generic = !epTitle || /^(第\s*\d+\s*集|Episode\s*\d+|EP?\s*\d+)$/i.test(epTitle);
            var idxLabel = e.IndexNumber != null ? ("第" + e.IndexNumber + "集") : "";
            var name;
            if (!generic) {
              name = idxLabel ? (idxLabel + " " + epTitle) : epTitle;
            } else if (idxLabel) {
              name = idxLabel;
            } else {
              var ms0 = e.MediaSources && e.MediaSources[0];
              var fileName = mediaSourceFileName(ms0);
              if (fileName && !/mediasource[_-]/i.test(fileName) && fileName.length < 80) {
                name = fileName;
              } else {
                name = epTitle || "未知分集";
              }
            }
            

            var playUrl = resolvePlayUrl(e.Id, srv, r.msId, audioIdx, r.psid, r.info);
            return {
              name: name,
              url: playUrl,
              embyId: e.Id
            };
          });
          

          var markEntry = epList.filter(function (e) { return e.embyId === startEp.Id; })[0] || epList[0];
          var markName = markEntry ? markEntry.name : "";

          return metaPromise.then(function (seriesItem) {
            suspendDetailForPlayback();
            return window.fm.vodInline({
              vod_id: vodId,
              vod_name: startEp.SeriesName || "",
              vod_pic: seriesPic,
              wallPic: wallPic,
              vod_play_from: lineName,
              vod_content: buildVodContentField(seriesItem),
              vod_actor: buildVodActorField(seriesItem),
              mark: markName,
              headers: embyPlayHeaders(srv),
              episodes: epList
            });
          });
        });
      }).catch(function (err) {
        console.error(err);
        resumeDetailAfterPlayback();
        toast("播放失败：" + err.message);
      });
  }

    tbiApply();
    if (Math.abs(d.v) > 0.03 || Math.abs(d.y) > 0.1 ||
        Math.abs(d.v2) > 0.03 || Math.abs(d.y - d.y2) > 0.1) {
      tbiKick();
    } else {                       /* 收敛：吸附回原形，彻底停帧 */
      d.y = d.y2 = 0; d.v = d.v2 = 0;
      tbiApply();
    }
  }

  function tbiKick() { if (!TBI.raf) TBI.raf = requestAnimationFrame(tbiTick); }

  /* 切页 / 导航栏重新显示时把弹簧归零，避免下次露面时还带着上次残留的形变 */
  function tbiReset(scroller) {
    if (!TBI.row) return;
    TBI.y = TBI.v = TBI.y2 = TBI.v2 = 0;
    TBI.last = scroller ? Math.max(0, scroller.scrollTop || 0) : 0;
    if (TBI.raf) { cancelAnimationFrame(TBI.raf); TBI.raf = 0; }
    tbiApply();
  }

  function tbiOnScroll(scroller) {
    var d = TBI;
    if (!d.on || !d.row || d.row.style.display === "none") return;
    if (!scroller.classList.contains("active")) return;   /* 只认当前这块屏幕的滚动 */
    var top = Math.max(0, scroller.scrollTop || 0);
    var dy = top - d.last;
    d.last = top;
    if (!dy) return;
    if (Math.abs(dy) > 240) return;                        /* 跳转/复位造成的瞬移，不当成手滑 */
    if (Math.abs(dy) < 1.5) return;                        /* 亚像素抖动不喂弹簧，少开 rAF */

    d.v += dy * TBI_IMPULSE;
    if (d.v > TBI_VMAX) d.v = TBI_VMAX;
    if (d.v < -TBI_VMAX) d.v = -TBI_VMAX;
    tbiKick();
  }

  function initTabbarInertia() {
    if (TBI.bound) return;
    var row = el("tabbar-row");
    if (!row) return;
    TBI.bound = true;
    TBI.row = row;
    TBI.cap = el("tabbar");
    TBI.fab = qs(".fab-wrap", row);
    if (TBI_REDUCE) return;        /* 用户开了"减弱动态效果"：整套引擎不启用，保持原样 */
    TBI.on = true;
    row.classList.add("tb-inertia");
    qsa(".screen").forEach(function (sc) {
      sc.addEventListener("scroll", function () { tbiOnScroll(sc); }, { passive: true });
      /* 抬手瞬间如果还没回到原形，让弹簧再跑一轮收敛 */
      sc.addEventListener("touchend", function () { tbiKick(); }, { passive: true });
    });
  }

  

  var RB_MAX = 90;        /* 越界位移的渐近上限 */
  var RB_TENSION = 0.55;  /* 越小越"硬"，拉一点就到头 */
  var RB = { h: null, vs: null, vm: null, node: null, move: null, mode: null,
             sx: 0, sy: 0, axis: null, base: 0, sign: 0, active: false };
  var RB_V_MAP = { "home-screen": "home-content", "library-screen": "lib-body",
                   "search-screen": "search-body", "detail-screen": "detail-content" };

  function rbDamp(raw) {
    var r = Math.abs(raw);
    return RB_MAX * (1 - 1 / (r / (RB_MAX * RB_TENSION) + 1));
  }

  function rbClear() {
    RB.h = RB.vs = RB.vm = RB.node = RB.move = null;
    RB.mode = null; RB.axis = null; RB.active = false;
  }

  function rbFinish() {
    if (RB.move && RB.active) {
      var m = RB.move, n = RB.node;
      m.classList.add("rb-glide");
      m.style.transform = "";
      setTimeout(function () { m.classList.remove("rb-glide"); }, 540);
      nudgeScrollUnstick(n);
    }
    rbClear();
  }

  function initRubberBand() {
    if (TBI_REDUCE) return;

    document.addEventListener("touchstart", function (e) {
      rbClear();
      if (!e.touches || e.touches.length !== 1) return;
      var t = e.target;
      if (!t || !t.closest) return;
      var h = t.closest(".row-scroll,.lib-filter-row,.client-select,.icon-picker-grid");
      if (h && (h.scrollWidth - h.clientWidth) > 4) RB.h = h;
      var sc = t.closest(".screen.active");
      if (sc && RB_V_MAP[sc.id]) {
        var c = el(RB_V_MAP[sc.id]);
        if (c) { RB.vs = sc; RB.vm = c; }
      }
      RB.sx = e.touches[0].clientX;
      RB.sy = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener("touchmove", function (e) {
      if (!e.touches || !e.touches.length) return;
      if (!RB.h && !RB.vm) return;
      var dx = e.touches[0].clientX - RB.sx;
      var dy = e.touches[0].clientY - RB.sy;

      /* 方向还没明朗前不表态，免得把纵向滚动误判成横向橡皮筋 */
      if (!RB.axis) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        if (Math.abs(dx) > Math.abs(dy)) {
          if (!RB.h) { rbClear(); return; }
          RB.axis = RB.mode = "x"; RB.node = RB.move = RB.h;
        } else {
          /* 下拉刷新正在进行时把纵向完全让给它 */
          if (!RB.vm || ptr.dragging || ptr.refreshing) { rbClear(); return; }
          RB.axis = RB.mode = "y"; RB.node = RB.vs; RB.move = RB.vm;
        }
      }

      var n = RB.node;
      var d = RB.mode === "x" ? dx : dy;
      var pos = RB.mode === "x" ? n.scrollLeft : n.scrollTop;
      var max = RB.mode === "x" ? (n.scrollWidth - n.clientWidth) : (n.scrollHeight - n.clientHeight);

      if (!RB.active) {
        if (max <= 0) { rbClear(); return; }          /* 根本滚不动的短内容不参与 */
        if (RB.mode === "y") {
          if (!(pos >= max - 1 && d < 0)) return;     /* 纵向只接管底部那一端 */
          RB.sign = -1;
        } else if (pos <= 0 && d > 0) {
          RB.sign = 1;
        } else if (pos >= max - 1 && d < 0) {
          RB.sign = -1;
        } else {
          return;                                     /* 还没贴边，交给浏览器正常滚 */
        }
        RB.active = true;
        RB.base = d;                                  /* 以"刚贴边这一刻"为零点，不是手指起点 */
        RB.move.classList.remove("rb-glide");
      }

      var raw = (d - RB.base) * RB.sign;               /* >0 = 正在往外拉 */
      e.preventDefault();
      if (raw > 0) {
        var off = rbDamp(raw) * RB.sign;
        RB.move.style.transform = RB.mode === "x"
          ? ("translate3d(" + off.toFixed(1) + "px,0,0)")
          : ("translate3d(0," + off.toFixed(1) + "px,0)");
      } else {
        RB.move.style.transform = "";
        var back = -raw;                               /* 手指往回走：手动 1:1 驱动滚动 */
        if (RB.sign === 1) n.scrollLeft = back;
        else if (RB.mode === "x") n.scrollLeft = max - back;
        else n.scrollTop = max - back;
      }
    }, { passive: false });

    document.addEventListener("touchend", rbFinish);
    document.addEventListener("touchcancel", rbFinish);
  }

  

  function hdrSync(sc) {
    var h = qs(".lib-header", sc);
    if (!h) return;
    h.style.setProperty("--hdr-p", (sc.scrollTop || 0) > 4 ? "1" : "0");
  }

  

  function scrollActiveScreenToTop() {
    var sc = qs(".screen.active");
    if (!sc || (sc.scrollTop || 0) <= 0) return;
    var from = sc.scrollTop;
    if (TBI_REDUCE) { sc.scrollTop = 0; return; }
    var dur = Math.min(620, Math.max(280, from * 0.5));
    var t0 = 0;
    requestAnimationFrame(function step(ts) {
      if (!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      var k = 1 - Math.pow(1 - p, 3);
      sc.scrollTop = from * (1 - k);
      if (p < 1) requestAnimationFrame(step);
    });
  }

  

  function homeTopBtnsSync(sc) {
    if (!sc || sc.id !== "home-screen") return;
    var v = (-Math.min(160, Math.max(0, sc.scrollTop || 0))) + "px";
    var a = el("home-mode-trigger");
    var b = el("home-stats-trigger");
    if (a) a.style.setProperty("--top-scroll", v);
    if (b) b.style.setProperty("--top-scroll", v);
  }

  

  var relayoutTimer = 0;
  function relayoutForViewport() {
    if (relayoutTimer) clearTimeout(relayoutTimer);
    relayoutTimer = setTimeout(function () {
      relayoutTimer = 0;
      try { updateTabHighlight(); } catch (e) {}
      var sc = qs(".screen.active");
      if (sc) { try { hdrSync(sc); homeTopBtnsSync(sc); } catch (e) {} }
      try { homeHeroParallaxApply(); } catch (e) {}
    }, 120);
  }
  window.addEventListener("resize", relayoutForViewport);
  window.addEventListener("orientationchange", relayoutForViewport);

  

  var _scrollSyncRaf = 0;
  var _scrollSyncPending = null;
  var _hdrLast = "";
  var _topScrollLast = "";
  function scheduleScrollChromeSync(sc) {
    _scrollSyncPending = sc;
    if (_scrollSyncRaf) return;
    _scrollSyncRaf = requestAnimationFrame(function () {
      _scrollSyncRaf = 0;
      var node = _scrollSyncPending;
      _scrollSyncPending = null;
      if (!node) return;
      var top = Math.max(0, node.scrollTop || 0);
      var hdr = top > 4 ? "1" : "0";
      if (hdr !== _hdrLast) {
        _hdrLast = hdr;
        var h = qs(".lib-header", node);
        if (h) h.style.setProperty("--hdr-p", hdr);
      }
      if (node.id === "home-screen") {
        var v = (-Math.min(160, top)) + "px";
        if (v !== _topScrollLast) {
          _topScrollLast = v;
          var a = el("home-mode-trigger");
          var b = el("home-stats-trigger");
          if (a) a.style.setProperty("--top-scroll", v);
          if (b) b.style.setProperty("--top-scroll", v);
        }
      }
    });
  }

  function initAppleMotion() {
    initRubberBand();
    qsa(".screen").forEach(function (sc) {
      hdrSync(sc);
      homeTopBtnsSync(sc);
      sc.addEventListener("scroll", function () { scheduleScrollChromeSync(sc); }, { passive: true });
    });
  }

  

  window.addEventListener("fmresume", function () {
    

    embyReportStopped();
    

    if (localResumePending) {
      var pending = localResumePending;
      localResumePending = null;
      if (Date.now() - pending.startedAt >= LOCAL_RESUME_MIN_WATCH_MS) {
        var entry = pending.entry;
        

        if (entry && entry.type === "Episode" && entry.episodeId && entry.cardId) {
          var srvR = (entry.srvId && getServerById(entry.srvId)) || activeServer();
          if (srvR && srvR.userId) {
            var epCacheKey = ((srvR && srvR.id) || "") + "|eps|" + entry.cardId;
            try { delete detailEpCache[epCacheKey]; } catch (e0) {}
            embyGet("/Shows/" + entry.cardId + "/Episodes?UserId=" + srvR.userId + "&Fields=UserData,RunTimeTicks,IndexNumber,Name,SeriesName", srvR).then(function (d) {
              var eps = (d && d.Items) || [];
              var next = resolveSeriesStartEpisode(eps, entry.episodeId);
              if (next && next.Id) {
                entry.episodeId = next.Id;
                entry.epIndex = next.IndexNumber != null ? next.IndexNumber : entry.epIndex;
                if (next.SeriesName) entry.name = next.SeriesName;
              }
              recordLocalPlay(entry);
              try { STATE.resumeCache = getLocalResumeList(); syncHomeResumeRow(); } catch (e1) {}
            }).catch(function () {
              recordLocalPlay(entry);
            });
          } else {
            recordLocalPlay(entry);
          }
        } else {
          recordLocalPlay(entry);
        }
      }
    }
    /* 恢复进播放器前卸掉的详情壁纸帧，并重启详情轮播（若仍在详情页） */
    resumeDetailAfterPlayback();
    /* 从后台恢复：无需强制刷新，保留当前视图 */
  });

  /* ---------------- 启动 ---------------- */

  function boot() {
    Promise.all([
      storeGet("deviceProfile"), storeGet("playerProfile"), storeGet("deviceId"), storeGet("servers"), storeGet("activeServerId"),
      storeGet("deviceProfileCat_phone"), storeGet("deviceProfileCat_tablet"), storeGet("deviceProfileCat_tv"), storeGet("userAvatarUrl"),
      storeGet("autoPlayNext"), storeGet("tmdbApiKey"), storeGet("tmdbApiBase"), storeGet("tmdbImgBase"), storeGet("lightTheme"),
      storeGet("startupRememberHome"), storeGet("homeMode"), storeGet("homeModeServerId"),
      storeGet("crossServerMatch"), storeGet("homeSectionIds")
    ]).then(function (vals) {
      STATE.avatarUrl = vals[8] || "";
      

      if (vals[9] === "0" || vals[9] === "1") STATE.autoPlayNext = vals[9] === "1";
      

      applyTmdbConfig(vals[10], vals[11], vals[12]);
      

      applyTheme(vals[13] === "1");

      /* 启动主页偏好 */
      if (vals[14] === "1") STATE.startupRememberHome = true;
      if (STATE.startupRememberHome) {
        var savedHomeMode = vals[15] || "tmdb";
        var savedHomeSrvId = vals[16] || "";
        if (savedHomeMode === "server" && savedHomeSrvId) {
          STATE.homeMode = "server";
          STATE.homeModeServerId = savedHomeSrvId;
        } else {
          STATE.homeMode = "tmdb";
          STATE.homeModeServerId = "";
        }
      } else {
        STATE.homeMode = "tmdb";
        STATE.homeModeServerId = "";
      }

      if (vals[17] === "0") STATE.crossServerMatch = false;
      else if (vals[17] === "1") STATE.crossServerMatch = true;
      if (vals[18]) {
        try {
          var parsed = JSON.parse(vals[18]);
          if (Array.isArray(parsed) && parsed.length) {
            var valid = {};
            TMDB_LISTS.forEach(function (l) { valid[l.id] = true; });
            var cleaned = parsed.filter(function (id) { return valid[id]; });
            if (cleaned.length) STATE.homeSectionIds = cleaned;
          }
        } catch (eHs) {}
      }
      

      DEVICE_CATEGORIES.forEach(function (cat, idx) {
        var saved = vals[5 + idx];
        if (saved && DEVICE_PROFILES[saved] && DEVICE_PROFILES[saved].category === cat) {
          DEVICE_CATEGORY_PICK_CACHE[cat] = saved;
        }
      });
      if (vals[0] && DEVICE_PROFILES[vals[0]]) {
        setDeviceProfile(vals[0], true);
        DEVICE_CATEGORY_PICK_CACHE[deviceCategoryOf(vals[0])] = vals[0];
      }
      

      qsa("[data-device-category].client-chip").forEach(function (node) {
        node.classList.toggle("active", node.getAttribute("data-device-category") === deviceCategoryOf(STATE.deviceProfileId));
      });
      if (vals[1] && PLAYER_PROFILES[vals[1]]) setPlayerProfile(vals[1], true);
      try { STATE.servers = vals[3] ? (JSON.parse(vals[3]) || []) : []; } catch (e) { STATE.servers = []; }
      STATE._savedActiveServerId = vals[4] || "";
      var savedId = vals[2];
      if (savedId && !looksLikeAppDeviceId(savedId)) savedId = null; /* 老格式（如 webhome- 前缀），不再复用，走下面重新生成 */

      

      STATE.deviceId = savedId || genDeviceId();
      if (STATE.deviceId !== vals[2]) storeSet("deviceId", STATE.deviceId);

      

      waitForFm(1500).then(function () {
        var native = nativeDeviceId();
        if (native && native !== STATE.deviceId) {
          STATE.deviceId = native;
          storeSet("deviceId", STATE.deviceId);
        }
      });
    }).then(function () {
      return restoreLastLogin();
    });
  }

  primeBuiltinAvatarCache();
  initPullToRefresh();
  initHomeScrollUnstickGuard();
  initTabbarInertia();
  initAppleMotion();
  initSwipeDismissAll();
  bindResumeLongPressDelete(document.body);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
