  /* 片名规范化：去掉空白/标点/常见冠词，便于中英混排、带副标题的条目还能对上。 */
  function normalizeTitleKey(s) {
    return String(s || "")
      .toLowerCase()
      .replace(/[\s\u3000]+/g, "")
      .replace(/[·•・：:：\-—_\[\]()（）【】「」『』"'"`~!?,.。，、！？]/g, "")
      .replace(/^(the|a|an)/, "");
  }

  function titlesLooselyMatch(a, b) {
    var na = normalizeTitleKey(a);
    var nb = normalizeTitleKey(b);
    if (!na || !nb) return false;
    if (na === nb) return true;
    /* 一方包含另一方且较短一方至少 2 个字符，避免单字误伤 */
    if (na.length >= 2 && nb.length >= 2 && (na.indexOf(nb) !== -1 || nb.indexOf(na) !== -1)) return true;
    return false;
  }

  

  function matchTmdbOnServers(title, year, mediaType, tmdbId, altTitles) {
    if (!STATE.servers.length) return Promise.resolve([]);
    var wantType = mediaType === "tv" ? "Series" : "Movie";
    var servers = STATE.servers.filter(function (s) { return s.token && s.userId; });
    /* 关闭跨服匹配时，只在当前激活服务器上找资源 */
    if (!STATE.crossServerMatch) {
      var only = activeServer();
      servers = (only && only.token && only.userId) ? [only] : [];
    }
    if (!servers.length) return Promise.resolve([]);
    var yearNum = year ? parseInt(year, 10) : 0;
    if (yearNum !== yearNum) yearNum = 0; /* NaN */
    var nameCandidates = [];
    function pushName(n) {
      n = String(n || "").trim();
      if (!n) return;
      for (var i = 0; i < nameCandidates.length; i++) if (nameCandidates[i] === n) return;
      nameCandidates.push(n);
    }
    pushName(title);
    (altTitles || []).forEach(pushName);

    function yearOk(it) {
      if (!yearNum || !it.ProductionYear) return true;
      return Math.abs(it.ProductionYear - yearNum) <= 1;
    }
    function typeOk(it) {
      return !it.Type || it.Type === wantType;
    }
    function nameOk(it) {
      if (!nameCandidates.length) return true;
      for (var i = 0; i < nameCandidates.length; i++) {
        if (titlesLooselyMatch(it.Name, nameCandidates[i])) return true;
        if (it.SeriesName && titlesLooselyMatch(it.SeriesName, nameCandidates[i])) return true;
      }
      return false;
    }

    function matchOnServer(s) {
      
      var byProvider = Promise.resolve([]);
      if (tmdbId) {
        var p = "/Users/" + encodeURIComponent(s.userId) + "/Items?Recursive=true&IncludeItemTypes=" + wantType +
          "&AnyProviderIdEquals=" + encodeURIComponent("Tmdb." + tmdbId) +
          "&Fields=ProviderIds,ProductionYear,PrimaryImageTag&Limit=8";
        byProvider = embyGet(p, s).then(function (d) {
          return ((d && d.Items) || []).filter(typeOk);
        }).catch(function () { return []; });
      }

      
      var byName = Promise.resolve([]);
      if (nameCandidates.length) {
        byName = Promise.all(nameCandidates.slice(0, 3).map(function (term) {
          return searchHintsOn(s, term, 20, false).catch(function () { return []; });
        })).then(function (lists) {
          var seen = {};
          var out = [];
          lists.forEach(function (items) {
            (items || []).forEach(function (it) {
              if (!it || !it.Id || seen[it.Id]) return;
              if (!typeOk(it) || !nameOk(it) || !yearOk(it)) return;
              seen[it.Id] = 1;
              out.push(it);
            });
          });
          return out;
        }).catch(function () { return []; });
      }

      return Promise.all([byProvider, byName]).then(function (pair) {
        var seen = {};
        var merged = [];
        pair[0].concat(pair[1]).forEach(function (it) {
          if (!it || !it.Id || seen[it.Id]) return;
          seen[it.Id] = 1;
          it._srvId = s.id;
          it._srvName = s.name;
          merged.push(it);
        });
        return merged;
      });
    }

    return Promise.all(servers.map(matchOnServer)).then(function (lists) {
      return [].concat.apply([], lists);
    });
  }

  function renderTmdbViewAll(root, listCfg, data) {
    var filter = STATE.libFilter || defaultLibFilter();
    var filterBarHtml = renderLibFilterBar(listCfg, filter);
    var fallbackType = (listCfg && listCfg.mediaType !== "all") ? listCfg.mediaType : (filter.type || "movie");

    if (isDefaultLibFilter(filter)) {
      var initialItems = ((STATE.tmdbListCache && STATE.tmdbListCache[data.id]) || []).filter(function (it) { return it.poster_path; });
      var seenKeys = {};
      initialItems.forEach(function (it) { seenKeys[(it.media_type || fallbackType) + ":" + it.id] = true; });

      if (!listCfg) {
        root.innerHTML = filterBarHtml + '<div class="empty-row">这个分类暂时没有内容</div>';
        hydrateImages(root);
        focusFirstIn(root);
        return;
      }

      /* 有首页缓存先铺；没有则从网络拉第 1 页（以前会误判 done 导致空白） */
      if (initialItems.length) {
        root.innerHTML = filterBarHtml + '<div class="grid">' + initialItems.map(function (it) { return tmdbPosterCardHtml(it, fallbackType); }).join("") + '</div>';
      } else {
        root.innerHTML = filterBarHtml + '<div class="empty-row" id="tmdb-viewall-loading">加载中…</div>';
      }
      hydrateImages(root);
      focusFirstIn(root);

      STATE.libPager = {
        loading: false,
        done: false,
        page: initialItems.length ? 1 : 0, /* 0 表示尚未成功拉到第 1 页 */
        loadMore: function () {
          var pager = this;
          if (pager.loading || pager.done || !listCfg) return;
          pager.loading = true;
          var nextPage = pager.page + 1;
          var isFirstNet = !root.querySelector(".grid");
          if (!isFirstNet) showLibLoadingMore(root);
          loadTmdbList(listCfg, nextPage).then(function (items) {
            if (STATE.libPager !== pager) return;
            if (!isFirstNet) hideLibLoadingMore(root);
            var fresh = [];
            (items || []).forEach(function (it) {
              if (!it.poster_path) return;
              var key = (it.media_type || fallbackType) + ":" + it.id;
              if (seenKeys[key]) return;
              seenKeys[key] = true;
              fresh.push(it);
            });
            pager.page = nextPage;
            var totalPages = (items && items.tmdbMaxTotalPages) || nextPage;
            if (nextPage >= totalPages || !(items && items.length)) pager.done = true;
            if (isFirstNet) {
              root.innerHTML = filterBarHtml + (fresh.length
                ? '<div class="grid">' + fresh.map(function (it) { return tmdbPosterCardHtml(it, fallbackType); }).join("") + '</div>'
                : '<div class="empty-row">这个分类暂时没有内容</div>');
              hydrateImages(root);
              focusFirstIn(root);
              /* 回填首页缓存，下次查看全部可秒开 */
              if (fresh.length && data && data.id) {
                try { STATE.tmdbListCache[data.id] = (items || []).filter(function (it) { return it.poster_path; }); } catch (eC) {}
              }
            } else {
              appendCardsToGrid(root, fresh.map(function (it) { return tmdbPosterCardHtml(it, fallbackType); }));
            }
            pager.loading = false;
            maybeFillLibScreen();
          }).catch(function () {
            if (STATE.libPager !== pager) return;
            if (!isFirstNet) hideLibLoadingMore(root);
            if (isFirstNet) {
              root.innerHTML = filterBarHtml + '<div class="empty-row">加载失败，请返回重试</div>';
            }
            pager.done = true;
            pager.loading = false;
          });
        }
      };
      if (!initialItems.length) STATE.libPager.loadMore();
      else maybeFillLibScreen();
      return;
    }

    

    if (!listCfg) { root.innerHTML = filterBarHtml + '<div class="empty-row">这个分类暂时没有内容</div>'; return; }
    var filteredListCfg = {
      id: listCfg.id + ":filtered",
      mediaType: listCfg.mediaType,
      excludeOriginalLanguage: listCfg.excludeOriginalLanguage,
      sources: buildFilteredTmdbSources(listCfg, filter)
    };
    root.innerHTML = filterBarHtml + '<div class="grid">' + new Array(9).fill('<div class="poster-card"><div class="poster-art skeleton"></div></div>').join("") + '</div>';

    var seenKeys2 = {};
    STATE.libPager = {
      loading: false,
      done: false,
      page: 0,
      loadMore: function () {
        var pager = this;
        if (pager.loading || pager.done) return;
        pager.loading = true;
        var isFirst = pager.page === 0;
        var nextPage = pager.page + 1;
        if (!isFirst) showLibLoadingMore(root);
        loadTmdbList(filteredListCfg, nextPage).then(function (items) {
          if (STATE.libPager !== pager) return;
          if (!isFirst) hideLibLoadingMore(root);
          var fresh = [];
          (items || []).forEach(function (it) {
            if (!it.poster_path) return;
            var key = (it.media_type || fallbackType) + ":" + it.id;
            if (seenKeys2[key]) return;
            seenKeys2[key] = true;
            fresh.push(it);
          });
          pager.page = nextPage;
          var totalPages = (items && items.tmdbMaxTotalPages) || nextPage;
          if (nextPage >= totalPages || !(items && items.length)) pager.done = true;
          var cardsHtml = fresh.map(function (it) { return tmdbPosterCardHtml(it, fallbackType); });
          if (isFirst) {
            root.innerHTML = filterBarHtml + (cardsHtml.length
              ? '<div class="grid">' + cardsHtml.join("") + '</div>'
              : '<div class="empty-row">这个筛选条件下暂时没有内容</div>');
            hydrateImages(root);
            focusFirstIn(root);
          } else {
            appendCardsToGrid(root, cardsHtml);
          }
          pager.loading = false;
          maybeFillLibScreen();
        }).catch(function () {
          if (STATE.libPager !== pager) return;
          if (!isFirst) hideLibLoadingMore(root);
          if (isFirst) root.innerHTML = filterBarHtml + '<div class="empty-row">加载失败，请重试</div>';
          pager.done = true;
          pager.loading = false;
        });
      }
    };
    STATE.libPager.loadMore();
  }

  function refreshBuiltinAvatarDisplays(url, dataUri) {
    var grid = el("avatar-builtin-grid");

      qsa(".avatar-swatch", grid).forEach(function (node) {
        if (node.getAttribute("data-avatar-url") === url) {

        if (isBuiltinSelected) renderAvatarInto(preview);
      }
    }
  }

  

  function primeBuiltinAvatarCache() {
    var pending = BUILTIN_AVATARS.filter(function (u) { return !__builtinAvatarCache[u]; });
    if (!pending.length || typeof fetch !== "function") return;
    pending.forEach(function (url) {
      fetch(url).then(function (resp) {
        if (!resp.ok) throw new Error("bad status");
        return resp.text();
      }).then(function (svgText) {
        var dataUri = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgText)));
        __builtinAvatarCache[url] = dataUri;
        try { window.localStorage.setItem(BUILTIN_AVATAR_CACHE_KEY, JSON.stringify(__builtinAvatarCache)); } catch (e) {}
        refreshBuiltinAvatarDisplays(url, dataUri);
      }).catch(function () { /* 静默失败，保留远程地址兜底，下次启动再重试一遍 */ });

      var tsPart = m[1].slice(0, m[1].length - 5);
      var ts = parseInt(tsPart, 36);
      if (!isNaN(ts) && ts > 1000000000000) return ts;
    }
    return null;

    return days + " 天前";

  function openAnchoredMenu(anchorEl, items) {
    return new Promise(function (resolve) {
      var overlay = el("home-mode-menu-overlay");
      var menu = el("home-mode-menu");
      if (!overlay || !menu || !anchorEl) { resolve(null); return; }
      var html = "";
      items.forEach(function (item) {
        if (item.separator) {

          return;
        }
        var isSelectable = typeof item.active === "boolean";
        var cls = "home-mode-menu-item focusable" + (item.active ? " is-active" : "") + (item.danger ? " danger" : "");
        html += '<button type="button" class="' + cls + '" tabindex="0" data-key="' + item.key + '">' +
          (item.icon ? '<span class="hm-icon">' + item.icon + '</span>' : "") +
          (isSelectable ? '<span class="hm-radio"><span class="hm-radio-dot"></span></span>' : "") +
          '<span class="hm-label">' + escapeHtml(item.label) + '</span>' +
        '</button>';
      });
      menu.innerHTML = html;
      anchorEl.classList.add("menu-open");
      overlay.classList.add("active");

      var rect = anchorEl.getBoundingClientRect();
      var menuW = menu.offsetWidth || 190;
      /* 右上角触发器（查看全部排序）：菜单右缘对齐按钮右缘 */
      var left;
      if (anchorEl.classList.contains("lib-sort-trigger") || anchorEl.id === "lib-sort-btn" || rect.left > window.innerWidth * 0.55) {
        left = Math.max(12, Math.min(rect.right - menuW, window.innerWidth - 12 - menuW));
      } else {
        left = Math.max(12, Math.min(rect.left, window.innerWidth - 12 - menuW));
      }
      menu.style.left = left + "px";

      var menuH = menu.offsetHeight;
      var spaceBelow = window.innerHeight - rect.bottom - 8;
      var spaceAbove = rect.top - 8;
      

      if (spaceBelow >= menuH || spaceBelow >= spaceAbove) {
        menu.classList.remove("flip-up");
        menu.style.top = (rect.bottom + 8) + "px";
        menu.style.bottom = "";
      } else {
        menu.classList.add("flip-up");
        menu.style.top = Math.max(12, rect.top - 8 - menuH) + "px";
        menu.style.bottom = "";
      }
      menu.style.top = (rect.bottom + 8) + "px";

      focusFirstIn(menu);

      function cleanup(result) {
        overlay.classList.remove("active");
        anchorEl.classList.remove("menu-open");
        overlay.removeEventListener("click", onClick);
        document.removeEventListener("click", onDocClick, true);
        document.removeEventListener("touchstart", onDocTouchStart, true);
        /* 同一条道理：只清自己登记的那份，防止跟另一颗按钮的登记打架。 */
        if (ANCHORED_MENU_ANCHOR === anchorEl) {
          ANCHORED_MENU_ANCHOR = null; ANCHORED_MENU_CLOSE = null;
          ANCHORED_MENU_LAST_CLOSED.anchor = anchorEl; ANCHORED_MENU_LAST_CLOSED.at = Date.now();
        }
        resolve(result);
      }
      function onClick(e) {
        if (e.target === overlay) { cleanup(null); return; }
        var btn = e.target.closest("[data-key]");
        if (!btn) return;
        cleanup(btn.getAttribute("data-key") || null);
      }
      

      function onDocClick(e) {
        if (menu.contains(e.target) || e.target === anchorEl || anchorEl.contains(e.target)) return;
        cleanup(null);
      }
      

      function onDocTouchStart(e) {
        var touch = e.touches && e.touches[0];
        var t = touch ? touch.target : e.target;
        if (menu.contains(t) || t === anchorEl || anchorEl.contains(t)) return;
        cleanup(null);
      }
      overlay.addEventListener("click", onClick);
      document.addEventListener("click", onDocClick, true);
      document.addEventListener("touchstart", onDocTouchStart, true);
      

      ANCHORED_MENU_ANCHOR = anchorEl;
      ANCHORED_MENU_CLOSE = function () { cleanup(null); };
    });
  }

  

  var SRV_PING = {};
  var SRV_PING_TTL = 60 * 1000;
  var SRV_PING_TIMEOUT = 12000;
  var SRV_PING_INFLIGHT = {};

  function srvPingState(id) {
    var hit = SRV_PING[id];
    if (hit && (Date.now() - hit.ts) < SRV_PING_TTL) return hit.state;
    return "checking";
  }

  function srvPingPaint(id, state) {
    qsa('[data-status-for="' + id + '"]').forEach(function (dot) {
      dot.className = "server-status " + state;
    });
  }

  function srvPingWithTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        var e = new Error("timeout");
        e.timeout = true;
        reject(e);
      }, ms);
      promise.then(function (v) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        resolve(v);
      }, function (err) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        reject(err);
      });
    });
  }

  function probeServerAuthCode(err) {
    var code = (err && err.status) || 0;
    if (!code) {
      var msg = String((err && err.message) || "");
      if (/\b401\b/.test(msg)) code = 401;
      else if (/\b403\b/.test(msg)) code = 403;
    }
    return code;
  }

  /* 与业务同路径的轻量鉴权探活（和卡片统计同一类接口，已验证可通） */
  function probeServerAuthed(s) {
    if (!s || !s.server) return Promise.reject(new Error("no server"));
    if (!s.token || !s.userId) {
      var e = new Error("HTTP 401");
      e.status = 401;
      return Promise.reject(e);
    }
    var q = "/Items/Counts?UserId=" + encodeURIComponent(s.userId);
    return embyGet(q, s).then(function () { return "online"; });
  }

  /* 无鉴权可达性兜底：仅在鉴权失败后用来区分「服务器挂了」还是「token 失效」 */
  function probeServerPublic(s) {
    var hosts = serverHosts(s);
    function tryHost(i) {
      if (i >= hosts.length) return Promise.reject(new Error("unreachable"));
      var base = String(hosts[i] || "").replace(/\/+$/, "");
      if (!base) return tryHost(i + 1);
      return req(base + "/System/Info/Public", { method: "GET" }).then(function () {
        return true;
      }).catch(function () {
        return tryHost(i + 1);
      });
    }
    return tryHost(0);
  }

  function probeServer(s) {
    var prev = (SRV_PING[s.id] && SRV_PING[s.id].state) || "";
    return srvPingWithTimeout(probeServerAuthed(s), SRV_PING_TIMEOUT).then(function (state) {
      return state;
    }).catch(function (err) {
      var code = probeServerAuthCode(err);
      if (code === 401 || code === 403) {
        /* token 有问题：再确认机器是否还活着 → 黄；确认不了也标黄（有地址有账号只是凭证坏了） */
        return srvPingWithTimeout(probeServerPublic(s), 5000).then(function () {
          return "auth";
        }).catch(function () {
          return "auth";
        });
      }
      if (err && err.timeout) {
        /* 超时：优先保留上次状态；没有历史时再试 Public 判活 */
        if (prev === "online" || prev === "auth") return prev;
        return srvPingWithTimeout(probeServerPublic(s), 5000).then(function () {
          return "online";
        }).catch(function () {
          return "offline";
        });
      }
      /* 其它错误：Public 通 → 在线（偶发鉴权毛刺）；不通 → 离线 */
      return srvPingWithTimeout(probeServerPublic(s), 5000).then(function () {
        return "online";
      }).catch(function () {
        if (prev === "online" || prev === "auth") return prev;
        return "offline";
      });
    });
  }

  function refreshServerStatuses(force) {
    var list = (STATE.servers || []).slice();
    list.forEach(function (s, idx) {
      var hit = SRV_PING[s.id];
      if (!force && hit && (Date.now() - hit.ts) < SRV_PING_TTL) {
        srvPingPaint(s.id, hit.state);
        return;
      }
      if (!force && SRV_PING_INFLIGHT[s.id]) return;
      /* 探测中保持旧灯色，避免整页先灰再闪红 */
      srvPingPaint(s.id, (hit && hit.state) ? hit.state : "checking");
      SRV_PING_INFLIGHT[s.id] = true;
      setTimeout(function () {
        probeServer(s).then(function (state) {
          SRV_PING[s.id] = { ts: Date.now(), state: state };
          srvPingPaint(s.id, state);
        })["finally"](function () {
          delete SRV_PING_INFLIGHT[s.id];
        });
      }, idx * 150);
    });
  }

  function bindServerCardLongPress(container) {
    if (!container || container.dataset.serverLongPressBound) return;
    container.dataset.serverLongPressBound = "1";
    var timer = null, startX = 0, startY = 0, activeCard = null;

    function clearTimer() { if (timer) { clearTimeout(timer); timer = null; } }
    

    function releasePress() {
      if (activeCard) activeCard.classList.remove("pressing");
    }
    function start(x, y, card) {
      activeCard = card; startX = x; startY = y;
      clearTimer();
      card.classList.add("pressing");
      timer = setTimeout(function () {
        timer = null;
        releasePress();
        serverCardLongPressSuppressClick = true;
        if (window.navigator && window.navigator.vibrate) { try { window.navigator.vibrate(15); } catch (e) {} }
        openServerCardMenu(card);
      }, SERVER_CARD_LONG_PRESS_MS);
    }
    function move(x, y) {
      if (!timer) return;
      if (Math.abs(x - startX) > SERVER_CARD_LONG_PRESS_MOVE_TOLERANCE || Math.abs(y - startY) > SERVER_CARD_LONG_PRESS_MOVE_TOLERANCE) { clearTimer(); releasePress(); }
    }
    function end() { clearTimer(); releasePress(); }

    container.addEventListener("touchstart", function (e) {

  function renderFavorites(opts) {
    opts = opts || {};
    ++libBodyGen;
    el("lib-title").textContent = "收藏";
    hideLibSortBtn();
    setLibHeaderAction(null);
    var root = el("lib-body");
    STATE.libPager = null;
    ensureLibBodyClickDelegation(root);
    initLibInfiniteScroll();

    
    var servers = [];
    var seen = {};
    function pushSrv(s) {
      if (!s || !s.token || !s.userId) return;
      var key = s.id || (s.server + "|" + s.userId);
      if (seen[key]) return;
      seen[key] = 1;
      servers.push(s);
    }
    (STATE.servers || []).forEach(pushSrv);
    pushSrv(activeServer());
    if (!servers.length && STATE.token && STATE.userId && STATE.server) {
      pushSrv({
        id: STATE.activeServerId || "active",
        server: STATE.server,
        backup: STATE.backup || "",
        token: STATE.token,
        userId: STATE.userId,
        name: STATE.username || "服务器"
      });
    }
    if (!servers.length) {
      root.innerHTML = '<div class="empty-row">请先添加并登录服务器</div>';
      return;
    }

    var pageSize = 60;
    var showSrvTag = servers.length > 1;
    var cacheKey = servers.map(function (s) { return s.id || ""; }).sort().join(",");

    function favPosterHtml(it, srv) {
      var img = imageUrl(it.Id, "Primary", { maxHeight: 400, tag: imgTag(it, "Primary") }, srv);
      var rate = it.CommunityRating ? '<span class="poster-badge">★' + Number(it.CommunityRating).toFixed(1) + '</span>' : "";
      var epBadge = episodeBadgeHtml(it);
      var srvTag = (showSrvTag && it._srvName) ? '<span class="poster-server-tag">' + escapeHtml(it._srvName) + '</span>' : "";
      return '<div class="poster-card focusable" tabindex="0" data-detail="' + escapeHtml(String(it.Id)) + '" data-server="' + escapeHtml((srv && srv.id) || "") + '">' +
        '<div class="poster-art"><img data-src="' + img + '" />' + rate + epBadge + srvTag + '</div>' +
        '<div class="poster-name">' + escapeHtml(it.Name || "") + '</div></div>';
    }

    function fetchFavoritesPage(srv, startIndex) {
      var fields = "PrimaryImageAspectRatio,CommunityRating,ProductionYear,RecursiveItemCount,DateCreated,Overview,ImageTags,PrimaryImageTag";
      var base = "/Users/" + encodeURIComponent(srv.userId) + "/Items?Recursive=true&IncludeItemTypes=Movie,Series" +
        "&SortBy=DateCreated,SortName&SortOrder=Descending&StartIndex=" + startIndex +
        "&Limit=" + pageSize + "&EnableTotalRecordCount=true&Fields=" + fields;
      var path1 = base + "&Filters=IsFavorite";
      var path2 = base + "&isFavorite=true";
      return embyGet(path1, srv).then(function (d) {
        var items = (d && d.Items) || [];
        var total = (d && typeof d.TotalRecordCount === "number") ? d.TotalRecordCount : (startIndex + items.length);
        return { items: items, total: total, srv: srv };
      }).catch(function () {
        return embyGet(path2, srv).then(function (d) {
          var items = (d && d.Items) || [];
          var total = (d && typeof d.TotalRecordCount === "number") ? d.TotalRecordCount : (startIndex + items.length);
          return { items: items, total: total, srv: srv };
        }).catch(function (err) {
          return { items: [], total: 0, srv: srv, error: err };
        });
      });
    }

    function saveFavCache(pager) {
      var grid = root.querySelector(".grid");
      STATE.favGridCache = {
        key: cacheKey,
        html: grid ? grid.outerHTML : root.innerHTML,
        loaded: pager.loaded,
        done: pager.done,
        ts: Date.now()
      };
    }

    function makeFavPager(initial) {
      return {
        loading: false,
        done: !!(initial && initial.done),
        loaded: (initial && initial.loaded) || 0,
        loadMore: function () {
          var pager = this;
          if (pager.loading || pager.done) return;
          pager.loading = true;
          var isFirst = pager.loaded === 0;
          var startIndex = pager.loaded;
          if (!isFirst) showLibLoadingMore(root);

          Promise.all(servers.map(function (srv) {
            return fetchFavoritesPage(srv, startIndex);
          })).then(function (results) {
            if (STATE.libPager !== pager) return;
            if (!isFirst) hideLibLoadingMore(root);

            var merged = [];
            var anyMore = false;
            var anyError = null;
            results.forEach(function (r) {
              if (r.error) anyError = r.error;
              (r.items || []).forEach(function (it) {
                if (!it || !it.Id) return;
                it._srvId = r.srv.id;
                it._srvName = r.srv.name || "";
                merged.push(it);
              });
              if ((r.items || []).length >= pageSize || (startIndex + (r.items || []).length) < (r.total || 0)) {
                anyMore = true;
              }
            });
            merged.sort(function (a, b) {
              var da = a.DateCreated || "";
              var db = b.DateCreated || "";
              if (da === db) return (a.Name || "").localeCompare(b.Name || "");
              return da < db ? 1 : -1;
            });

            if (isFirst && !merged.length) {
              root.innerHTML = anyError
                ? ('<div class="empty-row">加载收藏失败：' + escapeHtml((anyError && anyError.message) || "请求失败") +
                   '<span class="retry-btn focusable" tabindex="0" id="fav-retry">重试</span></div>')
                : '<div class="empty-row">还没有收藏的内容<br>在详情页点心形即可加入收藏</div>';
              var retry = el("fav-retry");
              if (retry) retry.addEventListener("click", function () { renderFavorites({ forceRefresh: true }); });
              pager.done = true;
              pager.loading = false;
              /* 空结果也缓存一小段，避免反复打空接口 */
              STATE.favGridCache = {
                key: cacheKey,
                html: root.innerHTML,
                loaded: 0,
                done: true,
                ts: Date.now()
              };
              focusFirstIn(root);
              return;
            }

            var cardsHtml = merged.map(function (it) {
              var srv = getServerById(it._srvId) || servers[0];
              return favPosterHtml(it, srv);
            });
            if (isFirst) {
              root.innerHTML = '<div class="grid">' + cardsHtml.join("") + '</div>';
              hydrateImages(root);
              focusFirstIn(root);
            } else {
              appendCardsToGrid(root, cardsHtml);
            }
            pager.loaded += pageSize;
            if (!anyMore || !merged.length) pager.done = true;
            pager.loading = false;
            saveFavCache(pager);
            maybeFillLibScreen();
          }).catch(function (err) {
            if (STATE.libPager !== pager) return;
            if (!isFirst) hideLibLoadingMore(root);
            if (isFirst) {
              root.innerHTML = '<div class="empty-row">加载收藏失败：' + escapeHtml((err && err.message) || "未知错误") +
                '<span class="retry-btn focusable" tabindex="0" id="fav-retry">重试</span></div>';
              var retry2 = el("fav-retry");
              if (retry2) retry2.addEventListener("click", function () { renderFavorites({ forceRefresh: true }); });
            }
            pager.done = true;
            pager.loading = false;
          });
        }
      };
    }

    /* 短缓存命中：直接还原 DOM，分页状态接着上次的 loaded/done */
    var cache = STATE.favGridCache;
    if (!opts.forceRefresh && cache && cache.key === cacheKey && cache.html &&
        (Date.now() - cache.ts <= FAV_MEM_CACHE_MAX_AGE)) {
      root.innerHTML = cache.html;
      hydrateImages(root);
      focusFirstIn(root);
      STATE.libPager = makeFavPager({ loaded: cache.loaded, done: cache.done });
      maybeFillLibScreen();
      return;
    }

    if (opts.forceRefresh) invalidateFavoritesCache();

    root.innerHTML = '<div class="grid">' + new Array(9).fill('<div class="poster-card"><div class="poster-art skeleton"></div></div>').join("") + '</div>';
    STATE.libPager = makeFavPager(null);
    STATE.libPager.loadMore();
  }

  /* ---------------- 搜索 ---------------- */

  

  var SEARCH_HISTORY_KEY = "solene_search_history_v1";
  var SEARCH_HISTORY_LIMIT = 12;

  function getSearchHistory() {
    try {
      var raw = window.localStorage.getItem(SEARCH_HISTORY_KEY);
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list.filter(function (t) { return typeof t === "string" && t; }) : [];
    } catch (e) { return []; }
  }
  function saveSearchHistory(list) {
    try { window.localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function addSearchHistory(term) {
    term = (term || "").trim();
    if (!term) return;
    var list = getSearchHistory().filter(function (t) { return t !== term; });
    list.unshift(term);
    if (list.length > SEARCH_HISTORY_LIMIT) list = list.slice(0, SEARCH_HISTORY_LIMIT);
    saveSearchHistory(list);
  }
  function removeSearchHistory(term) {
    saveSearchHistory(getSearchHistory().filter(function (t) { return t !== term; }));
  }
  function clearSearchHistory() {
    saveSearchHistory([]);
  }

  

  function resetSearchState() {
    searchStreamToken++;
    STATE.searchTerm = "";
    STATE.searchResultsCache = null;
    STATE.searchResultsCacheTerm = "";
    STATE.searchResultsDone = false;
    STATE.searchActiveSrc = "";
    STATE.searchHasContent = false;
    var input = el("search-input");
    if (input) input.value = "";
  }

  

  

  

  function searchItemsOn(s, term, limit) {
    return embyGet("/Users/" + s.userId + "/Items?SearchTerm=" + encodeURIComponent(term) +
      "&Recursive=true&IncludeItemTypes=Movie,Series&SortBy=SortName&Limit=" + (limit || 50), s)
      .then(function (d) { return (d && d.Items) || []; });
  }

  

  function mapSearchHints(d) {
    var hints = (d && (d.SearchHints || d.Items)) || [];
    return hints.map(function (h) {
      return {
        Id: h.ItemId || h.Id,
        Name: h.Name,
        Type: h.Type,
        ProductionYear: h.ProductionYear,
        SeriesName: h.Series || h.SeriesName || "",
        ImageTags: h.PrimaryImageTag ? { Primary: h.PrimaryImageTag } : {},
        CommunityRating: h.CommunityRating,
        UserData: h.UserData || null
      };
    }).filter(function (it) { return it.Id; });
  }

  function searchHintsOn(s, term, limit, skipEmptyFallback) {
    

    var path = "/Search/Hints?SearchTerm=" + encodeURIComponent(term) +
      "&UserId=" + encodeURIComponent(s.userId) +
      "&IncludeItemTypes=Movie,Series" +
      "&Limit=" + (limit || 50);
    return embyGet(path, s).then(function (d) {
      var items = mapSearchHints(d).filter(function (it) {
        return !it.Type || it.Type === "Movie" || it.Type === "Series";
      });
      if (items.length) return items;
      if (skipEmptyFallback) return [];
      return searchItemsOn(s, term, limit);   /* 端点在、但没命中：再用老办法确认一次 */
    })["catch"](function () {
      return searchItemsOn(s, term, limit);   /* 端点不可用（400/404/被代理挡掉）：直接走老办法 */
    });
  }

  function searchEmbyServers(term) {
    if (!term) return Promise.resolve([]);
    var servers = STATE.servers.filter(function (s) { return s.token && s.userId; });
    if (!servers.length) return Promise.resolve([]);
    return Promise.all(servers.map(function (s) {
      return searchHintsOn(s, term, 50)
        .then(function (items) {
          items.forEach(function (it) { it._srvId = s.id; it._srvName = s.name; });
          return items;
        })
        .catch(function () { return []; });
    })).then(function (lists) {
      var merged = [].concat.apply([], lists);
      merged.sort(function (a, b) { return String(a.Name || "").localeCompare(String(b.Name || ""), "zh"); });
      return merged;
    });
  }

  

  var searchStreamToken = 0;
  function searchServersStream(term, onUpdate) {
    var myToken = ++searchStreamToken;
    var servers = STATE.servers.filter(function (s) { return s.token && s.userId; });
    if (!term || !servers.length) { onUpdate([], true); return; }
    var groups = [];
    var remaining = servers.length;
    servers.forEach(function (s) {
      searchHintsOn(s, term, 50)
        .catch(function () { return []; })
        .then(function (items) {
          if (myToken !== searchStreamToken) return; /* 已经有更新的一轮搜索发起，这轮结果作废 */
          remaining--;
          if (items.length) {
            items.forEach(function (it) { it._srvId = s.id; it._srvName = s.name; });
            groups.push({ srv: s, items: items });
          }
          var done = remaining === 0;
          

          if (!done && !groups.length) return;
          onUpdate(groups.slice(), done);
        });
    });
  }

  

  function searchCardHtml(it, showSrvTag) {
    var srv = getServerById(it._srvId);
    var img = imageUrl(it.Id, "Primary", { maxHeight: 400, tag: imgTag(it, "Primary") }, srv);
    var rate = it.CommunityRating ? '<span class="poster-badge">★' + it.CommunityRating.toFixed(1) + '</span>' : "";
    var srvTag = (showSrvTag && it._srvName) ? '<span class="poster-server-tag">' + escapeHtml(it._srvName) + '</span>' : "";
    return '<div class="poster-card focusable" tabindex="0" data-detail="' + it.Id + '" data-server="' + escapeHtml(it._srvId || "") + '">' +
      '<div class="poster-art"><img data-src="' + img + '" />' + rate + srvTag + '</div>' +
      '<div class="poster-name">' + escapeHtml(it.Name || "") + '</div></div>';
  }

  function bindSearchResultCards(root) {
    qsa("[data-detail]", root).forEach(function (node) {
      node.addEventListener("click", function () {
        if (node.getAttribute("data-resume-play") === "1") {
          playFromResumeCard(node);
          return;
        }
        navigate("detail", { id: node.getAttribute("data-detail"), serverId: node.getAttribute("data-server") || "" });
      });
    });
  }

  

  function renderSearchResults(groups, done) {
    if (done === undefined) done = true;
    var root = el("search-body");
    

    STATE.searchResultsCache = groups;
    STATE.searchResultsCacheTerm = STATE.searchTerm;
    STATE.searchResultsDone = done;
    if (!groups.length) {
      STATE.searchActiveSrc = "";
      STATE.searchHasContent = false;
      root.innerHTML = '<div class="search-hint">' + (STATE.searchTerm ? "没有找到相关结果" : "输入片名试试看") + '</div>';
      return;
    }
    STATE.searchHasContent = true;

    if (groups.length === 1) {
      
      STATE.searchActiveSrc = "";
      root.innerHTML = '<div class="grid">' + groups[0].items.map(function (it) { return searchCardHtml(it, false); }).join("") + '</div>';
      hydrateImages(root);
      bindSearchResultCards(root);
      return;
    }

    

    var activeSrc = STATE.searchActiveSrc || "";
    if (activeSrc && !groups.some(function (g) { return g.srv.id === activeSrc; })) activeSrc = "";
    STATE.searchActiveSrc = activeSrc;

    var totalCount = groups.reduce(function (s, g) { return s + g.items.length; }, 0);
    var chips = [{ key: "", label: "全部", count: totalCount }].concat(groups.map(function (g) {
      return { key: g.srv.id, label: g.srv.name || g.srv.server, count: g.items.length };
    }));
    var tabsHtml = '<div class="lib-filter-row search-src-tabs">' + chips.map(function (c) {
      var sel = (c.key === activeSrc) ? " sel" : "";
      return '<span class="lib-filter-chip focusable' + sel + '" tabindex="0" data-src="' + escapeHtml(c.key) + '">' +
        escapeHtml(c.label) + '<span class="src-count">' + c.count + '</span></span>';
    }).join("") + '</div>';

    var bodyHtml;
    if (activeSrc) {
      var g = groups.filter(function (x) { return x.srv.id === activeSrc; })[0];
      bodyHtml = '<div class="grid">' + (g ? g.items : []).map(function (it) { return searchCardHtml(it, false); }).join("") + '</div>';
    } else {
      bodyHtml = groups.map(function (g) {
        return renderPosterRow(g.srv.name || g.srv.server, g.items, false, null, true);
      }).join("");
    }

    root.innerHTML = tabsHtml + bodyHtml;
    hydrateImages(root);
    bindSearchResultCards(root);
    qsa("[data-src]", root).forEach(function (node) {
      node.addEventListener("click", function () {
        STATE.searchActiveSrc = node.getAttribute("data-src") || "";
        renderSearchResults(STATE.searchResultsCache, STATE.searchResultsDone);
      });
    });
  }

  function renderSearchScreen() {
    var root = el("search-body");
    var input = el("search-input");
    input.value = STATE.searchTerm || "";

    

    STATE.searchHasContent = false;
    var cacheHit = STATE.searchTerm && STATE.searchResultsCache && STATE.searchResultsCacheTerm === STATE.searchTerm && STATE.searchResultsDone;
    if (cacheHit) {
      renderSearchResults(STATE.searchResultsCache, true);
      /* 只是原地恢复上次的结果，不是用户刚点进搜索页/刚打完字，不用抢焦点弹键盘。 */
      return;
    }

    if (STATE.searchTerm) {
      runSearch(STATE.searchTerm, false);
    } else {
      renderSearchIdle(root);
    }

    if (!input._bound) {
      input._bound = true;
      var timer = null;
      

      function commitSearchHistory() {
        var term = input.value.trim();
        if (!term) return;
        clearTimeout(timer);
        runSearch(term, true);
        try { input.blur(); } catch (e) {}
      }
      input.addEventListener("input", function () {
        var term = input.value.trim();
        STATE.searchTerm = term;
        clearTimeout(timer);
        if (!term) { renderSearchIdle(el("search-body")); return; }
        el("search-body").innerHTML = SEARCH_SKELETON_HTML;
        timer = setTimeout(function () { runSearch(term, false); }, 400);
      });
      input.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        commitSearchHistory();
      });
      var submitBtn = el("search-submit-btn");
      if (submitBtn) {
        submitBtn.addEventListener("click", commitSearchHistory);
      }
    }

    

    if (!input._focusTapBound) {
      input._focusTapBound = true;
      var forceFocus = function () {
        try { input.focus({ preventScroll: true }); } catch (e1) {
          try { input.focus(); } catch (e2) {}
        }
      };
      input.addEventListener("touchend", forceFocus, { passive: true });
      input.addEventListener("click", forceFocus);
    }
    try { input.focus({ preventScroll: true }); } catch (e) {
      try { input.focus(); } catch (e3) {}
    }
    focusFirstIn(root, input);
    
    requestAnimationFrame(function () {
      if (document.activeElement === input) return;
      var searchScreen = el("search-screen");
      if (!searchScreen || !searchScreen.classList.contains("active")) return;
      try { input.focus({ preventScroll: true }); } catch (e4) {}
    });
  }

  

  var SEARCH_SKELETON_HTML = '<div class="grid">' + new Array(6).fill('<div class="poster-card"><div class="poster-art skeleton"></div></div>').join("") + '</div>';

  

  function runSearch(term, record) {
    

    if (record !== false) addSearchHistory(term);
    var root = el("search-body");
    root.innerHTML = SEARCH_SKELETON_HTML;
    searchServersStream(term, function (groups, done) {
      var input = el("search-input");
      if (input && input.value.trim() !== term) return; /* 结果回来时输入框内容已经变了，作废 */
      renderSearchResults(groups, done);
    });
  }

  

  function renderSearchIdle(root) {
    STATE.searchActiveSrc = "";
    STATE.searchHasContent = false;
    var defaultHint = STATE.servers.length > 1
      ? "按服务器分组展示，自动搜索已添加的 " + STATE.servers.length + " 台服务器"
      : "输入片名试试看，将搜索你的媒体库";
    var history = getSearchHistory();
    if (!history.length) {
      root.innerHTML = '<div class="search-hint">' + defaultHint + '</div>';
      return;
    }
    var chipsHtml = history.map(function (t) {
      return '<span class="search-history-chip focusable" tabindex="0" data-history="' + escapeHtml(t) + '">' +
        '<span class="search-history-chip-text">' + escapeHtml(t) + '</span>' +
        '<span class="search-history-chip-x focusable" tabindex="0" data-history-remove="' + escapeHtml(t) + '">✕</span>' +
      '</span>';
    }).join("");
    root.innerHTML =
      '<div class="search-history">' +
        '<div class="search-history-head"><span>搜索记录</span><span class="search-history-clear focusable" tabindex="0" id="search-history-clear">清空</span></div>' +
        '<div class="search-history-chips">' + chipsHtml + '</div>' +
      '</div>' +
      '<div class="search-hint">' + defaultHint + '</div>';
    bindSearchHistoryUI(root);
  }

  function bindSearchHistoryUI(root) {
    var input = el("search-input");
    qsa("[data-history]", root).forEach(function (node) {
      node.addEventListener("click", function (e) {
        if (e.target.closest("[data-history-remove]")) return; /* 叉号单独处理，别顺带把整条 chip 的复搜也触发了 */
        var term = node.getAttribute("data-history");
        if (!term) return;
        input.value = term;
        STATE.searchTerm = term;
        runSearch(term, false);
      });
    });
    qsa("[data-history-remove]", root).forEach(function (node) {
      node.addEventListener("click", function (e) {
        e.stopPropagation();
        removeSearchHistory(node.getAttribute("data-history-remove"));
        renderSearchIdle(root);
      });
    });
    var clearBtn = el("search-history-clear");
    if (clearBtn) {
      clearBtn.addEventListener("click", function () {
        clearSearchHistory();
        renderSearchIdle(root);
      });
    }
  }


  

  function openTmdbOrMatchedDetail(data) {
    var tmdbId = data.tmdbId, mediaType = data.mediaType || "movie";
    var token = "tmdb-" + mediaType + "-" + tmdbId;
    var cachedMeta = detailCacheGet(detailTmdbMetaCache, tmdbDetailCacheKey(mediaType, tmdbId));
    var hasPreview = !!(data.title || data.poster || data.backdrop);

    /* 有缓存直接出完整详情；有卡片预览先出壳；否则灰骨架 */
    if (cachedMeta) {
      el("detail-content").innerHTML = "";
    } else if (hasPreview) {
      el("detail-content").innerHTML = tmdbPreviewShellHtml(data);
    } else {
      el("detail-content").innerHTML = detailSkeletonHtml();
    }
    el("detail-screen").classList.add("detail-loading");
    resetDetailScroll();
    playDetailEnter();
    document.body.classList.add("detail-active"); clearInterval(homeHeroTimer);
    detailHeroReset();
    detailHeroToken = token;
    detailPickedResource = null;
    detailFocusEpisodeId = null;
    detailPrefetchPlay = null;
    _pendingTmdbMatches = null;
    _setNativeToolbarVisible(false);

    /* 卡片上的图立刻铺壁纸，不等 TMDB 首包 */
    if (!cachedMeta && (data.backdrop || data.poster)) {
      try { detailHeroSet([data.backdrop || data.poster]); } catch (ePrev) {}
    }

    var tmdbPromise = cachedMeta
      ? Promise.resolve(cachedMeta)
      : cachedTmdbDetail(mediaType, tmdbId).catch(function () { return null; });

    /* 内容优先：TMDB 一返回就画详情，不再等服务器匹配 */
    tmdbPromise.then(function (meta) {
      if (detailHeroToken !== token) return;
      if (meta) {
        renderTmdbDetail(data, meta);
      } else {
        el("detail-screen").classList.remove("detail-loading");
        /* 预览壳已在：至少保留标题，避免整页失败 */
        if (hasPreview && el("detail-overview")) {
          /* preview shell used body skeleton without overview id — fall through to fail UI */
        }
        el("detail-content").innerHTML = '<div class="empty-row" style="padding:30px 16px;">加载详情失败' +
          '<button class="back-btn focusable" tabindex="0" data-back="1" style="margin-left:10px;">返回</button></div>';
        qs("[data-back]", el("detail-content")).addEventListener("click", function () { history.back(); });
      }
    });

    /* 资源匹配异步进行，只往 #tmdb-match-slot 补资源卡 */
    function applyMatches(matches) {
      if (detailHeroToken !== token) return;
      fillTmdbMatchSlot(matches || [], mediaType, token);
    }

    var earlyMatch = (data.title
      ? matchTmdbOnServers(data.title, data.year || "", mediaType, tmdbId, [])
      : matchTmdbOnServers("", "", mediaType, tmdbId, [])
    ).catch(function () { return []; });

    earlyMatch.then(function (matches) {
      if (detailHeroToken !== token) return;
      if (matches && matches.length) {
        applyMatches(matches);
        return;
      }
      /* 卡片片名没中：等 TMDB 元数据用多译名再搜一轮 */
      tmdbPromise.then(function (meta) {
        if (detailHeroToken !== token) return;
        if (!meta) {
          applyMatches([]);
          return;
        }
        var mainTitle = tmdbName(meta) || data.title || "";
        var date = tmdbDate(meta) || "";
        var y = (date && date.slice(0, 4)) || data.year || "";
        var alts = [];
        if (meta.original_title) alts.push(meta.original_title);
        if (meta.original_name) alts.push(meta.original_name);
        if (meta.title && meta.title !== mainTitle) alts.push(meta.title);
        if (meta.name && meta.name !== mainTitle) alts.push(meta.name);
        if (data.title && data.title !== mainTitle) alts.push(data.title);
        matchTmdbOnServers(mainTitle, y, mediaType, tmdbId, alts).then(function (matches2) {
          if (detailHeroToken !== token) return;
          applyMatches(matches2 || []);
        }).catch(function () {
          if (detailHeroToken !== token) return;
          applyMatches([]);
        });
      });
    });
  }

  var _pendingTmdbMatches = null;

  function fillTmdbMatchSlot(matches, mediaType, token) {
    if (detailHeroToken !== token) return;
    var slot = el("tmdb-match-slot");
    if (!slot) {
      /* 详情壳还没画完：先挂起，renderTmdbDetail 结束后再灌 */
      _pendingTmdbMatches = { token: token, matches: matches, mediaType: mediaType };
      return;
    }
    _pendingTmdbMatches = null;
    matches = (matches || []).slice();
    if (!matches.length) {
      slot.innerHTML = "";
      var playBtn0 = el("detail-play-btn");
      if (playBtn0) {
        playBtn0.classList.add("disabled");
        playBtn0.setAttribute("disabled", "disabled");
        playBtn0.setAttribute("aria-disabled", "true");
        playBtn0.setAttribute("tabindex", "-1");
        playBtn0.textContent = "▶ 没有资源";
        playBtn0.onclick = null;
      }
      return;
    }

    var chosenQuality = null;
    detailPickedResource = null;

    function bestVersion(versions) {
      var best = null, bestScore = -1;
      (versions || []).forEach(function (v) {
        var score = QUALITY_RANK[v.label] || 0;
        if (score > bestScore) { bestScore = score; best = v; }
      });
      return best;
    }
    function versionForQuality(versions, q) {
      return (versions || []).filter(function (v) { return v.label === q; })[0] || null;
    }

    function wirePlayBtn() {
      var playBtn = el("detail-play-btn");
      if (!playBtn) return;
      playBtn.classList.remove("disabled");
      playBtn.removeAttribute("disabled");
      playBtn.setAttribute("aria-disabled", "false");
      playBtn.setAttribute("tabindex", "0");
      playBtn.textContent = "▶ 播放";
      playBtn.onclick = function () {
        var p = detailPickedResource;
        if (p) {
          if (p.vid) playItem(p.id, null, p.srv, { mediaSourceId: p.vid, qualityLabel: p.vlabel, audioStreamIndex: p.audioIndex });
          else playItem(p.id, null, p.srv, { audioStreamIndex: p.audioIndex });
          return;
        }
        var first = matches[0];
        if (!first) return;
        var msrv = getServerById(first._srvId);
        var version = bestVersion(first._versions);
        if (version) playItem(first.Id, null, msrv, { mediaSourceId: version.id, qualityLabel: version.label });
        else playItem(first.Id, null, msrv);
      };
    }

    function renderResourceSection() {
      if (detailHeroToken !== token) return;
      var liveSlot = el("tmdb-match-slot");
      if (!liveSlot) return;

      var visible = matches.filter(function (it) {
        if (!chosenQuality) return true;
        if (it._versions === undefined) return true;
        return !!versionForQuality(it._versions, chosenQuality);
      });

      /* 无手动选择时默认高亮第一张可见卡（与播放按钮默认播 matches[0] 的行为一致），进详情页就能看出会播哪个 */
      var defaultActiveIdx = -1;
      if (!detailPickedResource && visible.length && matches.length) {
        for (var di = 0; di < visible.length; di++) {
          if (visible[di] === matches[0]) { defaultActiveIdx = di; break; }
        }
      }

      var cards = visible.map(function (it, idx) {
        var msrv = getServerById(it._srvId);
        var img = imageUrl(it.Id, "Primary", { maxHeight: 300, tag: imgTag(it, "Primary") }, msrv);
        var version = chosenQuality ? versionForQuality(it._versions, chosenQuality) : bestVersion(it._versions);
        var badgeText = version ? (version.label + (version.bitrate ? " · " + version.bitrate : "")) : "";
        var badge = version ? '<span class="poster-quality-badge">' + escapeHtml(badgeText) + '</span>' :
          (it._versions === null ? '<span class="poster-quality-badge poster-quality-badge-unknown" title="画质查询失败">?</span>' : "");
        /* vid 为空表示选中时画质版本还没查回来：此时只按 id+srvId 匹配，避免版本查回后重渲染把高亮弄丢 */
        var isPicked = !!(detailPickedResource && detailPickedResource.id === it.Id &&
          detailPickedResource.srvId === (it._srvId || "") &&
          (!detailPickedResource.vid || detailPickedResource.vid === (version ? version.id : "")));
        var isActive = detailPickedResource ? isPicked : (idx === defaultActiveIdx);
        var cardCls = "poster-card focusable" + (isActive ? " current" : "");
        var hdrLine = (version && version.hdr) ? '<span class="poster-media-info">' + escapeHtml(version.hdr) + '</span>' : "";
        return '<div class="' + cardCls + '" tabindex="0" data-match-id="' + it.Id + '" data-match-server="' + escapeHtml(it._srvId || "") +
          '" data-vid="' + escapeHtml(version ? version.id : "") + '" data-vlabel="' + escapeHtml(version ? version.label : "") + '">' +
          '<div class="poster-art"><img data-src="' + img + '" />' + badge + hdrLine +
            '<span class="poster-glow"></span><span class="poster-tap-hint">▶</span>' +
          '</div>' +
          '<div class="poster-name">' + escapeHtml(it._srvName || "") + '</div></div>';
      }).join("");

      var qualitySet = {};
      matches.forEach(function (it) { (it._versions || []).forEach(function (v) { qualitySet[v.label] = true; }); });
      var qualities = Object.keys(qualitySet).sort(function (a, b) { return (QUALITY_RANK[b] || 0) - (QUALITY_RANK[a] || 0); });
      var pickerHtml = qualities.length ? '<div class="quality-picker" id="tmdb-quality-picker">' +
        '<span class="quality-chip focusable' + (chosenQuality ? "" : " sel") + '" tabindex="0" data-quality="">全部</span>' +
        qualities.map(function (q) {
          return '<span class="quality-chip focusable' + (chosenQuality === q ? " sel" : "") + '" tabindex="0" data-quality="' + escapeHtml(q) + '">' + escapeHtml(q) + '</span>';
        }).join("") + '</div>' : '';

      liveSlot.innerHTML = '<div class="ep-header"><div class="detail-section-title">资源</div>' + pickerHtml + '</div><div class="row-scroll">' + cards + '</div>';
      hydrateImages(liveSlot);
      wirePlayBtn();

      qsa(".quality-chip", liveSlot).forEach(function (chip) {
        chip.addEventListener("click", function (e) {
          e.stopPropagation();
          var q = chip.getAttribute("data-quality");
          chosenQuality = (!q || chosenQuality === q) ? null : q;
          renderResourceSection();
        });
      });
      qsa("[data-match-id]", liveSlot).forEach(function (node) {
        node.addEventListener("click", function () {
          var id = node.getAttribute("data-match-id");
          var srvId = node.getAttribute("data-match-server") || "";
          var msrv = getServerById(srvId);
          var vid = node.getAttribute("data-vid");
          var vlabel = node.getAttribute("data-vlabel");
          var alreadyPicked = detailPickedResource && detailPickedResource.id === id &&
            detailPickedResource.srvId === srvId &&
            (!detailPickedResource.vid || !vid || detailPickedResource.vid === vid);
          if (alreadyPicked) {
            node.classList.add("launching");
            setTimeout(function () { node.classList.remove("launching"); }, 340);
            var audioIdx = detailPickedResource ? detailPickedResource.audioIndex : null;
            if (vid) playItem(id, null, msrv, { mediaSourceId: vid, qualityLabel: vlabel, audioStreamIndex: audioIdx });
            else playItem(id, null, msrv, { audioStreamIndex: audioIdx });
            return;
          }
          detailPickedResource = { id: id, srvId: srvId, srv: msrv, vid: vid || "", vlabel: vlabel || "" };
          detailPrefetchPlay = null;
          if (msrv) {
            var isTvPick = mediaType === "tv";
            prefetchPlaybackForResource(id, msrv, {
              asSeries: isTvPick,
              seriesId: isTvPick ? id : null,
              mediaSourceId: vid || null,
              detailToken: token
            });
          }
          qsa(".poster-card.current", liveSlot).forEach(function (n) { n.classList.remove("current"); });
          node.classList.add("current");
        });
      });
    }

    renderResourceSection();

    /* 匹配结果出来后，立刻预取第一个匹配项的 PlaybackInfo（剧集解析到可播分集） */
    if (matches.length) {
      var firstMatch = matches[0];
      var firstSrv = getServerById(firstMatch._srvId);
      if (firstSrv && firstSrv.token) {
        var isTvMatch = mediaType === "tv" || firstMatch.Type === "Series";
        prefetchPlaybackForResource(firstMatch.Id, firstSrv, {
          asSeries: isTvMatch,
          seriesId: isTvMatch ? firstMatch.Id : null,
          detailToken: token
        });
      }
    }

    setTimeout(function () {
      try {
        Promise.all(matches.map(function (it) {
          var msrv = getServerById(it._srvId);
          if (!msrv) { it._versions = []; return null; }
          var loaderPromise;
          try {
            loaderPromise = mediaType === "movie" ? loadItemVersions(it.Id, msrv) : loadSeriesVersions(it.Id, msrv);
          } catch (e) {
            loaderPromise = Promise.resolve([]);
          }
          return loaderPromise.then(function (versions) { it._versions = versions; }).catch(function () { it._versions = null; });
        })).then(function () {
          if (detailHeroToken !== token) return;
          if (!el("tmdb-match-slot")) return;
          renderResourceSection();
        }).catch(function () {});
      } catch (e) {}
    }, 0);
  }

  function pickTmdbCertification(item, mediaType) {
    var prefer = ["CN", "HK", "TW", "US"];
    if (mediaType === "tv") {
      var crList = (item.content_ratings && item.content_ratings.results) || [];
      for (var i = 0; i < prefer.length; i++) {
        var hit = crList.filter(function (r) { return r.iso_3166_1 === prefer[i] && r.rating; })[0];
        if (hit) return hit.rating;
      }
      return (crList.filter(function (r) { return r.rating; })[0] || {}).rating || "";
    }
    var rdList = (item.release_dates && item.release_dates.results) || [];
    for (var j = 0; j < prefer.length; j++) {
      var country = rdList.filter(function (r) { return r.iso_3166_1 === prefer[j]; })[0];
      if (country) {
        var cert = (country.release_dates || []).map(function (d) { return d.certification; }).filter(Boolean)[0];
        if (cert) return cert;
      }
    }
    return "";
  }

  

  function renderTmdbEpisodesSection(tvId, seasons) {
    var slot = el("tmdb-episodes-slot");

    if (!list.length) { slot.innerHTML = ""; return; }
    var tabsHtml = list.map(function (s, i) {
      return '<div class="season-tab focusable' + (i === 0 ? ' active' : '') + '" tabindex="0" data-season-num="' + s.season_number + '">' +
        escapeHtml(s.name || ("第 " + s.season_number + " 季")) + '</div>';

    slot.innerHTML = '<div class="ep-header"><div class="detail-section-title">剧集</div>' +
      '<div class="season-tabs" id="tmdb-season-tabs">' + tabsHtml + '</div></div>' +

      '<div id="tmdb-episode-list"></div>';
    qsa(".season-tab", slot).forEach(function (tab) {

  function loadTmdbEpisodesForSeason(tvId, seasonNum) {
    var listEl = el("tmdb-episode-list");
    if (!listEl) return;
    listEl.className = "";
    listEl.innerHTML = '<div class="empty-row">加载中…</div>';
    if (el("tmdb-ep-range-nav")) el("tmdb-ep-range-nav").innerHTML = "";
    tmdbGet("/tv/" + tvId + "/season/" + seasonNum).then(function (d) {
      if (!listEl || listEl !== el("tmdb-episode-list")) return;
      var eps = (d && d.episodes) || [];
      if (!eps.length) { listEl.innerHTML = '<div class="empty-row">此季暂无剧集信息</div>'; return; }
      listEl.className = "ep-row";
      listEl.innerHTML = eps.map(function (ep) {
        

        var thumb = ep.still_path ? tmdbImageUrl(ep.still_path, "w500") : "";
        var label = ep.episode_number != null ? ("第 " + ep.episode_number + " 集") : escapeHtml(ep.name || "");
        var name = (ep.name || "").trim();
        var generic = !name || /^(第\s*\d+\s*集|Episode\s*\d+|EP?\s*\d+)$/i.test(name);
        var sub = generic ? (ep.runtime ? ep.runtime + " 分钟" : "") : name;
        return '<div class="ep-card">' +
          '<div class="ep-label">' + escapeHtml(label) + '</div>' +
          '<div class="ep-thumb">' + (thumb ? '<img src="' + thumb + '" decoding="async" />' : '') + '</div>' +
          (sub ? '<div class="ep-sub">' + escapeHtml(sub) + '</div>' : '') +
          '</div>';

      qsa("img", listEl).forEach(function (img) { lazyImg(img); });
      var tmdbNavEl = el("tmdb-ep-range-nav");
      if (tmdbNavEl && tmdbNavEl.parentNode) {
        tmdbNavEl.innerHTML = buildEpRangeNavHtml(eps.length);
        wireEpRangeNav(tmdbNavEl, listEl);
      }
    }).catch(function () {
      if (listEl && listEl === el("tmdb-episode-list")) listEl.innerHTML = '<div class="empty-row">加载剧集失败</div>';
    });
  }

  function renderTmdbDetail(data, preloadedItem) {
    var tmdbId = data.tmdbId;
    var mediaType = data.mediaType || "movie";
    var reuseShell = !!preloadedItem && document.body.classList.contains("detail-active");
    if (!reuseShell) {
      el("detail-content").innerHTML = detailSkeletonHtml();
      el("detail-screen").classList.add("detail-loading");
      playDetailEnter();
      document.body.classList.add("detail-active"); clearInterval(homeHeroTimer);
      detailHeroToken = "tmdb-" + mediaType + "-" + tmdbId;
      _setNativeToolbarVisible(false);
    } else {
      detailHeroToken = "tmdb-" + mediaType + "-" + tmdbId;
    }

    var loadPromise = preloadedItem
      ? Promise.resolve(preloadedItem)
      : cachedTmdbDetail(mediaType, tmdbId);
    loadPromise.then(function (item) {
      if (item) detailCacheSet(detailTmdbMetaCache, tmdbDetailCacheKey(mediaType, tmdbId), item);
      var name = tmdbName(item);
      var date = tmdbDate(item);
      var pic = tmdbImageUrl(item.poster_path, "w780");
      var backdrop = tmdbImageUrl(item.backdrop_path, "w1280");

      if (window.fm && window.fm.preloadArtwork) {
        window.fm.preloadArtwork(pic, backdrop).catch(function () {});
      }

      
      var chips = [];
      if (item.vote_average) chips.push("★ " + item.vote_average.toFixed(1));
      if (date) chips.push(date.slice(0, 4));
      if (mediaType === "tv") {
        if (item.number_of_seasons) chips.push(item.number_of_seasons + " 季");
        if (item.status === "Ended" || item.status === "Canceled") chips.push("已完结");
        else if (item.status) chips.push("连载中");
      } else if (item.runtime) {
        chips.push(item.runtime + " 分钟");
      }
      (item.genres || []).slice(0, 2).forEach(function (g) { chips.push(g.name); });
      var cert = pickTmdbCertification(item, mediaType);
      if (cert) chips.push(cert);
      var chipsHtml = chips.length
        ? '<div class="detail-chips">' + chips.map(function (c) { return '<span class="detail-chip">' + escapeHtml(c) + '</span>'; }).join("") + '</div>'
        : "";

      var logoPath = pickTmdbLogo(item.images);
      var titleHtml = logoPath
        ? '<img class="detail-logo" src="' + tmdbImageUrl(logoPath, "w500") + '" alt="' + escapeHtml(name) + '" />'
        : '<div class="detail-title">' + escapeHtml(name) + '</div>';

      var html = '<div class="detail-hero">' +
        '<div class="detail-hero-fade"></div>' +
        '<div class="detail-hero-info">' +
          titleHtml +
          chipsHtml +
          '<div class="detail-actions"><button class="detail-play disabled focusable" tabindex="-1" disabled aria-disabled="true" id="detail-play-btn">▶ 没有资源</button></div>' +
        '</div></div>' +
        '<div class="detail-body">' +
          '<div class="detail-overview clamp" id="detail-overview">' + escapeHtml(item.overview || "暂无简介") + '</div>' +
          (mediaType === "tv" ? '<div id="tmdb-episodes-slot"></div>' : '') +
          '<div id="tmdb-match-slot"><div class="empty-row">正在匹配已连接的服务器…</div></div>' +
          '<div id="detail-cast"></div>' +
          '<div id="detail-similar"></div>' +
        '</div>';

      el("detail-content").innerHTML = html;
      el("detail-screen").classList.remove("detail-loading");
      resetDetailScroll();

      

      var extra = ((item.images && item.images.backdrops) || []).slice().sort(function (a, b) {
        var an = a.iso_639_1 == null ? 0 : 1, bn = b.iso_639_1 == null ? 0 : 1;
        if (an !== bn) return an - bn;
        return (b.vote_average || 0) - (a.vote_average || 0);
      }).slice(0, 4).map(function (b) { return tmdbImageUrl(b.file_path, "w1280"); });
      var heroUrls = [];
      if (backdrop) heroUrls.push(backdrop);
      extra.forEach(function (u) { if (heroUrls.indexOf(u) === -1) heroUrls.push(u); });
      detailHeroSet(heroUrls);
      bindDetailScrollFx();

      var ov = el("detail-overview");
      if (ov) ov.addEventListener("click", function () { ov.classList.toggle("clamp"); });
      focusFirstIn(el("detail-content"));

      renderTmdbCastSection(item);
      if (mediaType === "tv") renderTmdbEpisodesSection(tmdbId, item.seasons);
      /* 推荐后置：不堵首包 */
      if (item.recommendations && item.recommendations.results) {
        renderTmdbSimilarSection(item, mediaType);
      } else {
        loadTmdbRecommendationsDeferred(tmdbId, mediaType, detailHeroToken);
      }

      if (_pendingTmdbMatches && _pendingTmdbMatches.token === detailHeroToken) {
        fillTmdbMatchSlot(_pendingTmdbMatches.matches, _pendingTmdbMatches.mediaType, _pendingTmdbMatches.token);
      }
    }).catch(function (err) {
      el("detail-screen").classList.remove("detail-loading");
      el("detail-content").innerHTML = '<div class="empty-row" style="padding:30px 16px;">加载详情失败：' + escapeHtml(err.message) +
        '<button class="back-btn focusable" tabindex="0" data-back="1" style="margin-left:10px;">返回</button></div>';
      qs("[data-back]", el("detail-content")).addEventListener("click", function () { history.back(); });
    });
  }

  

  function renderTmdbCastSection(item) {

  function loadTmdbRecommendationsDeferred(tmdbId, mediaType, token) {

  function renderTmdbSimilarSection(item, mediaType) {
    var slot = el("detail-similar");
    if (!slot) return;
    var items = ((item.recommendations && item.recommendations.results) || []).filter(function (it) { return it.poster_path; });
    if (!items.length) { slot.innerHTML = ""; return; }
    var cards = items.slice(0, 20).map(function (it) {
      var mt = tmdbMediaType(it, mediaType);
      var img = tmdbImageUrl(it.poster_path, "w342");
      var rate = it.vote_average ? '<span class="poster-badge">★' + it.vote_average.toFixed(1) + '</span>' : "";
      return '<div class="poster-card focusable" tabindex="0" data-tmdb-id="' + it.id + '" data-media-type="' + mt +
        '" data-title="' + escapeHtml(tmdbName(it) || "") + '" data-year="' + escapeHtml((tmdbDate(it) || "").slice(0, 4)) +
        '" data-poster="' + escapeHtml(img) + '">' +
        '<div class="poster-art"><img data-src="' + img + '" />' + rate + '</div>' +
        '<div class="poster-name">' + escapeHtml(tmdbName(it)) + '</div></div>';
    }).join("");
    slot.innerHTML = '<div class="detail-section-title">相关推荐</div><div class="row-scroll">' + cards + '</div>';
    hydrateImages(slot);
    qsa("[data-tmdb-id]", slot).forEach(function (node) {

  function mediaSourceQualityLabel(ms, idx) {
    function heightToLabel(h) {
      if (h >= 2000) return "4K";
      if (h >= 1440) return "2K";
      if (h >= 1080) return "1080P";
      if (h >= 720) return "720P";
      if (h >= 480) return "480P";
      return h + "P";
    }
    try {
      var streams = ms.MediaStreams || [];
      var v = null;
      for (var i = 0; i < streams.length; i++) { if (streams[i].Type === "Video") { v = streams[i]; break; } }
      var h = v && (v.Height || v.height);
      var w = v && (v.Width || v.width);
      if (!h && w) h = Math.round(w * 9 / 16);
      if (h) return heightToLabel(h);
    } catch (e) {}
    var name = ms.Name || "";
    var m = name.match(/(\d{3,4})\s*[pP]\b/) || name.match(/\b(2160|1440|1080|720|480)\b/);
    if (m) return heightToLabel(parseInt(m[1], 10));
    if (/\b(4k|uhd)\b/i.test(name)) return "4K";
    if (/\b2k\b/i.test(name)) return "2K";
    var codec = (name.match(/\b(HEVC|H\.?265|x265|H\.?264|x264|AV1)\b/i) || [])[0];
    if (codec) return codec.toUpperCase().replace(/\./g, "");
    return "版本 " + ((idx != null ? idx : 0) + 1);
  }

  

  

  function decodeMediaNamePart(str) {
    if (!str) return "";
    var s = String(str).split("?")[0];
    for (var k = 0; k < 3; k++) {
      if (s.indexOf("%") === -1) break;
      try {
        var d = decodeURIComponent(s.replace(/\+/g, " "));
        if (d === s) break;
        s = d;
      } catch (e) { break; }
    }
    return s;
  }
  function mediaNameLooksBad(s) {
    if (!s) return true;
    if (/%[0-9A-Fa-f]{2}/.test(s)) return true;
    if (/mediasource[_-]/i.test(s)) return true;
    return false;
  }
  function mediaSourceFileName(ms) {
    if (!ms) return "";
    var p = ms.Path || "";
    if (p) {
      var base = decodeMediaNamePart(p.replace(/\\/g, "/").split("/").pop() || "");
      if (base && !mediaNameLooksBad(base)) return base;
    }
    var n = decodeMediaNamePart(ms.Name || "");
    if (n && !mediaNameLooksBad(n)) return n;
    return "";
  }
  
  function playMarkLabel(itemName, ms, opts) {
    opts = opts || {};
    var title = (itemName || "").trim();
    var q = (opts.qualityLabel || "").trim();
    if (!q && ms) q = mediaSourceQualityLabel(ms, 0) || "";
    var file = mediaSourceFileName(ms);
    if (title) {
      if (q) return title + " · " + q;
      return title;
    }
    if (q) return q;
    if (file) return file;
    return "播放";
  }

  function humanBitrate(bps) {
    if (!bps) return "";
    return (bps / 1e6).toFixed(1) + " Mbps";
  }
  function humanSize(bytes) {
    if (!bytes) return "";
    return (bytes / 1024 / 1024 / 1024).toFixed(1) + " GB";
  }
  var VIDEO_RANGE_LABEL = {
    HDR10: "HDR10", HDR10PLUS: "HDR10+", DOLBYVISION: "杜比视界", DOVI: "杜比视界", HLG: "HLG", HDRVIVID: "HDR Vivid"
  };
  var AUDIO_CHANNEL_LABEL = { 1: "1.0", 2: "2.0", 6: "5.1", 8: "7.1" };

  

  function mediaSourceHdrLabel(ms) {
    try {
      var streams = ms.MediaStreams || [];
      var v = null;
      for (var i = 0; i < streams.length; i++) { if (streams[i].Type === "Video") { v = streams[i]; break; } }
      if (!v) return "SDR";
      var range = ((v.VideoRangeType || v.VideoRange || "") + "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      return VIDEO_RANGE_LABEL[range] || "SDR";
    } catch (e) { return "SDR"; }
  }


  

  function mediaSourceInfoLine(ms) {
    try {
      var streams = ms.MediaStreams || [];
      var v = null;
      for (var i = 0; i < streams.length; i++) { if (streams[i].Type === "Video") { v = streams[i]; break; } }
      var parts = [mediaSourceQualityLabel(ms)];
      if (v) {
        var range = ((v.VideoRangeType || v.VideoRange || "") + "").toUpperCase().replace(/[^A-Z0-9]/g, "");
        var rangeLabel = VIDEO_RANGE_LABEL[range];
        if (rangeLabel) parts.push(rangeLabel);
        var codec = (v.Codec || "").toUpperCase();
        if (codec) parts.push(codec === "H264" || codec === "H265" ? codec.replace("H", "H.") : codec);
      }
      var bitrate = humanBitrate(ms.Bitrate);
      if (bitrate) parts.push(bitrate);
      var size = humanSize(ms.Size);
      if (size) parts.push(size);
      return parts.filter(Boolean).join(" · ");
    } catch (e) { return mediaSourceQualityLabel(ms); }
  }

  

  function mediaSourceAudioTracks(ms) {
    try {
      var streams = ms.MediaStreams || [];
      var audios = [];
      for (var i = 0; i < streams.length; i++) {
        if (streams[i].Type !== "Audio") continue;
        var a = streams[i];
        var codec = (a.Codec || "").toUpperCase();
        var chLabel = AUDIO_CHANNEL_LABEL[a.Channels] || (a.Channels ? a.Channels + "ch" : "");
        var label = [codec, chLabel].filter(Boolean).join(" ") || ("音轨 " + (audios.length + 1));
        if (a.IsDefault) label += "（默认）";
        audios.push({ index: a.Index, label: label, isDefault: !!a.IsDefault });
      }
      return audios;
    } catch (e) { return []; }
  }

  var tmdbIdCache = {};
  function resolveTmdbId(item, mediaType) {
    if (!item) return Promise.resolve(null);
    var known = item.ProviderIds && (item.ProviderIds.Tmdb || item.ProviderIds.tmdb);
    if (known) return Promise.resolve(known);
    var cacheKey = item.Id;
    if (cacheKey && tmdbIdCache.hasOwnProperty(cacheKey)) return Promise.resolve(tmdbIdCache[cacheKey]);
    var query = encodeURIComponent(item.Name || "");
    var yearParam = item.ProductionYear
      ? "&" + (mediaType === "tv" ? "first_air_date_year" : "year") + "=" + item.ProductionYear
      : "";
    function searchNoYear() {
      if (!yearParam) return Promise.resolve(null); // 本来就没带年份搜，没有再退的余地
      return tmdbGet("/search/" + mediaType + "?query=" + query).then(function (res) {
        return (res && res.results && res.results[0]) ? res.results[0].id : null;
      }).catch(function () { return null; });
    }
    return tmdbGet("/search/" + mediaType + "?query=" + query + yearParam)
      .then(function (res) {
        var id = (res && res.results && res.results[0]) ? res.results[0].id : null;
        if (id != null) return id;
        return searchNoYear();
      })
      .catch(function () { return searchNoYear(); })
      .then(function (id) {
        if (cacheKey) tmdbIdCache[cacheKey] = id;
        return id;
      });

  function bindDetailScrollFx() {
    var screen = el("detail-screen");
    if (!screen || screen.dataset.fxBound) return;
    screen.dataset.fxBound = "1";
    var raf = 0;
    screen.addEventListener("scroll", function () {
      if (raf) return;
      raf = requestAnimationFrame(function () {
        raf = 0;
        var hf = el("detail-hero-fixed");
        if (!hf || !hf.firstChild) return;
        /* 下拉关闭手势占用 transform 时不要抢 */
        if (hf.style.opacity && hf.style.opacity !== "1" && hf.style.opacity !== "") return;
        var hero = qs(".detail-hero", el("detail-content"));
        var h = (hero ? hero.offsetHeight : 0) || screen.clientHeight * 0.64;
        var start = h * 0.04, end = h * 0.62;
        var pct = Math.min(1, Math.max(0, (screen.scrollTop - start) / Math.max(1, end - start)));
        var ease = pct < 0.5 ? 2 * pct * pct : 1 - Math.pow(-2 * pct + 2, 2) / 2;
        /* 上滑页面：海报轻微下移并放大一点，配合压暗模糊 */
        var y = ease * 36;
        var sc = 1 + ease * 0.08;
        hf.style.transform = "translate3d(0," + y.toFixed(1) + "px,0) scale(" + sc.toFixed(4) + ")";
