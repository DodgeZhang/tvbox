</style>
</head>

function listFromInlist(x){if(!x)return[];let arr=[];if(Array.isArray(x)){x.forEach(b=>arr=arr.concat(listFromInlist(b)));return arr}let ts=x.t||[],ids=x.i||[],ty=x.ty||'',gs=x.g||[],qs=x.q||[];ts.forEach((name,n)=>{let q=Array.isArray(qs[n])?qs[n].join(' '):'';arr.push(vod(name,ids[n]||'',ty,((gs[n]||'')+' '+q).trim()))});return arr}
function listFromSearch(x){if(!x||typeof x!=='object')return[];let l=x.l||{},titles=l.title||l.t||[],ids=l.i||l.id||[],ds=l.d||l.dir||[],years=l.year||[];return titles.map((t,i)=>vod(t,ids[i]||'',ds[i]||'mv',years[i]||''))}
async function suggest(tid){let kws={mv:['2025','电影','最新电影'],tv:['剧集','2025','黑袍'],ac:['动漫','星辰变','斗罗'],home:['2025','星辰变','黑袍']}[tid]||[tid],arr=[],seen=new Set();for(let kw of kws){let d=await jsonReq('/res/search_suggest?q='+encodeURIComponent(kw));if(!Array.isArray(d))continue;for(let v of d){let dr=String(v.dir||'mv');if(tid!=='home'&&tid&&dr!==tid)continue;let key=dr+String(v.id||'');if(seen.has(key))continue;seen.add(key);arr.push(vod(v.title||'',v.id||'',dr,v.year||'',v))}if(arr.length>=24)break}return arr}
function renderTabs(){tabs.innerHTML=`<button class="tab ${state.tid==='home'?'active':''}" data-id="home">首页</button>`+CLASSES.map(x=>`<button class="tab ${state.tid===x[0]?'active':''}" data-id="${x[0]}">${x[1]}</button>`).join('');tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tid=b.dataset.id;state.page=1;state.noMore=false;load()})}
function card(v,i){return`<article class="card" data-i="${i}"><div class="poster">${v.vod_pic?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(v.vod_pic)}">`:'<div class="noimg">影</div>'}<span class="badge">${esc(v.vod_remarks||'')}</span></div><div class="meta"><div class="name">${esc(v.vod_name)}</div><div class="remark">${esc(v.vod_remarks||'点击查看')}</div></div></article>`}
function renderGrid(list,append){if(append){var grid=content.querySelector('.grid');if(grid){var frag=document.createDocumentFragment();list.forEach(function(v,i){var div=document.createElement('div');div.innerHTML=card(v,state.last.length+i);var c=div.firstElementChild;c.onclick=function(){openDetail(v)};frag.appendChild(c)});grid.appendChild(frag);state.last=state.last.concat(list)}else{state.last=list;content.innerHTML='<div class="grid">'+list.map(card).join('')+'</div>';content.querySelectorAll('.card').forEach(function(c,i){c.onclick=function(){openDetail(list[i])}})}return}state.last=list;content.innerHTML=list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="empty">暂无内容</div>';content.querySelectorAll('.card').forEach(function(c,i){c.onclick=function(){openDetail(list[i])}})}
function renderPager(){var pager=document.getElementById('pager');if(!pager){pager=document.createElement('div');pager.id='pager';pager.className='pager';content.appendChild(pager)}var prev=state.page>1?'':'disabled',next=state.noMore?'disabled':'';pager.innerHTML='<button id="prevBtn" '+prev+'>上一页</button><span style="color:var(--muted);padding:8px">'+state.page+'</span><button id="nextBtn" '+next+'>下一页</button>';document.getElementById('prevBtn').onclick=function(){if(state.page>1){state.page--;load()}};document.getElementById('nextBtn').onclick=function(){if(!state.noMore){state.page++;load()}}}
async function load(){renderTabs();if(state.loading||state.noMore)return;state.loading=true;if(state.page===1){content.innerHTML='<div class="empty">加载中…</div>';state.last=[]}try{var list=[];if(state.tid==='home'){var h=await req('/');list=listFromInlist(obj(h,'inlist')).slice(0,24);if(!list.length)list=(await suggest('home')).slice(0,24);renderGrid(list,false);renderPager();state.noMore=true;status.textContent='首页'}else{if(state.page===1){var h=await req('/'+state.tid);list=listFromInlist(obj(h,'inlist'));var p=obj(h,'page')||{};state.pageCount=parseInt(p.pages||100)||100;if(!list.length)list=await suggest(state.tid)}else{var d=await jsonReq('/res/change/'+state.tid+'/'+state.page+(state.genre?'?genre='+state.genre:'')+(state.sort?'&sort='+state.sort:''),HOST+'/'+state.tid);list=listFromInlist(d)}if(!list.length||list.length===0||(state.page>1&&state.page>=state.pageCount))state.noMore=true;renderGrid(list,state.page>1);renderPager();status.textContent=(CLASSES.find(function(x){return x[0]===state.tid})||[])[1]+' · 第 '+state.page+' 页 · '+(state.last||list).length+' 条'}}catch(e){content.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}finally{state.loading=false}}
async function search(q){q=clean(q);if(!q)return;renderTabs();content.innerHTML='<div class="empty">搜索中…</div>';try{let h=await req('/search?q='+encodeURIComponent(q));let list=listFromSearch(obj(h,'search'));if(!list.length){let d=await jsonReq('/res/search_suggest?q='+encodeURIComponent(q));list=Array.isArray(d)?d.map(v=>vod(v.title||'',v.id||'',v.dir||'mv',v.year||'',v)):[]}renderGrid(list,false);status.textContent=`搜索：${q} · ${list.length} 条`}catch(e){content.innerHTML='<div class="empty">搜索失败：'+esc(e.message)+'</div>'}}
async function openDetail(v){$('#sheet').classList.add('active');$('#panel').innerHTML='';try{let item=v._raw||b64d(v.vod_id),dr=item.dir||'mv',vid=item.id||'',h=await req(`/${dr}/${vid}`),d=obj(h,'d')||item,down=await jsonReq(`/res/downurl/${dr}/${vid}`,HOST+`/${dr}/${vid}`);let lines=buildLines(down);currentDetail={vod:{vod_id:v.vod_id,vod_name:d.title||item.title||v.vod_name,vod_pic:pic(dr,vid),vod_year:String(d.year||''),vod_area:Array.isArray(d.diqu)?d.diqu.join(' / '):'',vod_actor:Array.isArray(d.zhuyan)?d.zhuyan.join(' / '):'',vod_content:d.summary||'',vod_remarks:String(d.status||v.vod_remarks||'').replace(/<em>|<\/em>/g,'')},lines};let vd=currentDetail.vod,srcPic=vd.vod_pic;$('#panel').innerHTML=`<div class="hero"><img referrerpolicy="no-referrer" src="${esc(srcPic)}" onerror="this.parentElement.style.display='none'"><img class="hero-blur" referrerpolicy="no-referrer" src="${esc(srcPic)}" onerror="this.style.display='none'"></div><div class="detail-body"><img class="title-logo hidden" id="detailLogo"><div class="title">${esc(vd.vod_name)}</div><div class="detail-tags" id="detailTags">${[vd.vod_year,vd.vod_area,vd.vod_remarks].filter(Boolean).map(t=>`<span class="detail-tag">${esc(t)}</span>`).join('')}</div><div class="detail-desc">${esc(vd.vod_content||'暂无简介')}</div><div class="pan-head">网盘资源</div><div class="line-tabs" id="lineTabs"></div><div class="eps" id="eps"></div><div id="detailCast" style="display:none"></div></div>`;$('#backBtn').onclick=closeDetail;if(location.hash!=='#detail')history.pushState({wo:'detail'},'','#detail');(function(){let lt=$('#lineTabs');lines.forEach(function(ln,i){let b=document.createElement('button');b.className='line-tab'+(i===0?' active':'');b.textContent=ln.name+'('+ln.eps.length+')';b.onclick=function(){var tabs=lt.querySelectorAll('.line-tab');for(var j=0;j<tabs.length;j++)tabs[j].classList.remove('active');b.classList.add('active');renderEpisodes(i)};lt.appendChild(b)})})();renderEpisodes(0);loadTmdb(v)}catch(e){$('#panel').innerHTML='<div class="detail-body"><div class="empty">详情失败：'+esc(e.message)+'</div></div>'}}
function buildLines(down){let pf=[];if(!down||typeof down!=='object')return[];let pan=down.panlist||{};if(pan.id){let groups={},tn=pan.tname||[];(pan.url||[]).forEach((u,i)=>{if(!u)return;let tp=parseInt((pan.type||[])[i])||0,name='',title=(pan.name||[])[i]||'网盘链接',pwd=(pan.p||[])[i]||'';if(Number.isInteger(tp)&&tp<tn.length)name=tn[tp];else{let ul=String(u).toLowerCase();if(ul.includes('pan.baidu'))name='百度网盘';else if(ul.includes('pan.xunlei'))name='迅雷网盘';else if(ul.includes('pan.quark'))name='夸克网盘';else if(ul.includes('aliyun')||ul.includes('alipan'))name='阿里网盘';else if(ul.includes('drive.uc'))name='UC网盘';else if(ul.includes('cloud.189'))name='天翼网盘';else if(ul.includes('115.com'))name='115网盘';else if(ul.includes('123pan')||ul.includes('123.cn'))name='123网盘';else name='网盘'}u=String(u).replace(/\\\//g,'/');if(pwd&&!/pwd=/.test(u))u+=((u.includes('?')?'&':'?')+'pwd='+pwd);groups[name]=groups[name]||[];groups[name].push({name:title.replace(/[#\$]/g,' '),url:u,type:'pan'})});Object.keys(groups).forEach(k=>pf.push({name:k,eps:groups[k]}))}let dl=down.downlist&&down.downlist.list||{};if(dl.m){let eps=[];(dl.m||[]).slice(0,80).forEach((m,i)=>{let title=(dl.t||[])[i]||'磁力';eps.push({name:title.replace(/[#\$]/g,' '),url:'magnet:?xt=urn:btih:'+m+'&dn='+encodeURIComponent(title),type:'magnet'})});if(eps.length)pf.push({name:'磁力',eps})}return pf}
function renderEpisodes(idx){let box=$('#eps'),lines=currentDetail&&currentDetail.lines||[],ln=lines[idx];let list=ln&&ln.eps||[];box.innerHTML=list.map((x,i)=>`<button class="ep" data-lineidx="${idx}" data-index="${i}">${esc(x.name)}</button>`).join('')||'<div class="empty">暂无资源</div>';box.querySelectorAll('.ep').forEach(b=>b.onclick=()=>playFull(parseInt(b.dataset.lineidx),parseInt(b.dataset.index),b.textContent))}
async function playFull(lineIdx,index,mark){let d=currentDetail&&currentDetail.vod;if(!d)return;let lines=(currentDetail&&currentDetail.lines)||[],ln=lines[lineIdx],cur=ln&&ln.eps&&ln.eps[index];if(!cur)return;let u=playUrl(cur.url,cur.type);if(window.fm&&cur.type==='pan'){await fm.play(u,d.vod_name+' '+(mark||cur.name));return}if(window.fm&&fm.play){await fm.play(u,d.vod_name+' '+(mark||cur.name));return}location.href=u}
function playUrl(u,type){u=String(u||'');if(type==='pan'&&u.startsWith('http'))return u.startsWith('push://')?u:'push://'+u;return u}
