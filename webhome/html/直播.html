    try{
      var j = await req('https://udblgn.huya.com/web/anonymousLogin', {

          'Content-Type':'application/json',

        responseType:'json',

      });

        _huyaAnonUid = String(uid);
        _huyaAnonUidTs = now;
        return _huyaAnonUid;

    }catch(e){}
    // 兜底：用相对稳定的大整数，比纯随机略好，但仍可能被限时

  function huyaUuid(){
    // 官方算法近似：(Date.now() % 1e10 * 1e3 + random) % 0xffffffff
    var now = Date.now();
    return String(Math.floor(((now % 10000000000) * 1000 + (Math.random()*1000|0)) % 4294967295));
  }
  // pure_live processAnticode：uid 需做 32 位旋转后再参与签名，否则 CDN 约几十秒断流
  function huyaConvertUid(uid){
    var n = Number(uid) || 0;
    // JS 位运算是 32 位有符号，用 >>>0 转无符号
    return (((n << 8) | (n >>> 24)) >>> 0);
  }
  function huyaPickRatio(){
    // prefs.rate: 0原画 1流畅 2高清 3超清 4蓝光 — 对应 ratio 码率
    var rate = String(prefs.rate || '0');
    if(rate === '1') return 500;   // 流畅
    if(rate === '2') return 2000;  // 高清
    if(rate === '3') return 4000;  // 超清
    if(rate === '4') return 8000;  // 蓝光近似
    return 0; // 原画：不带 ratio 或 ratio=0

  async function buildHuyaUrl(baseUrl, streamName, anticode, ext){
    ext = ext || 'flv';
    var q = {};
    (anticode||'').split('&').forEach(function(kv){
      var i = kv.indexOf('=');
      if(i > 0){
        var k = kv.slice(0,i), v = kv.slice(i+1);
        try{ q[k] = decodeURIComponent(v); }catch(e){ q[k] = v; }
      }
    });
    var rawUid = await getHuyaAnonUid();
    var uidNum = Number(rawUid) || 0;
    var convertUid = huyaConvertUid(uidNum);
    var wsTime = q.wsTime || (Math.floor(Date.now()/1000) + 21600).toString(16);
    // pure_live: seqId = Date.now() + uid
    var seqid = String(Date.now() + uidNum);
    var ct = 'huya_live'; // pure_live 强制 huya_live
    var tVal = '100';
    var fmRaw = q.fm || '';
    var fm0 = '';
    try{ fm0 = b64decode(fmRaw); }catch(e){ fm0 = ''; }
    if(!fm0 && fmRaw){
      try{ fm0 = b64decode(decodeURIComponent(fmRaw)); }catch(e){}
    }
    var wsSecretPrefix = (fm0.split('_')[0]) || '';
    var ss = md5(seqid + '|' + ct + '|' + tVal);
    // 关键：签名里用 convertUid，不是原始 uid
    var wsSecret = wsSecretPrefix
      ? md5(wsSecretPrefix + '_' + convertUid + '_' + streamName + '_' + ss + '_' + wsTime)
      : (q.wsSecret || '');
    // uuid 算法对齐 pure_live
    var ctMs = (parseInt(wsTime, 16) + Math.random()) * 1000;
    var uuid = String(Math.floor(((ctMs % 1e10) + Math.random()) * 1e3) & 0xFFFFFFFF);
    var now = new Date();
    var pad = function(n){ return n < 10 ? '0'+n : ''+n; };
    var sv = '' + now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + pad(now.getHours());
    var timeStamp = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())
      +'_'+pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds())+'.'
      + String(now.getMilliseconds()).padStart(3,'0');

    var params = [
      'wsSecret=' + wsSecret,
      'wsTime=' + wsTime,
      'seqid=' + seqid,
      'ctype=' + ct,
      'ver=1',
      'fs=' + encodeURIComponent(q.fs || ''),
      't=' + tVal,
      'u=' + convertUid,
      'uuid=' + uuid,
      'sdk_sid=' + Date.now(),
      'codec=264',
      'sv=' + sv,
      'dMod=mseh-0',
      'sdkPcdn=1_1',
      'a_block=0',
      'timeStamp=' + encodeURIComponent(timeStamp)
    ];
    // 画质：设置里的清晰度 → ratio
    var ratio = huyaPickRatio();
    if(ratio > 0) params.push('ratio=' + ratio);
    else if(q.ratio !== undefined && q.ratio !== '' && Number(q.ratio) > 0) params.push('ratio=' + q.ratio);

    // 统一 https
    var base = String(baseUrl || '');
    if(base.indexOf('//') === 0) base = 'https:' + base;
    if(base.indexOf('http://') === 0) base = 'https://' + base.slice(7);
    base = base.replace(/\/$/, '');
    return base + '/' + streamName + '.' + ext + '?' + params.join('&');
  }
  function digStreams(obj, d){
    d = d||0; if(!obj || d>12 || typeof obj!=='object') return null;
    if(obj.gameStreamInfoList && obj.gameStreamInfoList.length) return obj.gameStreamInfoList;
    if(Object.prototype.toString.call(obj)==='[object Array]'){
      for(var i=0;i<obj.length;i++){ var r=digStreams(obj[i],d+1); if(r)return r; }
      return null;
    }
    for(var k in obj){ if(obj.hasOwnProperty(k)){ var r2=digStreams(obj[k],d+1); if(r2)return r2; } }
    return null;
  }
  async function huyaParseStreamsFromHtml(html){
    var streams = null;
    var m1 = html.match(/"stream":\s*"([A-Za-z0-9+/=]{50,})"/);
    if(m1){ try{ var o=JSON.parse(b64decode(m1[1])); streams = digStreams(o); }catch(e){} }
    if(!streams){
      var m2 = html.match(/window\.HNF_GLOBAL_INIT\s*=\s*(\{[\s\S]*?\})\s*<\/script>/);
      if(m2){
        try{
          var raw = m2[1];
          // HNF_GLOBAL_INIT 有时是 {...} 无外层，正则已含括号则直接 parse
          var g = JSON.parse(raw.charAt(0)==='{' ? raw : ('{'+raw+'}'));
          streams = digStreams(g);
        }catch(e){}
      }
    }
    if(!streams){
      var m3 = html.match(/hyPlayerConfig\s*=\s*(\{[\s\S]*?\});/);
      if(m3){ try{ streams=digStreams(JSON.parse(m3[1])); }catch(e){} }
    }
    if(!streams){
      var m4 = html.match(/"gameStreamInfoList"\s*:\s*(\[[\s\S]*?\])/);
      if(m4){ try{ streams=JSON.parse(m4[1]); }catch(e){} }
    }
    if(!streams || !streams.length){
      function pick(re){ var mm=html.match(re); return mm?mm[1]:''; }
      function unicode(t){ return String(t).replace(/\\u002[fF]/g,'/').replace(/\\\//g,'/').replace(/\\u0026/g,'&'); }
      var hlsUrl  = unicode(pick(/"sHlsUrl":\s*"([^"]+)"/));
      var name    = unicode(pick(/"sStreamName":\s*"([^"]+)"/));
      var hlsAnti = unicode(pick(/"sHlsAntiCode":\s*"([^"]*)"/));
      var flvUrl  = unicode(pick(/"sFlvUrl":\s*"([^"]+)"/));
      var flvAnti = unicode(pick(/"sFlvAntiCode":\s*"([^"]*)"/));
      if(name && (flvUrl || hlsUrl)){
        streams = [{ sHlsUrl:hlsUrl, sStreamName:name, sHlsAntiCode:hlsAnti, sFlvUrl:flvUrl, sFlvAntiCode:flvAnti }];
      }
    }
    return streams;
  }
  async function huyaStream(rid){
    rid = String(rid);
    var streams = null;
    // 1) 移动页
    try{
      var html = await req('https://m.huya.com/' + rid, {
        referer: 'https://m.huya.com/',
        headers: { 'User-Agent': HUYA_SDK_UA || PC_UA, 'Referer': 'https://m.huya.com/' }
      });
      streams = await huyaParseStreamsFromHtml(html);
    }catch(e){}
    // 2) PC 页兜底
    if(!streams || !streams.length){
      try{
        var html2 = await req('https://www.huya.com/' + rid, {
          referer: 'https://www.huya.com/',
          headers: { 'User-Agent': PC_UA, 'Referer': 'https://www.huya.com/' },
          pc: true
        });
        streams = await huyaParseStreamsFromHtml(html2);
      }catch(e){}
    }
    // 3) profileRoom 接口
    if(!streams || !streams.length){
      try{
        var j = await req('https://mp.huya.com/cache.php?m=Live&do=profileRoom&roomid=' + encodeURIComponent(rid), {
          responseType:'json', pc:true, referer:'https://www.huya.com/',
          headers: { 'User-Agent': PC_UA, 'Referer': 'https://www.huya.com/' }
        });
        var data = j && (j.data || j);
        streams = digStreams(data);
      }catch(e){}
    }
    if(!streams || !streams.length) throw new Error('无流');

    function fixProto(u){
      if(!u) return u;
      u = String(u);
      if(u.indexOf('//')===0) return 'https:'+u;
      if(u.indexOf('http://')===0) return 'https:'+u.slice(5);
      return u;
    }
    // 优先有 FLV 的线路，多线路取第一条有效
    var candidates = [];
    for(var i=0;i<streams.length;i++){
      var s = streams[i];
      if(s.sFlvUrl && s.sStreamName) candidates.push({ base:s.sFlvUrl, name:s.sStreamName, anti:s.sFlvAntiCode||'', ext:'flv' });
    }
    for(var j=0;j<streams.length;j++){
      var s2 = streams[j];
      if(s2.sHlsUrl && s2.sStreamName) candidates.push({ base:s2.sHlsUrl, name:s2.sStreamName, anti:s2.sHlsAntiCode||'', ext:'m3u8' });
    }
    if(!candidates.length) throw new Error('流地址字段缺失');

    var lastErr = null;
    for(var c=0;c<candidates.length;c++){
      try{
        var item = candidates[c];
        var url = await buildHuyaUrl(fixProto(item.base), item.name, item.anti, item.ext);
        if(item.ext === 'm3u8') return { url:url, format:'application/x-mpegURL' };
        return { url:url };
      }catch(e){ lastErr = e; }
    }
    throw lastErr || new Error('取流失败');
  }

  /* 斗鱼取流：getEncryption + getH5PlayV1，优先高权重 CDN */
  async function douyuStream(rid){
    var did = '10000000000000000000000000001501';
    var tt = Math.floor(Date.now() / 1000);
    var rate = prefs.rate || '0';
    var realRid = String(rid);

    try {
      var info = await req('https://www.douyu.com/betard/' + realRid, {
        responseType:'json', pc:true, referer:'https://www.douyu.com/'
      });
      var room = info && info.room;
      if(room){
        if(room.room_id) realRid = String(room.room_id);
        if(+room.show_status === 2) throw new Error('房间未开播');
      }
    } catch(e){
      if(e && /未开播/.test(e.message||'')) throw e;
    }

    var enc = await req('https://www.douyu.com/wgapi/livenc/liveweb/websec/getEncryption?did=' + did, {
      responseType:'json', pc:true, referer:'https://www.douyu.com/'
    });
    if(!enc || enc.error !== 0 || !enc.data) throw new Error('加密参数失败：' + ((enc&&enc.msg)||''));
    var ed = enc.data;
    var key = ed.key || '';
    var randStr = ed.rand_str || '';
    var encTime = parseInt(ed.enc_time, 10) || 1;
    var isSpecial = parseInt(ed.is_special, 10) || 0;
    var encData = ed.enc_data || '';
    var signStr = (isSpecial === 1) ? '' : (realRid + String(tt));
    var auth = randStr;
    for(var i = 0; i < encTime; i++) auth = md5(auth + key);
    auth = md5(auth + key + signStr);

    // 偏好 CDN：先试平台返回的高权重，再试常见高速节点
    var preferCdns = ['hw-h5', 'ws-h5', 'tct-h5', 'ali-h5', 'hs-h5', ''];

    async function playOnce(cdn){
      // pure_live getH5PlayV1：rate 0=原画，其余为平台 multirates 码率档
      var rateNum = String(rate || '0');
      if(rateNum === '4') rateNum = '0'; // 蓝光按原画请求
      var body = 'enc_data=' + encodeURIComponent(encData)
        + '&tt=' + tt
        + '&did=' + encodeURIComponent(did)
        + '&auth=' + encodeURIComponent(auth)
        + '&cdn=' + encodeURIComponent(cdn || '')
        + '&rate=' + encodeURIComponent(rateNum)
        + '&hevc=0&fa=0&ive=0';
      var j = await req('https://www.douyu.com/lapi/live/getH5PlayV1/' + realRid, {
        method:'POST',
        headers:{
          'Content-Type':'application/x-www-form-urlencoded',
          'User-Agent': PC_UA,
          Referer: 'https://www.douyu.com/' + realRid,
          Origin: 'https://www.douyu.com'
        },
        body: body,
        responseType:'json',
        pc:true
      });
      return j;
    }

    function pickUrl(d){
      if(!d) return null;
      if(d.rtmp_url && d.rtmp_live){
        var url = String(d.rtmp_url).replace(/\/$/, '') + '/' + d.rtmp_live;
        if(/\.xs(\?|$)/.test(url)) url = url.replace(/\.xs/, '.flv');
        return { url: url, cdn: d.rtmp_cdn || '', rate: d.rate };
      }
      if(d.hls_url) return { url: d.hls_url, format:'application/x-mpegURL', cdn: d.rtmp_cdn || '' };
      return null;
    }

    // 第一轮：空 cdn，拿平台默认 + cdnsWithName
    var first = await playOnce('');
    if(first && first.error === 0 && first.data){
      var cdns = first.data.cdnsWithName || [];
      // 按 re-weight 从高到低
      cdns = cdns.slice().sort(function(a,b){ return (b['re-weight']||0) - (a['re-weight']||0); });
      var ordered = [];
      cdns.forEach(function(c){ if(c && c.cdn && ordered.indexOf(c.cdn) < 0) ordered.push(c.cdn); });
      preferCdns.forEach(function(c){ if(ordered.indexOf(c) < 0) ordered.push(c); });

      // 先用默认结果
      var best = pickUrl(first.data);
      // 若列表里有更高权重且与默认不同，再请求一次该 CDN
      if(ordered.length && ordered[0] && ordered[0] !== (first.data.rtmp_cdn || '')){
        try {
          var second = await playOnce(ordered[0]);
          if(second && second.error === 0 && second.data){
            var alt = pickUrl(second.data);
            if(alt && alt.url) best = alt;
          }
        } catch(e2) {}
      }
      if(best && best.url) return best;
    }

    // 兜底逐个 CDN
    for(var k = 0; k < preferCdns.length; k++){
      try {
        var jj = await playOnce(preferCdns[k]);
        if(jj && jj.error === 0){
          var u = pickUrl(jj.data);
          if(u && u.url) return u;
        }
      } catch(e3) {}
    }

    var msg = (first && (first.msg || ('error=' + first.error))) || '无流地址';
    throw new Error('斗鱼取流失败：' + msg);
  }

  /* 从分区页 HTML 抠房间（官方 category/{id} 转义 JSON） */
  function dyParseCategoryHtml(html){
    if(!html || typeof html !== 'string') return [];
    var rooms = [], seen = {}, re, m, rid, title, cover, block, idx, nm, vm, fm;

    function unesc(s){
      if(!s) return '';
      return String(s)
        .replace(/\\u0026/g, '&')
        .replace(/\\u003c/g, '<')
        .replace(/\\u003e/g, '>')
        .replace(/\\u002F/gi, '/')
        .replace(/\\\//g, '/')
        .replace(/\\"/g, '"')
        .replace(/\\\\/g, '\\');
    }

    // \"id_str\":\"19位\",\"title\":\"标题\"
    re = /\\"id_str\\":\\"(\d{19})\\",\\"title\\":\\"([^\\]*)\\"/g;
    while((m = re.exec(html))){
      rid = m[1];
      if(seen[rid]) continue;
      title = unesc(m[2]) || '(抖音直播)';
      if(isSpam(title)) continue;
      seen[rid] = 1;

      idx = m.index;
      block = html.slice(idx, idx + 3500);
      cover = '';
      // cover url_list 第一项（URL 内含 \u0026）
      fm = block.match(/\\"url_list\\":\[\\"(.*?)\\"/);
      if(fm) cover = unesc(fm[1]);

      var author = '';
      nm = block.match(/\\"nickname\\":\\"([^\\]*)\\"/);
      if(nm) author = unesc(nm[1]);

      var views = '';
      vm = block.match(/\\"user_count_str\\":\\"([^"\\]+)\\"/)
        || block.match(/\\"total_user_str\\":\\"([^"\\]+)\\"/);
      if(vm) views = vm[1];

      // 顺带缓存最高清 flv，减少二次请求（可选）
      var flv = '';
      fm = block.match(/\\"FULL_HD1\\":\\"(https?:.*?)\\"/)
        || block.match(/\\"ORIGION\\":\\"(https?:.*?)\\"/)
        || block.match(/\\"HD1\\":\\"(https?:.*?)\\"/);
      if(fm) flv = unesc(fm[1]);

      rooms.push({
        kind:'live', rid:rid,
        title: title,
        author: author,
        pic: cover,
        views: hot(views || 0),
        cate: '',
        live:true,
        _dyFlv: flv || undefined
      });
    }
    return rooms;
  }

  function dyPickQuality(flvMap){
    if(!flvMap || typeof flvMap !== 'object') return null;
    var rate = String(prefs.rate || '0');
    var order;
    if(rate === '1') order = ['SD1','SD2','HD1','FULL_HD1','ORIGION','ORIGIN'];
    else if(rate === '2') order = ['SD2','HD1','FULL_HD1','SD1','ORIGION','ORIGIN'];
    else if(rate === '3') order = ['HD1','FULL_HD1','SD2','ORIGION','ORIGIN','SD1'];
    else if(rate === '4') order = ['FULL_HD1','ORIGION','ORIGIN','HD1','SD2','SD1'];
    else order = ['ORIGION','ORIGIN','FULL_HD1','HD1','SD2','SD1'];
    var i, k, keys = Object.keys(flvMap);
    for(i=0;i<order.length;i++){
      k = order[i];
      if(flvMap[k]) return flvMap[k];
    }
    return keys.length ? flvMap[keys[0]] : null;
  }
  function dyFixUrl(url){
    if(!url) return '';
    url = String(url);
    if(url.indexOf('//') === 0) url = 'https:' + url;
    if(url.indexOf('http://') === 0) url = 'https://' + url.slice(7);
    return url;
  }

  function dyExtractFromStreamUrl(su){
    if(!su || typeof su !== 'object') return null;
    // flv_pull_url map
    var url = dyPickQuality(su.flv_pull_url || {});
    if(url) return { url: dyFixUrl(url) };
    // hls map
    if(su.hls_pull_url_map){
      var h = dyPickQuality(su.hls_pull_url_map);
      if(h) return { url: dyFixUrl(h), format:'application/x-mpegURL' };
    }
    if(su.hls_pull_url) return { url: dyFixUrl(su.hls_pull_url), format:'application/x-mpegURL' };
    // pure_live: stream_data JSON → data[sdk_key].main.flv/hls
    try{
      var raw = su.live_core_sdk_data && su.live_core_sdk_data.pull_data && su.live_core_sdk_data.pull_data.stream_data;
      if(!raw && su.stream_data) raw = su.stream_data;
      if(typeof raw === 'string' && raw.charAt(0) === '{'){
        var sd = JSON.parse(raw);
        var data = (sd && sd.data) || sd;
        var rate = String(prefs.rate || '0');
        var keys = rate === '1' ? ['sd','ld','hd','origin','orignal']
                 : rate === '2' ? ['hd','sd','origin','orignal','ld']
                 : rate === '3' ? ['hd','origin','orignal','sd','ld']
                 : ['origin','orignal','hd','sd','ld'];
        // 也尝试 qualities 里的 sdk_key
        var extraKeys = Object.keys(data || {});
        keys = keys.concat(extraKeys);
        for(var i=0;i<keys.length;i++){
          var node = data[keys[i]];
          if(!node || !node.main) continue;
          if(node.main.flv) return { url: dyFixUrl(node.main.flv) };
          if(node.main.hls) return { url: dyFixUrl(node.main.hls), format:'application/x-mpegURL' };
        }
      }
    }catch(e){}
    return null;
  }

      try {
        j = await req(tries[i], { responseType:'json', headers: dyHdr(), timeout: 25, referer:'https://live.douyin.com/' });
        var room = null;
        if(j && j.data){
          room = j.data.room || (j.data.data && (j.data.data.room || j.data.data[0])) || null;
          if(!room && j.data.data && j.data.data.enter_room_id){

            var rooms = (j.data.data && j.data.data.data) || [];
            if(rooms[0] && rooms[0].room) room = rooms[0].room;

        if(room){

        if(e && /未开播/.test(e.message||'')) throw e;

        headers: dyHdr(), referer:'https://live.douyin.com/', timeout: 25
      });
      var pageStr = String(page);

      if(flv){
        var u = flv[0].replace(/\\u002F/g,'/').replace(/\\u0026/g,'&').replace(/&amp;/g,'&');
        return { url: dyFixUrl(u) };
      }
      var m3u = pageStr.match(/https?:\/\/[^\s"'\\]+\.m3u8[^\s"'\\]*/i);
      if(m3u){
        var u2 = m3u[0].replace(/\\u002F/g,'/').replace(/\\u0026/g,'&');
        return { url: dyFixUrl(u2), format:'application/x-mpegURL' };
      }
    }catch(e){ lastErr = e; }
    var msg = lastErr && lastErr.message ? String(lastErr.message) : '无流地址';
    if(/代理|proxy|非JSON/i.test(msg)) throw new Error('抖音取流被拦截或需代理');

        if(j && j.code === 0 && j.data){
          var arr = [], seen = {}, mods = j.data.room_list || [];
          var rec = j.data.recommend_room_list || [];
          collectBili(rec).forEach(function(r){ if(!seen[r.rid]){ seen[r.rid]=1; arr.push(r); } });
          mods.forEach(function(mod){
            collectBili(mod.list || []).forEach(function(r){
              if(!seen[r.rid]){ seen[r.rid]=1; arr.push(r); }
            });
          });
          if(arr.length) return { items: arr, more: false };
        }
      } catch(e) {}
      // 实测稳定：get_user_recommend
      try {
        var jr = await req('https://api.live.bilibili.com/room/v1/room/get_user_recommend?page=' + page + '&page_size=30', {
          responseType:'json', headers: hdr, pc:true
        });
        if(jr && (jr.code === 0 || jr.msg === 'ok') && jr.data){
          var listR = Array.isArray(jr.data) ? jr.data : (jr.data.list || []);
          var arrR = collectBili(listR);
          if(arrR.length) return { items: arrR, more: arrR.length >= 20 };
        }
      } catch(e) {}
    }

    // 分区: parent-area
    var parent = 0, area = 0;
    if(/^\d+-\d+$/.test(String(cate))){
      var parts = String(cate).split('-');
      parent = parseInt(parts[0], 10) || 0;
      area = parseInt(parts[1], 10) || 0;
    }

    // 优先旧接口 getRoomList（无 Cookie 也可用）；second/getList 易 -352 放最后
    var urls = [];
    if(area > 0){
      urls.push('https://api.live.bilibili.com/room/v1/area/getRoomList?area_id=' + area + '&sort_type=online&page_size=30&page_no=' + page);
    } else if(parent > 0){
      urls.push('https://api.live.bilibili.com/room/v1/area/getRoomList?parent_area_id=' + parent + '&area_id=0&sort_type=online&page_size=30&page_no=' + page);
      urls.push('https://api.live.bilibili.com/room/v1/area/getRoomList?parent_area_id=' + parent + '&cate_id=0&area_id=0&sort_type=online&page=1&page_size=30&page_no=' + page);
    } else {
      urls.push('https://api.live.bilibili.com/room/v1/room/get_user_recommend?page=' + page + '&page_size=30');
    }
    urls.push('https://api.live.bilibili.com/xlive/web-interface/v1/second/getList?platform=web&parent_area_id=' + (parent||2) + '&area_id=' + area + '&sort_type=online&page=' + page + '&page_size=30');

    var lastErr = null, i, j2, arr2;
    for(i=0;i<urls.length;i++){
      try {
        j2 = await req(urls[i], { responseType:'json', headers: hdr, pc:true });
        if(!j2) continue;
        if(j2.code !== 0 && j2.code !== undefined && j2.code !== '0'){ lastErr = new Error(j2.message || ('code '+j2.code)); continue; }
        var data = j2.data;
        var list = [];
        if(Array.isArray(data)) list = data;
        else if(data) list = data.list || data.recommend_room_list || [];
        arr2 = collectBili(list);
        if(arr2.length) return { items: arr2, more: arr2.length >= 20 };
      } catch(e){ lastErr = e; }
    }
    if(lastErr) throw lastErr;
    return { items: [], more: false };
  }

  async function biliStream(rid){
    var realRid = String(rid);
    var hdr = await biliHdr();
    // 短号转长号
    try {
      var init = await req('https://api.live.bilibili.com/room/v1/Room/room_init?id=' + encodeURIComponent(realRid), {
        responseType:'json', headers: hdr, pc:true
      });
      if(init && init.code === 0 && init.data){
        if(+init.data.live_status === 0) throw new Error('房间未开播');
        if(init.data.room_id) realRid = String(init.data.room_id);
      }
    } catch(e){
      if(e && /未开播/.test(e.message||'')) throw e;
    }

    var qn = biliQn();
    function pickFromPlayInfo(j2){
      if(!j2 || j2.code !== 0 || !j2.data) return null;
      var streams = (((j2.data.playurl_info || {}).playurl || {}).stream) || [];
      var urls = [];
      for(var si=0; si<streams.length; si++){
        var formats = streams[si].format || [];
        for(var fi=0; fi<formats.length; fi++){
          var codecs = formats[fi].codec || [];
          var fname = formats[fi].format_name || '';
          for(var ci=0; ci<codecs.length; ci++){
            var c = codecs[ci];
            var base = c.base_url || '';
            var infos = c.url_info || [];
            for(var ui=0; ui<infos.length; ui++){
              var host = infos[ui].host || '';
              var extra = infos[ui].extra || '';
              if(base && host){
                var url = host + base + extra;
                if(url.indexOf('http') === 0){
                  urls.push({
                    url: url,
                    hls: /\.m3u8/.test(url) || fname === 'ts' || fname === 'fmp4',
                    mcdn: /mcdn|szbdyd|\.edge\.|szext|\bxy\d/i.test(url)
                  });
                }
              }
            }
          }
        }
      }
      if(!urls.length) return null;
      // 优先非 mcdn，再优先 HLS（播放器兼容更好）
      urls.sort(function(a,b){
        var am = a.mcdn?1:0, bm = b.mcdn?1:0;
        if(am !== bm) return am - bm;
        return (b.hls?1:0) - (a.hls?1:0);
      });
      var best = urls[0];
      return best.hls ? { url:best.url, format:'application/x-mpegURL' } : { url:best.url };
    }

    // 多组参数轮询：web + html5，codec 全开
    var playUrls = [
      'https://api.live.bilibili.com/xlive/web-room/v2/index/getRoomPlayInfo?room_id=' + encodeURIComponent(realRid)
        + '&protocol=0,1&format=0,1,2&codec=0,1&qn=' + qn + '&platform=web&ptype=8',
      'https://api.live.bilibili.com/xlive/web-room/v2/index/getRoomPlayInfo?room_id=' + encodeURIComponent(realRid)
        + '&protocol=0,1&format=0,1,2&codec=0,1&qn=' + qn + '&platform=html5&dolby=5',
      'https://api.live.bilibili.com/xlive/web-room/v2/index/getRoomPlayInfo?room_id=' + encodeURIComponent(realRid)
        + '&protocol=0,1&format=0,1,2&codec=0&platform=html5&dolby=5&qn=' + qn
    ];
    var i, j2, picked;
    for(i=0;i<playUrls.length;i++){
      try {
        j2 = await req(playUrls[i], { responseType:'json', headers: hdr, pc:true });
        picked = pickFromPlayInfo(j2);
        if(picked) return picked;
      } catch(e) {}
    }

    // 旧 playUrl 兜底
    var j = await req(
      'https://api.live.bilibili.com/room/v1/Room/playUrl?cid=' + encodeURIComponent(realRid) + '&qn=' + qn + '&platform=web',
      { responseType:'json', headers: hdr, pc:true }
    );
    if(j && j.code === 0){
      var durl = (j.data && j.data.durl) || [];
      if(durl.length && durl[0].url){
        var url = durl[0].url;
        if(/\.m3u8/.test(url)) return { url:url, format:'application/x-mpegURL' };
        return { url:url };
      }
    }
    throw new Error((j && j.message) || 'B站取流失败');
  }

  function ksPickFromPlayUrls(playUrls){
    if(!playUrls) return null;
    var reps = [];
    // 结构1: [{ adaptationSet: { representation: [...] } }]
    if(Array.isArray(playUrls)){
      playUrls.forEach(function(p){
        var r = (p.adaptationSet || {}).representation || [];
        reps = reps.concat(r);
      });
    } else if(typeof playUrls === 'object'){
      // 结构2: { h264: { adaptationSet... }, hevc: ... } 或直接 representation
      ['h264','hevc','H264','HEVC'].forEach(function(k){
        var node = playUrls[k];
        if(!node) return;
        if(node.adaptationSet && node.adaptationSet.representation)
          reps = reps.concat(node.adaptationSet.representation);
        else if(Array.isArray(node.representation))
          reps = reps.concat(node.representation);
      });
      if(playUrls.adaptationSet && playUrls.adaptationSet.representation)
        reps = reps.concat(playUrls.adaptationSet.representation);
      if(Array.isArray(playUrls.representation))
        reps = reps.concat(playUrls.representation);
    }
    if(!reps.length) return null;

    var rate = String(prefs.rate || '0');
    var order;
    if(rate === '1') order = ['STANDARD','HIGH','SUPER','BLUE_RAY','BLUERAY'];
    else if(rate === '2') order = ['HIGH','SUPER','BLUE_RAY','STANDARD'];
    else if(rate === '3') order = ['SUPER','BLUE_RAY','HIGH','STANDARD'];
    else order = ['BLUE_RAY','BLUERAY','SUPER','HIGH','STANDARD']; // 原画/蓝光优先

    var map = {};
    reps.forEach(function(r){
      if(r && r.url) map[String(r.qualityType || r.quality || '').toUpperCase()] = r.url;
    });
    var i, k, url;
    for(i=0;i<order.length;i++){
      k = order[i];
      if(map[k]){ url = map[k]; break; }
    }
    if(!url){
      // 按 level 最大
      reps.sort(function(a,b){ return (b.level||0) - (a.level||0); });
      url = reps[0] && reps[0].url;
    }
    if(!url) return null;
    if(url.indexOf('//') === 0) url = 'https:' + url;
    if(url.indexOf('http://') === 0) url = 'https://' + url.slice(7);
    return { url: url };
  }

  async function ksStream(rid){
    var realRid = String(rid);
    var cached = _ksCache[realRid];

    // 1) 列表缓存的 playUrls
    if(cached && cached._ksPlay){
      var s1 = ksPickFromPlayUrls(cached._ksPlay);
      if(s1 && s1.url) return s1;
    }

    // 2) livedetail by principalId (author)
    var authors = [];
    if(cached && cached._ksAuthor) authors.push(cached._ksAuthor);
    authors.push(realRid);
    var i, j, ls, s2;
    for(i=0;i<authors.length;i++){
      try {
        j = await req(
          'https://live.kuaishou.com/live_api/liveroom/livedetail?principalId=' + encodeURIComponent(authors[i]),
          { responseType:'json', headers: ksHdr(), pc:true, timeout: 25 }
        );
        ls = j && j.data && j.data.liveStream;
        if(ls){
          s2 = ksPickFromPlayUrls(ls.playUrls || ls.playUrl);
          if(s2 && s2.url) return s2;
          // 有时只有 multi 字段
          if(ls.multiResolutionHlsPlayUrls){
            // 取最高一档
            var multi = ls.multiResolutionHlsPlayUrls;
            var keys = Object.keys(multi);
            if(keys.length){
              var last = multi[keys[keys.length-1]];
              var urls = (last && last.urls) || [];
              if(urls[0] && urls[0].url){
                var u = urls[0].url;
                if(u.indexOf('http://')===0) u='https://'+u.slice(7);
                return { url:u, format:'application/x-mpegURL' };
              }
            }
          }
        }
      } catch(e) {}
    }

    // 3) 热门列表里再找同 id
    try {
      var feed = await req('https://live.kuaishou.com/live_api/hot/list?page=1', {
        responseType:'json', headers: ksHdr(), pc:true
      });
      var list = (feed && feed.data && feed.data.list) || [];
      for(i=0;i<list.length;i++){
        if(String(list[i].id) === realRid){
          s2 = ksPickFromPlayUrls(list[i].playUrls);
          if(s2 && s2.url) return s2;
        }
      }
    } catch(e2) {}

    throw new Error('快手取流失败（可能未开播或需代理）');
  }

  async function fetchHuyaCate(){

      { id:'1', name:'网游' }, { id:'2', name:'单机' },
      { id:'8', name:'娱乐' }, { id:'3', name:'手游' }
    ];
    var tree = [{ g:'', name:'推荐', children:[] }];
    var flat = [{ g:'', name:'推荐' }];
    for(var i=0;i<parents.length;i++){

          responseType:'json', pc:true, referer:'https://www.huya.com/'

        if(j && j.data && !Array.isArray(j.data)) list = j.data.vGameList || j.data.gameList || j.data.list || [];
        var kids = [];
        for(var k=0;k<list.length;k++){

    var j = await req('https://api.live.bilibili.com/room/v1/Area/getList', {
      responseType:'json', pc:true, referer:'https://live.bilibili.com/',
      headers: { 'User-Agent': PC_UA, 'Referer':'https://live.bilibili.com/' }
    });
    if(!j || (j.code !== 0 && j.code !== undefined)) return null;
    var data = j.data || [];
    if(!data.length) return null;
    var tree = [{ g:'0-0', name:'推荐', children:[] }];
    var flat = [{ g:'0-0', name:'推荐' }];
    for(var i=0;i<data.length;i++){
      var p = data[i];
      var kids = [];
      var list = p.list || [];
      for(var k=0;k<list.length;k++){
        var it = list[k];
        var g = String(p.id) + '-' + String(it.id);
        var nm = it.name || '';
        if(!nm) continue;
        kids.push({ g:g, name:nm });
        flat.push({ g:g, name:nm });
      }
      tree.push({ g:'p:'+p.id, name:p.name || ('分区'+p.id), children:kids });
    }
    return { tree:tree, flat:flat };
  }

  async function fetchDouyinCate(){
    // pure_live：从 live.douyin.com 首页 HTML 解析 categoryData
    try{
      var html = await req('https://live.douyin.com/?from_nav=1', {
        pc:true, referer:'https://live.douyin.com/',
        headers: { 'User-Agent': PC_UA, 'Referer':'https://live.douyin.com/' }
      });
      var marker = '{"pathname":"/","categoryData":';
      var idx = String(html).indexOf(marker);
      if(idx < 0) marker = '\\"pathname\\":\\"/\\",\\"categoryData\\":';
      idx = String(html).indexOf('categoryData');
      if(idx < 0) return null;
      // 尝试在 RENDER_DATA 或类似块中找
      var m = String(html).match(/categoryData"\s*:\s*(\[[\s\S]*?\])\s*[,}]/);
      if(!m) m = String(html).match(/"categoryData":(\[[\s\S]*?\])\s*[,}]/);
      if(!m) return null;
      var data;
      try{ data = JSON.parse(m[1]); }catch(e){
        try{ data = JSON.parse(m[1].replace(/\\"/g,'"').replace(/\\\\/g,'\\')); }catch(e2){ return null; }
      }
      if(!Array.isArray(data) || !data.length) return null;
      var tree = [{ g:'', name:'推荐', children:[] }];
      var flat = [{ g:'', name:'推荐' }];
      for(var i=0;i<data.length;i++){
        var item = data[i];
        var part = item.partition || {};
        var pid = String(part.id_str || part.id || '') + ',' + String(part.type || '1');
        var pname = part.title || ('分区'+(i+1));
        var kids = [];
        var subs = item.sub_partition || item.sub_partitions || [];
        // 父级自身也可作为分区
        kids.push({ g:pid, name:pname });
        flat.push({ g:pid, name:pname });
        for(var k=0;k<subs.length;k++){
          var sp = (subs[k] && (subs[k].partition || subs[k])) || {};
          var sid = String(sp.id_str || sp.id || '') + ',' + String(sp.type || '1');
          var sn = sp.title || '';
          if(!sn) continue;
          kids.push({ g:sid, name:sn });
          flat.push({ g:sid, name:sn });
        }
        tree.push({ g:'p:'+pid, name:pname, children:kids });
      }
      return { tree:tree, flat:flat };
    }catch(e){ return null; }
  }

  async function fetchKsCate(){
    // type=1 与顶部「热门(rec)」重复且子项会和其它一级交叉，导致点二级被 resolve 回热门
    var parents = [
      { id:'2', name:'网游' }, { id:'3', name:'单机' },
      { id:'4', name:'手游' }, { id:'5', name:'棋牌' }, { id:'6', name:'娱乐' },
      { id:'7', name:'综合' }, { id:'8', name:'文化' }
    ];
    var tree = [{ g:'rec', name:'热门', children:[] }];
    var flat = [{ g:'rec', name:'热门' }];
    var seenId = {};
    for(var i=0;i<parents.length;i++){
      var p = parents[i];
      try{
        var j = await req('https://live.kuaishou.com/live_api/category/data?type='+p.id+'&page=1&size=100', {
          responseType:'json', pc:true, referer:'https://live.kuaishou.com/',
          headers: { 'User-Agent': PC_UA, 'Referer':'https://live.kuaishou.com/', 'Origin':'https://live.kuaishou.com' }
        });
        var list = (j && j.data && (j.data.list || j.data.categories || j.data.categoryList)) || [];
        var kids = [];
        for(var k=0;k<list.length;k++){
          var it = list[k];
          var id = String(it.id || it.categoryId || it.gameId || '');
          var nm = it.name || it.categoryName || it.gameName || '';
          if(!id || !nm) continue;
          // 同一 id 只挂到首次出现的一级，避免跨一级重复导致选中错乱
          if(seenId[id]) continue;
          seenId[id] = 1;
          // pure_live: 列表侧用 ks:id；live() 里按 id 长度选 gameboard / non-gameboard
          var g = 'ks:' + id;
          kids.push({ g:g, name:nm, _ksId:id });
          flat.push({ g:g, name:nm, _ksId:id });
        }
        if(kids.length) tree.push({ g:'p:'+p.id, name:p.name, children:kids });
      }catch(e){}
    }
    if(flat.length <= 1) return null;
    return { tree:tree, flat:flat };
  }

  var ADAPTERS = {
    huya: {
      id: 'huya',
      word: '虎牙直播',
      site: 'https://www.huya.com',
      cate: HUYA_CATE,
      cateTree: null,
      fetchCate: fetchHuyaCate,
      live: huyaLive,
      search: huyaSearch,
      stream: huyaStream,
      referer: 'https://www.huya.com/'
    },
    douyu: {
      id: 'douyu',
      word: '斗鱼直播',
      site: 'https://www.douyu.com',
      cate: DOUYU_CATE,
      cateTree: null,
      fetchCate: fetchDouyuCate,
      live: douyuLive,
      search: douyuSearch,
      stream: douyuStream,
      referer: 'https://www.douyu.com/'
    },
    douyin: {
      id: 'douyin',
      word: '抖音直播',
      site: 'https://live.douyin.com',
      cate: DOUYIN_CATE,
      cateTree: null,
      fetchCate: fetchDouyinCate,
      live: douyinLive,
      search: douyinSearch,
      stream: douyinStream,
      referer: 'https://live.douyin.com/'
    },
    bili: {
      id: 'bili',
      word: 'B站直播',
      site: 'https://live.bilibili.com',
      cate: BILI_CATE,
      cateTree: null,
      fetchCate: fetchBiliCate,
      live: biliLive,
      search: biliSearch,
      stream: biliStream,
      referer: 'https://live.bilibili.com/'
    },
    kuaishou: {
      id: 'kuaishou',
      word: '快手直播',
      site: 'https://live.kuaishou.com',
      cate: KS_CATE,
      cateTree: null,
      fetchCate: fetchKsCate,
      live: ksLive,
      search: ksSearch,
      stream: ksStream,
      referer: 'https://live.kuaishou.com/'
    }
  };

  window.LiveEngine = {
    ADAPTERS: ADAPTERS,
    setPrefs: function(p){ for(var k in p) if(p[k]!==undefined) prefs[k]=p[k]; },
    getUA: function(){ return prefs.ua; },
    getPCUA: function(){ return PC_UA; },
    getBiliCk: function(){ return biliCookie(); },
    biliCheckLogin: biliCheckLogin,
    resImg: resUrl,
    req: req,
    md5: md5
  };
})();
</script>

<script>
(function () {
  'use strict';
  var E = window.LiveEngine;
  function $(id){ return document.getElementById(id); }
  function setVal(id,v){ var e=$(id); if(e) e.value=v; }
  function getVal(id){ var e=$(id); return e?String(e.value):''; }
  function on(id,ev,fn){ var e=$(id); if(e) e.addEventListener(ev,fn); }
  function isNative(){ return !!(window.fm && window.fm.req); }

  var SRC = 'huya';
  var A = E.ADAPTERS.huya;
  var native=false;
  var elList=$('list'), elState=$('state'), elMore=$('more'), elTabs=$('tabs'), elToast=$('toast'), elAreas=$('liveAreas');
  var prefs={ rate:'0', wall:'pic', biliCk:'' };
  var view={ cate:'', page:1, items:[], loading:false, seq:0, more:true, kind:'live', kw:'', subFilter:'', parentKey:'' };

  function toast(m){ elToast.textContent=m; elToast.className='toast show'; clearTimeout(toast._t); toast._t=setTimeout(function(){elToast.className='toast';},2400); }
  function bodyClass(n,o){ var b=document.body,c=(' '+b.className+' ').replace(new RegExp('\\s'+n+'\\s','g'),' '); b.className=(o?c+n:c).replace(/\s+/g,' ').replace(/^ | $/g,''); }
  function hasBodyClass(n){ return (' '+document.body.className+' ').indexOf(' '+n+' ')!==-1; }
  function netDot(ok){ var d=$('netDot'); if(d) d.className='mark '+(ok?'ok':'bad'); }

  var store={
    get:async function(k){ try{ if(isNative()&&fm.cache) return (await fm.cache.get(k,'livecombo'))||''; }catch(e){} try{ return localStorage.getItem('lc_'+k)||''; }catch(e){ return ''; } },
    set:async function(k,v){ try{ if(isNative()&&fm.cache){ await fm.cache.set(k,v,'livecombo'); return; } }catch(e){} try{ localStorage.setItem('lc_'+k,v); }catch(e){} }
  };

  var lazyIO=null, lazyList=[];
  function lazyLoad(img){ if(img._done)return; img._done=true; var u=img.getAttribute('data-src'); if(!u)return; img.onload=function(){img.className='in';}; img.onerror=function(){ if(img._fb){ img.onerror=null; img.style.opacity='0'; return; } img._fb=1; // 代理失败时直连原图
      var raw=u; if(raw.indexOf('//')===0) raw='https:'+raw; img.src=raw; };
    try{ img.src=E.resImg(u); }catch(e){ img.src=u; }
  }
  function lazyWatch(img){ if(window.IntersectionObserver){ if(!lazyIO){ lazyIO=new IntersectionObserver(function(es){ es.forEach(function(en){ if(en.isIntersecting){ lazyLoad(en.target); lazyIO.unobserve(en.target); } }); },{rootMargin:'250px 0px'}); } lazyIO.observe(img); return; } lazyList.push(img); }
  function lazyScan(){ if(!lazyList.length)return; var h=window.innerHeight+300,i,img,r; for(i=lazyList.length-1;i>=0;i--){ img=lazyList[i]; r=img.getBoundingClientRect(); if(r.top<h&&r.bottom>-300){ lazyLoad(img); lazyList.splice(i,1); } } }

  function card(item){
    var btn=document.createElement('button'); btn.className='card-inner'; btn.setAttribute('tabindex','0');
    var thumb=document.createElement('div'); thumb.className='thumb';
    var img=document.createElement('img'); img.alt=''; img.className='lazy'; img.setAttribute('data-src',item.pic); lazyWatch(img); thumb.appendChild(img);
    var lb=document.createElement('span'); lb.className='badge live'; lb.textContent='LIVE'; thumb.appendChild(lb);
    if(item.views){ var hb=document.createElement('span'); hb.className='badge'; hb.textContent=item.views; thumb.appendChild(hb); }
    var meta=document.createElement('div'); meta.className='meta';
    var t=document.createElement('div'); t.className='title'; t.textContent=item.title||'(直播间)';
    var sub=document.createElement('div'); sub.className='sub';
    var parts=[]; if(item.author)parts.push(item.author); if(item.cate)parts.push(item.cate);
    sub.textContent=parts.join(' · ');
    meta.appendChild(t); meta.appendChild(sub);
    btn.appendChild(thumb); btn.appendChild(meta);
    btn.addEventListener('click',function(){ play(item); });
    return btn;
  }
  function renderInto(box,items){ var f=document.createDocumentFragment(),i,w; for(i=0;i<items.length;i++){ w=document.createElement('div'); w.className='card'; w.setAttribute('data-cate',items[i].cate||''); w.appendChild(card(items[i])); f.appendChild(w); } box.appendChild(f); }
  function showState(h){ elState.innerHTML=h; }
  function clearState(){ elState.innerHTML=''; }
  function skeleton(n){ var f=document.createDocumentFragment(),i,c,inner,th,me; for(i=0;i<n;i++){ c=document.createElement('div'); c.className='card'; inner=document.createElement('div'); inner.className='card-inner'; th=document.createElement('div'); th.className='thumb'; me=document.createElement('div'); me.className='meta'; me.innerHTML='<div class="bar"></div><div class="bar short"></div>'; inner.appendChild(th); inner.appendChild(me); c.appendChild(inner); f.appendChild(c); } return f; }
  function loadingState(){ clearState(); elList.className='grid skel'; elList.replaceChildren(skeleton(12)); }
  function endLoading(){ elList.className='grid'; }
  function moeEmpty(t,s){ return '<div class="moe-empty"><svg viewBox="0 0 80 64" width="84" height="66" aria-hidden="true"><rect x="6" y="14" width="68" height="44" rx="15" fill="'+ (SRC==='douyu'?'#FF5A00':'#FF7700') +'"/><rect x="13" y="21" width="54" height="30" rx="10" fill="#1C1712"/><path d="M25 33 q4 5 8 0" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M47 33 q4 5 8 0" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg><div class="moe-text">'+t+'</div><div class="moe-sub">'+(s||'')+'</div></div>'; }

  /**
   * 根据 view.cate 反查所属一级分区 g。
   * 优先锁定在当前 view.parentKey 下（避免快手等平台同一子分区出现在多个一级里时被 resolve 回「热门」）。
   */
  function resolveParentKey(cateG){
    if(A.cateTree && A.cateTree.length){
      var i, j, n, kids, pk = view.parentKey;
      // 1) 当前一级下能命中子分区 → 绝不换一级
      if(pk !== undefined && pk !== null){
        for(i=0;i<A.cateTree.length;i++){
          if(A.cateTree[i].g !== pk) continue;
          n = A.cateTree[i];
          if(n.g === cateG) return n.g;
          kids = n.children || [];
          for(j=0;j<kids.length;j++){ if(kids[j].g === cateG) return n.g; }
          // 当前一级存在但子项对不上，仍保留当前一级（由调用方决定是否改 cate）
          return n.g;
        }
      }
      // 2) cate 本身就是一级
      for(i=0;i<A.cateTree.length;i++){ if(A.cateTree[i].g === cateG) return A.cateTree[i].g; }
      // 3) 全局子分区反查（仅在没有有效 parentKey 时）
      for(i=0;i<A.cateTree.length;i++){
        n = A.cateTree[i]; kids = n.children || [];
        for(j=0;j<kids.length;j++){ if(kids[j].g === cateG) return n.g; }
      }
    }
    if(view.parentKey !== undefined && view.parentKey !== null) return view.parentKey;
    return cateG != null ? cateG : '';
  }

  function updateAreas(){
    if(!elAreas) return;
    // 动态分区树：二级子分区（严格单选）
    // 注意 parentKey 可能为 ''（推荐），不能用 if(view.parentKey) 判断
    if(A.cateTree && A.cateTree.length && view.parentKey !== undefined && view.parentKey !== null){
      var node = null, i;
      for(i=0;i<A.cateTree.length;i++){
        if(A.cateTree[i].g === view.parentKey){ node = A.cateTree[i]; break; }
      }
      var kids = (node && node.children) || [];
      if(kids.length){
        var inKids = false;
        for(i=0;i<kids.length;i++){ if(kids[i].g === view.cate){ inKids = true; break; } }
        if(!inKids) view.cate = kids[0].g;
        // 强制 parentKey 对齐当前 node，防止被串改
        if(node) view.parentKey = node.g;

        // 同一一级且二级栏结构已在：只改高亮，避免整条闪烁
        var existing = elAreas.querySelectorAll('.larea[data-g]');
        var sameChrome = elAreas.className.indexOf('on') !== -1
          && existing.length === kids.length
          && elAreas.getAttribute('data-parent') === String(node.g);
        if(sameChrome){
          var ok = true;
          for(i=0;i<kids.length;i++){
            if(!existing[i] || existing[i].getAttribute('data-g') !== kids[i].g){ ok = false; break; }
          }
          if(ok){
            syncAreaHighlight();
            return;
          }
        }

        elAreas.replaceChildren();
        elAreas.setAttribute('data-parent', String(node.g));
        kids.forEach(function(ch){
          var b=document.createElement('button');
          b.type='button';
          b.className='larea'+(view.cate===ch.g?' on':'');
          b.textContent=ch.name;
          b.setAttribute('data-g', ch.g);
          b.addEventListener('click', function(){
            if(view.cate === ch.g && view.kind === 'live') return;
            view.kind='live';
            view.cate=ch.g;
            // 二级挂在当前一级下：固定本一级，禁止 resolve 跨级
            view.parentKey = node.g;
            view.subFilter='';
            // 只改高亮，不销毁二级栏 / 不重绘一级栏
            syncAreaHighlight();
            // 仅刷新列表骨架，分类菜单与页面顶栏保持不动
            load(true, { keepChrome: true });
          });
          elAreas.appendChild(b);
        });
        // 兜底：二级也只允许一个 on
        var aons = elAreas.querySelectorAll('.larea.on');
        if(aons.length > 1){
          for(var ai=1;ai<aons.length;ai++) aons[ai].className = 'larea';
        }
        elAreas.className='liveareas on';
        try{ enableHScroll(elAreas); }catch(e){}
        return;
      }
      // 一级无子分区：隐藏二级条
      elAreas.className='liveareas';
      elAreas.replaceChildren();
      elAreas.removeAttribute('data-parent');
      return;
    }
    // 回退：本地筛选（严格单选）
    var seen={}, order=[], c;
    for(i=0;i<view.items.length;i++){ c=view.items[i].cate; if(c && !seen[c]){ seen[c]=1; order.push(c); } }
    if(order.length<2){ elAreas.className='liveareas'; elAreas.replaceChildren(); return; }
    order.sort();
    elAreas.replaceChildren();
    var all=document.createElement('button'); all.type='button'; all.className='larea'+(!view.subFilter?' on':''); all.textContent='全部'; all.setAttribute('data-sub',''); all.addEventListener('click',function(){ setSubFilter(''); }); elAreas.appendChild(all);
    order.forEach(function(name){
      var b=document.createElement('button'); b.type='button';
      b.className='larea'+(view.subFilter===name?' on':'');
      b.textContent=name; b.setAttribute('data-sub', name);
      b.addEventListener('click',function(){ setSubFilter(name); });
      elAreas.appendChild(b);
    });
    elAreas.className='liveareas on'; try{enableHScroll(elAreas);}catch(e){}
  }
  function setSubFilter(name){
    view.subFilter = name || '';
    if(elAreas){
      Array.prototype.forEach.call(elAreas.querySelectorAll('.larea'), function(b){
        var sub = b.getAttribute('data-sub');
        var isOn = (view.subFilter === '' && (sub === '' || sub === null))
          || (view.subFilter !== '' && sub === view.subFilter);
        b.className = 'larea' + (isOn ? ' on' : '');
      });
    }
    applySubFilter();
  }
  function applySubFilter(){ Array.prototype.forEach.call(elList.children,function(w){ var c=w.getAttribute('data-cate')||''; w.style.display=(!view.subFilter||c===view.subFilter)?'':'none'; }); }

  /** 从平台接口同步全部分区（失败则保留内置兜底） */
  async function ensureCate(force){
    if(!A.fetchCate) return;
    if(A._cateReady && !force) return;
    try{
      var res = await A.fetchCate();
      if(res && res.flat && res.flat.length){
        A.cate = res.flat;
        A.cateTree = res.tree || null;
        A._cateReady = true;
      }
    }catch(e){
      // 保持默认 cate
    }
  }

  async function fetchPage(){
    if(view.kind==='search') return A.search(view.kw, view.page);
    return A.live(view.cate, view.page);
  }

  /** 仅更新二级栏高亮，不销毁重建（避免点击二级时菜单跟着列表一起闪） */
  function syncAreaHighlight(){
    if(!elAreas) return;
    Array.prototype.forEach.call(elAreas.querySelectorAll('.larea'), function(el){
      var g = el.getAttribute('data-g');
      var sub = el.getAttribute('data-sub');
      var on = false;
      if(g != null) on = (g === view.cate);
      else {
        on = (view.subFilter === '' && (sub === '' || sub === null))
          || (view.subFilter !== '' && sub === view.subFilter);
      }
      el.className = 'larea' + (on ? ' on' : '');
    });
  }

  /**
   * @param {boolean} reset 是否从第一页重载
   * @param {{keepChrome?:boolean}} opts keepChrome=true：保留一级/二级菜单不重建（二级切换用）
   */
  async function load(reset, opts){
    opts = opts || {};
    var keepChrome = !!opts.keepChrome;
    var seq=++view.seq; view.loading=true;
    if(reset){
      view.page=1; view.items=[]; view.more=true; view.subFilter='';
      lazyList=[]; if(lazyIO){lazyIO.disconnect();lazyIO=null;}
      elList.replaceChildren(); elMore.replaceChildren();
      // 二级切换：不动分类栏；一级/搜索切换才清空二级栏
      if(!keepChrome && elAreas){
        elAreas.className='liveareas';
        elAreas.replaceChildren();
      }
      loadingState();
      if(!keepChrome) window.scrollTo(0,0);
    }
    try{
      var res=await Promise.race([ fetchPage(), new Promise(function(_,rej){ setTimeout(function(){rej(new Error('请求超时'));},20000); }) ]);
      if(seq!==view.seq) return;
      var items=res.items||[]; view.more=!!res.more;
      netDot(true); endLoading();
      if(reset) elList.replaceChildren();
      if(!items.length && !view.items.length){ showState(moeEmpty('这里没有直播','换个分区或关键词试试')); }
      else { clearState(); view.items=view.items.concat(items); renderInto(elList,items); }
      if(keepChrome) syncAreaHighlight();
      else updateAreas();
      applySubFilter();
      renderMore();
    }catch(e){
      if(seq!==view.seq) return;
      netDot(false); endLoading();
      if(view.items.length) toast('加载失败：'+e.message);
      else { elList.replaceChildren(); showState('<strong>没能连上'+(A.word||'')+'</strong><div>'+String(e.message).replace(/</g,'&lt;')+'</div><div style="margin-top:8px">需要代理时请在 App 里配置。</div>'); }
      // 失败时仍保持分类栏（keepChrome）或按需重建
      if(keepChrome) syncAreaHighlight();

    var t = document.querySelector('title'); if(t) t.textContent = A.word;
    // Logo：虎牙=播放键，斗鱼=鱼形简标
    var mark = $('netDot');
    if(mark){
      if(SRC === 'douyu'){
        mark.innerHTML = '<svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">'
          + '<circle cx="16" cy="16" r="14.5" fill="currentColor"></circle>'

          + '<circle cx="13.2" cy="14.2" r="1.6" fill="currentColor"></circle>'
          + '<path d="M18.5 12.5c1.8-.3 3.6.6 4.2 2.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>'
          + '<circle cx="25.5" cy="7.5" r="4.2" fill="#FF4D5E"></circle>'
          + '<circle cx="25.5" cy="7.5" r="4.2" fill="none" stroke="#fff" stroke-width="1.2"></circle>'
          + '</svg>';
      } else if(SRC === 'douyin'){
        mark.innerHTML = '<svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">'
          + '<circle cx="16" cy="16" r="14.5" fill="currentColor"></circle>'
          + '<path d="M18.2 8.5v9.2c0 2.4-1.9 4.3-4.3 4.3S9.6 20.1 9.6 17.7s1.9-4.3 4.3-4.3c.4 0 .8.1 1.2.2V10c-.4-.1-.8-.1-1.2-.1-3.9 0-7 3.1-7 7s3.1 7 7 7 7-3.1 7-7V8.5h-2.7z" fill="#fff"></path>'
          + '<circle cx="25.5" cy="7.5" r="4.2" fill="#25F4EE"></circle>'
          + '<circle cx="25.5" cy="7.5" r="4.2" fill="none" stroke="#fff" stroke-width="1.2"></circle>'
          + '</svg>';
      } else if(SRC === 'bili'){
        mark.innerHTML = '<svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">'
          + '<circle cx="16" cy="16" r="14.5" fill="currentColor"></circle>'
          + '<path d="M10.2 11.5l-1.8-1.8 1.2-1.2 2.2 2.2h8.4l2.2-2.2 1.2 1.2-1.8 1.8H10.2z" fill="#fff"></path>'
          + '<rect x="8.5" y="12.2" width="15" height="10.5" rx="2.2" fill="#fff"></rect>'
          + '<circle cx="13.2" cy="17.2" r="1.5" fill="currentColor"></circle>'
          + '<circle cx="18.8" cy="17.2" r="1.5" fill="currentColor"></circle>'
          + '<circle cx="25.5" cy="7.5" r="4.2" fill="#00A1D6"></circle>'
          + '<circle cx="25.5" cy="7.5" r="4.2" fill="none" stroke="#fff" stroke-width="1.2"></circle>'
          + '</svg>';
      } else if(SRC === 'kuaishou'){
        mark.innerHTML = '<svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">'
          + '<circle cx="16" cy="16" r="14.5" fill="currentColor"></circle>'
          + '<path d="M16 8.5c-2.8 0-5 2.4-5 5.4 0 2.2 1.2 4.1 3 5.1v4.5h4V18.9c1.8-1 3-2.9 3-5.1 0-3-2.2-5.3-5-5.3z" fill="#fff"></path>'

      } else {
        mark.innerHTML = '<svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">'
          + '<circle cx="16" cy="16" r="14.5" fill="currentColor"></circle>'

          + '<polygon points="13.2,10.8 13.2,21.2 22,16" fill="currentColor"></polygon>'
          + '<circle cx="25.5" cy="7.5" r="4.2" fill="#FF4D5E"></circle>'

  }
  async function switchSource(id){
    if(!E.ADAPTERS[id] || id === SRC) return;
    SRC = id;
    A = E.ADAPTERS[id];
    await store.set('src', id);
    view.token = (view.token||0) + 1;
    view.kind = 'live';
    view.kw = '';
    view.parentKey = '';
    clearSearchBox();
    applySrcTheme();
    updateSwitcher();
    await loadHistory();
    toast('同步分区中…');
    await ensureCate(true);
    view.cate = (A.cate[0] && A.cate[0].g) || '';
    view.parentKey = (A.cateTree && A.cateTree[0] && A.cateTree[0].g) || view.cate;
    renderTabs();
    updateAreas();
    load(true);
    window.scrollTo(0, 0);
  }

  function bind(){
    on('goBtn','click',doSearch);
    on('q','input',onType);
    on('q','focus',function(){ bodyClass('searching',true); showHistory(); });
    on('q','keydown',function(e){ if(sugKey(e))return; if(e.key==='Enter'||e.keyCode===13)doSearch(); });
    on('q','blur',function(){ setTimeout(closeSug,160); });
    on('clrBtn','click',function(){ setVal('q',''); syncClear(); showHistory(); var q=$('q'); if(q&&q.focus)q.focus(); });
    on('setBtn','click',function(){ openSheet('settings'); });
    on('netBtn','click',function(){ openSheet('net'); runDiag(); });
    on('setBack','click',function(){ closeSheet(); });
    on('netBack','click',function(){ closeSheet(); });
    on('runDiag','click',runDiag);
    on('optMask','click',closePicker);
    on('saveBtn','click',savePrefs);
    on('resetBtn','click',function(){ setVal('rate','0'); setVal('wall','pic'); var ta=$('biliCk'); if(ta) ta.value=''; prefs.biliCk=''; syncPickers(); updateBiliCkStatus(); });
    on('biliCkClear','click',function(){
      var ta=$('biliCk'); if(ta) ta.value='';
      prefs.biliCk='';
      E.setPrefs(prefs);
      updateBiliCkStatus('已清除 Cookie');
      toast('已清除 B站 Cookie');
    });
    on('biliCkCheck','click', async function(){
      var ta=$('biliCk');
      prefs.biliCk = ta ? String(ta.value||'').trim() : '';
      E.setPrefs(prefs);
      if(!prefs.biliCk){ updateBiliCkStatus('请先粘贴 Cookie'); toast('请先粘贴 SESSDATA'); return; }
      updateBiliCkStatus('检测中…');
      try{
        var r = await E.biliCheckLogin();
        if(r && r.ok){
          updateBiliCkStatus('✓ 已登录：' + r.msg);
          toast('登录有效：' + r.msg);
          // 自动保存
          await store.set('prefs', JSON.stringify(prefs));
        } else {
          updateBiliCkStatus('✗ ' + ((r && r.msg) || '无效'));
          toast('登录无效：' + ((r && r.msg) || ''));
        }
      }catch(e){
        updateBiliCkStatus('✗ 检测失败：' + (e.message||e));
        toast('检测失败');
      }
    });
    document.addEventListener('touchstart',function(e){ var t=e.target; if(t&&t.closest&&t.closest('.search'))return; if(document.activeElement!==$('q')&&!hasBodyClass('searching'))return; closeSug(); var q=$('q'); if(q&&q.blur)q.blur(); bodyClass('searching',false); },{passive:true});
    var segs = document.querySelectorAll('.switcher .sseg');
    Array.prototype.forEach.call(segs, function (seg) {
      seg.addEventListener('click', function () {
        switchSource(seg.getAttribute('data-src'));
      });
    });
    window.addEventListener('resize', positionInd);
    window.addEventListener('fmviewport', positionInd);
  }

  async function boot(){
    native=!!(window.fm&&window.fm.req);
    clampSafeTop(); window.addEventListener('fmviewport',clampSafeTop);
    document.documentElement.className+=native?' fm-native':'';
    try{
      var sid = await store.get('src');
      if(sid && E.ADAPTERS[sid]){ SRC = sid; A = E.ADAPTERS[sid]; }
    }catch(e){}
    applySrcTheme();
    updateSwitcher();
    try{ await loadPrefs(); }catch(e){}
    try{ bind(); }catch(e){}
    try{ await loadHistory(); }catch(e){}
    try{
      toast('同步分区中…');
      await ensureCate(false);
      view.cate = (A.cate[0] && A.cate[0].g) || '';
      view.parentKey = (A.cateTree && A.cateTree[0] && A.cateTree[0].g) || view.cate;
    }catch(e){}
    try{ renderTabs(); updateAreas(); }catch(e){}
    try{ autoPage(); }catch(e){}
    try{ initGestures(); enableHScroll(elTabs); enableHScroll(elAreas); }catch(e){}
    if(native&&fm.ui&&fm.ui.setChrome){ try{ fm.ui.setChrome({mode:'edge',statusBarStyle:'light',startup:true})['catch'](function(){}); }catch(e){} }
    load(true);
    setTimeout(positionInd, 80);
  }
  if(window.fm&&window.fm.req) boot();
  else{ var started=false; window.addEventListener('fmsdk',function(){ if(!started){started=true;boot();} }); setTimeout(function(){ if(!started){started=true;boot();} },1200); }
})();
</script>
